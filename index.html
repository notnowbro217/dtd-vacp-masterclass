class=\"overflow-x-auto text-xs\">\n                    <table class=\"w-full text-left border-collapse\">\n                        <thead class=\"bg-slate-100 dark:bg-slate-800 uppercase\">\n                            <tr>\n                                <th class=\"p-2 border\">Vị Trí (5 Nhân Sự)</th>\n                                <th class=\"p-2 border\">Nhiệm Vụ Cốt Lõi</th>\n                                <th class=\"p-2 border\">Chỉ Số KPI Sống Còn</th>\n                            </tr>\n                        </thead>\n                        <tbody class=\"divide-y text-slate-600 dark:text-slate-300\">\n                            <tr>\n                                <td class=\"p-2 font-bold border\">1. E-Commerce Team Leader</td>\n                                <td class=\"p-2 border\">Quản trị P&L gian hàng, lên campaign flash sale, phân bổ ngân sách ads</td>\n                                <td class=\"p-2 border font-bold text-blue-600\">Net GMV > 500tr/tháng, CIR < 25%</td>\n                            </tr>\n                            <tr>\n                                <td class=\"p-2 font-bold border\">2. Media Buyer (Chạy Ads)</td>\n                                <td class=\"p-2 border\">Tối ưu TikTok Ads, Shopee Ads, test tệp đối tượng và creative</td>\n                                <td class=\"p-2 border font-bold text-emerald-600\">ROAS > 3.5, CPA < 45.000 VNĐ</td>\n                            </tr>\n                            <tr>\n                                <td class=\"p-2 font-bold border\">3. Livestreamer / KOC Nội Bộ</td>\n                                <td class=\"p-2 border\">Live 4 - 6 tiếng/ngày, ghim deal, tương tác và giải đáp da đầu</td>\n                                <td class=\"p-2 border font-bold text-amber-600\">GPM > 12tr/phiên live, Conversion Rate > 4.5%</td>\n                            </tr>\n                            <tr>\n                                <td class=\"p-2 font-bold border\">4. Video Creator / Designer</td>\n                                <td class=\"p-2 border\">Sản xuất 3 - 5 video ngắn/ngày, thiết kế hình ảnh bao bì sang xịn</td>\n                                <td class=\"p-2 border font-bold text-purple-600\">Tối thiểu 1 video triệu view/tuần</td>\n                            </tr>\n                            <tr>\n                                <td class=\"p-2 font-bold border\">5. CSKH & Vận Hành Đơn</td>\n                                <td class=\"p-2 border\">Chăm sóc inbox, gọi xác nhận đơn, xử lý hoàn hủy và xin đánh giá 5 sao</td>\n                                <td class=\"p-2 border font-bold text-red-600\">Tỷ lệ phản hồi < 5 phút, Hoàn hủy < 7%</td>\n                            </tr>\n                        </tbody>\n                    </table>\n                </div>\n                "}, {"tab": "checklist", "name": "Checklist Tối Ưu Gian Hàng TikTok Shop & Shopee Mall", "content": "\n                <div class=\"space-y-3 text-sm text-slate-700 dark:text-slate-300\">\n                    <label class=\"flex items-start gap-2 p-2 bg-white dark:bg-slate-800 rounded border border-slate-200 dark:border-slate-700\">\n                        <input type=\"checkbox\" class=\"mt-1\">\n                        <span><strong>Bộ ảnh Luxury khoa học:</strong> Sử dụng tone màu xám bạc / nâu hổ phách y khoa, hình ảnh giọt serum phóng đại cấu trúc sợi tóc.</span>\n                    </label>\n                    <label class=\"flex items-start gap-2 p-2 bg-white dark:bg-slate-800 rounded border border-slate-200 dark:border-slate-700\">\n                        <input type=\"checkbox\" class=\"mt-1\">\n                        <span><strong>Mạng lưới Affiliate KOC:</strong> Ký kết với 100 reviewer chuyên về tóc, gửi mẫu thử miễn phí (free sampling) để phủ sóng video review.</span>\n                    </label>\n                    <label class=\"flex items-start gap-2 p-2 bg-white dark:bg-slate-800 rounded border border-slate-200 dark:border-slate-700\">\n                        <input type=\"checkbox\" class=\"mt-1\">\n                        <span><strong>Quản trị tỷ lệ hủy/hoàn (Return Rate):</strong> Kiểm soát thời gian đóng gói dưới 12h, kèm thiệp cảm ơn và mẫu thử quà tặng bất ngờ trong mỗi hộp hàng.</span>\n                    </label>\n                </div>\n                "}, {"tab": "quiz", "name": "Trắc Nghiệm Tư Duy E-Commerce", "content": "\n                <div class=\"p-5 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700\">\n                    <div class=\"font-bold text-slate-900 dark:text-white mb-2\">Câu hỏi: Khi bán sản phẩm chăm sóc tóc trên TikTok Shop, yếu tố nào quan trọng nhất quyết định một video bán hàng có thể cắn xu hướng (Viral)?</div>\n                    <div class=\"space-y-2 mt-3 text-sm text-slate-700 dark:text-slate-300\">\n                        <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/50 cursor-pointer\">\n                            <input type=\"radio\" name=\"q7\" value=\"a\" class=\"mr-2\"> A. Dùng máy quay điện ảnh 8K đắt tiền nhất.\n                        </label>\n                        <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/50 cursor-pointer\">\n                            <input type=\"radio\" name=\"q7\" value=\"b\" class=\"mr-2\"> B. 3 giây đầu tiên (Hook) đánh trúng nỗi đau thị giác dữ dội (ví dụ: vơ một nắm tóc rụng khi gội đầu, hoặc cận cảnh da đầu gàu ngứa) kèm giải pháp biến hình thần tốc.\n                        </label>\n                        <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/50 cursor-pointer\">\n                            <input type=\"radio\" name=\"q7\" value=\"c\" class=\"mr-2\"> C. Đọc thuộc lòng toàn bộ bảng thành phần hóa học dài 5 phút.\n                        </label>\n                    </div>\n                    <div class=\"mt-4 p-3 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 rounded-lg text-xs text-emerald-800 dark:text-emerald-300 hidden\" id=\"q7-ans\">\n                        <strong>Đáp án chính xác: B!</strong> Trên TikTok, người dùng lướt đi trong 1-2 giây. Nếu không có \"Visual Hook\" gây sốc thị giác và chạm trúng nỗi sợ hãi hoặc khao khát của khách hàng ngay 3 giây đầu, 95% người xem sẽ vuốt qua và video sẽ bị bóp phân phối.\n                    </div>\n                    <button onclick=\"document.getElementById('q7-ans').classList.toggle('hidden')\" class=\"mt-3 px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded text-xs font-semibold\">Xem Giải Thích Học Thuật</button>\n                </div>\n                "}]}, {"id": 8, "title": "Hệ Điều Hành Văn Hóa (Culture-OS) & 16 Quy Trình SOP Chuẩn ISO 9001:2015", "subtitle": "5 văn hóa Setup vs Growth, bộ 16 SOP chống thất thoát và cơ chế tự vận hành doanh nghiệp B2B", "badge": "Văn Hóa Doanh Nghiệp & SOP", "duration": "30 phút học", "lessons": [{"tab": "core", "name": "Culture-OS & 5 Trụ Cột Văn Hóa Setup vs Growth", "content": "\n                <div class=\"space-y-6\">\n                    <div class=\"bg-violet-50 dark:bg-slate-800/60 p-5 rounded-xl border border-violet-200 dark:border-slate-700\">\n                        <h4 class=\"text-lg font-bold text-violet-900 dark:text-violet-300 mb-2\">🏛️ Văn Hóa Doanh Nghiệp Là \"Hệ Điều Hành Ngầm\"</h4>\n                        <p class=\"text-slate-700 dark:text-slate-300 leading-relaxed\">\n                            Quy trình (SOP) là luật chơi trên giấy, nhưng <strong>Văn hóa (Culture) mới quyết định nhân viên hành xử thế nào khi không có sếp ở đó</strong>. Nếu không có hệ điều hành văn hóa mạnh mẽ, công ty mở rộng chi nhánh tới đâu thì thất thoát và nội bộ tranh giành tới đó.\n                        </p>\n                    </div>\n\n                    <h4 class=\"text-xl font-bold text-slate-900 dark:text-white mt-4\">💎 5 Văn Hóa Cốt Lõi: Chuyển Đổi Từ Giai Đoạn Setup Sang Growth</h4>\n                    <div class=\"space-y-3 text-sm\">\n                        <div class=\"p-4 bg-white dark:bg-slate-800 rounded-lg border-l-4 border-blue-600 border border-slate-200 dark:border-slate-700\">\n                            <div class=\"font-bold text-slate-900 dark:text-white\">1. Tư Duy Nhận Trách Nhiệm 100% (Extreme Ownership)</div>\n                            <p class=\"text-xs text-slate-600 dark:text-slate-300 mt-1\">Xóa bỏ hoàn toàn văn hóa \"đổ lỗi cho hoàn cảnh/cho phòng ban khác\". Khi sự cố xảy ra, câu hỏi đầu tiên là: <em>\"Tôi đã làm gì sai và tôi sửa nó thế nào?\"</em></p>\n                        </div>\n                        <div class=\"p-4 bg-white dark:bg-slate-800 rounded-lg border-l-4 border-amber-600 border border-slate-200 dark:border-slate-700\">\n                            <div class=\"font-bold text-slate-900 dark:text-white\">2. Kỷ Luật Dữ Liệu Thực Tế (Data-driven Honesty)</div>\n                            <p class=\"text-xs text-slate-600 dark:text-slate-300 mt-1\">Nói chuyện bằng con số trên MISA và thực tế kho bãi. Cấm báo cáo định tính kiểu <em>\"em thấy khách hàng khen lắm\"</em> mà không có số liệu đơn hàng chứng minh.</p>\n                        </div>\n                        <div class=\"p-4 bg-white dark:bg-slate-800 rounded-lg border-l-4 border-emerald-600 border border-slate-200 dark:border-slate-700\">\n                            <div class=\"font-bold text-slate-900 dark:text-white\">3. Tốc Độ Hành Động Vượt Trội (Bias for Action)</div>\n                            <p class=\"text-xs text-slate-600 dark:text-slate-300 mt-1\">Một quyết định nhanh 80% tốt hơn một quyết định hoàn hảo nhưng chậm trễ cả tháng làm mất cơ hội thị trường.</p>\n                        </div>\n                        <div class=\"p-4 bg-white dark:bg-slate-800 rounded-lg border-l-4 border-purple-600 border border-slate-200 dark:border-slate-700\">\n                            <div class=\"font-bold text-slate-900 dark:text-white\">4. Khách Hàng Là Thượng Đế Nhưng Hệ Thống Là Pháp Luật</div>\n                            <p class=\"text-xs text-slate-600 dark:text-slate-300 mt-1\">Phục vụ khách hàng tận tâm nhất, nhưng tuyệt đối không phá vỡ nguyên tắc kiểm soát công nợ và an toàn tài chính.</p>\n                        </div>\n                        <div class=\"p-4 bg-white dark:bg-slate-800 rounded-lg border-l-4 border-cyan-600 border border-slate-200 dark:border-slate-700\">\n                            <div class=\"font-bold text-slate-900 dark:text-white\">5. Tinh Thần Học Tập Không Ngừng (Growth Mindset)</div>\n                            <p class=\"text-xs text-slate-600 dark:text-slate-300 mt-1\">Chủ động ứng dụng AI, cập nhật kỹ thuật tóc thế giới, liên tục nâng cấp bản thân và đào tạo người kế cận.</p>\n                        </div>\n                    </div>\n                </div>\n                "}, {"tab": "data", "name": "Danh Mục 16 SOP Chuẩn Hóa ISO 9001:2015", "content": "\n                <div class=\"grid md:grid-cols-2 gap-3 text-xs\">\n                    <div class=\"p-3 bg-white dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700\">\n                        <div class=\"font-bold text-blue-600 mb-1\">Nhóm Vận Hành Kỹ Thuật & R&D</div>\n                        <ul class=\"space-y-1 text-slate-600 dark:text-slate-300\">\n                            <li>• SOP-01: Quy trình thẩm định & test chất lượng thuốc uốn nhuộm mới</li>\n                            <li>• SOP-02: Quy trình xử lý khiếu nại kỹ thuật & cứu tóc hư tổn</li>\n                            <li>• SOP-03: Quy chuẩn tổ chức lớp đào tạo kỹ thuật VACP Academy</li>\n                            <li>• SOP-04: Quy chuẩn tổ chức Hair Show trình diễn thời trang tóc</li>\n                        </ul>\n                    </div>\n                    <div class=\"p-3 bg-white dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700\">\n                        <div class=\"font-bold text-amber-600 mb-1\">Nhóm Chuỗi Cung Ứng & Kho Vận</div>\n                        <ul class=\"space-y-1 text-slate-600 dark:text-slate-300\">\n                            <li>• SOP-05: Quy trình đặt hàng nhập khẩu nước ngoài (Đặt hàng v4)</li>\n                            <li>• SOP-06: Quy trình kiểm đếm, nhập kho & dán tem phụ hàng hóa</li>\n                            <li>• SOP-07: Quy trình bảo quản hóa chất tóc tránh nhiệt độ cao</li>\n                            <li>• SOP-08: Quy trình đóng gói, xuất kho & điều vận logistics liên tỉnh</li>\n                        </ul>\n                    </div>\n                    <div class=\"p-3 bg-white dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700\">\n                        <div class=\"font-bold text-emerald-600 mb-1\">Nhóm Kinh Doanh & Quan Hệ Đại Lý</div>\n                        <ul class=\"space-y-1 text-slate-600 dark:text-slate-300\">\n                            <li>• SOP-09: Quy trình thẩm định & ký kết hợp đồng Nhà Phân Phối (NPP)</li>\n                            <li>• SOP-10: Quy trình chào hàng & ký kết hợp tác Salon VIP độc quyền</li>\n                            <li>• SOP-11: Quy trình duyệt hạn mức công nợ & bảo lãnh thanh toán</li>\n                            <li>• SOP-12: Quy trình thu hồi công nợ quá hạn & bàn giao pháp chế</li>\n                        </ul>\n                    </div>\n                    <div class=\"p-3 bg-white dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700\">\n                        <div class=\"font-bold text-purple-600 mb-1\">Nhóm Quản Trị & Nhân Sự</div>\n                        <ul class=\"space-y-1 text-slate-600 dark:text-slate-300\">\n                            <li>• SOP-13: Quy trình tuyển dụng & thẩm định năng lực thực tế</li>\n                            <li>• SOP-14: Quy trình đào tạo hội nhập văn hóa Culture-OS 14 ngày</li>\n                            <li>• SOP-15: Quy trình đánh giá hiệu quả công việc KPI & Lương 3P</li>\n                            <li>• SOP-16: Quy trình kiểm toán nội bộ & phòng chống gian lận thương mại</li>\n                        </ul>\n                    </div>\n                </div>\n                "}, {"tab": "checklist", "name": "Checklist Triển Khai SOP Không Bị Chết Trên Giấy", "content": "\n                <div class=\"space-y-3 text-sm text-slate-700 dark:text-slate-300\">\n                    <label class=\"flex items-start gap-2 p-2 bg-white dark:bg-slate-800 rounded border border-slate-200 dark:border-slate-700\">\n                        <input type=\"checkbox\" class=\"mt-1\">\n                        <span><strong>Quy tắc \"Một Trang Duy Nhất\":</strong> Mỗi SOP phải có 1 bản tóm tắt lưu đồ (Flowchart) 1 trang dán trực tiếp tại nơi làm việc (kho, bàn kế toán, phòng Academy).</span>\n                    </label>\n                    <label class=\"flex items-start gap-2 p-2 bg-white dark:bg-slate-800 rounded border border-slate-200 dark:border-slate-700\">\n                        <input type=\"checkbox\" class=\"mt-1\">\n                        <span><strong>Audit đột xuất hàng tháng:</strong> Ban Kiểm Soát Nội Bộ kiểm tra ngẫu nhiên 5 quy trình bất kỳ mỗi tháng, phát hiện sai phạm trừ thẳng vào P3 KPI của Trưởng phòng.</span>\n                    </label>\n                </div>\n                "}, {"tab": "quiz", "name": "Trắc Nghiệm Văn Hóa Thực Thi", "content": "\n                <div class=\"p-5 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700\">\n                    <div class=\"font-bold text-slate-900 dark:text-white mb-2\">Câu hỏi: Khi một Trưởng phòng báo cáo: \"Thưa sếp, tháng này doanh số phòng em không đạt vì mưa bão nhiều quá khách không đi làm tóc\", theo Culture-OS của DTD, người sếp nên phản hồi thế nào?</div>\n                    <div class=\"space-y-2 mt-3 text-sm text-slate-700 dark:text-slate-300\">\n                        <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/50 cursor-pointer\">\n                            <input type=\"radio\" name=\"q8\" value=\"a\" class=\"mr-2\"> A. Thông cảm và an ủi nhân viên chờ hết bão.\n                        </label>\n                        <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/50 cursor-pointer\">\n                            <input type=\"radio\" name=\"q8\" value=\"b\" class=\"mr-2\"> B. Nhắc nhở văn hóa \"Nhận Trách Nhiệm 100%\": Mưa bão là yếu tố bên ngoài ai cũng gặp, câu hỏi là phòng kinh doanh đã chủ động chuyển đổi sang tổ chức đào tạo online, kích cầu gói combo đặt trước hoặc hỗ trợ salon chăm sóc khách tại nhà như thế nào để vượt qua bão?\n                        </label>\n                        <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/50 cursor-pointer\">\n                            <input type=\"radio\" name=\"q8\" value=\"c\" class=\"mr-2\"> C. Đuổi việc ngay lập tức không cần nghe giải thích.\n                        </label>\n                    </div>\n                    <div class=\"mt-4 p-3 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 rounded-lg text-xs text-emerald-800 dark:text-emerald-300 hidden\" id=\"q8-ans\">\n                        <strong>Đáp án chính xác: B!</strong> Văn hóa Extreme Ownership không chấp nhận việc lãnh đạo cấp trung hành xử như nạn nhân của thời tiết hay thị trường. Người quản lý giỏi là người luôn tìm thấy giải pháp xoay chuyển tình thế.\n                    </div>\n                    <button onclick=\"document.getElementById('q8-ans').classList.toggle('hidden')\" class=\"mt-3 px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded text-xs font-semibold\">Xem Giải Thích Học Thuật</button>\n                </div>\n                "}]}, {"id": 9, "title": "Khung Năng Lực AI Thực Chiến Cho Ban Lãnh Đạo & Quản Lý DTD", "subtitle": "Kỹ thuật Prompt CARE, tự động hóa MISA bằng Python, kiến trúc Zalo Bot AI Agent và bảo mật dữ liệu", "badge": "Công Nghệ & Trí Tuệ Nhân Tạo AI", "duration": "30 phút học", "lessons": [{"tab": "core", "name": "Khung Prompt CARE & Co-Pilot Lãnh Đạo", "content": "\n                <div class=\"space-y-6\">\n                    <div class=\"bg-teal-50 dark:bg-slate-800/60 p-5 rounded-xl border border-teal-200 dark:border-slate-700\">\n                        <h4 class=\"text-lg font-bold text-teal-900 dark:text-teal-300 mb-2\">🤖 AI Không Thay Thế Lãnh Đạo, Nhưng Lãnh Đạo Dùng AI Sẽ Thay Thế Lãnh Đạo Không Dùng</h4>\n                        <p class=\"text-slate-700 dark:text-slate-300 leading-relaxed\">\n                            Đối với ban lãnh đạo DTD & VACP, AI không phải là công cụ chat giải trí, mà là một <strong>Tổng Tham Mưu Trưởng (Executive Co-Pilot)</strong> hỗ trợ bóc tách báo cáo tài chính hàng nghìn dòng, phát hiện lỗ hổng hợp đồng, kiến tạo chiến lược GTM và tự động hóa xuất báo cáo hàng sáng.\n                        </p>\n                    </div>\n\n                    <h4 class=\"text-xl font-bold text-slate-900 dark:text-white mt-4\">🎯 Khung Kỹ Thuật Prompt Chuẩn C-Level: C.A.R.E</h4>\n                    <div class=\"grid sm:grid-cols-4 gap-3 text-sm\">\n                        <div class=\"p-4 bg-white dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700\">\n                            <div class=\"font-bold text-blue-600 mb-1\">C - Context (Bối Cảnh)</div>\n                            <p class=\"text-xs text-slate-600 dark:text-slate-300\">Cung cấp dữ liệu chi tiết: Bạn là ai, công ty phân phối B2B mỹ phẩm tóc, 21 NPP, thị trường đang gặp rào cản gì.</p>\n                        </div>\n                        <div class=\"p-4 bg-white dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700\">\n                            <div class=\"font-bold text-amber-600 mb-1\">A - Action (Hành Động)</div>\n                            <p class=\"text-xs text-slate-600 dark:text-slate-300\">Yêu cầu chính xác động từ hành động: Phân tích, đối soát, phản biện tử huyệt, thiết lập kịch bản GTM, tính toán P&L.</p>\n                        </div>\n                        <div class=\"p-4 bg-white dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700\">\n                            <div class=\"font-bold text-emerald-600 mb-1\">R - Result (Định Dạng)</div>\n                            <p class=\"text-xs text-slate-600 dark:text-slate-300\">Quy định định dạng đầu ra cụ thể: Bảng so sánh 5 cột, file Excel với độ cao hàng tự động, tài liệu Word căn lề chuẩn mẫu.</p>\n                        </div>\n                        <div class=\"p-4 bg-white dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700\">\n                            <div class=\"font-bold text-purple-600 mb-1\">E - Example (Ví Dụ / Tiêu Chuẩn)</div>\n                            <p class=\"text-xs text-slate-600 dark:text-slate-300\">Cung cấp chuẩn mực mẫu: Văn phong kiếm hiệp cổ trang lịch thiệp, không hallucinate, trích dẫn số liệu thật.</p>\n                        </div>\n                    </div>\n                </div>\n                "}, {"tab": "data", "name": "Kiến Trúc Tự Động Hóa MISA & Zalo Bot AI Agent", "content": "\n                <div class=\"space-y-4 text-xs text-slate-600 dark:text-slate-300\">\n                    <div class=\"p-4 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700\">\n                        <div class=\"font-bold text-blue-600 mb-2\">1. Kiến Trúc Lấy Dữ Liệu Tự Động Từ MISA AMIS (Playwright Route Interception)</div>\n                        <p class=\"leading-relaxed\">Thay vì nhân viên kế toán phải ngồi tải thủ công từng file Excel từ MISA, một script Python chạy ngầm hàng đêm lúc 02:00 sáng tự động đăng nhập, chặn bắt API Token (Route Interception), tải toàn bộ báo cáo công nợ và doanh thu 21 NPP, lưu vào máy chủ an toàn.</p>\n                    </div>\n                    <div class=\"p-4 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700\">\n                        <div class=\"font-bold text-emerald-600 mb-2\">2. Zalo Bot AI Agent Đẩy Báo Cáo Vào Nhóm Chat Lãnh Đạo</div>\n                        <p class=\"leading-relaxed\">Đúng 07:30 sáng, Bot AI kích hoạt mô hình ngôn ngữ phân tích số liệu đêm qua, đúc kết 3 dòng cảnh báo: <em>NPP nào vượt hạn mức nợ? SKU nào sắp hết hàng trong kho?</em> Sau đó tạo tự động 1 file Excel định dạng chuẩn và gửi trực tiếp vào nhóm Zalo của Ban Giám Đốc.</p>\n                    </div>\n                </div>\n                "}, {"tab": "checklist", "name": "Checklist An Toàn Thông Tin & Bảo Mật Dữ Liệu AI", "content": "\n                <div class=\"space-y-3 text-sm text-slate-700 dark:text-slate-300\">\n                    <label class=\"flex items-start gap-2 p-2 bg-white dark:bg-slate-800 rounded border border-slate-200 dark:border-slate-700\">\n                        <input type=\"checkbox\" class=\"mt-1\">\n                        <span><strong>Ẩn tuyệt đối đường dẫn nội bộ:</strong> Không bao giờ để lộ đường dẫn ổ đĩa máy tính cục bộ (C:\\, F:\\) trong tin nhắn gửi nhân sự hoặc đối tác.</span>\n                    </label>\n                    <label class=\"flex items-start gap-2 p-2 bg-white dark:bg-slate-800 rounded border border-slate-200 dark:border-slate-700\">\n                        <input type=\"checkbox\" class=\"mt-1\">\n                        <span><strong>Mã hóa danh tính khách hàng:</strong> Khi đưa dữ liệu lên các mô hình AI công cộng để phân tích xu hướng, cần ẩn số điện thoại và địa chỉ cụ thể của chủ salon.</span>\n                    </label>\n                </div>\n                "}, {"tab": "quiz", "name": "Trắc Nghiệm Tư Duy AI Cấp Quản Lý", "content": "\n                <div class=\"p-5 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700\">\n                    <div class=\"font-bold text-slate-900 dark:text-white mb-2\">Câu hỏi: Để AI phân tích chính xác xem NPP Hải Phòng tại sao giảm 30% doanh số trong tháng 8, prompt nào dưới đây hiệu quả nhất?</div>\n                    <div class=\"space-y-2 mt-3 text-sm text-slate-700 dark:text-slate-300\">\n                        <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/50 cursor-pointer\">\n                            <input type=\"radio\" name=\"q9\" value=\"a\" class=\"mr-2\"> A. \"Tại sao NPP Hải Phòng tháng này bán ế vậy AI?\"\n                        </label>\n                        <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/50 cursor-pointer\">\n                            <input type=\"radio\" name=\"q9\" value=\"b\" class=\"mr-2\"> B. Áp dụng CARE: Cung cấp bối cảnh (Doanh số tháng 7 vs tháng 8 theo từng mã SKU, lịch sử thanh toán công nợ), yêu cầu AI đối chiếu xem sự sụt giảm đến từ mã uốn hay mã nhuộm, phân tích rào cản chuyển đổi và đề xuất 3 giải pháp kích cầu cụ thể.\n                        </label>\n                        <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/50 cursor-pointer\">\n                            <input type=\"radio\" name=\"q9\" value=\"c\" class=\"mr-2\"> C. \"Viết cho tôi một bài thơ động viên NPP Hải Phòng cố gắng bán hàng.\"\n                        </label>\n                    </div>\n                    <div class=\"mt-4 p-3 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 rounded-lg text-xs text-emerald-800 dark:text-emerald-300 hidden\" id=\"q9-ans\">\n                        <strong>Đáp án chính xác: B!</strong> Nguyên tắc vàng của AI là \"Garbage In, Garbage Out\". Chỉ khi bạn cung cấp dữ liệu đầu vào chi tiết, có cấu trúc và đặt câu hỏi bóc tách rõ ràng theo khung CARE, AI mới có thể đóng vai trò cố vấn phân tích sắc bén cho ban lãnh đạo.\n                    </div>\n                    <button onclick=\"document.getElementById('q9-ans').classList.toggle('hidden')\" class=\"mt-3 px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded text-xs font-semibold\">Xem Giải Thích Học Thuật</button>\n                </div>\n                "}]}];
        let currentEpisodeId = 1;
        let currentTab = 'core';
        let completedEpisodes = JSON.parse(localStorage.getItem('dtd_completed_episodes') || '[]');

        // Theme management
        const html = document.documentElement;
        const themeToggle = document.getElementById('theme-toggle');
        const themeLightIcon = document.getElementById('theme-icon-light');
        const themeDarkIcon = document.getElementById('theme-icon-dark');

        function updateTheme(dark) {
            if (dark) {
                html.classList.add('dark');
                themeLightIcon.classList.remove('hidden');
                themeDarkIcon.classList.add('hidden');
                localStorage.setItem('dtd_theme', 'dark');
            } else {
                html.classList.remove('dark');
                themeLightIcon.classList.add('hidden');
                themeDarkIcon.classList.remove('hidden');
                localStorage.setItem('dtd_theme', 'light');
            }
        }

        const savedTheme = localStorage.getItem('dtd_theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            updateTheme(true);
        } else {
            updateTheme(false);
        }

        themeToggle.addEventListener('click', () => {
            updateTheme(!html.classList.contains('dark'));
        });

        // Render Sidebar List
        const listContainer = document.getElementById('episode-list');
        function renderSidebar() {
            listContainer.innerHTML = '';
            episodes.forEach(ep => {
                const isCurrent = ep.id === currentEpisodeId;
                const isCompleted = completedEpisodes.includes(ep.id);
                
                const item = document.createElement('a');
                item.href = '#';
                item.className = `block p-3 rounded-xl transition-all ${
                    isCurrent 
                    ? 'bg-blue-50 dark:bg-blue-950/50 border border-blue-200 dark:border-blue-800 text-blue-900 dark:text-blue-200 shadow-sm' 
                    : 'hover:bg-slate-100 dark:hover:bg-slate-800/60 text-slate-700 dark:text-slate-300'
                }`;
                
                item.innerHTML = `
                    <div class="flex items-center justify-between mb-1">
                        <span class="text-[11px] font-bold ${isCurrent ? 'text-blue-600 dark:text-blue-400' : 'text-slate-400'}">TẬP ${ep.id}</span>
                        <span class="text-xs">${isCompleted ? '✅' : '⚪'}</span>
                    </div>
                    <div class="font-bold text-xs line-clamp-2 leading-snug">${ep.title}</div>
                `;
                
                item.addEventListener('click', (e) => {
                    e.preventDefault();
                    currentEpisodeId = ep.id;
                    currentTab = 'core';
                    renderContent();
                    renderSidebar();
                    if (window.innerWidth < 1024) {
                        document.getElementById('sidebar').classList.add('-translate-x-full');
                    }
                });
                
                listContainer.appendChild(item);
            });
            updateProgress();
        }

        function updateProgress() {
            const pct = Math.round((completedEpisodes.length / episodes.length) * 100);
            document.getElementById('progress-text').innerText = pct + '%';
            document.getElementById('progress-bar').style.width = pct + '%';
        }

        // Render Current Episode Content
        function renderContent() {
            const ep = episodes.find(e => e.id === currentEpisodeId);
            if (!ep) return;

            document.getElementById('current-badge').innerText = ep.badge;
            document.getElementById('current-duration').innerText = '⏱️ ' + ep.duration;
            document.getElementById('current-title').innerText = `Tập ${ep.id}: ${ep.title}`;
            document.getElementById('current-subtitle').innerText = ep.subtitle;
            document.getElementById('episode-pagination').innerText = `Tập ${ep.id} / ${episodes.length}`;

            const isDone = completedEpisodes.includes(ep.id);
            document.getElementById('complete-icon').innerText = isDone ? '✅' : '⭕';
            document.getElementById('complete-text').innerText = isDone ? 'Đã hoàn thành tập này' : 'Đánh dấu đã hoàn thành tập này';

            // Render Tabs
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if (btn.dataset.tab === currentTab) {
                    btn.className = 'tab-btn px-4 py-2.5 text-xs sm:text-sm font-semibold border-b-2 border-blue-600 text-blue-600 dark:text-blue-400 -mb-[1px]';
                } else {
                    btn.className = 'tab-btn px-4 py-2.5 text-xs sm:text-sm font-semibold border-b-2 border-transparent text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 -mb-[1px]';
                }
            });

            const lesson = ep.lessons.find(l => l.tab === currentTab) || ep.lessons[0];
            document.getElementById('tab-pane-content').innerHTML = lesson.content;

            // Update buttons
            document.getElementById('btn-prev').disabled = (currentEpisodeId === 1);
            document.getElementById('btn-prev').classList.toggle('opacity-50', currentEpisodeId === 1);
            document.getElementById('btn-next').disabled = (currentEpisodeId === episodes.length);
            document.getElementById('btn-next').classList.toggle('opacity-50', currentEpisodeId === episodes.length);
        }

        // Tab click listeners
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentTab = btn.dataset.tab;
                renderContent();
            });
        });

        // Prev / Next listeners
        document.getElementById('btn-prev').addEventListener('click', () => {
            if (currentEpisodeId > 1) {
                currentEpisodeId--;
                currentTab = 'core';
                renderContent();
                renderSidebar();
            }
        });

        document.getElementById('btn-next').addEventListener('click', () => {
            if (currentEpisodeId < episodes.length) {
                currentEpisodeId++;
                currentTab = 'core';
                renderContent();
                renderSidebar();
            }
        });

        // Mark complete listener
        document.getElementById('btn-complete').addEventListener('click', () => {
            const idx = completedEpisodes.indexOf(currentEpisodeId);
            if (idx === -1) {
                completedEpisodes.push(currentEpisodeId);
            } else {
                completedEpisodes.splice(idx, 1);
            }
            localStorage.setItem('dtd_completed_episodes', JSON.stringify(completedEpisodes));
            renderContent();
            renderSidebar();
        });

        // Mobile sidebar toggle
        document.getElementById('toggle-sidebar').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
        });

        // Search filter
        document.getElementById('episode-search').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            document.querySelectorAll('#episode-list > a').forEach((item, index) => {
                const ep = episodes[index];
                const match = ep.title.toLowerCase().includes(query) || ep.subtitle.toLowerCase().includes(query);
                item.style.display = match ? 'block' : 'none';
            });
        });

        // Initial setup
        renderSidebar();
        renderContent();
    </script>
</body>
</html>
