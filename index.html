    <script>
        const dtdData = {"company": "DTD HOLDING", "track_title": "Học Viện Quản Trị B2B & Phân Phối Mỹ Phẩm Tóc Toàn Quốc", "tagline": "Dành riêng cho Lãnh đạo, Quản lý, Kế toán, SCM và Đội ngũ Kinh doanh B2B của DTD Holding", "icon": "🏛️", "modules": [{"id": "dtd_m1", "title": "Module 1: Tầm Nhìn Chiến Lược 2026–2030, Lịch Sử & Triết Lý Vận Hành 5 Hóa DTD Holding", "subtitle": "Hành trình phát triển, sứ mệnh phụng sự Salon đại chúng, mục tiêu phủ sóng 65 NPP và kỷ luật văn hóa 5 Hóa", "duration": "25 phút học", "lessons": [{"tab": "theory", "name": "1. Lịch Sử, Sứ Mệnh & Tầm Nhìn Chiến Lược 2026–2030", "content": "\n                    <div class=\"space-y-5 text-slate-700 dark:text-slate-300\">\n                        <div class=\"p-5 bg-amber-50/70 dark:bg-slate-800/80 rounded-xl border border-amber-200 dark:border-slate-700\">\n                            <h4 class=\"text-lg font-black text-amber-950 dark:text-amber-300 mb-2\">📜 Hành Trình & Sứ Mệnh Của DTD Holding</h4>\n                            <p class=\"text-sm leading-relaxed mb-3\">\n                                Được sáng lập bởi <strong>Founder Định HongKong</strong>, DTD Holding khởi đầu từ khát vọng giải quyết nỗi đau lớn nhất của ngành tóc Việt Nam: <em>Hàng trăm nghìn thợ tóc và chủ salon tại các tỉnh thành phải mua hóa chất uốn, nhuộm, tẩy với giá quá đắt từ các thương hiệu ngoại, hoặc phải chấp nhận dùng hàng trôi nổi, không rõ nguồn gốc làm hư hại tóc khách hàng.</em>\n                            </p>\n                            <p class=\"text-sm leading-relaxed\">\n                                <strong>Sứ Mệnh Bất Biến Của DTD Holding:</strong> Trở thành bệ phóng kinh doanh vững chắc, cung cấp hệ sinh thái sản phẩm chất lượng cao, giá thành hợp lý và đào tạo kỹ thuật thực chiến, đồng hành cùng sự giàu có và bền vững của hàng chục nghìn Salon tóc trên toàn quốc.\n                            </p>\n                        </div>\n\n                        <div class=\"p-5 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800\">\n                            <h4 class=\"text-lg font-black text-slate-900 dark:text-white mb-3\">🎯 Mục Tiêu Chiến Lược Giai Đoạn 2026–2030</h4>\n                            <div class=\"grid sm:grid-cols-3 gap-3 text-xs\">\n                                <div class=\"p-3 bg-slate-50 dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700\">\n                                    <div class=\"font-bold text-amber-600 dark:text-amber-400 mb-1\">MỞ RỘNG MẠNG LƯỚI</div>\n                                    <div class=\"text-base font-black text-slate-900 dark:text-white mb-1\">65 Nhà Phân Phối</div>\n                                    <p class=\"text-slate-500 dark:text-slate-400\">Nâng quy mô từ 21 NPP hiện tại lên 65 NPP độc quyền cấp tỉnh, bảo đảm mỗi tỉnh thành đều có một tổng kho vệ tinh phụ trách địa bàn.</p>\n                                </div>\n                                <div class=\"p-3 bg-slate-50 dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700\">\n                                    <div class=\"font-bold text-blue-600 dark:text-blue-400 mb-1\">ĐỘ PHỦ THỊ TRƯỜNG</div>\n                                    <div class=\"text-base font-black text-slate-900 dark:text-white mb-1\">10,000+ Salon Tỉnh</div>\n                                    <p class=\"text-slate-500 dark:text-slate-400\">Thiết lập quan hệ cung ứng định kỳ hàng tháng cho hơn 10,000 Salon tầm trung và đại chúng tại các huyện, thị xã và thành phố trực thuộc tỉnh.</p>\n                                </div>\n                                <div class=\"p-3 bg-slate-50 dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700\">\n                                    <div class=\"font-bold text-emerald-600 dark:text-emerald-400 mb-1\">HẠ TẦNG VẬN HÀNH</div>\n                                    <div class=\"text-base font-black text-slate-900 dark:text-white mb-1\">ERP & Tự Động Hóa</div>\n                                    <p class=\"text-slate-500 dark:text-slate-400\">100% dữ liệu xuất nhập tồn, bán hàng MISA AMIS và dự báo Đặt hàng v4 được số hóa và liên kết tự động bằng bot AI.</p>\n                                </div>\n                            </div>\n                        </div>\n\n                        <div class=\"p-5 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800\">\n                            <h4 class=\"text-lg font-black text-slate-900 dark:text-white mb-3\">⚡ Triết Lý Vận Hành \"5 HÓA\" Bắt Buộc Tại DTD Holding</h4>\n                            <div class=\"space-y-2 text-xs\">\n                                <div class=\"p-2.5 bg-slate-50 dark:bg-slate-800 rounded-lg\">\n                                    <strong>1. Chuẩn Hóa:</strong> Định nghĩa rõ ràng quy cách từng thùng hàng, tem nhãn phụ, tiêu chuẩn chất lượng sản phẩm và phiếu giao hàng.\n                                </div>\n                                <div class=\"p-2.5 bg-slate-50 dark:bg-slate-800 rounded-lg\">\n                                    <strong>2. Quy Trình Hóa:</strong> Mọi thao tác xuất kho, thu tiền mặt, duyệt nợ gối đầu đều phải tuân thủ đúng quy trình, không làm việc dựa vào trí nhớ.\n                                </div>\n                                <div class=\"p-2.5 bg-slate-50 dark:bg-slate-800 rounded-lg\">\n                                    <strong>3. Số Hóa:</strong> Cấm dùng sổ sách tay rời rạc. Toàn bộ đơn hàng phải được lập phiếu và hạch toán trực tiếp trên phần mềm kế toán MISA.\n                                </div>\n                                <div class=\"p-2.5 bg-slate-50 dark:bg-slate-800 rounded-lg\">\n                                    <strong>4. Tự Động Hóa:</strong> Sử dụng hệ thống tự động đồng bộ số liệu, gửi cảnh báo nợ quá hạn và tạo báo cáo doanh số mỗi sáng.\n                                </div>\n                                <div class=\"p-2.5 bg-slate-50 dark:bg-slate-800 rounded-lg\">\n                                    <strong>5. Tối Ưu Hóa:</strong> Định kỳ hàng quý rà soát các mã SKU bán chậm, tối ưu tồn kho an toàn và nâng cao hiệu suất giao vận.\n                                </div>\n                            </div>\n                        </div>\n                    </div>\n                    "}, {"tab": "data", "name": "2. Bảng Giá Trị Cốt Lõi & Thước Đo Kỷ Luật DTD", "content": "\n                    <div class=\"overflow-x-auto text-xs\">\n                        <table class=\"w-full text-left border-collapse\">\n                            <thead class=\"bg-slate-100 dark:bg-slate-800 uppercase font-bold text-slate-700 dark:text-slate-300\">\n                                <tr>\n                                    <th class=\"p-3 border\">Giá Trị Cốt Lõi</th>\n                                    <th class=\"p-3 border\">Hành Vi Được Khuyến Khích (Chuẩn Mực)</th>\n                                    <th class=\"p-3 border text-red-600\">Hành Vi Bị Cấm Tuyệt Đối</th>\n                                </tr>\n                            </thead>\n                            <tbody class=\"divide-y text-slate-600 dark:text-slate-300\">\n                                <tr>\n                                    <td class=\"p-3 font-bold border\">1. Tận Tâm Phụng Sự Salon</td>\n                                    <td class=\"p-3 border\">Nhiệt tình tư vấn kỹ thuật pha màu, hỗ trợ salon xử lý khi thuốc lên màu không như ý, giao hàng đúng hẹn.</td>\n                                    <td class=\"p-3 border text-red-500\">Thái độ trịch thượng với thợ salon tỉnh, ép đại lý ôm hàng quá khả năng thanh toán.</td>\n                                </tr>\n                                <tr>\n                                    <td class=\"p-3 font-bold border\">2. Kỷ Luật Số Liệu MISA</td>\n                                    <td class=\"p-3 border\">Đối soát doanh số hàng ngày, ghi nhận đúng thực tế kho bãi, cập nhật thanh toán ngay khi tiền về tài khoản.</td>\n                                    <td class=\"p-3 border text-red-500\">Kê khống đơn hàng để lấy thưởng doanh số, tự ý xuất kho khi chưa có lệnh trên phần mềm.</td>\n                                </tr>\n                                <tr>\n                                    <td class=\"p-3 font-bold border\">3. Trách Nhiệm 100%</td>\n                                    <td class=\"p-3 border\">Chủ động nhận lỗi khi giao thiếu mã hàng, lập tức gửi bù bằng chuyến xe tiếp theo trong 24h.</td>\n                                    <td class=\"p-3 border text-red-500\">Đổ lỗi cho nhà xe vận chuyển, đùn đẩy trách nhiệm kiểm tra thùng hàng cho khách.</td>\n                                </tr>\n                            </tbody>\n                        </table>\n                    </div>\n                    "}, {"tab": "checklist", "name": "3. Bộ Quy Tắc Vận Hành CLAUDE.md Cho Đội Ngũ DTD", "content": "\n                    <div class=\"space-y-3 text-xs text-slate-700 dark:text-slate-300\">\n                        <div class=\"p-3 bg-white dark:bg-slate-800 rounded border border-slate-200 dark:border-slate-700\">\n                            <strong>Quy Tắc 1: Ẩn Danh & Bảo Mật Khách Hàng:</strong> Khi chia sẻ dữ liệu kinh doanh hoặc làm việc với công cụ AI, tuyệt đối không để lộ số điện thoại, tài khoản ngân hàng và địa chỉ chi tiết của các chủ salon.\n                        </div>\n                        <div class=\"p-3 bg-white dark:bg-slate-800 rounded border border-slate-200 dark:border-slate-700\">\n                            <strong>Quy Tắc 2: Giữ Vững Cấu Trúc Giá NPP:</strong> Mọi chính sách chiết khấu vượt khung quy định bắt buộc phải có tờ trình gửi Giám đốc Kinh doanh duyệt trước khi báo cho đại lý.\n                        </div>\n                        <div class=\"p-3 bg-white dark:bg-slate-800 rounded border border-slate-200 dark:border-slate-700\">\n                            <strong>Quy Tắc 3: Xử Lý Đơn Hàng Mùa Cao Điểm:</strong> Vào tháng 11 - 12 âm lịch, các đơn đặt hàng từ NPP phải được gửi trước ít nhất 7 ngày làm việc để kho tổng sắp xếp lịch xe giao vận.\n                        </div>\n                    </div>\n                    "}, {"tab": "quiz", "name": "4. Trắc Nghiệm Văn Hóa & Tầm Nhìn DTD", "content": "\n                    <div class=\"p-4 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700\">\n                        <div class=\"font-bold text-sm text-slate-900 dark:text-white mb-2\">Câu hỏi: Mục tiêu chiến lược cốt lõi về mạng lưới phân phối của DTD Holding đến năm 2030 là gì?</div>\n                        <div class=\"space-y-2 mt-3 text-xs text-slate-700 dark:text-slate-300\">\n                            <label class=\"block p-2.5 rounded border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 cursor-pointer\">\n                                <input type=\"radio\" name=\"dtd_q1\" value=\"a\" class=\"mr-2\"> A. Dừng bán qua đại lý để tự mở 500 cửa hàng bán lẻ trên toàn quốc.\n                            </label>\n                            <label class=\"block p-2.5 rounded border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 cursor-pointer\">\n                                <input type=\"radio\" name=\"dtd_q1\" value=\"b\" class=\"mr-2\"> B. Nâng quy mô từ 21 NPP lên 65 Nhà Phân Phối độc quyền cấp tỉnh bao phủ 100% các tỉnh thành, phục vụ hơn 10,000 Salon đối tác.\n                            </label>\n                            <label class=\"block p-2.5 rounded border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 cursor-pointer\">\n                                <input type=\"radio\" name=\"dtd_q1\" value=\"c\" class=\"mr-2\"> C. Chuyển sang kinh doanh mỹ phẩm online hoàn toàn trên sàn Shopee.\n                            </label>\n                        </div>\n                        <div class=\"mt-3 p-3 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 rounded text-xs text-emerald-800 dark:text-emerald-300 hidden\" id=\"dtd_q1_ans\">\n                            <strong>Đáp án đúng: B!</strong> DTD Holding kiên định với mô hình phân phối B2B vững chắc qua hệ thống 65 NPP độc quyền cấp tỉnh, bảo đảm độ phủ sâu rộng tới tận các salon cấp huyện và thị xã.\n                        </div>\n                        <button onclick=\"document.getElementById('dtd_q1_ans').classList.toggle('hidden')\" class=\"mt-3 px-3 py-1 bg-amber-600 hover:bg-amber-700 text-white rounded text-xs font-semibold\">Xem Giải Thích</button>\n                    </div>\n                    "}]}, {"id": "dtd_m2", "title": "Module 2: Mô Hình Kinh Doanh B2B & Quản Trị Hệ Thống 21–65 Nhà Phân Phối (NPP)", "subtitle": "Cơ chế bảo vệ địa bàn độc quyền, chính sách chiết khấu bậc thang, kiểm soát chống lấn vùng và hỗ trợ bán hàng", "duration": "30 phút học", "lessons": [{"tab": "theory", "name": "1. Nguyên Tắc Vận Hành Hệ Thống Đại Lý Độc Quyền", "content": "\n                    <div class=\"space-y-4 text-xs text-slate-700 dark:text-slate-300 leading-relaxed\">\n                        <div class=\"p-4 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700\">\n                            <h5 class=\"font-bold text-sm text-slate-900 dark:text-white mb-2\">1. Quy Chế Bảo Vệ Địa Bàn Độc Quyền:</h5>\n                            <p>Mỗi Nhà Phân Phối (NPP) khi ký hợp đồng chính thức với DTD Holding được giao toàn quyền quản lý và phân phối độc quyền nhãn hàng trên địa bàn một tỉnh hoặc thành phố trực thuộc. Công ty cam kết <strong>không mở thêm NPP thứ 2</strong> trên cùng một địa bàn đã cam kết doanh số.</p>\n                        </div>\n                        <div class=\"p-4 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700\">\n                            <h5 class=\"font-bold text-sm text-slate-900 dark:text-white mb-2\">2. Chế Tài Chống Bán Phá Giá & Tràn Vùng:</h5>\n                            <p>Bán tràn vùng (tuồn hàng sang tỉnh của NPP khác) hoặc bán dưới giá niêm yết là <strong>hành vi phá hoại hệ thống nghiêm trọng</strong>. Khi phát hiện qua số lô (lot number) in trên vỏ hộp, NPP vi phạm sẽ bị: Cảnh cáo lần 1 -> Thu hồi 50% tiền thưởng quý -> Cắt hợp đồng độc quyền và chuyển quyền phân phối cho đối tác khác.</p>\n                        </div>\n                        <div class=\"p-4 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700\">\n                            <h5 class=\"font-bold text-sm text-slate-900 dark:text-white mb-2\">3. Cơ Chế Chiết Khấu Bậc Thang:</h5>\n                            <p>Chiết khấu thương mại được tính toán theo sản lượng cam kết hàng tháng (ví dụ: Đạt mốc 50tr, 100tr, 200tr). Ngoài ra, NPP thanh toán tiền mặt ngay hoặc chuyển khoản trước khi xuất hàng được hưởng thêm <strong>chiết khấu thanh toán sớm 2%</strong>.</p>\n                        </div>\n                    </div>\n                    "}, {"tab": "data", "name": "2. Bảng Phân Bổ Chỉ Tiêu Doanh Số NPP Theo Vùng", "content": "\n                    <div class=\"overflow-x-auto text-xs\">\n                        <table class=\"w-full text-left border-collapse\">\n                            <thead class=\"bg-slate-100 dark:bg-slate-800 uppercase font-bold\">\n                                <tr>\n                                    <th class=\"p-2.5 border\">Phân Hạng Tỉnh</th>\n                                    <th class=\"p-2.5 border\">Tiêu Chí Đánh Giá</th>\n                                    <th class=\"p-2.5 border\">Doanh Số Tối Thiểu/Tháng</th>\n                                    <th class=\"p-2.5 border\">Hạn Mức Công Nợ Gối Đầu</th>\n                                </tr>\n                            </thead>\n                            <tbody class=\"divide-y text-slate-600 dark:text-slate-300\">\n                                <tr>\n                                    <td class=\"p-2.5 font-bold border\">Tỉnh Hạng 1 (Hải Phòng, Quảng Ninh, Nghệ An, Thanh Hóa...)</td>\n                                    <td class=\"p-2.5 border\">Dân số &gt; 1.5 triệu, kinh tế phát triển, trên 500 salon đang hoạt động.</td>\n                                    <td class=\"p-2.5 border font-bold text-amber-600\">150.000.000 - 250.000.000 VNĐ</td>\n                                    <td class=\"p-2.5 border\">Tối đa 150.000.000 VNĐ (Không quá 30 ngày)</td>\n                                </tr>\n                                <tr>\n                                    <td class=\"p-2.5 font-bold border\">Tỉnh Hạng 2 (Thái Bình, Nam Định, Bắc Giang, Phú Thọ...)</td>\n                                    <td class=\"p-2.5 border\">Dân số 1 - 1.5 triệu, khoảng 200 - 400 salon.</td>\n                                    <td class=\"p-2.5 border font-bold text-amber-600\">80.000.000 - 120.000.000 VNĐ</td>\n                                    <td class=\"p-2.5 border\">Tối đa 80.000.000 VNĐ (Không quá 30 ngày)</td>\n                                </tr>\n                                <tr>\n                                    <td class=\"p-2.5 font-bold border\">Tỉnh Hạng 3 (Miền núi phía Bắc & Tây Nguyên)</td>\n                                    <td class=\"p-2.5 border\">Dân số thưa, salon phân tán.</td>\n                                    <td class=\"p-2.5 border font-bold text-amber-600\">40.000.000 - 60.000.000 VNĐ</td>\n                                    <td class=\"p-2.5 border\">Tối đa 40.000.000 VNĐ (Không quá 30 ngày)</td>\n                                </tr>\n                            </tbody>\n                        </table>\n                    </div>\n                    "}, {"tab": "checklist", "name": "3. Quy Trình Chăm Sóc & Phát Triển NPP Mới", "content": "\n                    <div class=\"space-y-2 text-xs text-slate-700 dark:text-slate-300\">\n                        <div class=\"p-3 bg-white dark:bg-slate-800 rounded border\">\n                            <strong>Bước 1 - Khảo Sát Địa Bàn:</strong> Quản lý vùng DTD xuống trực tiếp tỉnh, khảo sát tệp salon, đánh giá uy tín và năng lực tài chính của đại lý.\n                        </div>\n                        <div class=\"p-3 bg-white dark:bg-slate-800 rounded border\">\n                            <strong>Bước 2 - Ký Hợp Đồng Thử Thách 3 Tháng:</strong> Giao chỉ tiêu thử thách 70% định mức. Công ty tài trợ toàn bộ tài liệu mẫu mã và chuyên viên kỹ thuật về đào tạo hỗ trợ mở hàng.\n                        </div>\n                        <div class=\"p-3 bg-white dark:bg-slate-800 rounded border\">\n                            <strong>Bước 3 - Bàn Giao Hợp Đồng Độc Quyền Chính Thức:</strong> Khi đạt chỉ tiêu 3 tháng liên tiếp, chính thức trao chứng nhận độc quyền tỉnh và cấp hạn mức nợ gối đầu.\n                        </div>\n                    </div>\n                    "}, {"tab": "quiz", "name": "4. Trắc Nghiệm Xử Lý Tranh Chấp Địa Bàn", "content": "\n                    <div class=\"p-4 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700\">\n                        <div class=\"font-bold text-sm text-slate-900 dark:text-white mb-2\">Tình huống: NPP tỉnh A phát hiện NPP tỉnh B lén bán thuốc nhuộm GLEM cho một salon thuộc địa phận tỉnh A với giá thấp hơn 5%. Quản lý vùng DTD phải xử lý thế nào?</div>\n                        <div class=\"space-y-2 mt-3 text-xs text-slate-700 dark:text-slate-300\">\n                            <label class=\"block p-2.5 rounded border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 cursor-pointer\">\n                                <input type=\"radio\" name=\"dtd_q2\" value=\"a\" class=\"mr-2\"> A. Để hai NPP tự thỏa thuận với nhau vì công ty chỉ bán buôn.\n                            </label>\n                            <label class=\"block p-2.5 rounded border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 cursor-pointer\">\n                                <input type=\"radio\" name=\"dtd_q2\" value=\"b\" class=\"mr-2\"> B. Lập biên bản kiểm tra số lô hộp thuốc tại salon, xác minh nguồn gốc xuất kho của NPP B. Buộc NPP B phải thu hồi hàng về và bồi hoàn toàn bộ doanh số cho NPP A, đồng thời trừ điểm thi đua của NPP B.\n                            </label>\n                            <label class=\"block p-2.5 rounded border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 cursor-pointer\">\n                                <input type=\"radio\" name=\"dtd_q2\" value=\"c\" class=\"mr-2\"> C. Giảm giá bán cho cả 2 NPP để cạnh tranh tự do.\n                            </label>\n                        </div>\n                        <div class=\"mt-3 p-3 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 rounded text-xs text-emerald-800 dark:text-emerald-300 hidden\" id=\"dtd_q2_ans\">\n                            <strong>Đáp án đúng: B!</strong> Kỷ luật địa bàn là nguyên tắc sống còn của phân phối B2B. Nếu thả nổi cho bán tràn vùng và phá giá, các đại lý sẽ mất lòng tin và đồng loạt từ bỏ nhãn hàng.\n                        </div>\n                        <button onclick=\"document.getElementById('dtd_q2_ans').classList.toggle('hidden')\" class=\"mt-3 px-3 py-1 bg-amber-600 hover:bg-amber-700 text-white rounded text-xs font-semibold\">Xem Giải Thích</button>\n                    </div>\n                    "}]}, {"id": "dtd_m3", "title": "Module 3: Cẩm Nang Sản Phẩm Cốt Lõi: GLEM, Luminous, Amino Care & MINATO", "subtitle": "Khoa học hạt màu nano, phủ bạc 100%, phân tích doanh số 2.12 tỷ T6/2026 và công thức chuyển từ tặng sang bán", "duration": "30 phút học", "lessons": [{"tab": "theory", "name": "1. Khoa Học Sản Phẩm & Vũ Khí Chiếm Lĩnh Thị Phần GLEM", "content": "\n                    <div class=\"space-y-4 text-xs text-slate-700 dark:text-slate-300 leading-relaxed\">\n                        <div class=\"p-4 bg-amber-50/60 dark:bg-slate-800 rounded-xl border border-amber-200 dark:border-slate-700\">\n                            <h5 class=\"font-bold text-sm text-amber-950 dark:text-amber-300 mb-2\">⭐ Thương Hiệu GLEM — Cỗ Máy Tạo Dòng Tiền Vững Chắc</h5>\n                            <p class=\"mb-2\">Trong danh mục của DTD Holding, GLEM đóng vai trò là <strong>sản phẩm trụ cột (Cash Cow)</strong>, phục vụ trực tiếp cho nhu cầu nhuộm màu và phủ bạc tại các salon tỉnh với những ưu thế vượt trội:</p>\n                            <ul class=\"list-disc pl-4 space-y-1\">\n                                <li><strong>Hạt màu Nano siêu mịn:</strong> Dễ dàng thẩm thấu sâu vào lớp vỏ tóc (Cortex) mà không cần nồng độ amoniac quá cao, giúp tóc sau nhuộm giữ được độ bóng mượt tự nhiên, không bị khô xơ.</li>\n                                <li><strong>Khả năng phủ bạc 100%:</strong> Xử lý triệt để các chất tóc bạc kháng thuốc của khách hàng trung niên tại các tỉnh, màu lên chuẩn tông và không bị ánh đỏ sau nhiều lần gội.</li>\n                                <li><strong>Tỷ lệ pha chuẩn 1:1 với Oxy trợ nhuộm:</strong> Đơn giản hóa thao tác của thợ phụ trong tiệm, hạn chế tối đa sai sót khi pha chế hóa chất.</li>\n                            </ul>\n                        </div>\n\n                        <div class=\"p-4 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700\">\n                            <h5 class=\"font-bold text-sm text-slate-900 dark:text-white mb-2\">📊 Bài Học Thành Công: Doanh Số Tháng 6/2026 Đạt 2.12 Tỷ Đồng</h5>\n                            <p class=\"mb-2\">Tháng 6/2026 ghi nhận bước nhảy vọt lịch sử của nhãn hàng GLEM với doanh số đạt <strong>2.12 tỷ VND (+294.6% so với tháng trước)</strong> và biên lợi nhuận gộp lên tới <strong>60.8%</strong>. Kết quả này đến từ chiến lược 2 bước bài bản:</p>\n                            <div class=\"grid sm:grid-cols-2 gap-3 mt-2\">\n                                <div class=\"p-3 bg-slate-50 dark:bg-slate-700 rounded-lg\">\n                                    <strong>Giai đoạn 1 (Tháng 3 - Tháng 4): Gieo Mầm Bằng Hàng Mẫu</strong>\n                                    <p class=\"text-slate-500 dark:text-slate-300 mt-1\">Gửi tặng hàng chục nghìn tuýp màu mẫu (sampling) cho các thợ salon trải nghiệm thực tế trên đầu khách thật để họ tận mắt thấy độ bóng và khả năng ăn màu.</p>\n                                </div>\n                                <div class=\"p-3 bg-slate-50 dark:bg-slate-700 rounded-lg\">\n                                    <strong>Giai đoạn 2 (Tháng 5 - Tháng 6): Thu Hoạch Bằng Combo</strong>\n                                    <p class=\"text-slate-500 dark:text-slate-300 mt-1\">Khi salon đã quen tay và khách khen ngợi, lập tức dừng chương trình tặng và chuyển đổi sang chính sách bán combo ưu đãi: Mua 10 tặng 2 kèm bảng màu cao cấp.</p>\n                                </div>\n                            </div>\n                        </div>\n                    </div>\n                    "}, {"tab": "data", "name": "2. Bảng Danh Mục SKU & Thông Số Kỹ Thuật", "content": "\n                    <div class=\"overflow-x-auto text-xs\">\n                        <table class=\"w-full text-left border-collapse\">\n                            <thead class=\"bg-slate-100 dark:bg-slate-800 uppercase font-bold\">\n                                <tr>\n                                    <th class=\"p-2.5 border\">Dòng Sản Phẩm</th>\n                                    <th class=\"p-2.5 border\">Quy Cách Đóng Gói</th>\n                                    <th class=\"p-2.5 border\">Tính Năng Kỹ Thuật Nổi Bật</th>\n                                    <th class=\"p-2.5 border\">Biên Lợi Nhuận Gộp</th>\n                                </tr>\n                            </thead>\n                            <tbody class=\"divide-y text-slate-600 dark:text-slate-300\">\n                                <tr>\n                                    <td class=\"p-2.5 font-bold border\">Kem Nhuộm Tóc GLEM</td>\n                                    <td class=\"p-2.5 border\">Tuýp nhôm 100ml / 60 tuýp/thùng</td>\n                                    <td class=\"p-2.5 border\">Hạt màu Nano, phủ bạc 100%, mùi hương thảo mộc nhẹ dịu.</td>\n                                    <td class=\"p-2.5 border font-bold text-emerald-600\">60.8%</td>\n                                </tr>\n                                <tr>\n                                    <td class=\"p-2.5 font-bold border\">Oxy Trợ Nhuộm GLEM (3%, 6%, 9%, 12%)</td>\n                                    <td class=\"p-2.5 border\">Chai nhựa 1000ml / 12 chai/thùng</td>\n                                    <td class=\"p-2.5 border\">Bổ sung tinh dầu dưỡng, hạn chế xót da đầu khi nhuộm sát chân.</td>\n                                    <td class=\"p-2.5 border font-bold text-emerald-600\">55.0%</td>\n                                </tr>\n                                <tr>\n                                    <td class=\"p-2.5 font-bold border\">Uốn Lạnh Phục Hồi Amino Care</td>\n                                    <td class=\"p-2.5 border\">Cặp dập uốn 500ml x 2 / 20 cặp/thùng</td>\n                                    <td class=\"p-2.5 border\">Bổ sung axit amin thực vật, sóng uốn mềm mại, giữ nếp lâu.</td>\n                                    <td class=\"p-2.5 border font-bold text-emerald-600\">52.5%</td>\n                                </tr>\n                                <tr>\n                                    <td class=\"p-2.5 font-bold border\">Dòng Chăm Sóc MINATO (Japan Tech)</td>\n                                    <td class=\"p-2.5 border\">Cặp gội xả 800ml x 2 / 12 cặp/thùng</td>\n                                    <td class=\"p-2.5 border\">Công nghệ tinh khiết Nhật Bản, phục hồi tóc nát hư tổn nặng.</td>\n                                    <td class=\"p-2.5 border font-bold text-emerald-600\">48.0%</td>\n                                </tr>\n                            </tbody>\n                        </table>\n                    </div>\n                    "}, {"tab": "checklist", "name": "3. Kịch Bản Chuyển Hóa Khách Hàng Từ Tặng Sang Mua", "content": "\n                    <div class=\"space-y-3 text-xs text-slate-700 dark:text-slate-300\">\n                        <div class=\"p-3 bg-white dark:bg-slate-800 rounded border\">\n                            <strong>Bước 1 - Theo Dõi Sau 48 Giờ:</strong> Nhân viên kinh doanh gọi điện hoặc ghé thăm salon: <em>\"Hôm qua anh/chị nhuộm tuýp GLEM 5.0 phủ bạc cho khách thấy màu lên thế nào ạ? Tóc khách có bóng và mượt không?\"</em>\n                        </div>\n                        <div class=\"p-3 bg-white dark:bg-slate-800 rounded border\">\n                            <strong>Bước 2 - Kích Hoạt Đơn Hàng Đầu Tiên:</strong> <em>\"Nhà máy đang có chương trình hỗ trợ NPP tỉnh gói trải nghiệm: Anh lấy 1 thùng (60 tuýp) đủ các mã màu thịnh hành nhất em tặng thêm 1 chai Oxy 1000ml và 1 bảng màu nhung cao cấp để bàn.\"</em>\n                        </div>\n                    </div>\n                    "}, {"tab": "quiz", "name": "4. Trắc Nghiệm Hiểu Biết Sản Phẩm GLEM", "content": "\n                    <div class=\"p-4 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700\">\n                        <div class=\"font-bold text-sm text-slate-900 dark:text-white mb-2\">Câu hỏi: Đâu là nguyên nhân cốt lõi giúp doanh số GLEM tăng trưởng kỷ lục 294.6% trong tháng 6/2026?</div>\n                        <div class=\"space-y-2 mt-3 text-xs text-slate-700 dark:text-slate-300\">\n                            <label class=\"block p-2.5 rounded border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 cursor-pointer\">\n                                <input type=\"radio\" name=\"dtd_q3\" value=\"a\" class=\"mr-2\"> A. Công ty hạ giá bán xuống rẻ hơn giá vốn để phá giá đối thủ.\n                            </label>\n                            <label class=\"block p-2.5 rounded border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 cursor-pointer\">\n                                <input type=\"radio\" name=\"dtd_q3\" value=\"b\" class=\"mr-2\"> B. Chuyển đổi thành công từ giai đoạn cho salon dùng thử (sampling) sang các gói mua hàng thương mại chính thức kèm bảng màu và chính sách đại lý hấp dẫn.\n                            </label>\n                            <label class=\"block p-2.5 rounded border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 cursor-pointer\">\n                                <input type=\"radio\" name=\"dtd_q3\" value=\"c\" class=\"mr-2\"> C. Chi hàng chục tỷ chạy quảng cáo truyền hình quốc gia.\n                            </label>\n                        </div>\n                        <div class=\"mt-3 p-3 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 rounded text-xs text-emerald-800 dark:text-emerald-300 hidden\" id=\"dtd_q3_ans\">\n                            <strong>Đáp án đúng: B!</strong> Bài học kinh điển của DTD Holding: Chỉ tặng mẫu thử khi có kế hoạch đo lường và kịch bản chốt chuyển đổi sang đơn hàng thương mại trong vòng 30 ngày.\n                        </div>\n                        <button onclick=\"document.getElementById('dtd_q3_ans').classList.toggle('hidden')\" class=\"mt-3 px-3 py-1 bg-amber-600 hover:bg-amber-700 text-white rounded text-xs font-semibold\">Xem Giải Thích</button>\n                    </div>\n                    "}]}, {"id": "dtd_m4", "title": "Module 4: Quản Trị Tài Chính Kế Toán MISA AMIS & Kỹ Trị Dòng Tiền, Thu Hồi Công Nợ", "subtitle": "Cấu trúc P&L chuẩn mực, 3 vùng rủi ro công nợ 21 NPP, cơ chế khóa đơn tự động và chỉ số vòng quay vốn", "duration": "35 phút học", "lessons": [{"tab": "theory", "name": "1. Binh Pháp Quản Trị Công Nợ 21 Nhà Phân Phối", "content": "\n                    <div class=\"space-y-4 text-xs text-slate-700 dark:text-slate-300 leading-relaxed\">\n                        <div class=\"p-4 bg-emerald-50/70 dark:bg-slate-800 rounded-xl border border-emerald-200 dark:border-slate-700\">\n                            <h5 class=\"font-bold text-sm text-emerald-950 dark:text-emerald-300 mb-2\">💵 Nguyên Lý Sinh Mạng: Doanh Số Ảo vs Dòng Tiền Thật</h5>\n                            <p>Trong kinh doanh phân phối B2B, đơn hàng xuất kho mới chỉ là hoàn thành một nửa chặng đường. Đơn hàng chỉ thực sự thành công khi <strong>tiền mặt đã về đến tài khoản công ty</strong>. Việc thả lỏng cho NPP nợ gối đầu không kiểm soát sẽ biến lợi nhuận trên sổ sách thành nợ xấu khó đòi.</p>\n                        </div>\n\n                        <div class=\"grid sm:grid-cols-3 gap-3\">\n                            <div class=\"p-3 bg-emerald-50 dark:bg-slate-800 rounded-lg border-l-4 border-emerald-500 border border-slate-200 dark:border-slate-700\">\n                                <div class=\"font-bold text-emerald-700 dark:text-emerald-400 mb-1\">VÙNG XANH (0 - 30 Ngày)</div>\n                                <p>Công nợ trong hạn định mức hợp đồng. Cho phép duyệt xuất các đơn hàng mới bình thường.</p>\n                            </div>\n                            <div class=\"p-3 bg-amber-50 dark:bg-slate-800 rounded-lg border-l-4 border-amber-500 border border-slate-200 dark:border-slate-700\">\n                                <div class=\"font-bold text-amber-700 dark:text-amber-400 mb-1\">VÙNG VÀNG (31 - 45 Ngày)</div>\n                                <p>Nợ quá hạn mức từ 1 - 15 ngày. Khóa chức năng xuất đơn hàng mới trên phần mềm MISA. Yêu cầu NPP thanh toán tối thiểu 50% số nợ cũ mới được duyệt đơn tiếp theo.</p>\n                            </div>\n                            <div class=\"p-3 bg-red-50 dark:bg-slate-800 rounded-lg border-l-4 border-red-500 border border-slate-200 dark:border-slate-700\">\n                                <div class=\"font-bold text-red-700 dark:text-red-400 mb-1\">VÙNG ĐỎ (&gt; 45 Ngày)</div>\n                                <p>Báo động đỏ nguy cơ thất thoát vốn. Dừng xuất hàng vĩnh viễn, chuyển hồ sơ cho phòng pháp chế và cử Quản lý vùng trực tiếp xuống niêm phong thu hồi hàng tồn kho.</p>\n                            </div>\n                        </div>\n                    </div>\n                    "}, {"tab": "data", "name": "2. Cấu Trúc P&L Chuẩn Mực Của DTD Holding", "content": "\n                    <div class=\"overflow-x-auto text-xs\">\n                        <table class=\"w-full text-left border-collapse\">\n                            <thead class=\"bg-slate-100 dark:bg-slate-800 uppercase font-bold\">\n                                <tr>\n                                    <th class=\"p-2.5 border\">Khoản Mục P&L Quản Trị</th>\n                                    <th class=\"p-2.5 border\">Tỷ Trọng / Doanh Thu Thuần</th>\n                                    <th class=\"p-2.5 border\">Nguyên Tắc Kiểm Soát Kỷ Luật</th>\n                                </tr>\n                            </thead>\n                            <tbody class=\"divide-y text-slate-600 dark:text-slate-300\">\n                                <tr>\n                                    <td class=\"p-2.5 font-bold border\">1. Doanh Thu Thuần (Net Sales)</td>\n                                    <td class=\"p-2.5 border font-mono font-bold text-blue-600\">100.0%</td>\n                                    <td class=\"p-2.5 border\">Doanh số thực thu sau khi đã trừ chiết khấu thương mại.</td>\n                                </tr>\n                                <tr>\n                                    <td class=\"p-2.5 font-bold border\">2. Giá Vốn Hàng Bán (COGS)</td>\n                                    <td class=\"p-2.5 border font-mono font-bold text-red-500\">38.0% - 42.0%</td>\n                                    <td class=\"p-2.5 border\">Giá nhập nhà máy + Chi phí bao bì + Thuế nhập khẩu + Vận chuyển về kho tổng.</td>\n                                </tr>\n                                <tr>\n                                    <td class=\"p-2.5 font-bold border\">3. Lợi Nhuận Gộp (Gross Profit)</td>\n                                    <td class=\"p-2.5 border font-mono font-bold text-emerald-600\">58.0% - 62.0%</td>\n                                    <td class=\"p-2.5 border\">Biên an toàn bắt buộc để trang trải chi phí vận hành phân phối.</td>\n                                </tr>\n                                <tr>\n                                    <td class=\"p-2.5 font-bold border\">4. Chi Phí Bán Hàng (Selling Expenses)</td>\n                                    <td class=\"p-2.5 border font-mono font-bold text-amber-600\">18.0% - 22.0%</td>\n                                    <td class=\"p-2.5 border\">Lương hoa hồng NVKD, chi phí hỗ trợ hội thảo tỉnh, vận chuyển giao đại lý.</td>\n                                </tr>\n                                <tr>\n                                    <td class=\"p-2.5 font-bold border\">5. Chi Phí Quản Lý Doanh Nghiệp (G&A)</td>\n                                    <td class=\"p-2.5 border font-mono font-bold text-purple-600\">8.0% - 10.0%</td>\n                                    <td class=\"p-2.5 border\">Lương khối văn phòng, khấu hao kho bãi, phần mềm MISA, văn phòng phẩm.</td>\n                                </tr>\n                                <tr>\n                                    <td class=\"p-2.5 font-bold border\">6. Lợi Nhuận Thuần Hoạt Động (EBITDA)</td>\n                                    <td class=\"p-2.5 border font-mono font-bold text-emerald-700\">20.0% - 25.0%</td>\n                                    <td class=\"p-2.5 border\">Dòng tiền dôi dư để tái đầu tư mở rộng thị trường và chia cổ tức.</td>\n                                </tr>\n                            </tbody>\n                        </table>\n                    </div>\n                    "}, {"tab": "checklist", "name": "3. Quy Trình Khóa Đơn Trên MISA Khi Quá Hạn Nợ", "content": "\n                    <div class=\"space-y-2 text-xs text-slate-700 dark:text-slate-300\">\n                        <div class=\"p-3 bg-white dark:bg-slate-800 rounded border\">\n                            <strong>Bước 1 - Kế Toán Công Nợ Quét Tự Động:</strong> Mỗi sáng lúc 08:30, xuất danh sách công nợ tuổi nợ (Aging Report) từ MISA AMIS.\n                        </div>\n                        <div class=\"p-3 bg-white dark:bg-slate-800 rounded border\">\n                            <strong>Bước 2 - Bật Trạng Thái Khóa (Hold):</strong> Đánh dấu trạng thái Tạm Khóa cho mọi NPP chạm mốc 31 ngày nợ hoặc vượt số tiền bảo lãnh. Hệ thống sẽ chặn nhân viên kinh doanh không tạo được phiếu xuất kho mới.\n                        </div>\n                        <div class=\"p-3 bg-white dark:bg-slate-800 rounded border\">\n                            <strong>Bước 3 - Mở Khóa Khi Tiền Về:</strong> Chỉ mở khóa đơn hàng khi tài khoản công ty nhận được ủy nhiệm chi chuyển khoản thanh toán từ đại lý.\n                        </div>\n                    </div>\n                    "}, {"tab": "quiz", "name": "4. Trắc Nghiệm Kỷ Luật Tài Chính", "content": "\n                    <div class=\"p-4 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700\">\n                        <div class=\"font-bold text-sm text-slate-900 dark:text-white mb-2\">Tình huống: Một NPP thân thiết lâu năm với Founder muốn đặt thêm 100 triệu tiền hàng trước vụ Tết nhưng hiện đang có khoản nợ 70 triệu quá hạn 40 ngày (vùng vàng). Kế toán viên xử lý thế nào?</div>\n                        <div class=\"space-y-2 mt-3 text-xs text-slate-700 dark:text-slate-300\">\n                            <label class=\"block p-2.5 rounded border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 cursor-pointer\">\n                                <input type=\"radio\" name=\"dtd_q4\" value=\"a\" class=\"mr-2\"> A. Cứ xuất hàng đi vì đây là khách hàng quen của sếp.\n                            </label>\n                            <label class=\"block p-2.5 rounded border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 cursor-pointer\">\n                                <input type=\"radio\" name=\"dtd_q4\" value=\"b\" class=\"mr-2\"> B. Giữ vững kỷ luật hệ thống: Giải thích rõ ràng nguyên tắc khóa đơn tự động trên MISA, yêu cầu NPP thanh toán dứt điểm khoản 70 triệu nợ cũ thì đơn mới 100 triệu mới được hệ thống phê duyệt xuất kho.\n                            </label>\n                            <label class=\"block p-2.5 rounded border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 cursor-pointer\">\n                                <input type=\"radio\" name=\"dtd_q4\" value=\"c\" class=\"mr-2\"> C. Tự bỏ tiền túi ra đóng trước cho NPP.\n                            </label>\n                        </div>\n                        <div class=\"mt-3 p-3 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 rounded text-xs text-emerald-800 dark:text-emerald-300 hidden\" id=\"dtd_q4_ans\">\n                            <strong>Đáp án đúng: B!</strong> \"Khách hàng là thượng đế nhưng Hệ thống là pháp luật\". Kỷ luật công nợ phải được thực thi bình đẳng, không có ngoại lệ cá nhân.\n                        </div>\n                        <button onclick=\"document.getElementById('dtd_q4_ans').classList.toggle('hidden')\" class=\"mt-3 px-3 py-1 bg-amber-600 hover:bg-amber-700 text-white rounded text-xs font-semibold\">Xem Giải Thích</button>\n                    </div>\n                    "}]}, {"id": "dtd_m5", "title": "Module 5: Chuỗi Cung Ứng SCM & Kho Vận: Thuật Toán Đặt Hàng v4 & Mùa Vụ Tết", "subtitle": "Thuật toán dự báo nhu cầu Đặt hàng v4, xử lý hệ số mùa vụ Tết (+350-450%) và phương pháp Bù hàng thiếu", "duration": "30 phút học", "lessons": [{"tab": "theory", "name": "1. Thuật Toán Đặt Hàng v4 & Xử Lý Đỉnh Điểm Mùa Vụ Tết", "content": "\n                    <div class=\"space-y-4 text-xs text-slate-700 dark:text-slate-300 leading-relaxed\">\n                        <div class=\"p-4 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700\">\n                            <h5 class=\"font-bold text-sm text-slate-900 dark:text-white mb-2\">📈 Quy Luật Mùa Vụ Khắc Nghiệt Của Ngành Mỹ Phẩm Tóc:</h5>\n                            <p class=\"mb-2\">Doanh số ngành tóc không phân bổ đều trong năm mà biến động cực độ theo âm lịch: Vào 2 tháng áp Tết (tháng 11 và tháng 12 âm lịch), số lượng khách đến salon uốn, nhuộm, phục hồi <strong>tăng gấp 3.5 đến 4.5 lần</strong> so với các tháng mùa hè. Điều này đặt ra bài toán sinh tử cho bộ phận SCM:</p>\n                            <ul class=\"list-disc pl-4 space-y-1\">\n                                <li>Thời gian sản xuất tại nhà máy đối tác và vận chuyển đường biển mất từ <strong>45 đến 60 ngày</strong>.</li>\n                                <li>Nếu đặt hàng quá trễ: Kho tổng cháy hàng vào tháng Chạp, NPP không có hàng bán, mất hàng chục tỷ doanh thu vào tay đối thủ.</li>\n                                <li>Nếu đặt hàng quá nhiều: Qua Tết vào tháng Giêng (tháng salon đóng cửa nghỉ ngơi), hàng ôm ứ đọng cả năm, chôn chặt dòng vốn lưu động của công ty.</li>\n                            </ul>\n                        </div>\n\n                        <div class=\"p-4 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700\">\n                            <h5 class=\"font-bold text-sm text-slate-900 dark:text-white mb-2\">🔍 Phương Pháp \"Bù Hàng Thiếu\" — Tách Bạch Mã Yếu Khỏi Thiếu Hàng:</h5>\n                            <p class=\"mb-2\">Một trong những sai lầm phổ biến nhất của nhân viên kinh doanh là nghe đại lý phàn nàn: <em>\"Mã màu này tôi không bán được vì công ty giao thiếu hàng\"</em>. Bộ phận SCM DTD Holding áp dụng nguyên tắc kiểm chứng thực tế:</p>\n                            <p class=\"italic text-slate-500\">Ví dụ thực tế mã màu LUMN-P2-ORANGE: Đại lý báo bán chậm vì thiếu hàng, nhưng khi kiểm tra dữ liệu kho đại lý thì trong kho vẫn còn nguyên 20 hộp suốt 3 tháng không vơi. Đây là <strong>MÃ YẾU</strong> (nhu cầu khách hàng thấp) chứ không phải thiếu hàng. SCM kiên quyết không nhập thêm mã này để tránh tồn kho rác.</p>\n                        </div>\n                    </div>\n                    "}, {"tab": "data", "name": "2. Bảng Kế Hoạch Tiến Độ Đặt Hàng Phục Vụ Vụ Tết", "content": "\n                    <div class=\"overflow-x-auto text-xs\">\n                        <table class=\"w-full text-left border-collapse\">\n                            <thead class=\"bg-slate-100 dark:bg-slate-800 uppercase font-bold\">\n                                <tr>\n                                    <th class=\"p-2.5 border\">Mốc Thời Gian (Âm Lịch)</th>\n                                    <th class=\"p-2.5 border\">Nhiệm Vụ Cốt Lõi Của Khối SCM & Mua Hàng</th>\n                                    <th class=\"p-2.5 border\">Mục Tiêu Đạt Được</th>\n                                </tr>\n                            </thead>\n                            <tbody class=\"divide-y text-slate-600 dark:text-slate-300\">\n                                <tr>\n                                    <td class=\"p-2.5 font-bold border\">Tháng 8 Âm Lịch</td>\n                                    <td class=\"p-2.5 border\">Chạy thuật toán Đặt hàng v4 với hệ số mùa vụ 3.8x, tổng hợp dự báo từ 21 NPP.</td>\n                                    <td class=\"p-2.5 border\">Chốt số lượng đặt hàng với nhà máy sản xuất.</td>\n                                </tr>\n                                <tr>\n                                    <td class=\"p-2.5 font-bold border\">Tháng 9 Âm Lịch</td>\n                                    <td class=\"p-2.5 border\">Nhà máy sản xuất đóng gói, kiểm định chất lượng lô hàng xuất xưởng.</td>\n                                    <td class=\"p-2.5 border\">Hàng lên tàu vận chuyển đường biển về cảng Hải Phòng / Cát Lái.</td>\n                                </tr>\n                                <tr>\n                                    <td class=\"p-2.5 font-bold border\">Tháng 10 Âm Lịch</td>\n                                    <td class=\"p-2.5 border\">Thông quan hải quan, dán tem phụ, nhập kho tổng Hà Nội & TP.HCM.</td>\n                                    <td class=\"p-2.5 border font-bold text-emerald-600\">Kho tổng đầy 100% cơ số hàng an toàn.</td>\n                                </tr>\n                                <tr>\n                                    <td class=\"p-2.5 font-bold border\">Tháng 11 - 12 Âm Lịch</td>\n                                    <td class=\"p-2.5 border\">Phân bổ xe giao vận liên tục hàng tuần về kho 21 NPP cấp tỉnh.</td>\n                                    <td class=\"p-2.5 border font-bold text-amber-600\">Đáp ứng 100% nhu cầu salon làm tóc dịp Tết.</td>\n                                </tr>\n                            </tbody>\n                        </table>\n                    </div>\n                    "}, {"tab": "checklist", "name": "3. 6 Bẫy Kỹ Thuật Google Sheets Cần Tránh", "content": "\n                    <div class=\"space-y-2 text-xs text-slate-700 dark:text-slate-300\">\n                        <div class=\"p-3 bg-white dark:bg-slate-800 rounded border\">\n                            <strong>Bẫy 1 - Bẫy Dấu Thập Phân Locale vi_VN:</strong> Máy tính cài tiếng Việt dùng dấu phẩy (,) làm dấu thập phân, trong khi máy tiếng Anh dùng dấu chấm (.). Phải chuẩn hóa locale sheet để tránh công thức tính sai hàng tỷ đồng.\n                        </div>\n                        <div class=\"p-3 bg-white dark:bg-slate-800 rounded border\">\n                            <strong>Bẫy 2 - Bẫy Hardcode Công Thức:</strong> Không gõ trực tiếp số vào công thức tính (ví dụ: `=A1*1.5`). Mọi hệ số mùa vụ phải được đặt ở một sheet THAM SỐ riêng biệt để dễ dàng cập nhật.\n                        </div>\n                    </div>\n                    "}, {"tab": "quiz", "name": "4. Trắc Nghiệm Tính Toán Chuỗi Cung Ứng", "content": "\n                    <div class=\"p-4 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700\">\n                        <div class=\"font-bold text-sm text-slate-900 dark:text-white mb-2\">Câu hỏi: Để chuẩn bị lượng hàng phục vụ cao điểm tháng 11 và tháng 12 âm lịch cho 21 NPP, bộ phận SCM DTD Holding bắt buộc phải chốt số lượng đặt hàng với nhà máy vào thời điểm nào?</div>\n                        <div class=\"space-y-2 mt-3 text-xs text-slate-700 dark:text-slate-300\">\n                            <label class=\"block p-2.5 rounded border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 cursor-pointer\">\n                                <input type=\"radio\" name=\"dtd_q5\" value=\"a\" class=\"mr-2\"> A. Đầu tháng 11 âm lịch khi thấy các đại lý bắt đầu đặt hàng ồ ạt.\n                            </label>\n                            <label class=\"block p-2.5 rounded border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 cursor-pointer\">\n                                <input type=\"radio\" name=\"dtd_q5\" value=\"b\" class=\"mr-2\"> B. Chậm nhất vào tháng 8 âm lịch (trước ít nhất 60-75 ngày) vì chu kỳ sản xuất và vận chuyển đường biển mất 2 tháng.\n                            </label>\n                            <label class=\"block p-2.5 rounded border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 cursor-pointer\">\n                                <input type=\"radio\" name=\"dtd_q5\" value=\"c\" class=\"mr-2\"> C. Chờ đến sau Tết khi giá nhà máy giảm mới đặt.\n                            </label>\n                        </div>\n                        <div class=\"mt-3 p-3 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 rounded text-xs text-emerald-800 dark:text-emerald-300 hidden\" id=\"dtd_q5_ans\">\n                            <strong>Đáp án đúng: B!</strong> Bài học xương máu của SCM: Nếu chờ đến tháng 10 hay 11 mới đặt hàng, tàu biển chưa kịp về cảng thì Tết đã qua, toàn bộ cơ hội kinh doanh sẽ biến mất.\n                        </div>\n                        <button onclick=\"document.getElementById('dtd_q5_ans').classList.toggle('hidden')\" class=\"mt-3 px-3 py-1 bg-amber-600 hover:bg-amber-700 text-white rounded text-xs font-semibold\">Xem Giải Thích</button>\n                    </div>\n                    "}]}, {"id": "dtd_m6", "title": "Module 6: Khung Năng Lực AI Thực Chiến & Tự Động Hóa DTD Holding", "subtitle": "Kỹ thuật Prompt CARE cho quản lý, tự động hóa MISA bằng Python và kiến trúc Bot Zalo AI Agent xuất báo cáo sáng", "duration": "25 phút học", "lessons": [{"tab": "theory", "name": "1. Khung Kỹ Thuật Prompt CARE Dành Cho Quản Lý DTD", "content": "\n                    <div class=\"space-y-4 text-xs text-slate-700 dark:text-slate-300 leading-relaxed\">\n                        <div class=\"p-4 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700\">\n                            <h5 class=\"font-bold text-sm text-slate-900 dark:text-white mb-2\">🤖 Tư Duy Sử Dụng AI Của Nhà Quản Lý DTD Holding:</h5>\n                            <p class=\"mb-3\">AI không phải là chiếc đũa thần kỳ ảo, mà là một <strong>Thư Ký Chiến Lược Tinh Hoa</strong>. Để AI cho ra câu trả lời sắc bén phục vụ công việc quản trị B2B, mọi quản lý DTD phải nắm vững khung <strong>C.A.R.E</strong>:</p>\n                            <div class=\"grid sm:grid-cols-2 gap-3\">\n                                <div class=\"p-3 bg-slate-50 dark:bg-slate-700 rounded-lg\">\n                                    <strong class=\"text-blue-600 dark:text-blue-400\">C - Context (Bối Cảnh Chi Tiết):</strong>\n                                    <p class=\"mt-1\">Cung cấp vai trò và đặc thù: <em>\"Tôi là Giám đốc Kinh doanh của DTD Holding, công ty phân phối mỹ phẩm tóc B2B cho 21 NPP tỉnh...\"</em></p>\n                                </div>\n                                <div class=\"p-3 bg-slate-50 dark:bg-slate-700 rounded-lg\">\n                                    <strong class=\"text-amber-600 dark:text-amber-400\">A - Action (Hành Động Cụ Thể):</strong>\n                                    <p class=\"mt-1\">Chỉ định chính xác nhiệm vụ: <em>\"Hãy bóc tách bảng doanh số tháng 8 đính kèm, so sánh mức độ sụt giảm giữa mã thuốc nhuộm GLEM và oxy...\"</em></p>\n                                </div>\n                                <div class=\"p-3 bg-slate-50 dark:bg-slate-700 rounded-lg\">\n                                    <strong class=\"text-emerald-600 dark:text-emerald-400\">R - Result (Định Dạng Đầu Ra):</strong>\n                                    <p class=\"mt-1\">Yêu cầu định dạng bảng biểu rõ ràng: <em>\"Xuất kết quả dưới dạng bảng Markdown 5 cột kèm 3 đề xuất kích cầu...\"</em></p>\n                                </div>\n                                <div class=\"p-3 bg-slate-50 dark:bg-slate-700 rounded-lg\">\n                                    <strong class=\"text-purple-600 dark:text-purple-400\">E - Example / Constraint (Ràng Buộc):</strong>\n                                    <p class=\"mt-1\">Đặt giới hạn chuẩn xác: <em>\"Dùng văn phong quản trị gãy gọn, không bịa đặt số liệu, ẩn thông tin số điện thoại khách hàng...\"</em></p>\n                                </div>\n                            </div>\n                        </div>\n                    </div>\n                    "}, {"tab": "data", "name": "2. Kiến Trúc Tự Động Hóa MISA & Zalo Bot AI", "content": "\n                    <div class=\"space-y-3 text-xs text-slate-700 dark:text-slate-300\">\n                        <div class=\"p-4 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700\">\n                            <h5 class=\"font-bold text-sm text-blue-600 dark:text-blue-400 mb-2\">1. Thu Thập Dữ Liệu Tự Động Từ MISA AMIS:</h5>\n                            <p class=\"leading-relaxed\">Thay vì kế toán phải ngồi tải báo cáo thủ công mất 2 giờ mỗi sáng, hệ thống sử dụng script Python Playwright tự động chạy lúc 02:00 sáng, đăng nhập vào cổng web MISA AMIS, chặn bắt API Token (Route Interception), tải toàn bộ số liệu doanh thu và công nợ 21 NPP về cơ sở dữ liệu nội bộ.</p>\n                        </div>\n                        <div class=\"p-4 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700\">\n                            <h5 class=\"font-bold text-sm text-emerald-600 dark:text-emerald-400 mb-2\">2. Zalo Bot AI Agent Xuất Báo Cáo Sáng:</h5>\n                            <p class=\"leading-relaxed\">Đúng 07:30 mỗi sáng, Bot AI tự động phân tích dữ liệu, tạo ra một file Excel định dạng chuẩn đẹp và gửi trực tiếp vào nhóm Zalo \"Ban Điều Hành DTD Holding\" kèm thông báo tóm tắt 3 dòng: NPP nào phát sinh nợ quá hạn, sản phẩm nào sắp chạm ngưỡng tồn kho an toàn.</p>\n                        </div>\n                    </div>\n                    "}, {"tab": "checklist", "name": "3. Mẫu Prompt Thực Chiến Cho Kế Toán Trưởng", "content": "\n                    <div class=\"p-4 bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-mono\">\n                        <p class=\"text-slate-600 dark:text-slate-300\">\n                            \"Bạn là Cố vấn Tài chính Doanh nghiệp B2B cấp cao của DTD Holding. Dưới đây là bảng số liệu công nợ của 21 NPP trích xuất từ MISA. Hãy phân loại các đại lý thành 3 nhóm: Vùng Xanh (&le;30 ngày), Vùng Vàng (31-45 ngày) và Vùng Đỏ (&gt;45 ngày). Đưa ra danh sách 5 đại lý cần khóa đơn ngay hôm nay và soạn sẵn tin nhắn thông báo nhẹ nhàng nhưng kiên quyết để kế toán gửi cho đại lý.\"\n                        </p>\n                    </div>\n                    "}, {"tab": "quiz", "name": "4. Trắc Nghiệm An Toàn Dữ Liệu AI", "content": "\n                    <div class=\"p-4 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700\">\n                        <div class=\"font-bold text-sm text-slate-900 dark:text-white mb-2\">Câu hỏi: Khi sử dụng ChatGPT hoặc Claude để phân tích hợp đồng kinh tế với Nhà phân phối, nhân viên DTD bắt buộc phải làm gì trước tiên?</div>\n                        <div class=\"space-y-2 mt-3 text-xs text-slate-700 dark:text-slate-300\">\n                            <label class=\"block p-2.5 rounded border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 cursor-pointer\">\n                                <input type=\"radio\" name=\"dtd_q6\" value=\"a\" class=\"mr-2\"> A. Cứ dán toàn bộ hợp đồng có đầy đủ số CMND, số tài khoản và chữ ký lên mạng.\n                            </label>\n                            <label class=\"block p-2.5 rounded border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 cursor-pointer\">\n                                <input type=\"radio\" name=\"dtd_q6\" value=\"b\" class=\"mr-2\"> B. Ẩn danh (anonymize) toàn bộ tên cá nhân, số điện thoại, số tài khoản ngân hàng và các điều khoản bí mật giá vốn trước khi đưa văn bản vào AI.\n                            </label>\n                            <label class=\"block p-2.5 rounded border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 cursor-pointer\">\n                                <input type=\"radio\" name=\"dtd_q6\" value=\"c\" class=\"mr-2\"> C. Nhờ AI ký tên thay cho Tổng Giám đốc.\n                            </label>\n                        </div>\n                        <div class=\"mt-3 p-3 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 rounded text-xs text-emerald-800 dark:text-emerald-300 hidden\" id=\"dtd_q6_ans\">\n                            <strong>Đáp án đúng: B!</strong> An toàn thông tin là nguyên tắc pháp lý tối thượng. Tuyệt đối không để lộ dữ liệu nhạy cảm của khách hàng và đối tác lên các công cụ AI công cộng.\n                        </div>\n                        <button onclick=\"document.getElementById('dtd_q6_ans').classList.toggle('hidden')\" class=\"mt-3 px-3 py-1 bg-amber-600 hover:bg-amber-700 text-white rounded text-xs font-semibold\">Xem Giải Thích</button>\n                    </div>\n                    "}]}]};
