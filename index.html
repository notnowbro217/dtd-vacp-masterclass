=\"c\" class=\"mr-2\"> C. 10.000 tuýp.\n                            </label>\n                        </div>\n                        <div class=\"p-3 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 rounded-lg text-xs text-emerald-800 dark:text-emerald-300 hidden\" id=\"dtd_q5_ans\">\n                            <strong>Đáp án chuẩn xác: B (124.000 tuýp)!</strong> Bài học thực tế: Nếu bộ phận SCM chỉ tính theo mức tiêu thụ ngày thường (500 tuýp/ngày &times; 60 = 30.000 tuýp), DTD Holding sẽ cháy hàng ngay từ tuần đầu tháng 12 âm lịch, đánh mất hơn 70% cơ hội doanh thu trong năm.\n                        </div>\n                        <button onclick=\"document.getElementById('dtd_q5_ans').classList.toggle('hidden')\" class=\"px-4 py-1.5 bg-amber-600 hover:bg-amber-700 text-white rounded text-xs font-semibold\">Xem Lời Giải Chi Tiết</button>\n                    </div>\n                    "}]}, {"id": "dtd_m6", "title": "Module 6: Khung Năng Lực AI Thực Chiến & Tự Động Hóa MISA B2B DTD Holding", "subtitle": "Kỹ thuật Prompt CARE cấp quản lý, kiến trúc Python Playwright cào dữ liệu lúc 02:00 AM và Zalo Bot AI Agent", "duration": "35 phút học", "lessons": [{"tab": "theory", "name": "1. Khung Kỹ Thuật Prompt CARE Dành Cho Cấp Quản Lý", "content": "\n                    <div class=\"space-y-5 text-slate-700 dark:text-slate-300 text-sm leading-relaxed\">\n                        <div class=\"p-5 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800\">\n                            <h4 class=\"text-base font-black text-slate-900 dark:text-white mb-2\">🤖 Định Vị AI: \"Thư Ký Chiến Lược Tinh Hoa\"</h4>\n                            <p class=\"text-xs text-slate-600 dark:text-slate-400 mb-3\">\n                                Tại DTD Holding, AI không thay thế con người mà giải phóng cán bộ quản lý khỏi các công việc lặp lại nhàm chán. Để AI tạo ra kết quả phân tích số liệu chuẩn xác, mọi nhà quản lý bắt buộc phải áp dụng khung kỹ thuật <strong>C.A.R.E</strong>:\n                            </p>\n                            <div class=\"grid sm:grid-cols-2 gap-3 text-xs\">\n                                <div class=\"p-3 bg-blue-50/70 dark:bg-slate-800 rounded-lg border border-blue-200 dark:border-slate-700\">\n                                    <strong class=\"text-blue-700 dark:text-blue-300\">C - CONTEXT (Bối Cảnh Chi Tiết):</strong>\n                                    <p class=\"mt-1 text-slate-600 dark:text-slate-300\">Cung cấp vai trò và đặc thù ngành hàng: <em>\"Bạn là Giám đốc Tài chính B2B của công ty DTD Holding chuyên phân phối mỹ phẩm tóc cho 21 NPP tỉnh...\"</em></p>\n                                </div>\n                                <div class=\"p-3 bg-amber-50/70 dark:bg-slate-800 rounded-lg border border-amber-200 dark:border-slate-700\">\n                                    <strong class=\"text-amber-700 dark:text-amber-300\">A - ACTION (Hành Động Cụ Thể):</strong>\n                                    <p class=\"mt-1 text-slate-600 dark:text-slate-300\">Chỉ định chính xác nhiệm vụ: <em>\"Hãy bóc tách bảng doanh số tháng 8 đính kèm, lọc ra 5 đại lý có mức sụt giảm doanh số lớn nhất trên 20%...\"</em></p>\n                                </div>\n                                <div class=\"p-3 bg-emerald-50/70 dark:bg-slate-800 rounded-lg border border-emerald-200 dark:border-slate-700\">\n                                    <strong class=\"text-emerald-700 dark:text-emerald-300\">R - RESULT (Định Dạng Đầu Ra):</strong>\n                                    <p class=\"mt-1 text-slate-600 dark:text-slate-300\">Yêu cầu khuôn dạng rõ ràng: <em>\"Xuất kết quả thành bảng Markdown 5 cột: Tên NPP, Doanh số T7, Doanh số T8, % Biến động, và 3 giải pháp kích cầu...\"</em></p>\n                                </div>\n                                <div class=\"p-3 bg-purple-50/70 dark:bg-slate-800 rounded-lg border border-purple-200 dark:border-slate-700\">\n                                    <strong class=\"text-purple-700 dark:text-purple-300\">E - EXAMPLE & CONSTRAINT (Ví Dụ & Ràng Buộc):</strong>\n                                    <p class=\"mt-1 text-slate-600 dark:text-slate-300\">Ràng buộc an toàn: <em>\"Văn phong quản trị gãy gọn, không bịa đặt số liệu, ẩn danh số CMND và số tài khoản ngân hàng của đại lý.\"</em></p>\n                                </div>\n                            </div>\n                        </div>\n                    </div>\n                    "}, {"tab": "data", "name": "2. Kiến Trúc Kỹ Thuật Tự Động Hóa MISA Playwright & Zalo Bot AI", "content": "\n                    <div class=\"space-y-4 text-xs text-slate-700 dark:text-slate-300\">\n                        <div class=\"p-4 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800\">\n                            <h5 class=\"text-sm font-bold text-slate-900 dark:text-white mb-2\">⚡ Kiến Trúc Tự Động Hóa Báo Cáo Sáng (Pipeline Architecture)</h5>\n                            <p class=\"text-slate-500 dark:text-slate-400 mb-3\">Hệ thống giúp tiết kiệm 2 giờ làm việc thủ công mỗi ngày của bộ phận kế toán và quản trị:</p>\n                            \n                            <div class=\"space-y-3\">\n                                <div class=\"p-3 bg-slate-50 dark:bg-slate-800 rounded-lg border\">\n                                    <div class=\"font-bold text-blue-600 dark:text-blue-400 mb-1\">BƯỚC 1: Cào Dữ Liệu Tự Động Bằng Python Playwright (02:00 AM)</div>\n                                    <p class=\"text-slate-600 dark:text-slate-300\">Script Python chạy ngầm trên máy chủ, sử dụng Playwright mở trình duyệt headless, đăng nhập tài khoản MISA AMIS web, áp dụng kỹ thuật <strong>Route Interception</strong> để bắt API Token trực tiếp, tự động tải xuống file Excel báo cáo bán hàng và công nợ 21 NPP.</p>\n                                </div>\n                                <div class=\"p-3 bg-slate-50 dark:bg-slate-800 rounded-lg border\">\n                                    <div class=\"font-bold text-amber-600 dark:text-amber-400 mb-1\">BƯỚC 2: Chuẩn Hóa & Nạp Dữ Liệu Vào Google Sheets Đặt Hàng v4 (03:30 AM)</div>\n                                    <p class=\"text-slate-600 dark:text-slate-300\">Dữ liệu thô từ MISA được làm sạch, chuyển đổi định dạng số thập phân, tự động append vào file Google Sheets Đặt hàng v4 để cập nhật lại số lượng tồn kho an toàn và cảnh báo đặt hàng lại.</p>\n                                </div>\n                                <div class=\"p-3 bg-slate-50 dark:bg-slate-800 rounded-lg border\">\n                                    <div class=\"font-bold text-emerald-600 dark:text-emerald-400 mb-1\">BƯỚC 3: Zalo Bot AI Agent Xuất Báo Cáo Ban Điều Hành (07:30 AM)</div>\n                                    <p class=\"text-slate-600 dark:text-slate-300\">Bot AI gọi LLM phân tích nhanh số liệu, tạo file Excel tóm tắt đẹp mắt và gửi thẳng vào nhóm Zalo <em>\"Ban Điều Hành DTD Holding\"</em> kèm thông điệp tóm lược 3 điểm: NPP nào vượt hạn mức công nợ, mã hàng nào chạm ngưỡng tồn kho tối thiểu.</p>\n                                </div>\n                            </div>\n                        </div>\n                    </div>\n                    "}, {"tab": "checklist", "name": "3. Bộ Prompts Mẫu Chuẩn Cho 5 Vị Trí Quản Lý DTD", "content": "\n                    <div class=\"space-y-3 text-xs text-slate-700 dark:text-slate-300 leading-relaxed\">\n                        <div class=\"p-3 bg-slate-50 dark:bg-slate-800 rounded-lg border font-mono\">\n                            <strong class=\"text-blue-600 dark:text-blue-400\">Prompt 1 - Dành cho CEO Điều Hành:</strong>\n                            <p class=\"mt-1 text-slate-600 dark:text-slate-300\">\"Bạn là Cố vấn Chiến lược Doanh nghiệp cấp cao. Hãy phân tích báo cáo doanh số tháng đính kèm của DTD Holding. Chỉ ra 3 cơ hội tăng trưởng doanh thu lớn nhất cho kênh NPP tỉnh, phân tích 2 rủi ro về tồn kho mã bột tẩy và thuốc nhuộm, và đề xuất chương trình thi đua quý cho 21 NPP.\"</p>\n                        </div>\n                        <div class=\"p-3 bg-slate-50 dark:bg-slate-800 rounded-lg border font-mono\">\n                            <strong class=\"text-amber-600 dark:text-amber-400\">Prompt 2 - Dành cho Giám Đốc Kinh Doanh (CCO/TPKD):</strong>\n                            <p class=\"mt-1 text-slate-600 dark:text-slate-300\">\"Bạn là Trưởng phòng Kinh doanh B2B mỹ phẩm tóc. Hãy soạn một kịch bản gọi điện thoại thuyết phục chủ NPP tại Thái Bình nhập thêm gói hàng trợ nhuộm GLEM để đón đầu mùa vụ Tết, giải quyết triệt để nỗi lo đọng vốn của đại lý bằng các số liệu cam kết tốc độ bán ra.\"</p>\n                        </div>\n                        <div class=\"p-3 bg-slate-50 dark:bg-slate-800 rounded-lg border font-mono\">\n                            <strong class=\"text-emerald-600 dark:text-emerald-400\">Prompt 3 - Dành cho Kế Toán Trưởng:</strong>\n                            <p class=\"mt-1 text-slate-600 dark:text-slate-300\">\"Bạn là Kế toán trưởng chuyên quản trị rủi ro công nợ. Dưới đây là bảng trích xuất 21 NPP từ MISA. Hãy phân loại các đại lý vào 3 vùng tuổi nợ Xanh-Vàng-Đỏ. Soạn sẵn 3 mẫu thư nhắc nợ từ nhẹ nhàng, kiên quyết, đến thông báo phong tỏa mã đặt hàng gửi cho các NPP thuộc Vùng Đỏ.\"</p>\n                        </div>\n                    </div>\n                    "}, {"tab": "quiz", "name": "4. Bài Kiểm Tra Đạo Đức & An Toàn Dữ Liệu AI M6", "content": "\n                    <div class=\"p-5 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 space-y-4\">\n                        <div class=\"font-bold text-sm text-slate-900 dark:text-white\">\n                            ❓ Nguyên Tắc Bảo Mật: Khi một chuyên viên kế toán muốn nhờ AI phân tích sổ chi tiết bán hàng của 21 NPP, hành động nào sau đây là BẮT BUỘC theo quy chế an ninh dữ liệu của DTD Holding?\n                        </div>\n                        <div class=\"space-y-2 text-xs text-slate-700 dark:text-slate-300\">\n                            <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer\">\n                                <input type=\"radio\" name=\"dtd_q6\" value=\"a\" class=\"mr-2\"> A. Copy nguyên vẹn số điện thoại cá nhân, số tài khoản ngân hàng của các chủ NPP dán lên bản miễn phí của ChatGPT trên mạng.\n                            </label>\n                            <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer\">\n                                <input type=\"radio\" name=\"dtd_q6\" value=\"b\" class=\"mr-2\"> B. Ẩn danh toàn bộ dữ liệu định danh nhạy cảm (thay tên chủ NPP bằng mã NPP_01, NPP_02; xóa số tài khoản ngân hàng và CMND; ẩn thông tin giá vốn nhập khẩu nội bộ) trước khi đưa vào mô hình AI.\n                            </label>\n                            <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer\">\n                                <input type=\"radio\" name=\"dtd_q6\" value=\"c\" class=\"mr-2\"> C. Gửi mật khẩu tài khoản MISA cho AI để AI tự vào đọc dữ liệu.\n                            </label>\n                        </div>\n                        <div class=\"p-3 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 rounded-lg text-xs text-emerald-800 dark:text-emerald-300 hidden\" id=\"dtd_q6_ans\">\n                            <strong>Đáp án chuẩn xác: B!</strong> An toàn thông tin là ranh giới sống còn của doanh nghiệp. Để lộ dữ liệu khách hàng và bí mật giá vốn sang các mô hình AI công cộng sẽ bị xử lý kỷ luật sa thải và truy cứu trách nhiệm pháp lý.\n                        </div>\n                        <button onclick=\"document.getElementById('dtd_q6_ans').classList.toggle('hidden')\" class=\"px-4 py-1.5 bg-amber-600 hover:bg-amber-700 text-white rounded text-xs font-semibold\">Xem Phân Tích An Toàn</button>\n                    </div>\n                    "}]}]};
        const vacpData = {"company": "VACP GROUP", "track_title": "Học Viện Quản Trị & Vận Hành Mỹ Phẩm Tóc Phân Khúc Cao Cấp VIP Salon", "tagline": "Cẩm nang học thuật & vận hành thực chiến dành riêng cho Ban Điều Hành, Khối Salon VIP, Giảng Viên Học Viện VACP và Đội Ngũ Giám Sát", "icon": "👑", "modules": [{"id": "vacp_m1", "title": "Module 1: Chiến Lược Toàn Diện 2026–2030 Định Vị Phân Khúc VIP Salon & Ma Trận 5 Đối Thủ Cao Cấp", "subtitle": "Quy mô thị trường 5,000 tỷ VNĐ, ma trận 7S McKinsey đối thủ và chiến lược đại dương xanh công nghệ Cysteamine Multi-pH", "duration": "35 phút học", "lessons": [{"tab": "theory", "name": "1. Chiến Lược Toàn Diện & Phân Khúc Thị Trường Mục Tiêu", "content": "\n                    <div class=\"space-y-6 text-slate-700 dark:text-slate-300 text-sm leading-relaxed\">\n                        <div class=\"p-6 bg-gradient-to-r from-amber-50 to-yellow-50 dark:from-slate-800 dark:to-slate-850 rounded-2xl border border-amber-200 dark:border-slate-700 shadow-sm\">\n                            <h4 class=\"text-xl font-black text-amber-950 dark:text-amber-300 mb-3 flex items-center gap-2\">\n                                <span>👑</span> Định Vị Thương Hiệu Cấp Cao Của VACP Group\n                            </h4>\n                            <p class=\"mb-3\">\n                                VACP Group được thành lập với một sứ mệnh duy nhất và kiên định: <strong>Trở thành đối tác chiến lược số 1 của Top 500 Beauty Salon cao cấp tại Việt Nam</strong>, dẫn đầu xu hướng phục hồi và tạo mẫu tóc bằng công nghệ hóa sinh chuẩn Seoul không dùng kiềm độc hại.\n                            </p>\n                            <p class=\"mb-3\">\n                                <strong>Bối Cảnh Thị Trường Mỹ Phẩm Tóc Chuyên Nghiệp Việt Nam (Professional Hair Care):</strong>\n                            </p>\n                            <ul class=\"list-disc pl-5 space-y-1 mb-4 text-xs\">\n                                <li><strong>Quy mô toàn ngành:</strong> Ước tính đạt trên <strong>5.000 tỷ VNĐ</strong> vào năm 2026, với tốc độ tăng trưởng kép hàng năm (CAGR) đạt 12.8%.</li>\n                                <li><strong>Phân khúc Salon Cao Cấp (VIP Salon):</strong> Chiếm khoảng <strong>25% giá trị toàn ngành</strong> (khoảng 1.250 tỷ VNĐ), tăng trưởng vượt bậc 18.5%/năm nhờ tầng lớp trung lưu và giới trẻ sẵn sàng chi trả từ 1.500.000 – 4.000.000 VNĐ cho mỗi lần làm dịch vụ uốn, nhuộm, phục hồi tóc.</li>\n                                <li><strong>Chiến Lược Đại Dương Xanh Của VACP:</strong> Tuyệt đối không cạnh tranh về giá ở phân khúc phổ thông. VACP tập trung 100% vào phân khúc Luxury & Premium Salon, cung cấp trọn gói giải pháp công nghệ uốn PLEXIS Seoul Cysteamine Multi-pH và dưỡng sinh da đầu DEMI Nhật Bản.</li>\n                            </ul>\n                            <div class=\"p-4 bg-white/80 dark:bg-slate-900/80 rounded-xl border border-amber-300 dark:border-slate-600\">\n                                <span class=\"font-bold text-amber-900 dark:text-amber-200\">💎 LỜI HỨA THƯƠNG HIỆU VACP:</span>\n                                <p class=\"text-xs mt-1 text-slate-600 dark:text-slate-300\">\n                                    \"Không chỉ bán sản phẩm, VACP chuyển giao công nghệ làm tóc đỉnh cao, cam kết giúp mọi Salon đối tác gia tăng 40% doanh thu dịch vụ uốn phục hồi và nâng tầm vị thế thương hiệu cá nhân của chủ Salon.\"\n                                </p>\n                            </div>\n                        </div>\n\n                        <div class=\"p-5 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800\">\n                            <h4 class=\"text-base font-black text-slate-900 dark:text-white mb-3\">⚖️ Ma Trận Phân Tích 5 Đối Thủ Cạnh Tranh Cao Cấp (Khung 7S McKinsey)</h4>\n                            <div class=\"overflow-x-auto text-xs\">\n                                <table class=\"w-full text-left border-collapse border border-slate-200 dark:border-slate-700\">\n                                    <thead class=\"bg-slate-100 dark:bg-slate-800 font-bold text-slate-700 dark:text-slate-300\">\n                                        <tr>\n                                            <th class=\"p-2.5 border\">Đối Thủ Cạnh Tranh</th>\n                                            <th class=\"p-2.5 border\">Thế Mạnh Cốt Lõi (Strengths)</th>\n                                            <th class=\"p-2.5 border\">Tử Huyệt / Khoảng Trống (Vulnerabilities)</th>\n                                            <th class=\"p-2.5 border text-amber-700 dark:text-amber-400\">Đòn Đột Phá Của VACP</th>\n                                        </tr>\n                                    </thead>\n                                    <tbody class=\"divide-y divide-slate-200 dark:divide-slate-700 text-slate-600 dark:text-slate-300\">\n                                        <tr>\n                                            <td class=\"p-2.5 font-bold border\">1. Milbon (Nhật Bản)</td>\n                                            <td class=\"p-2.5 border\">Thương hiệu uy tín lâu năm, hệ thống đào tạo kỹ thuật bài bản, sản phẩm uốn nhuộm cao cấp.</td>\n                                            <td class=\"p-2.5 border text-rose-500\">Giá bán quá cao, cơ chế chiết khấu cứng nhắc, quy trình uốn còn phức tạp khó làm chủ.</td>\n                                            <td class=\"p-2.5 border font-semibold text-emerald-600\">PLEXIS Seoul: Công nghệ uốn Cysteamine Multi-pH đơn giản hóa thao tác, biên lợi nhuận cao hơn cho Salon.</td>\n                                        </tr>\n                                        <tr>\n                                            <td class=\"p-2.5 font-bold border\">2. Davines (Ý)</td>\n                                            <td class=\"p-2.5 border\">Câu chuyện thương hiệu bền vững, bảo vệ môi trường, thiết kế bao bì nghệ thuật châu Âu.</td>\n                                            <td class=\"p-2.5 border text-rose-500\">Hóa chất uốn thiết kế cho chất tóc phương Tây, độ đàn hồi sóng tóc châu Á chưa thực sự bền.</td>\n                                            <td class=\"p-2.5 border font-semibold text-emerald-600\">Chuyên biệt hóa 100% cho cấu trúc sợi tóc sợi tơ mảnh và sợi to kháng thuốc của phụ nữ Việt Nam.</td>\n                                        </tr>\n                                        <tr>\n                                            <td class=\"p-2.5 font-bold border\">3. Moroccanoil (Israel)</td>\n                                            <td class=\"p-2.5 border\">Thống trị phân khúc tinh dầu dưỡng tóc Argan, độ nhận diện thương hiệu người tiêu dùng cực lớn.</td>\n                                            <td class=\"p-2.5 border text-rose-500\">Không có hệ sinh thái hóa chất uốn, nhuộm, tẩy chuyên sâu; chủ yếu là dòng dưỡng bán lẻ.</td>\n                                            <td class=\"p-2.5 border font-semibold text-emerald-600\">Cung cấp giải pháp trọn gói từ hóa chất dịch vụ uốn nhuộm tại tiệm đến dòng Homecare dưỡng tại nhà.</td>\n                                        </tr>\n                                        <tr>\n                                            <td class=\"p-2.5 font-bold border\">4. Goldwell (Đức) & L'Oréal (Pháp)</td>\n                                            <td class=\"p-2.5 border\">Thị phần rộng khắp, chiếm lĩnh hầu hết các chuỗi salon lớn lâu năm tại Việt Nam.</td>\n                                            <td class=\"p-2.5 border text-rose-500\">Độ phủ đã bão hòa, hàng hóa bị bán tràn lan trên sàn thương mại điện tử làm mất tính độc quyền của salon.</td>\n                                            <td class=\"p-2.5 border font-semibold text-emerald-600\">Cam kết bảo hộ khu vực độc quyền: Không bán lẻ online, mỗi quận/huyện chỉ hợp tác 1-2 Salon VIP đại diện.</td>\n                                        </tr>\n                                    </tbody>\n                                </table>\n                            </div>\n                        </div>\n                    </div>\n                    "}, {"tab": "data", "name": "2. Tiêu Chuẩn Phân Hạng Khách Hàng VIP Salon (Diamond - Gold - Silver)", "content": "\n                    <div class=\"space-y-4 text-xs text-slate-700 dark:text-slate-300\">\n                        <div class=\"p-4 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800\">\n                            <h5 class=\"text-sm font-bold text-slate-900 dark:text-white mb-2\">💎 Bộ Tiêu Chuẩn 3 Phân Hạng Đối Tác Của VACP Group</h5>\n                            <p class=\"text-slate-500 dark:text-slate-400 mb-3\">Được thẩm định trực tiếp bởi Giám đốc Kinh doanh theo biểu mẫu SOP-SALES-01:</p>\n                            \n                            <div class=\"grid sm:grid-cols-3 gap-3\">\n                                <div class=\"p-4 bg-amber-50/70 dark:bg-slate-800 rounded-xl border border-amber-200 dark:border-slate-700\">\n                                    <div class=\"font-bold text-amber-900 dark:text-amber-200 text-sm mb-1\">HẠNG DIAMOND (Salon Kim Cương)</div>\n                                    <ul class=\"space-y-1 text-slate-600 dark:text-slate-300 mt-2\">\n                                        <li>&bull; <strong>Quy mô:</strong> Chuỗi salon từ 3 chi nhánh hoặc salon độc lập trên 15 ghế cắt tóc tại trung tâm TP lớn.</li>\n                                        <li>&bull; <strong>Cam kết doanh số:</strong> &ge; 100 triệu VNĐ/tháng (1.2 tỷ/năm).</li>\n                                        <li>&bull; <strong>Quyền lợi:</strong> Độc quyền bán kính 3km; tài trợ 100% chi phí biển hiệu mica VIP; cử Kỹ thuật viên Master Hàn Quốc về đào tạo riêng.</li>\n                                    </ul>\n                                </div>\n                                <div class=\"p-4 bg-yellow-50/70 dark:bg-slate-800 rounded-xl border border-yellow-200 dark:border-slate-700\">\n                                    <div class=\"font-bold text-yellow-900 dark:text-yellow-200 text-sm mb-1\">HẠNG GOLD (Salon Vàng)</div>\n                                    <ul class=\"space-y-1 text-slate-600 dark:text-slate-300 mt-2\">\n                                        <li>&bull; <strong>Quy mô:</strong> Salon độc lập uy tín từ 6 - 15 ghế, doanh thu dịch vụ trung bình > 200 tr/tháng.</li>\n                                        <li>&bull; <strong>Cam kết doanh số:</strong> &ge; 50 triệu VNĐ/tháng (600 tr/năm).</li>\n                                        <li>&bull; <strong>Quyền lợi:</strong> Chiết khấu 30%; tài trợ 50% chi phí nhận diện; tặng 1 máy kích nhiệt đĩa treo tường cao cấp; 1 suất du lịch Hàn Quốc.</li>\n                                    </ul>\n                                </div>\n                                <div class=\"p-4 bg-slate-100 dark:bg-slate-800 rounded-xl border border-slate-300 dark:border-slate-700\">\n                                    <div class=\"font-bold text-slate-900 dark:text-white text-sm mb-1\">HẠNG SILVER (Salon Bạc)</div>\n                                    <ul class=\"space-y-1 text-slate-600 dark:text-slate-300 mt-2\">\n                                        <li>&bull; <strong>Quy mô:</strong> Salon tầm khá từ 3 - 6 ghế, định hướng phát triển lên phân khúc cao cấp.</li>\n                                        <li>&bull; <strong>Cam kết doanh số:</strong> &ge; 25 triệu VNĐ/tháng (300 tr/năm).</li>\n                                        <li>&bull; <strong>Quyền lợi:</strong> Chiết khấu 25%; tặng bảng màu Mica sang trọng; tặng 2 vé tham dự Workshop kỹ thuật thường niên.</li>\n                                    </ul>\n                                </div>\n                            </div>\n                        </div>\n                    </div>\n                    "}, {"tab": "checklist", "name": "3. Quy Trình Khảo Sát Hiện Trường & Thẩm Định Salon Tiềm Năng (SOP-SALES-01)", "content": "\n                    <div class=\"space-y-3 text-xs text-slate-700 dark:text-slate-300 leading-relaxed\">\n                        <div class=\"p-4 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800\">\n                            <h5 class=\"font-bold text-sm text-slate-900 dark:text-white mb-2\">📋 5 Tiêu Chí Thẩm Định Cốt Tử Khi Tiếp Cận Salon Của VACP Sales:</h5>\n                            <div class=\"space-y-2\">\n                                <div class=\"p-2.5 bg-slate-50 dark:bg-slate-800 rounded\">\n                                    <strong>1. Vị Trí Địa Lý & Mặt Tiền:</strong> Mặt tiền tối thiểu 5m trên các tuyến phố thời trang sầm uất hoặc khu chung cư cao cấp, có chỗ đỗ xe ô tô cho khách VIP.\n                                </div>\n                                <div class=\"p-2.5 bg-slate-50 dark:bg-slate-800 rounded\">\n                                    <strong>2. Thiết Kế Không Gian & Vệ Sinh:</strong> Không gian sạch sẽ, ánh sáng vàng ấm sang trọng, khu vực bồn gội tách biệt riêng tư, không có mùi hóa chất nồng nặc.\n                                </div>\n                                <div class=\"p-2.5 bg-slate-50 dark:bg-slate-800 rounded\">\n                                    <strong>3. Chân Dung Khách Hàng Hiện Hữu:</strong> Đa số khách hàng là phụ nữ công sở cao cấp, nữ doanh nhân, người có thu nhập ổn định và sẵn sàng chi tiền chăm sóc bản thân.\n                                </div>\n                                <div class=\"p-2.5 bg-slate-50 dark:bg-slate-800 rounded\">\n                                    <strong>4. Tư Duy Của Chủ Salon:</strong> Chủ salon là người cầu tiến, trăn trở về kỹ thuật chất lượng cao, mong muốn nâng tầm tiệm chứ không chạy theo cuộc chiến giảm giá hạ chất lượng.\n                                </div>\n                                <div class=\"p-2.5 bg-slate-50 dark:bg-slate-800 rounded\">\n                                    <strong>5. Lịch Sử Tín Dụng & Khả Năng Thanh Toán:</strong> Không có lịch sử nợ đọng xấu với các hãng mỹ phẩm khác trên thị trường.\n                                </div>\n                            </div>\n                        </div>\n                    </div>\n                    "}, {"tab": "quiz", "name": "4. Bài Kiểm Tra Chiến Lược & Định Vị M1", "content": "\n                    <div class=\"p-5 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 space-y-4\">\n                        <div class=\"font-bold text-sm text-slate-900 dark:text-white\">\n                            ❓ Tình Huống Chiến Lược: Một chuỗi salon bình dân 10 cơ sở tại ngoại thành muốn nhập số lượng lớn sản phẩm PLEXIS để làm các gói khuyến mãi \"Uốn tóc trọn gói 199k\". VACP Group có nên chấp thuận ký hợp đồng cung ứng này không?\n                        </div>\n                        <div class=\"space-y-2 text-xs text-slate-700 dark:text-slate-300\">\n                            <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer\">\n                                <input type=\"radio\" name=\"vacp_q1\" value=\"a\" class=\"mr-2\"> A. Đồng ý ngay lập tức vì đơn hàng 10 cơ sở sẽ mang lại doanh số lớn trong ngắn hạn.\n                            </label>\n                            <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer\">\n                                <input type=\"radio\" name=\"vacp_q1\" value=\"b\" class=\"mr-2\"> B. Kiên quyết TỪ CHỐI! Định vị của VACP Group và thương hiệu PLEXIS Seoul là dòng sản phẩm cao cấp dành cho Salon VIP. Việc đưa sản phẩm vào các chuỗi uốn giá rẻ 199k sẽ lập tức phá nát định vị thương hiệu, khiến Top 500 Salon cao cấp tẩy chay sản phẩm vì mất tính sang trọng và độc quyền.\n                            </label>\n                            <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer\">\n                                <input type=\"radio\" name=\"vacp_q1\" value=\"c\" class=\"mr-2\"> C. Đồng ý nhưng yêu cầu salon bóc nhãn mác trước khi làm cho khách.\n                            </label>\n                        </div>\n                        <div class=\"p-3 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 rounded-lg text-xs text-emerald-800 dark:text-emerald-300 hidden\" id=\"vacp_q1_ans\">\n                            <strong>Đáp án chuẩn xác: B!</strong> Kỷ luật định vị là nguyên tắc sống còn của thương hiệu cao cấp. Thà từ chối đơn hàng ngắn hạn để bảo vệ sự toàn vẹn của định vị Luxury & Premium trong tâm trí khách hàng.\n                        </div>\n                        <button onclick=\"document.getElementById('vacp_q1_ans').classList.toggle('hidden')\" class=\"px-4 py-1.5 bg-amber-600 hover:bg-amber-700 text-white rounded text-xs font-semibold\">Xem Phân Tích Chiến Lược</button>\n                    </div>\n                    "}]}, {"id": "vacp_m2", "title": "Module 2: Cơ Cấu Định Biên 73 Nhân Sự, Ma Trận RACI, Lương 3P & Quỹ ESOP Giữ Chân Nhân Tài", "subtitle": "Phân bổ 7 phòng ban qua 2 giai đoạn (Lõi 2026 và Mở rộng 2027), chuẩn đánh giá BARS và chính sách đãi ngộ tinh nhuệ", "duration": "35 phút học", "lessons": [{"tab": "theory", "name": "1. Sơ Đồ Định Biên 73 Nhân Sự VACP Group", "content": "\n                    <div class=\"space-y-5 text-slate-700 dark:text-slate-300 text-sm leading-relaxed\">\n                        <div class=\"p-5 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800\">\n                            <h4 class=\"text-base font-black text-slate-900 dark:text-white mb-2\">👥 Bộ Máy Tổ Chức Tinh Nhuệ 73 Headcount</h4>\n                            <p class=\"text-xs text-slate-600 dark:text-slate-400 mb-3\">Được thiết kế theo mô hình chuyên biệt hóa cao độ để phục vụ khách hàng VIP Salon:</p>\n                            \n                            <div class=\"grid sm:grid-cols-2 gap-3 text-xs\">\n                                <div class=\"p-3 bg-slate-50 dark:bg-slate-800 rounded-lg border\">\n                                    <div class=\"font-bold text-amber-700 dark:text-amber-400\">★ GIAI ĐOẠN 1: BỘ KHUNG LÕI NĂM 2026 (55 Headcount)</div>\n                                    <ul class=\"list-disc pl-5 mt-1 space-y-1 text-slate-600 dark:text-slate-300\">\n                                        <li><strong>Ban Giám Đốc (BOD - 3 NS):</strong> CEO Tổng điều hành, CCO Giám đốc Kinh doanh, CFO Giám đốc Tài chính.</li>\n                                        <li><strong>Khối Kinh Doanh Salon VIP (Sales - 20 NS):</strong> 1 Giám đốc Kinh doanh, 2 Trưởng phòng (Hà Nội & TP.HCM), 17 Chuyên viên phát triển thị trường salon VIP.</li>\n                                        <li><strong>Khối Kỹ Thuật & Academy (Tech - 12 NS):</strong> 1 Giám đốc Kỹ thuật, 1 Master Trainer Hàn Quốc, 4 Giảng viên uốn nhuộm, 6 Kỹ thuật viên Demo salon.</li>\n                                        <li><strong>Khối Marketing & Sự Kiện (MKT - 8 NS):</strong> 1 Trưởng phòng MKT, 3 Brand Manager (Plexis, Demi, Hairmate), 2 Chuyên viên Media 4K, 2 Digital Ads B2B.</li>\n                                        <li><strong>Khối Mua Hàng, XNK & SCM (6 NS):</strong> 1 TP Mua hàng, 1 Chuyên viên Incoterms & BYT, 4 Thủ kho & Kế toán kho mát Hà Nội/TP.HCM.</li>\n                                        <li><strong>Khối Tài Chính Kế Toán (5 NS):</strong> 1 Kế toán trưởng, 2 Kế toán thanh toán & thuế, 2 Kế toán công nợ theo dõi salon VIP.</li>\n                                        <li><strong>Khối Nhân Sự & Hành Chính (4 NS):</strong> 1 TP Nhân sự, 2 Chuyên viên tuyển dụng & đào tạo, 1 Pháp chế doanh nghiệp.</li>\n                                    </ul>\n                                </div>\n                                <div class=\"p-3 bg-slate-50 dark:bg-slate-800 rounded-lg border\">\n                                    <div class=\"font-bold text-blue-700 dark:text-blue-400\">★ GIAI ĐOẠN 2: BỔ SUNG NĂM 2027 (+18 Headcount = 73 NS)</div>\n                                    <p class=\"text-slate-600 dark:text-slate-300 mt-1 mb-2\">Thành lập 4 Chi nhánh & Văn phòng đại diện kiêm Kho vệ tinh tại 4 trung tâm kinh tế trọng điểm:</p>\n                                    <ul class=\"list-disc pl-5 space-y-1 text-slate-600 dark:text-slate-300\">\n                                        <li><strong>Phòng KD Hải Phòng (Vùng Đông Bắc):</strong> 1 TPKD + 3.5 NVKD (4.5 Headcount).</li>\n                                        <li><strong>Phòng KD Đà Nẵng (Vùng Miền Trung):</strong> 1 TPKD + 3.5 NVKD (4.5 Headcount).</li>\n                                        <li><strong>Phòng KD Nha Trang (Vùng Nam Trung Bộ):</strong> 1 TPKD + 3.5 NVKD (4.5 Headcount).</li>\n                                        <li><strong>Phòng KD Cần Thơ (Vùng Tây Nam Bộ):</strong> 1 TPKD + 3.5 NVKD (4.5 Headcount).</li>\n                                        <li><strong>4 Thủ kho & Kế toán kho vệ tinh tỉnh:</strong> Chịu trách nhiệm bảo quản kho mát và giao hàng 2h cho salon địa phương.</li>\n                                    </ul>\n                                </div>\n                            </div>\n                        </div>\n                    </div>\n                    "}, {"tab": "data", "name": "2. Cơ Chế Đãi Ngộ Lương 3P & Quỹ ESOP Giữ Chân Nhân Tài", "content": "\n                    <div class=\"space-y-4 text-xs text-slate-700 dark:text-slate-300\">\n                        <div class=\"p-4 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800\">\n                            <h5 class=\"text-sm font-bold text-slate-900 dark:text-white mb-2\">💰 Cấu Trúc Hệ Thống Lương 3P Của VACP Group</h5>\n                            <table class=\"w-full text-left border-collapse border border-slate-200 dark:border-slate-700\">\n                                <thead class=\"bg-slate-100 dark:bg-slate-800 font-bold text-slate-700 dark:text-slate-300\">\n                                    <tr>\n                                        <th class=\"p-2.5 border\">Trụ Cột Lương 3P</th>\n                                        <th class=\"p-2.5 border\">Cơ Sở Xác Định</th>\n                                        <th class=\"p-2.5 border\">Tỷ Trọng Trong Thu Nhập</th>\n                                        <th class=\"p-2.5 border\">Ý Nghĩa Quản Trị</th>\n                                    </tr>\n                                </thead>\n                                <tbody class=\"divide-y divide-slate-200 dark:divide-slate-700\">\n                                    <tr>\n                                        <td class=\"p-2.5 font-bold border text-blue-600\">P1 - Position (Lương Vị Trí)</td>\n                                        <td class=\"p-2.5 border\">Giá trị của chức danh công việc trên thị trường lao động (Trưởng phòng, Giảng viên, Sales).</td>\n                                        <td class=\"p-2.5 border font-semibold\">40% – 50%</td>\n                                        <td class=\"p-2.5 border\">Đảm bảo mức sống ổn định, an tâm cống hiến dài lâu cho công ty.</td>\n                                    </tr>\n                                    <tr>\n                                        <td class=\"p-2.5 font-bold border text-amber-600\">P2 - Person (Lương Năng Lực)</td>\n                                        <td class=\"p-2.5 border\">Đánh giá theo Khung năng lực hành vi (BARS 360 độ): Trình độ kỹ thuật, kỹ năng đàm phán, tính kỷ luật.</td>\n                                        <td class=\"p-2.5 border font-semibold\">20% – 25%</td>\n                                        <td class=\"p-2.5 border\">Khuyến khích nhân viên chủ động học tập nâng cao tay nghề và thăng cấp bậc chuyên môn.</td>\n                                    </tr>\n                                    <tr>\n                                        <td class=\"p-2.5 font-bold border text-emerald-600\">P3 - Performance (Thưởng Hiệu Suất)</td>\n                                        <td class=\"p-2.5 border\">Kết quả hoàn thành KPI: Doanh số thực thu, số lượng Salon VIP mở mới, tỷ lệ tái đặt hàng & NPS.</td>\n                                        <td class=\"p-2.5 border font-semibold\">25% – 40%</td>\n                                        <td class=\"p-2.5 border\">Tạo động lực bứt phá không giới hạn thu nhập cho các nhân sự xuất sắc.</td>\n                                    </tr>\n                                </tbody>\n                            </table>\n                        </div>\n\n                        <div class=\"p-4 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800\">\n                            <h5 class=\"text-sm font-bold text-slate-900 dark:text-white mb-2\">📈 Chính Sách Quỹ Cổ Phần Thưởng ESOP (Employee Stock Option Plan)</h5>\n                            <p class=\"text-slate-500 dark:text-slate-400 mb-2\">HĐQT VACP Group trích lập quỹ <strong>5% cổ phần ưu đãi</strong> dành riêng cho nhân tài nòng cốt:</p>\n                            <ul class=\"list-disc pl-5 space-y-1 text-slate-600 dark:text-slate-300\">\n                                <li><strong>Đối tượng xét duyệt:</strong> Giám đốc Khối, Trưởng phòng xuất sắc, Master Trainer kỹ thuật có thâm niên từ 2 năm trở lên và đạt KPI loại A trong 4 quý liên tiếp.</li>\n                                <li><strong>Lộ trình thực hiện quyền (Vesting Schedule):</strong> 25% sau năm thứ 2; 25% sau năm thứ 3; 50% còn lại sau năm thứ 4.</li>\n                                <li><strong>Quyền lợi:</strong> Được nhận cổ tức tiền mặt hàng năm và cơ hội chuyển đổi thành cổ phiếu phổ thông có giá trị gia tăng vượt bậc khi công ty IPO hoặc thoái vốn chiến lược.</li>\n                            </ul>\n                        </div>\n                    </div>\n                    "}, {"tab": "checklist", "name": "3. Quy Trình Onboarding 30 Ngày Cho Nhân Sự Mới", "content": "\n                    <div class=\"space-y-3 text-xs text-slate-700 dark:text-slate-300 leading-relaxed\">\n                        <div class=\"p-4 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800\">\n                            <h5 class=\"font-bold text-sm text-slate-900 dark:text-white mb-2\">🗓️ Lộ Trình 30 Ngày Hội Nhập Văn Hóa & Kỹ Thuật Chuẩn VIP:</h5>\n                            <div class=\"space-y-2\">\n                                <div class=\"p-2.5 bg-slate-50 dark:bg-slate-800 rounded\">\n                                    <strong>Tuần 1 (Ngày 1 - 7): Văn Hóa & Nền Tảng:</strong> Học thuộc 5 giá trị văn hóa cốt lõi, quy định bảo mật, học thuyết uốn Cysteamine Multi-pH và thi đỗ bài test lý thuyết sản phẩm (điểm tối thiểu 85/100).\n                                </div>\n                                <div class=\"p-2.5 bg-slate-50 dark:bg-slate-800 rounded\">\n                                    <strong>Tuần 2 (Ngày 8 - 14): Trải Nghiệm Thực Tế Tại Viện Academy:</strong> Trực tiếp pha thuốc, quấn trục, canh nhiệt trên đầu canh và mẫu tóc thật dưới sự kèm cặp 1-1 của Giảng viên Master.\n                                </div>\n                                <div class=\"p-2.5 bg-slate-50 dark:bg-slate-800 rounded\">\n                                    <strong>Tuần 3 (Ngày 15 - 21): Đi Thực Địa Salon Cùng Đàn Anh (Shadowing):</strong> Đi cùng Trưởng phòng kinh doanh tiếp cận 5 Salon VIP, quan sát toàn bộ quy trình demo kỹ thuật và đàm phán hợp đồng.\n                                </div>\n                                <div class=\"p-2.5 bg-slate-50 dark:bg-slate-800 rounded\">\n                                    <strong>Tuần 4 (Ngày 22 - 30): Tự Chủ Đứng Lớp Demo & Đánh Giá:</strong> Tự thực hiện 01 ca demo kỹ thuật uốn uốn phục hồi độc lập tại salon dưới sự giám sát ngầm, báo cáo kết quả và chính thức ký hợp đồng lao động.\n                                </div>\n                            </div>\n                        </div>\n                    </div>\n                    "}, {"tab": "quiz", "name": "4. Bài Kiểm Tra Quản Trị Nhân Sự M2", "content": "\n                    <div class=\"p-5 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 space-y-4\">\n                        <div class=\"font-bold text-sm text-slate-900 dark:text-white\">\n                            ❓ Tình Huống Quản Trị: Một Giảng viên Kỹ thuật VACP rất giỏi chuyên môn uốn tóc nhưng thường xuyên đi muộn trong các buổi đào tạo tại salon khách hàng, có thái độ xem thường nhân viên kinh doanh. Theo hệ thống đánh giá BARS 360 độ và lương 3P, người này sẽ bị ảnh hưởng như thế nào?\n                        </div>\n                        <div class=\"space-y-2 text-xs text-slate-700 dark:text-slate-300\">\n                            <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer\">\n                                <input type=\"radio\" name=\"vacp_q2\" value=\"a\" class=\"mr-2\"> A. Không bị ảnh hưởng gì vì kỹ thuật giỏi là quan trọng nhất trong ngành tóc.\n                            </label>\n                            <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer\">\n                                <input type=\"radio\" name=\"vacp_q2\" value=\"b\" class=\"mr-2\"> B. Bị hạ bậc đánh giá năng lực P2 (Person) xuống mức C do vi phạm chuẩn mực văn hóa kỷ luật và hợp tác liên phòng ban; đồng thời bị cắt quyền tham gia quỹ xét duyệt cổ phần thưởng ESOP năm đó.\n                            </label>\n                            <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer\">\n                                <input type=\"radio\" name=\"vacp_q2\" value=\"c\" class=\"mr-2\"> C. Tăng thêm lương cứng P1 để động viên đi làm đúng giờ.\n                            </label>\n                        </div>\n                        <div class=\"p-3 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 rounded-lg text-xs text-emerald-800 dark:text-emerald-300 hidden\" id=\"vacp_q2_ans\">\n                            <strong>Đáp án chuẩn xác: B!</strong> Tại VACP Group, \"Năng lực chuyên môn mà không có phẩm hạnh văn hóa sẽ trở thành mầm mống phá hoại tổ chức\". Hệ thống lương 3P và BARS được lập ra để bảo vệ văn hóa doanh nghiệp trước những cá nhân kiêu ngạo.\n                        </div>\n                        <button onclick=\"document.getElementById('vacp_q2_ans').classList.toggle('hidden')\" class=\"px-4 py-1.5 bg-amber-600 hover:bg-amber-700 text-white rounded text-xs font-semibold\">Xem Phân Tích Nhân Sự</button>\n                    </div>\n                    "}]}, {"id": "vacp_m3", "title": "Module 3: Nền Tảng Hóa Sinh & Hệ Thống Uốn Tóc Chuẩn Seoul PLEXIS Cysteamine Multi-pH & DEMI Scalp Care", "subtitle": "So sánh hóa sinh Cysteamine HCl vs Thioglycolate, hệ thống 3 nấc pH phục hồi và quy trình 7 bước chuẩn phòng lab Seoul", "duration": "35 phút học", "lessons": [{"tab": "theory", "name": "1. Bản Chất Hóa Sinh Phân Tử Cysteamine Multi-pH", "content": "\n                    <div class=\"space-y-5 text-slate-700 dark:text-slate-300 text-sm leading-relaxed\">\n                        <div class=\"p-5 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800\">\n                            <h4 class=\"text-base font-black text-slate-900 dark:text-white mb-2\">🔬 Cuộc Cách Mạng Hoạt Chất Uốn Tóc: Cysteamine Hydrochloride ($C_2H_7NS \\cdot HCl$)</h4>\n                            <p class=\"text-xs text-slate-600 dark:text-slate-400 mb-3\">VACP chuyển giao trực tiếp tinh hoa công nghệ phòng thí nghiệm Seoul để giải quyết bài toán hóc búa nhất: Uốn tóc đã qua tẩy nhuộm mà sợi tóc vẫn đanh dai, nảy sóng:</p>\n                            \n                            <div class=\"grid sm:grid-cols-2 gap-3 text-xs\">\n                                <div class=\"p-3 bg-rose-50 dark:bg-slate-800 rounded-lg border border-rose-200 dark:border-slate-700\">\n                                    <div class=\"font-bold text-rose-700 dark:text-rose-400 mb-1\">❌ Thuốc Uốn Kiềm Truyền Thống (Thioglycolate / Amoniac):</div>\n                                    <p class=\"text-slate-600 dark:text-slate-300\">\n                                        Trọng lượng phân tử lớn (> 200 Da), bắt buộc phải có môi trường kiềm cao (pH 9.0 – 9.8) để bẻ gãy lớp biểu bì bên ngoài. Hóa chất phá hủy không chọn lọc các liên kết Disulfide ($S\text{–}S$), làm tan rã cấu trúc Protein Keratin khiến tóc bị nhũn nát khi gặp nước và khô xơ chẻ ngọn.\n                                    </p>\n                                </div>\n                                <div class=\"p-3 bg-emerald-50 dark:bg-slate-800 rounded-lg border border-emerald-200 dark:border-slate-700\">\n                                    <div class=\"font-bold text-emerald-700 dark:text-emerald-400 mb-1\">✅ Công Nghệ PLEXIS Cysteamine Gen 4 (Multi-pH Seoul):</div>\n                                    <p class=\"text-slate-600 dark:text-slate-300\">\n                                        Trọng lượng phân tử siêu vi chỉ <strong>113.6 Da</strong>, cấu trúc tương thích 98% với axit amin tự nhiên của tóc. Hoạt chất thẩm thấu tự nhiên vào lõi tóc ở môi trường pH trung tính (pH 4.5 – 6.5) mà không làm tổn hại lớp biểu bì (Cuticle), tái định hình liên kết lưu huỳnh hoàn hảo.\n                                    </p>\n                                </div>\n                            </div>\n                        </div>\n\n                        <div class=\"p-5 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800\">\n                            <h4 class=\"text-base font-black text-slate-900 dark:text-white mb-3\">📊 Hệ Thống Kiểm Soát Uốn Phục Hồi 3 Nấc Multi-pH PLEXIS</h4>\n                            <div class=\"overflow-x-auto text-xs\">\n                                <table class=\"w-full text-left border-collapse border border-slate-200 dark:border-slate-700\">\n                                    <thead class=\"bg-slate-100 dark:bg-slate-800 font-bold text-slate-700 dark:text-slate-300\">\n                                        <tr>\n                                            <th class=\"p-2.5 border\">Nấc Sản Phẩm</th>\n                                            <th class=\"p-2.5 border\">Độ pH Chuẩn</th>\n                                            <th class=\"p-2.5 border\">Tình Trạng Tóc Khách Hàng</th>\n                                            <th class=\"p-2.5 border\">Thời Gian Mềm Hóa</th>\n                                        </tr>\n                                    </thead>\n                                    <tbody class=\"divide-y divide-slate-200 dark:divide-slate-700\">\n                                        <tr>\n                                            <td class=\"p-2.5 font-bold border text-blue-600\">PLEXIS Mild Acid</td>\n                                            <td class=\"p-2.5 border font-semibold\">pH 4.5</td>\n                                            <td class=\"p-2.5 border\">Tóc nát, tóc đã qua tẩy level 8-10, tóc xơ xẹp mất cấu trúc màng lipid.</td>\n                                            <td class=\"p-2.5 border\">15 - 20 phút (Kiểm tra bằng độ nảy)</td>\n                                        </tr>\n                                        <tr>\n                                            <td class=\"p-2.5 font-bold border text-emerald-600\">PLEXIS Neutral Wave</td>\n                                            <td class=\"p-2.5 border font-semibold\">pH 6.5</td>\n                                            <td class=\"p-2.5 border\">Tóc uốn nhuộm trung bình, tóc sợi tơ mảnh tự nhiên của phụ nữ văn phòng.</td>\n                                            <td class=\"p-2.5 border\">20 - 25 phút</td>\n                                        </tr>\n                                        <tr>\n                                            <td class=\"p-2.5 font-bold border text-amber-600\">PLEXIS Strong Hard</td>\n                                            <td class=\"p-2.5 border font-semibold\">pH 8.5</td>\n                                            <td class=\"p-2.5 border\">Tóc đen nguyên bản, sợi thô to cứng, tóc kháng thuốc uốn thông thường.</td>\n                                            <td class=\"p-2.5 border\">25 - 30 phút</td>\n                                        </tr>\n                                    </tbody>\n                                </table>\n                            </div>\n                        </div>\n                    </div>\n                    "}, {"tab": "data", "name": "2. Quy Trình 7 Bước Uốn Tóc Phục Hồi Chuẩn Phòng Lab Seoul", "content": "\n                    <div class=\"space-y-4 text-xs text-slate-700 dark:text-slate-300\">\n                        <div class=\"p-4 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800\">\n                            <h5 class=\"text-sm font-bold text-slate-900 dark:text-white mb-2\">💈 7 Bước Vận Hành Kỹ Thuật Bắt Buộc Dành Cho Kỹ Thuật Viên VACP:</h5>\n                            <div class=\"space-y-2.5\">\n                                <div class=\"p-2.5 bg-slate-50 dark:bg-slate-800 rounded border-l-4 border-blue-500\">\n                                    <strong>Bước 1 - Khảo Sát & Đo Độ pH Tóc:</strong> Kiểm tra lịch sử hóa chất của sợi tóc (đã tẩy mấy lần, có dùng phủ bóng kim loại không). Thử độ giãn đứt khi ướt.\n                                </div>\n                                <div class=\"p-2.5 bg-slate-50 dark:bg-slate-800 rounded border-l-4 border-blue-500\">\n                                    <strong>Bước 2 - Gội Thanh Lọc Cặn Kim Loại:</strong> Dùng dầu gội làm sạch sâu chuyên dụng để bóc tách toàn bộ cặn canxi, clo và silicone bám trên biểu bì tóc.\n                                </div>\n                                <div class=\"p-2.5 bg-slate-50 dark:bg-slate-800 rounded border-l-4 border-blue-500\">\n                                    <strong>Bước 3 - Nạp Dinh Dưỡng Keratin Thủy Phân:</strong> Xịt tinh chất PLEXIS Protein Booster vào những đoạn tóc hư tổn để lấp đầy các lỗ hổng xốp trước khi vào thuốc.\n                                </div>\n                                <div class=\"p-2.5 bg-slate-50 dark:bg-slate-800 rounded border-l-4 border-amber-500\">\n                                    <strong>Bước 4 - Vào Thuốc Uốn Cysteamine Theo Vùng pH:</strong> Đo chính xác bằng cân tiểu ly. Vào nấc pH 8.5 ở chân tóc khỏe, pH 6.5 ở thân tóc và pH 4.5 ở ngọn tóc yếu.\n                                </div>\n                                <div class=\"p-2.5 bg-slate-50 dark:bg-slate-800 rounded border-l-4 border-amber-500\">\n                                    <strong>Bước 5 - Quấn Trục & Canh Nhiệt Thông Minh:</strong> Lựa chọn size trục phù hợp kiểu sóng tóc (Hàn Quốc sóng lơi size 22-25mm). Kích nhiệt 2 lần ngắt quãng (Nhiệt độ 80°C - 100°C tùy chất tóc), tuyệt đối không để nhiệt cao làm cháy protein.\n                                </div>\n                                <div class=\"p-2.5 bg-slate-50 dark:bg-slate-800 rounded border-l-4 border-emerald-500\">\n                                    <strong>Bước 6 - Định Hình Bằng Dập Oxy Hóa OxiStabilizer:</strong> Tra thuốc dập số 2 có hoạt chất chống rát da đầu. Lưu thuốc đúng 7-10 phút để tái khóa 100% liên kết lưu huỳnh.\n                                </div>\n                                <div class=\"p-2.5 bg-slate-50 dark:bg-slate-800 rounded border-l-4 border-emerald-500\">\n                                    <strong>Bước 7 - Xả Nguội & Khóa Màng Lipid Tự Nhiên:</strong> Xả sạch bằng nước mát, thoa huyết thanh bảo vệ nhiệt và sấy tạo kiểu bằng tay mà không cần dùng lô kẹp cầu kỳ.\n                                </div>\n                            </div>\n                        </div>\n                    </div>\n                    "}, {"tab": "checklist", "name": "3. Chính Sách Hợp Đồng Đại Sứ Kỹ Thuật (KOL Hair Stylist)", "content": "\n                    <div class=\"space-y-3 text-xs text-slate-700 dark:text-slate-300 leading-relaxed\">\n                        <div class=\"p-4 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800\">\n                            <h5 class=\"font-bold text-sm text-slate-900 dark:text-white mb-2\">🌟 Khung Hợp Đồng Tài Trợ & Đồng Hành Cùng KOL Tóc Cấp Cao:</h5>\n                            <ul class=\"list-disc pl-5 space-y-1.5 text-slate-600 dark:text-slate-300\">\n                                <li><strong>Tiêu chuẩn lựa chọn KOL:</strong> Chủ salon có trên 50.000 followers trên TikTok/Facebook, có gu thẩm mỹ cao, phong cách làm việc lịch thiệp chuẩn mực.</li>\n                                <li><strong>Gói tài trợ độc quyền từ VACP:</strong> Tài trợ 100% sản phẩm uốn nhuộm PLEXIS & DEMI dùng thử nghiệm trong 6 tháng; tài trợ máy quay dựng video chuyên nghiệp và đội ngũ Media 4K hỗ trợ sản xuất nội dung kỹ thuật.</li>\n                                <li><strong>Nghĩa vụ cam kết của KOL:</strong> Sản xuất tối thiểu 4 video kỹ thuật uốn phục hồi/tháng có gắn nhận diện thương hiệu PLEXIS; đồng ý đứng lớp chia sẻ tại 02 Workshop kỹ thuật thường niên của VACP Academy.</li>\n                            </ul>\n                        </div>\n                    </div>\n                    "}, {"tab": "quiz", "name": "4. Bài Kiểm Tra Kỹ Thuật Uốn Hóa Sinh M3", "content": "\n                    <div class=\"p-5 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 space-y-4\">\n                        <div class=\"font-bold text-sm text-slate-900 dark:text-white\">\n                            ❓ Tình Huống Kỹ Thuật Phòng Lab: Một khách hàng có mái tóc đã tẩy 2 lần lên level 9 muốn uốn sóng lơi Hàn Quốc. Nếu Kỹ thuật viên dùng thuốc uốn có nồng độ pH 9.0 để làm cho khách thì hiện tượng gì sẽ xảy ra và phương án đúng của VACP là gì?\n                        </div>\n                        <div class=\"space-y-2 text-xs text-slate-700 dark:text-slate-300\">\n                            <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer\">\n                                <input type=\"radio\" name=\"vacp_q3\" value=\"a\" class=\"mr-2\"> A. Tóc sẽ xoăn tít rất đẹp và giữ sóng được cả năm.\n                            </label>\n                            <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer\">\n                                <input type=\"radio\" name=\"vacp_q3\" value=\"b\" class=\"mr-2\"> B. Tóc tẩy level 9 đã bị rỗng tủy và mất sạch lớp màng bảo vệ, nếu gặp pH 9.0 sẽ bị nhũn nát (cháy hóa chất) ngay sau 5 phút. Phương án chuẩn mực của VACP: Sử dụng duy nhất dòng uốn axit PLEXIS Mild Acid (pH 4.5) kết hợp nạp Protein Booster phục hồi trước khi vào trục kích nhiệt nhẹ ở 80°C.\n                            </label>\n                            <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer\">\n                                <input type=\"radio\" name=\"vacp_q3\" value=\"c\" class=\"mr-2\"> C. Xịt thêm keo bọt vuốt tóc vào bát thuốc để giảm bớt độ nóng.\n                            </label>\n                        </div>\n                        <div class=\"p-3 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 rounded-lg text-xs text-emerald-800 dark:text-emerald-300 hidden\" id=\"vacp_q3_ans\">\n                            <strong>Đáp án chuẩn xác: B!</strong> Sự hiểu biết tường tận về nồng độ pH và giới hạn chịu lực của sợi tóc tẩy là vũ khí tạo nên đẳng cấp của Chuyên gia VACP. Sai lầm về pH sẽ hủy hoại uy tín cả đời của một Salon tóc.\n                        </div>\n                        <button onclick=\"document.getElementById('vacp_q3_ans').classList.toggle('hidden')\" class=\"px-4 py-1.5 bg-amber-600 hover:bg-amber-700 text-white rounded text-xs font-semibold\">Xem Phân Tích Hóa Sinh</button>\n                    </div>\n                    "}]}, {"id": "vacp_m4", "title": "Module 4: Mô Hình Tài Chính 53 Tháng & Lộ Trình Tăng Trưởng 75 Tỷ Đến 488 Tỷ VNĐ", "subtitle": "Bảng P&L 5 năm, điểm hòa vốn tháng thứ 7, tỷ suất lợi nhuận ròng 17.2% và chỉ số quản trị dòng tiền DSO/DIO", "duration": "35 phút học", "lessons": [{"tab": "theory", "name": "1. Lộ Trình Tăng Trưởng Doanh Thu 2026–2030 (Top 2 Thị Phần)", "content": "\n                    <div class=\"space-y-5 text-slate-700 dark:text-slate-300 text-sm leading-relaxed\">\n                        <div class=\"p-5 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800\">\n                            <h4 class=\"text-base font-black text-slate-900 dark:text-white mb-2\">📈 Bản Kế Hoạch Tài Chính 5 Năm Chinh Phục Ngôi Vị Á Quân Ngành Tóc</h4>\n                            <p class=\"text-xs text-slate-600 dark:text-slate-400 mb-3\">\n                                Trích xuất trực tiếp từ mô hình tài chính <code>VACP_Financial_Model_2026_2030.xlsx</code> được phê duyệt bởi Hội Đồng Quản Trị:\n                            </p>\n                            <div class=\"overflow-x-auto text-xs\">\n                                <table class=\"w-full text-left border-collapse border border-slate-200 dark:border-slate-700\">\n
