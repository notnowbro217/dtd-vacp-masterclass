ent": "\n                    <div class=\"space-y-4 text-xs text-slate-700 dark:text-slate-300\">\n                        <div class=\"p-4 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800\">\n                            <h5 class=\"text-sm font-bold text-slate-900 dark:text-white mb-2\">⚖️ Cơ Cấu Chi Phí Vàng Chuẩn VIP Của VACP Group</h5>\n                            <div class=\"grid sm:grid-cols-4 gap-3\">\n                                <div class=\"p-3 bg-slate-50 dark:bg-slate-800 rounded-lg border text-center\">\n                                    <div class=\"text-slate-500 text-[11px]\">GIÁ VỐN HÀNG BÁN (COGS)</div>\n                                    <div class=\"text-xl font-black text-slate-900 dark:text-white mt-1\">39.0%</div>\n                                    <p class=\"text-[10px] text-slate-400 mt-1\">Bao gồm giá nhập khẩu OEM Seoul, thuế nhập khẩu mỹ phẩm và cước tàu biển quốc tế.</p>\n                                </div>\n                                <div class=\"p-3 bg-slate-50 dark:bg-slate-800 rounded-lg border text-center\">\n                                    <div class=\"text-slate-500 text-[11px]\">CHI PHÍ BÁN HÀNG & MKT</div>\n                                    <div class=\"text-xl font-black text-blue-600 mt-1\">24.5%</div>\n                                    <p class=\"text-[10px] text-slate-400 mt-1\">Lương hoa hồng Sales VIP, chi phí tổ chức Hair Show, tài trợ máy uốn và booking KOL.</p>\n                                </div>\n                                <div class=\"p-3 bg-slate-50 dark:bg-slate-800 rounded-lg border text-center\">\n                                    <div class=\"text-slate-500 text-[11px]\">CHI PHÍ QUẢN LÝ (G&A)</div>\n                                    <div class=\"text-xl font-black text-amber-600 mt-1\">15.0%</div>\n                                    <p class=\"text-[10px] text-slate-400 mt-1\">Khối điều hành, văn phòng, kho lạnh đạt chuẩn bảo quản <28°C và phần mềm ERP.</p>\n                                </div>\n                                <div class=\"p-3 bg-slate-50 dark:bg-slate-800 rounded-lg border text-center\">\n                                    <div class=\"text-slate-500 text-[11px]\">BIÊN LỢI NHUẬN RÒNG</div>\n                                    <div class=\"text-xl font-black text-emerald-600 mt-1\">17.2%</div>\n                                    <p class=\"text-[10px] text-slate-400 mt-1\">Lợi nhuận ròng sau thuế thu nhập doanh nghiệp được tái đầu tư cho R&D và quỹ ESOP.</p>\n                                </div>\n                            </div>\n                        </div>\n\n                        <div class=\"p-4 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800\">\n                            <h5 class=\"text-sm font-bold text-slate-900 dark:text-white mb-2\">🎯 Bộ 3 Chỉ Số Quản Trị Dòng Tiền Nghiêm Ngặt</h5>\n                            <ul class=\"space-y-1.5 text-slate-600 dark:text-slate-300\">\n                                <li>&bull; <strong>Số ngày thu tiền bình quân (DSO Target):</strong> Siết chặt từ 32 ngày (năm 2026) xuống 22 ngày (năm 2030), hạn chế tối đa việc ứ đọng dòng tiền mặt ngoài thị trường.</li>\n                                <li>&bull; <strong>Vòng quay hàng tồn kho (DIO):</strong> Giảm dần từ 75 ngày xuống 55 ngày nhờ thuật toán dự báo nhu cầu chính xác.</li>\n                                <li>&bull; <strong>Thời hạn nợ nhà cung cấp quốc tế (DPO):</strong> Đàm phán thanh toán sau 60 ngày, giúp VACP luôn có dòng tiền tự do (Free Cash Flow) dương.</li>\n                            </ul>\n                        </div>\n                    </div>\n                    "}, {"tab": "checklist", "name": "3. Kịch Bản Hòa Vốn (Break-even Analysis) Tại Tháng Thứ 7", "content": "\n                    <div class=\"space-y-3 text-xs text-slate-700 dark:text-slate-300 leading-relaxed\">\n                        <div class=\"p-4 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800\">\n                            <h5 class=\"font-bold text-sm text-slate-900 dark:text-white mb-2\">🏁 Cột Mốc Tháng Thứ 7: Vượt Qua Điểm Hòa Vốn Doanh Nghiệp</h5>\n                            <div class=\"p-3 bg-amber-50 dark:bg-slate-800 rounded-lg border border-amber-200 dark:border-slate-700 mb-3\">\n                                <strong>Điểm hòa vốn hoạt động (Operational Break-Even):</strong> Đạt được khi doanh thu thuần chạm ngưỡng <strong>1,82 tỷ VNĐ/tháng</strong> (tương đương phục vụ định kỳ 65 Salon Hạng Gold và 12 Salon Hạng Diamond).\n                            </div>\n                            <p class=\"text-slate-600 dark:text-slate-300\">\n                                Từ tháng thứ 8 trở đi, mọi chi phí cố định (Định phí văn phòng, lương cứng nhân viên, khấu hao kho lạnh) đã được trang trải đầy đủ. Mỗi đồng doanh thu tăng thêm sẽ đóng góp trực tiếp vào tỷ suất lợi nhuận ròng của tập đoàn.\n                            </p>\n                        </div>\n                    </div>\n                    "}, {"tab": "quiz", "name": "4. Bài Kiểm Tra Tài Chính Doanh Nghiệp M4", "content": "\n                    <div class=\"p-5 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 space-y-4\">\n                        <div class=\"font-bold text-sm text-slate-900 dark:text-white\">\n                            ❓ Câu Hỏi Tài Chính: Tại sao VACP Group lại đặt mục tiêu chỉ số DSO (Số ngày thu tiền khách hàng bình quân) rất nghiêm ngặt ở mức 22 - 32 ngày, thay vì cho các chủ salon nợ thoải mái 60 - 90 ngày như một số hãng mỹ phẩm khác?\n                        </div>\n                        <div class=\"space-y-2 text-xs text-slate-700 dark:text-slate-300\">\n                            <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer\">\n                                <input type=\"radio\" name=\"vacp_q4\" value=\"a\" class=\"mr-2\"> A. Vì công ty không có tiền để kinh doanh.\n                            </label>\n                            <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer\">\n                                <input type=\"radio\" name=\"vacp_q4\" value=\"b\" class=\"mr-2\"> B. Vì ngành làm đẹp có tính rủi ro cao về mặt bằng salon; cho nợ quá 30 ngày rất dễ biến thành nợ xấu khi chủ salon chuyển nhượng tiệm hoặc đổi nghề. Đồng thời, DSO dưới 30 ngày bảo đảm VACP luôn có tiền mặt dồi dào để nhập khẩu cont hàng mới từ Hàn Quốc và Nhật Bản.\n                            </label>\n                            <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer\">\n                                <input type=\"radio\" name=\"vacp_q4\" value=\"c\" class=\"mr-2\"> C. Để ép salon phá sản nhanh hơn.\n                            </label>\n                        </div>\n                        <div class=\"p-3 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 rounded-lg text-xs text-emerald-800 dark:text-emerald-300 hidden\" id=\"vacp_q4_ans\">\n                            <strong>Đáp án chuẩn xác: B!</strong> Tiền mặt là máu của doanh nghiệp (Cash is King). Quản trị công nợ chuẩn chỉnh là bí quyết giúp VACP duy trì tốc độ tăng trưởng phi mã 60% - 125% mà không bao giờ bị đứt gãy thanh khoản.\n                        </div>\n                        <button onclick=\"document.getElementById('vacp_q4_ans').classList.toggle('hidden')\" class=\"px-4 py-1.5 bg-amber-600 hover:bg-amber-700 text-white rounded text-xs font-semibold\">Xem Phân Tích Tài Chính</button>\n                    </div>\n                    "}]}, {"id": "vacp_m5", "title": "Module 5: VACP Academy — Chiến Lược GTM & Kịch Bản Tổ Chức Hair Show 300+ Salon VIP", "subtitle": "Mô hình phễu chuyển đổi 3 tầng Education-First, ma trận RACI sự kiện 13 hạng mục và kịch bản chốt gói kích hoạt 90 ngày", "duration": "35 phút học", "lessons": [{"tab": "theory", "name": "1. Mô Hình Phễu GTM: Đào Tạo Dẫn Đường (Education-First)", "content": "\n                    <div class=\"space-y-5 text-slate-700 dark:text-slate-300 text-sm leading-relaxed\">\n                        <div class=\"p-5 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800\">\n                            <h4 class=\"text-base font-black text-slate-900 dark:text-white mb-2\">🎓 Triết Lý GTM: \"Bán Giải Pháp Kỹ Thuật Trước, Bán Sản Phẩm Theo Sau\"</h4>\n                            <p class=\"text-xs text-slate-600 dark:text-slate-400 mb-3\">\n                                Khách hàng VIP Salon không bao giờ mua hàng vì nhân viên kinh doanh nài nỉ hay chào mời chiết khấu rẻ. Họ chỉ mua hàng khi họ tin tưởng tuyệt đối vào <strong>năng lực chuyển giao kỹ thuật của Học Viện VACP Academy</strong>.\n                            </p>\n                            \n                            <div class=\"space-y-3 text-xs\">\n                                <div class=\"p-3 bg-blue-50/70 dark:bg-slate-800 rounded-lg border border-blue-200 dark:border-slate-700\">\n                                    <strong class=\"text-blue-700 dark:text-blue-300 font-bold\">TẦNG 1: HỘI THẢO WORKSHOP LƯU ĐỘNG (TOFU - Top of Funnel)</strong>\n                                    <p class=\"mt-1 text-slate-600 dark:text-slate-300\">Tổ chức các buổi Workshop kỹ thuật 1 ngày tại các khách sạn 4-5 sao tại các tỉnh thành, mời 100 - 200 chủ salon đến chứng kiến tận mắt ca uốn phục hồi trên tóc nát hư tổn do Master Hàn Quốc trực tiếp thực hiện.</p>\n                                </div>\n                                <div class=\"p-3 bg-amber-50/70 dark:bg-slate-800 rounded-lg border border-amber-200 dark:border-slate-700\">\n                                    <strong class=\"text-amber-700 dark:text-amber-300 font-bold\">TẦNG 2: KHÓA MASTERCLASS CHUYÊN SÂU 3 NGÀY (MOFU - Middle of Funnel)</strong>\n                                    <p class=\"mt-1 text-slate-600 dark:text-slate-300\">Tuyển chọn các chủ salon tâm huyết tham gia khóa học thực hành cọ xát trực tiếp tại Học viện VACP Hà Nội và TP.HCM. Cầm tay chỉ việc pha công thức Multi-pH, đo nhiệt độ bằng súng hồng ngoại.</p>\n                                </div>\n                                <div class=\"p-3 bg-emerald-50/70 dark:bg-slate-800 rounded-lg border border-emerald-200 dark:border-slate-700\">\n                                    <strong class=\"text-emerald-700 dark:text-emerald-300 font-bold\">TẦNG 3: KÝ HỢP ĐỒNG ĐỘC QUYỀN & TÀI TRỢ TOÀN DIỆN (BOFU - Bottom of Funnel)</strong>\n                                    <p class=\"mt-1 text-slate-600 dark:text-slate-300\">Chốt hợp đồng cung ứng năm trở thành Đối Tác Vàng/Kim Cương của VACP Group. Bàn giao máy uốn, lắp đặt bảng hiệu mica nhận diện và bảo trợ truyền thông thương hiệu salon.</p>\n                                </div>\n                            </div>\n                        </div>\n                    </div>\n                    "}, {"tab": "data", "name": "2. Ma Trận RACI 13 Hạng Mục Vận Hành Sự Kiện & Chính Sách Gói Tài Trợ", "content": "\n                    <div class=\"space-y-4 text-xs text-slate-700 dark:text-slate-300\">\n                        <div class=\"p-4 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800\">\n                            <h5 class=\"text-sm font-bold text-slate-900 dark:text-white mb-2\">📋 Ma Trận RACI Điều Phối Sự Kiện Hair Show Giữa 5 Bộ Phận</h5>\n                            <p class=\"text-slate-500 dark:text-slate-400 mb-2\">Quy định thẩm quyền giữa BOD, Sales, Kỹ thuật (Tech), Marketing (Mkt) và Hậu cần kho (Log):</p>\n                            \n                            <table class=\"w-full text-left border-collapse border border-slate-200 dark:border-slate-700\">\n                                <thead class=\"bg-slate-100 dark:bg-slate-800 font-bold text-slate-700 dark:text-slate-300\">\n                                    <tr>\n                                        <th class=\"p-2 border\">Hạng Mục Nhiệm Vụ Sự Kiện</th>\n                                        <th class=\"p-2 border text-center\">BOD</th>\n                                        <th class=\"p-2 border text-center\">Sales</th>\n                                        <th class=\"p-2 border text-center\">Tech</th>\n                                        <th class=\"p-2 border text-center\">Mkt</th>\n                                        <th class=\"p-2 border text-center\">Log</th>\n                                    </tr>\n                                </thead>\n                                <tbody class=\"divide-y divide-slate-200 dark:divide-slate-700\">\n                                    <tr>\n                                        <td class=\"p-2 border\">Phê duyệt ngân sách & KPI doanh thu sự kiện</td>\n                                        <td class=\"p-2 border text-center font-bold text-purple-600\">A</td>\n                                        <td class=\"p-2 border text-center\">C</td>\n                                        <td class=\"p-2 border text-center\">C</td>\n                                        <td class=\"p-2 border text-center font-bold text-blue-600\">R</td>\n                                        <td class=\"p-2 border text-center\">I</td>\n                                    </tr>\n                                    <tr>\n                                        <td class=\"p-2 border\">Soạn giáo trình, kỹ thuật uốn & Casting Model tóc</td>\n                                        <td class=\"p-2 border text-center\">I</td>\n                                        <td class=\"p-2 border text-center\">C</td>\n                                        <td class=\"p-2 border text-center font-bold text-blue-600\">A / R</td>\n                                        <td class=\"p-2 border text-center\">C</td>\n                                        <td class=\"p-2 border text-center\">I</td>\n                                    </tr>\n                                    <tr>\n                                        <td class=\"p-2 border\">Thiết kế nhận diện, sân khấu LED & truyền thông</td>\n                                        <td class=\"p-2 border text-center\">I</td>\n                                        <td class=\"p-2 border text-center\">I</td>\n                                        <td class=\"p-2 border text-center\">C</td>\n                                        <td class=\"p-2 border text-center font-bold text-blue-600\">A / R</td>\n                                        <td class=\"p-2 border text-center\">I</td>\n                                    </tr>\n                                    <tr>\n                                        <td class=\"p-2 border\">Mời 300+ Chủ Salon VIP, bán vé tham dự</td>\n                                        <td class=\"p-2 border text-center\">I</td>\n                                        <td class=\"p-2 border text-center font-bold text-blue-600\">A / R</td>\n                                        <td class=\"p-2 border text-center\">I</td>\n                                        <td class=\"p-2 border text-center\">C</td>\n                                        <td class=\"p-2 border text-center\">I</td>\n                                    </tr>\n                                    <tr>\n                                        <td class=\"p-2 border\">Thị phạm kỹ thuật uốn PLEXIS trên sân khấu</td>\n                                        <td class=\"p-2 border text-center\">I</td>\n                                        <td class=\"p-2 border text-center\">I</td>\n                                        <td class=\"p-2 border text-center font-bold text-blue-600\">A / R</td>\n                                        <td class=\"p-2 border text-center\">C</td>\n                                        <td class=\"p-2 border text-center\">I</td>\n                                    </tr>\n                                    <tr>\n                                        <td class=\"p-2 border\">Tư vấn chốt Gói Kích Hoạt (Activation Package) tại bàn</td>\n                                        <td class=\"p-2 border text-center\">I</td>\n                                        <td class=\"p-2 border text-center font-bold text-blue-600\">A / R</td>\n                                        <td class=\"p-2 border text-center\">C</td>\n                                        <td class=\"p-2 border text-center\">I</td>\n                                        <td class=\"p-2 border text-center\">I</td>\n                                    </tr>\n                                    <tr>\n                                        <td class=\"p-2 border\">Đo lường NPS & cử KTV kèm cặp salon sau sự kiện</td>\n                                        <td class=\"p-2 border text-center font-bold text-purple-600\">A</td>\n                                        <td class=\"p-2 border text-center font-bold text-blue-600\">R</td>\n                                        <td class=\"p-2 border text-center font-bold text-blue-600\">R</td>\n                                        <td class=\"p-2 border text-center\">C</td>\n                                        <td class=\"p-2 border text-center\">I</td>\n                                    </tr>\n                                </tbody>\n                            </table>\n                            <div class=\"text-[10px] text-slate-400 mt-2\">\n                                Ghi chú: <strong>A</strong> (Accountable - Chịu trách nhiệm tối cao); <strong>R</strong> (Responsible - Người trực tiếp thực thi); <strong>C</strong> (Consulted - Tham vấn ý kiến); <strong>I</strong> (Informed - Nhận thông báo).\n                            </div>\n                        </div>\n                    </div>\n                    "}, {"tab": "checklist", "name": "3. Kịch Bản Timeline 90 Ngày Chuẩn Bị Đại Hội Hair Show", "content": "\n                    <div class=\"space-y-3 text-xs text-slate-700 dark:text-slate-300 leading-relaxed\">\n                        <div class=\"p-4 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800\">\n                            <h5 class=\"font-bold text-sm text-slate-900 dark:text-white mb-2\">⏱️ Tiến Độ Triển Khai Hair Show Quy Mô 300 - 500 Khách Mời:</h5>\n                            <div class=\"space-y-2\">\n                                <div class=\"p-2.5 bg-slate-50 dark:bg-slate-800 rounded\">\n                                    <strong>D-90 đến D-60: Khảo Sát & Chốt Địa Điểm:</strong> Ký hợp đồng trung tâm hội nghị 5 sao, phê duyệt concept sân khấu, làm việc lịch trình Master Hàn Quốc.\n                                </div>\n                                <div class=\"p-2.5 bg-slate-50 dark:bg-slate-800 rounded\">\n                                    <strong>D-60 đến D-30: Truyền Thông & Bán Vé:</strong> Khối Sales tiếp cận 500 Salon mục tiêu, phát thư mời VIP trân trọng mạ vàng, chốt danh sách 300 khách đăng ký chính thức.\n                                </div>\n                                <div class=\"p-2.5 bg-slate-50 dark:bg-slate-800 rounded\">\n                                    <strong>D-30 đến D-7: Casting Người Mẫu & Chuẩn Bị Bộ Sưu Tập:</strong> Tuyển chọn 30 mẫu tóc thật, xử lý nền tóc trước, chuẩn bị trang phục dạ hội và ánh sáng sân khấu.\n                                </div>\n                                <div class=\"p-2.5 bg-slate-50 dark:bg-slate-800 rounded\">\n                                    <strong>D-Day (Ngày Sự Kiện): Thực Thi Đỉnh Cao:</strong> Check-in thảm đỏ, trình diễn thị phạm trực tiếp kỹ thuật PLEXIS, công bố chính sách gói ưu đãi và bùng nổ chốt đơn hợp đồng.\n                                </div>\n                            </div>\n                        </div>\n                    </div>\n                    "}, {"tab": "quiz", "name": "4. Bài Kiểm Tra Chiến Thuật GTM M5", "content": "\n                    <div class=\"p-5 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 space-y-4\">\n                        <div class=\"font-bold text-sm text-slate-900 dark:text-white\">\n                            ❓ Chiến Thuật Chốt Đơn: Tại sao trong các sự kiện Hair Show của VACP Academy, công ty không phát bảng giá sỉ thông thường mà lại tung ra \"Gói Kích Hoạt Giới Hạn\" (Chỉ dành cho 20 salon cọc tiền đầu tiên)?\n                        </div>\n                        <div class=\"space-y-2 text-xs text-slate-700 dark:text-slate-300\">\n                            <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer\">\n                                <input type=\"radio\" name=\"vacp_q5\" value=\"a\" class=\"mr-2\"> A. Để giấu giá không cho đối thủ biết.\n                            </label>\n                            <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer\">\n                                <input type=\"radio\" name=\"vacp_q5\" value=\"b\" class=\"mr-2\"> B. Ứng dụng tâm lý học hành vi \"Độ khan hiếm & Bằng chứng xã hội\" (Scarcity & Social Proof): Khi chứng kiến tận mắt hiệu quả uốn tóc đỉnh cao trên sân khấu và thấy các chủ salon tên tuổi khác tranh nhau đặt cọc gói tài trợ máy uốn độc quyền, hiệu ứng FOMO (sợ bỏ lỡ cơ hội) sẽ thúc đẩy quyết định ký hợp đồng ngay tại sự kiện với tỷ lệ chuyển đổi trên 40%.\n                            </label>\n                            <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer\">\n                                <input type=\"radio\" name=\"vacp_q5\" value=\"c\" class=\"mr-2\"> C. Vì công ty chỉ mang theo 20 thùng hàng mẫu đến hội trường.\n                            </label>\n                        </div>\n                        <div class=\"p-3 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 rounded-lg text-xs text-emerald-800 dark:text-emerald-300 hidden\" id=\"vacp_q5_ans\">\n                            <strong>Đáp án chuẩn xác: B!</strong> Sự kiện không đơn thuần là nơi trình diễn nghệ thuật, mà là cỗ máy chuyển đổi kinh doanh đỉnh cao. Nắm vững tâm lý học bán hàng B2B giúp VACP đạt doanh thu hàng tỷ đồng chỉ trong 3 giờ tổ chức sự kiện.\n                        </div>\n                        <button onclick=\"document.getElementById('vacp_q5_ans').classList.toggle('hidden')\" class=\"px-4 py-1.5 bg-amber-600 hover:bg-amber-700 text-white rounded text-xs font-semibold\">Xem Phân Tích GTM</button>\n                    </div>\n                    "}]}, {"id": "vacp_m6", "title": "Module 6: Hệ Điều Hành Doanh Nghiệp Culture-OS & Bộ 16 Quy Trình Vận Hành Tiêu Chuẩn SOP ISO 9001", "subtitle": "5 Giá trị văn hóa cốt lõi, cẩm nang 16 SOP chi tiết từ Sales, Tech, Marketing, Logistics đến Kế toán và SLA 2h", "duration": "35 phút học", "lessons": [{"tab": "theory", "name": "1. 5 Giá Trị Văn Hóa Cốt Lõi Culture-OS Của VACP Group", "content": "\n                    <div class=\"space-y-5 text-slate-700 dark:text-slate-300 text-sm leading-relaxed\">\n                        <div class=\"p-5 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800\">\n                            <h4 class=\"text-base font-black text-slate-900 dark:text-white mb-2\">🏛️ Trụ Cột Văn Hóa Doanh Nghiệp Của VACP Group</h4>\n                            <p class=\"text-xs text-slate-600 dark:text-slate-400 mb-3\">Văn hóa là linh hồn giữ vững sự kỷ luật và tính phụng sự tận tâm trong phân khúc khách hàng thượng lưu:</p>\n                            \n                            <div class=\"space-y-2 text-xs\">\n                                <div class=\"p-3 bg-amber-50/70 dark:bg-slate-800 rounded-lg border\">\n                                    <strong class=\"text-amber-900 dark:text-amber-200 font-bold\">1. TẬN HIẾN (DEDICATION):</strong>\n                                    <p class=\"text-slate-600 dark:text-slate-300 mt-0.5\">Đặt sự thành công và uy tín của Salon khách hàng lên trên lợi ích bán hàng ngắn hạn. Luôn sẵn sàng hỗ trợ kỹ thuật ngày đêm khi salon gặp ca tóc khó.</p>\n                                </div>\n                                <div class=\"p-3 bg-yellow-50/70 dark:bg-slate-800 rounded-lg border\">\n                                    <strong class=\"text-yellow-900 dark:text-yellow-200 font-bold\">2. TINH HOA (EXCELLENCE):</strong>\n                                    <p class=\"text-slate-600 dark:text-slate-300 mt-0.5\">Mọi chi tiết nhỏ từ trang phục nhân viên, cách pha thuốc bằng cân điện tử, đến chất liệu hộp quà tặng đều phải toát lên chuẩn mực thẩm mỹ và sự sang trọng bậc nhất.</p>\n                                </div>\n                                <div class=\"p-3 bg-blue-50/70 dark:bg-slate-800 rounded-lg border\">\n                                    <strong class=\"text-blue-900 dark:text-blue-200 font-bold\">3. CHÍNH TRỰC (INTEGRITY):</strong>\n                                    <p class=\"text-slate-600 dark:text-slate-300 mt-0.5\">Nói đúng sự thật về khả năng hóa sinh của sản phẩm, không tâng bốc quá đà; cam kết giữ trọn vẹn lời hứa bảo hộ địa bàn độc quyền cho salon đối tác.</p>\n                                </div>\n                                <div class=\"p-3 bg-emerald-50/70 dark:bg-slate-800 rounded-lg border\">\n                                    <strong class=\"text-emerald-900 dark:text-emerald-200 font-bold\">4. KHÁT VỌNG (ASPIRATION):</strong>\n                                    <p class=\"text-slate-600 dark:text-slate-300 mt-0.5\">Không tự mãn với thành tích hiện tại, liên tục nghiên cứu công nghệ làm đẹp mới nhất từ Seoul, Tokyo, Milan để đưa về phụng sự thị trường Việt Nam.</p>\n                                </div>\n                                <div class=\"p-3 bg-purple-50/70 dark:bg-slate-800 rounded-lg border\">\n                                    <strong class=\"text-purple-900 dark:text-purple-200 font-bold\">5. ĐỒNG HÀNH (PARTNERSHIP):</strong>\n                                    <p class=\"text-slate-600 dark:text-slate-300 mt-0.5\">Coi chủ salon là người đồng đội chung một chiến hào, cùng chia sẻ ngọt bùi và cùng nhau thịnh vượng bền vững.</p>\n                                </div>\n                            </div>\n                        </div>\n                    </div>\n                    "}, {"tab": "data", "name": "2. Danh Mục 16 Quy Trình Vận Hành Tiêu Chuẩn (SOP ISO 9001)", "content": "\n                    <div class=\"space-y-4 text-xs text-slate-700 dark:text-slate-300\">\n                        <div class=\"p-4 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800\">\n                            <h5 class=\"text-sm font-bold text-slate-900 dark:text-white mb-2\">📑 Hệ Thống 16 SOP Vận Hành Chi Tiết Chuẩn Hóa Theo 5 Khối:</h5>\n                            <div class=\"overflow-x-auto\">\n                                <table class=\"w-full text-left border-collapse border border-slate-200 dark:border-slate-700\">\n                                    <thead class=\"bg-slate-100 dark:bg-slate-800 font-bold text-slate-700 dark:text-slate-300\">\n                                        <tr>\n                                            <th class=\"p-2 border\">Mã SOP</th>\n                                            <th class=\"p-2 border\">Tên Quy Trình Vận Hành</th>\n                                            <th class=\"p-2 border\">Bộ Phận Chịu Trách Nhiệm</th>\n                                            <th class=\"p-2 border\">Cam Kết Thời Gian (SLA)</th>\n                                        </tr>\n                                    </thead>\n                                    <tbody class=\"divide-y divide-slate-200 dark:divide-slate-700\">\n                                        <tr>\n                                            <td class=\"p-2 font-mono font-bold border text-blue-600\">SOP-SALES-01</td>\n                                            <td class=\"p-2 border\">Tiếp cận, khảo sát và phân hạng Salon (Diamond/Gold/Silver)</td>\n                                            <td class=\"p-2 border\">Khối Kinh Doanh B2B</td>\n                                            <td class=\"p-2 border\">Trong 48 giờ sau khi có Lead</td>\n                                        </tr>\n                                        <tr>\n                                            <td class=\"p-2 font-mono font-bold border text-blue-600\">SOP-SALES-02</td>\n                                            <td class=\"p-2 border\">Tổ chức buổi Demo kỹ thuật trực tiếp trên mẫu tóc thật tại Salon</td>\n                                            <td class=\"p-2 border\">KTV Demo & Sales</td>\n                                            <td class=\"p-2 border\">90 – 150 phút/ca demo</td>\n                                        </tr>\n                                        <tr>\n                                            <td class=\"p-2 font-mono font-bold border text-blue-600\">SOP-SALES-03</td>\n                                            <td class=\"p-2 border\">Đàm phán hợp đồng, hạn mức công nợ & tặng gói máy uốn/biển hiệu</td>\n                                            <td class=\"p-2 border\">Trưởng Phòng Kinh Doanh</td>\n                                            <td class=\"p-2 border\">Phê duyệt trong 24 giờ</td>\n                                        </tr>\n                                        <tr>\n                                            <td class=\"p-2 font-mono font-bold border text-blue-600\">SOP-SALES-04</td>\n                                            <td class=\"p-2 border\">Chăm sóc sau bán, hỗ trợ kỹ thuật định kỳ & upsell Hairmate</td>\n                                            <td class=\"p-2 border\">Khối Sales & Tech</td>\n                                            <td class=\"p-2 border\">Định kỳ 14 ngày/lần</td>\n                                        </tr>\n                                        <tr>\n                                            <td class=\"p-2 font-mono font-bold border text-emerald-600\">SOP-TECH-01</td>\n                                            <td class=\"p-2 border\">Tổ chức khóa chuyển giao công nghệ PLEXIS/DEMI tại Viện VACP</td>\n                                            <td class=\"p-2 border\">VACP Academy</td>\n                                            <td class=\"p-2 border\">Khóa học 3 ngày chuyên sâu</td>\n                                        </tr>\n                                        <tr>\n                                            <td class=\"p-2 font-mono font-bold border text-emerald-600\">SOP-TECH-02</td>\n                                            <td class=\"p-2 border\">Tổ chức Seminar / Workshop lưu động tỉnh thành kết hợp Master</td>\n                                            <td class=\"p-2 border\">Ban Kỹ Thuật & MKT</td>\n                                            <td class=\"p-2 border\">Chu kỳ 45 ngày/sự kiện</td>\n                                        </tr>\n                                        <tr>\n                                            <td class=\"p-2 font-mono font-bold border text-emerald-600\">SOP-TECH-03</td>\n                                            <td class=\"p-2 border\">Hỗ trợ & xử lý khủng hoảng sự cố kỹ thuật tại salon khách hàng</td>\n                                            <td class=\"p-2 border\">Đội Phản Ứng Nhanh Tech</td>\n                                            <td class=\"p-2 border font-bold text-rose-600\">Có mặt trong vòng 2 giờ</td>\n                                        </tr>\n                                        <tr>\n                                            <td class=\"p-2 font-mono font-bold border text-purple-600\">SOP-MKT-01</td>\n                                            <td class=\"p-2 border\">Booking KOL Hair Stylist, sản xuất video clip kỹ thuật 4K</td>\n                                            <td class=\"p-2 border\">Khối Marketing</td>\n                                            <td class=\"p-2 border\">Tối thiểu 4 video/tháng</td>\n                                        </tr>\n                                        <tr>\n                                            <td class=\"p-2 font-mono font-bold border text-purple-600\">SOP-MKT-02</td>\n                                            <td class=\"p-2 border\">Thiết kế, sản xuất và thi công POSM bảng hiệu nhận diện VIP</td>\n                                            <td class=\"p-2 border\">Brand Manager</td>\n                                            <td class=\"p-2 border\">Hoàn thiện trong 7 ngày</td>\n                                        </tr>\n                                        <tr>\n                                            <td class=\"p-2 font-mono font-bold border text-purple-600\">SOP-MKT-03</td>\n                                            <td class=\"p-2 border\">Tổ chức Sự kiện thường niên Hair Show tri ân 300+ Salon</td>\n                                            <td class=\"p-2 border\">Toàn Tập Đoàn</td>\n                                            <td class=\"p-2 border\">Timeline 90 ngày chuẩn bị</td>\n                                        </tr>\n                                        <tr>\n                                            <td class=\"p-2 font-mono font-bold border text-amber-600\">SOP-LOG-01</td>\n                                            <td class=\"p-2 border\">Tiếp nhận hàng nhập khẩu, kiểm định CO/CQ, dán tem phụ BYT</td>\n                                            <td class=\"p-2 border\">Khối XNK & Kho</td>\n                                            <td class=\"p-2 border\">Nhập ERP trong 24 giờ</td>\n                                        </tr>\n                                        <tr>\n                                            <td class=\"p-2 font-mono font-bold border text-amber-600\">SOP-LOG-02</td>\n                                            <td class=\"p-2 border\">Bảo quản thuốc uốn nhuộm trong kho lạnh nhiệt độ < 28°C</td>\n                                            <td class=\"p-2 border\">Thủ Kho Chuyên Trách</td>\n                                            <td class=\"p-2 border\">Ghi chép nhiệt kế 2 lần/ngày</td>\n                                        </tr>\n                                        <tr>\n                                            <td class=\"p-2 font-mono font-bold border text-amber-600\">SOP-LOG-03</td>\n                                            <td class=\"p-2 border\">Đóng gói chống sốc/rò rỉ và giao vận B2B hỏa tốc</td>\n                                            <td class=\"p-2 border\">Bộ Phận Giao Vận</td>\n                                            <td class=\"p-2 border\">Giao trong 2h nội thành, 24h tỉnh</td>\n                                        </tr>\n                                        <tr>\n                                            <td class=\"p-2 font-mono font-bold border text-indigo-600\">SOP-FIN-01</td>\n                                            <td class=\"p-2 border\">Thẩm định và phê duyệt hạn mức công nợ gối đầu salon (15-30 ngày)</td>\n                                            <td class=\"p-2 border\">Kế Toán Công Nợ</td>\n                                            <td class=\"p-2 border\">Hoàn tất thẩm định trong 12 giờ</td>\n                                        </tr>\n                                        <tr>\n                                            <td class=\"p-2 font-mono font-bold border text-indigo-600\">SOP-FIN-02</td>\n                                            <td class=\"p-2 border\">Theo dõi, đối soát và đôn đốc thu hồi dòng tiền bán lẻ</td>\n                                            <td class=\"p-2 border\">Kế Toán Thu Nợ</td>\n                                            <td class=\"p-2 border\">Đối soát hàng tuần</td>\n                                        </tr>\n                                        <tr>\n                                            <td class=\"p-2 font-mono font-bold border text-indigo-600\">SOP-FIN-03</td>\n                                            <td class=\"p-2 border\">Tính thưởng hoa hồng kinh doanh lương 3P cho Sales & Giảng viên</td>\n                                            <td class=\"p-2 border\">Kế Toán Trưởng & HR</td>\n                                            <td class=\"p-2 border\">Chi trả đúng ngày mùng 5 hàng tháng</td>\n                                        </tr>\n                                    </tbody>\n                                </table>\n                            </div>\n                        </div>\n                    </div>\n                    "}, {"tab": "checklist", "name": "3. Quy Trình Xử Lý Khủng Hoảng Kỹ Thuật Trong Vòng 2H (SOP-TECH-03)", "content": "\n                    <div class=\"space-y-3 text-xs text-slate-700 dark:text-slate-300 leading-relaxed\">\n                        <div class=\"p-4 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800\">\n                            <h5 class=\"font-bold text-sm text-slate-900 dark:text-white mb-2\">🚨 Kế Hoạch Ứng Phó Khủng Hoảng Kỹ Thuật Tại Salon Đối Tác:</h5>\n                            <div class=\"space-y-2\">\n                                <div class=\"p-2.5 bg-slate-50 dark:bg-slate-800 rounded border-l-4 border-rose-600\">\n                                    <strong>1. Tiếp Nhận Thông Tin Tức Thì:</strong> Khi salon gọi điện phản ánh tóc khách hàng uốn không xoăn hoặc bị khô, chuyên viên trực hotline kỹ thuật ghi nhận đầy đủ công thức pha thuốc, thời gian kích nhiệt và hình ảnh chụp chất tóc.\n                                </div>\n                                <div class=\"p-2.5 bg-slate-50 dark:bg-slate-800 rounded border-l-4 border-rose-600\">\n                                    <strong>2. Biệt Đội Phản Ứng Nhanh Có Mặt Trong 2 Giờ:</strong> Giảng viên Kỹ thuật trực tiếp mang bộ phục hồi chuyên sâu đến salon, trấn an tâm lý chủ salon và khách hàng.\n                                </div>\n                                <div class=\"p-2.5 bg-slate-50 dark:bg-slate-800 rounded border-l-4 border-emerald-600\">\n                                    <strong>3. Trực Tiếp Xử Lý Cứu Ca Tóc Tại Chỗ:</strong> Thực hiện liệu trình nạp Protein booster phục hồi cấu trúc tóc miễn phí 100%, tạo kiểu lại sóng tóc hoàn hảo cho khách.\n                                </div>\n                                <div class=\"p-2.5 bg-slate-50 dark:bg-slate-800 rounded border-l-4 border-blue-600\">\n                                    <strong>4. Họp Rút Kinh Nghiệm Kỹ Thuật Nội Bộ:</strong> Phân tích nguyên nhân (do thợ tiệm canh sai thời gian hay nhầm nấc pH), tổ chức đào tạo lại tay nghề cho thợ của salon đó để không bao giờ tái diễn.\n                                </div>\n                            </div>\n                        </div>\n                    </div>\n                    "}, {"tab": "quiz", "name": "4. Bài Kiểm Tra Quy Trình SOP M6", "content": "\n                    <div class=\"p-5 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 space-y-4\">\n                        <div class=\"font-bold text-sm text-slate-900 dark:text-white\">\n                            ❓ Tình Huống Vận Hành: Kho tổng nhận một lô hàng thuốc uốn PLEXIS nhập khẩu từ Seoul nhưng nhiệt độ trong xe container vận chuyển lên tới 35°C (vượt ngưỡng tiêu chuẩn kho mát < 28°C của SOP-LOG-02). Thủ kho bắt buộc phải xử lý thế nào?\n                        </div>\n                        <div class=\"space-y-2 text-xs text-slate-700 dark:text-slate-300\">\n                            <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer\">\n                                <input type=\"radio\" name=\"vacp_q6\" value=\"a\" class=\"mr-2\"> A. Cứ cho nhập kho bình thường vì bên ngoài vỏ hộp vẫn nguyên vẹn.\n                            </label>\n                            <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer\">\n                                <input type=\"radio\" name=\"vacp_q6\" value=\"b\" class=\"mr-2\"> B. Lập biên bản tình trạng nhiệt độ với đơn vị giao vận, tạm thời cách ly lô hàng vào khu vực chờ kiểm định; lấy mẫu ngẫu nhiên chuyển cho Ban Kỹ Thuật (Tech) test hóa sinh xem hoạt chất Cysteamine có bị biến tính hoặc suy giảm nồng độ pH không trước khi phê duyệt nhập kho ERP.\n                            </label>\n                            <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer\">\n                                <input type=\"radio\" name=\"vacp_q6\" value=\"c\" class=\"mr-2\"> C. Đem xịt quạt gió cho nguội rồi xuất bán ngay cho các salon.\n                            </label>\n                        </div>\n                        <div class=\"p-3 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 rounded-lg text-xs text-emerald-800 dark:text-emerald-300 hidden\" id=\"vacp_q6_ans\">\n                            <strong>Đáp án chuẩn xác: B!</strong> Hoạt chất Cysteamine và các enzyme hữu cơ rất nhạy cảm với nhiệt độ cao. Tuân thủ nghiêm ngặt tiêu chuẩn bảo quản kho mát là lời cam kết đanh thép về chất lượng sản phẩm chuẩn quốc tế của VACP Group.\n                        </div>\n                        <button onclick=\"document.getElementById('vacp_q6_ans').classList.toggle('hidden')\" class=\"px-4 py-1.5 bg-amber-600 hover:bg-amber-700 text-white rounded text-xs font-semibold\">Xem Phân Tích Vận Hành</button>\n                    </div>\n                    "}]}]};

        let currentTrack = 'dtd'; // 'dtd' or 'vacp'
        let currentModuleIndex = 0;
        let currentTab = 'theory';

        const htmlEl = document.documentElement;
        const themeBtn = document.getElementById('theme-toggle');

        // Dark/Light Theme
        function setTheme(dark) {
            if (dark) {
                htmlEl.classList.add('dark');
                localStorage.setItem('masterclass_theme', 'dark');
            } else {
                htmlEl.classList.remove('dark');
                localStorage.setItem('masterclass_theme', 'light');
            }
        }
        const savedTheme = localStorage.getItem('masterclass_theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            setTheme(true);
        } else {
            setTheme(false);
        }
        themeBtn.addEventListener('click', () => setTheme(!htmlEl.classList.contains('dark')));

        // Track Switching
        const btnDtd = document.getElementById('btn-track-dtd');
        const btnVacp = document.getElementById('btn-track-vacp');
        const companyLogo = document.getElementById('company-logo');
        const brandTitle = document.getElementById('portal-brand-title');
        const brandDesc = document.getElementById('portal-brand-desc');
        const sidebarLabel = document.getElementById('sidebar-track-label');

        function switchTrack(track) {
            currentTrack = track;
            currentModuleIndex = 0;
            currentTab = 'theory';

            if (track === 'dtd') {
                btnDtd.className = 'px-3 sm:px-4 py-1.5 rounded-lg text-xs font-bold transition-all shadow-sm flex items-center gap-1.5 bg-white dark:bg-slate-700 text-amber-700 dark:text-amber-300';
                btnVacp.className = 'px-3 sm:px-4 py-1.5 rounded-lg text-xs font-bold transition-all text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white flex items-center gap-1.5';
                companyLogo.innerText = '🏛️';
                companyLogo.className = 'w-9 h-9 rounded-xl flex items-center justify-center text-white font-black text-lg shadow-md bg-amber-600';
                brandTitle.innerHTML = 'DTD HOLDING <span class="text-[10px] px-2 py-0.5 rounded-full font-bold uppercase tracking-wider bg-amber-100 text-amber-900 dark:bg-amber-950/60 dark:text-amber-300">HỌC VIỆN B2B</span>';
                brandDesc.innerText = 'Giáo trình đào tạo độc lập dành cho nhân sự DTD Holding';
                sidebarLabel.innerText = 'CHUYÊN ĐỀ DTD HOLDING';
            } else {
                btnVacp.className = 'px-3 sm:px-4 py-1.5 rounded-lg text-xs font-bold transition-all shadow-sm flex items-center gap-1.5 bg-white dark:bg-slate-700 text-blue-700 dark:text-blue-300';
                btnDtd.className = 'px-3 sm:px-4 py-1.5 rounded-lg text-xs font-bold transition-all text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white flex items-center gap-1.5';
                companyLogo.innerText = '👑';
                companyLogo.className = 'w-9 h-9 rounded-xl flex items-center justify-center text-white font-black text-lg shadow-md bg-blue-600';
                brandTitle.innerHTML = 'VACP GROUP <span class="text-[10px] px-2 py-0.5 rounded-full font-bold uppercase tracking-wider bg-blue-100 text-blue-900 dark:bg-blue-950/60 dark:text-blue-300">HỌC VIỆN SALON VIP</span>';
                brandDesc.innerText = 'Giáo trình đào tạo độc lập dành cho nhân sự VACP Group';
                sidebarLabel.innerText = 'CHUYÊN ĐỀ VACP GROUP';
            }

            renderSidebar();
            renderModule();
        }

        btnDtd.addEventListener('click', () => switchTrack('dtd'));
        btnVacp.addEventListener('click', () => switchTrack('vacp'));

        function getCurrentData() {
            return currentTrack === 'dtd' ? dtdData : vacpData;
        }

        // Render Sidebar
        const moduleListContainer = document.getElementById('module-list');
        function renderSidebar() {
            const data = getCurrentData();
            moduleListContainer.innerHTML = '';

            data.modules.forEach((mod, idx) => {
                const isCurrent = idx === currentModuleIndex;
                const a = document.createElement('a');
                a.href = '#';
                a.className = `block p-3 rounded-xl transition-all ${
                    isCurrent 
                    ? (currentTrack === 'dtd' 
                        ? 'bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800 text-amber-900 dark:text-amber-200 shadow-sm' 
                        : 'bg-blue-50 dark:bg-blue-950/40 border border-blue-200 dark:border-blue-800 text-blue-900 dark:text-blue-200 shadow-sm')
                    : 'hover:bg-slate-100 dark:hover:bg-slate-800/60 text-slate-700 dark:text-slate-300'
                }`;

                a.innerHTML = `
                    <div class="flex items-center justify-between mb-1">
                        <span class="text-[10px] font-black ${isCurrent ? (currentTrack === 'dtd' ? 'text-amber-600' : 'text-blue-600') : 'text-slate-400'}">MÔ-ĐUN ${idx + 1}</span>
                        <span class="text-xs font-mono text-slate-400">${mod.duration}</span>
                    </div>
                    <div class="font-bold text-xs line-clamp-2 leading-snug">${mod.title}</div>
                `;

                a.addEventListener('click', (e) => {
                    e.preventDefault();
                    currentModuleIndex = idx;
                    currentTab = 'theory';
                    renderSidebar();
                    renderModule();
                    if (window.innerWidth < 1024) {
                        document.getElementById('sidebar').classList.add('-translate-x-full');
                    }
                });

                moduleListContainer.appendChild(a);
            });
        }

        // Render Module Content
        function renderModule() {
            const data = getCurrentData();
            const mod = data.modules[currentModuleIndex];
            if (!mod) return;

            const badgeColor = currentTrack === 'dtd' ? 'bg-amber-100 text-amber-900 dark:bg-amber-950/70 dark:text-amber-300' : 'bg-blue-100 text-blue-900 dark:bg-blue-950/70 dark:text-blue-300';
            const nextBtnColor = currentTrack === 'dtd' ? 'bg-amber-600 hover:bg-amber-700' : 'bg-blue-600 hover:bg-blue-700';

            const badge = document.getElementById('module-badge');
            badge.className = `px-3 py-1 text-xs font-black rounded-full uppercase tracking-wider ${badgeColor}`;
            badge.innerText = `${data.company} · MÔ-ĐUN ${currentModuleIndex + 1}`;

            document.getElementById('module-duration').innerText = '⏱️ ' + mod.duration;
            document.getElementById('module-title').innerText = mod.title;
            document.getElementById('module-subtitle').innerText = mod.subtitle;
            document.getElementById('module-counter').innerText = `Chuyên đề ${currentModuleIndex + 1} / ${data.modules.length}`;

            const nextBtn = document.getElementById('btn-next-mod');
            nextBtn.className = `px-4 py-2 rounded-xl text-white text-xs sm:text-sm font-bold transition-colors shadow-sm ${nextBtnColor}`;

            // Update Tab Headers
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if (btn.dataset.tab === currentTab) {
                    const activeBorder = currentTrack === 'dtd' ? 'border-amber-600 text-amber-600 dark:text-amber-400' : 'border-blue-600 text-blue-600 dark:text-blue-400';
                    btn.className = `tab-btn px-4 py-2.5 text-xs sm:text-sm font-bold border-b-2 -mb-[1px] ${activeBorder}`;
                } else {
                    btn.className = 'tab-btn px-4 py-2.5 text-xs sm:text-sm font-bold border-b-2 -mb-[1px] border-transparent text-slate-500 hover:text-slate-700 dark:hover:text-slate-300';
                }
            });

            // Render Tab Pane Content
            const lesson = mod.lessons.find(l => l.tab === currentTab) || mod.lessons[0];
            document.getElementById('tab-pane').innerHTML = lesson.content;

            // Update Next/Prev state
            document.getElementById('btn-prev-mod').disabled = (currentModuleIndex === 0);
            document.getElementById('btn-prev-mod').classList.toggle('opacity-40', currentModuleIndex === 0);
            document.getElementById('btn-next-mod').disabled = (currentModuleIndex === data.modules.length - 1);
            document.getElementById('btn-next-mod').classList.toggle('opacity-40', currentModuleIndex === data.modules.length - 1);
        }

        // Tab click listeners
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentTab = btn.dataset.tab;
                renderModule();
            });
        });

        // Prev / Next Listeners
        document.getElementById('btn-prev-mod').addEventListener('click', () => {
            if (currentModuleIndex > 0) {
                currentModuleIndex--;
                currentTab = 'theory';
                renderSidebar();
                renderModule();
            }
        });

        document.getElementById('btn-next-mod').addEventListener('click', () => {
            const data = getCurrentData();
            if (currentModuleIndex < data.modules.length - 1) {
                currentModuleIndex++;
                currentTab = 'theory';
                renderSidebar();
                renderModule();
            }
        });

        // Mobile sidebar
        document.getElementById('toggle-sidebar').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
        });

        // Module search
        document.getElementById('module-search').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase();
            const data = getCurrentData();
            document.querySelectorAll('#module-list > a').forEach((el, idx) => {
                const mod = data.modules[idx];
                const match = mod.title.toLowerCase().includes(q) || mod.subtitle.toLowerCase().includes(q);
                el.style.display = match ? 'block' : 'none';
            });
        });

        // Init
        switchTrack('dtd');
    </script>
</body>
</html>
