 Hành (CEO)</td>\n                                    <td class=\"p-2.5 border\">Level 6</td>\n                                    <td class=\"p-2.5 border font-bold text-blue-600\">60.000.000 VNĐ</td>\n                                    <td class=\"p-2.5 border\">Lãnh đạo toàn diện, phê duyệt P&L, ký kết hợp đồng độc quyền với hãng nước ngoài.</td>\n                                </tr>\n                                <tr>\n                                    <td class=\"p-2.5 font-bold border\">Giám Đốc Kinh Doanh Toàn Quốc (CSO)</td>\n                                    <td class=\"p-2.5 border\">Level 5</td>\n                                    <td class=\"p-2.5 border font-bold text-amber-600\">30.000.000 VNĐ + DS</td>\n                                    <td class=\"p-2.5 border\">Chỉ huy 6 vùng kinh doanh, chịu trách nhiệm tổng doanh số và kiểm soát công nợ.</td>\n                                </tr>\n                                <tr>\n                                    <td class=\"p-2.5 font-bold border\">Trưởng Phòng Marketing (CMO/Lead)</td>\n                                    <td class=\"p-2.5 border\">Level 4</td>\n                                    <td class=\"p-2.5 border font-bold\">30.000.000 VNĐ</td>\n                                    <td class=\"p-2.5 border\">Xây dựng thương hiệu 3 nhãn hàng, sản xuất nội dung media 4K, tổ chức Hair Show.</td>\n                                </tr>\n                                <tr>\n                                    <td class=\"p-2.5 font-bold border\">Master Trainer R&D (Võ Thuận / Định Xoăn)</td>\n                                    <td class=\"p-2.5 border\">Level 4</td>\n                                    <td class=\"p-2.5 border font-bold text-purple-600\">15.000.000 - 17.000.000 VNĐ</td>\n                                    <td class=\"p-2.5 border\">Chủ trì giảng dạy Masterclass, xử lý các sự cố kỹ thuật cứu tóc cho Salon VIP.</td>\n                                </tr>\n                                <tr>\n                                    <td class=\"p-2.5 font-bold border\">Thủ Kho Tổng (Hà Nội & TP.HCM)</td>\n                                    <td class=\"p-2.5 border\">Level 3</td>\n                                    <td class=\"p-2.5 border font-bold\">15.000.000 - 17.000.000 VNĐ</td>\n                                    <td class=\"p-2.5 border\">Duy trì kho mát &lt; 28°C, tỷ lệ hao hụt &lt; 0.05%, đảm bảo giao hàng hỏa tốc 24h.</td>\n                                </tr>\n                            </tbody>\n                        </table>\n                    </div>\n                    "}, {"tab": "checklist", "name": "3. Chính Sách Thưởng ESOP 4 Năm & Chống Cạnh Tranh", "content": "\n                    <div class=\"space-y-3 text-xs text-slate-700 dark:text-slate-300\">\n                        <div class=\"p-3 bg-white dark:bg-slate-800 rounded border\">\n                            <strong>Lịch Trình Mở Khóa ESOP:</strong> Năm 1 mở 25% -> Năm 2 mở 25% -> Năm 3 mở 25% -> Năm 4 mở 25% chính thức sở hữu cổ phần biểu quyết.\n                        </div>\n                        <div class=\"p-3 bg-white dark:bg-slate-800 rounded border\">\n                            <strong>Điều Khoản Không Cạnh Tranh (Non-Compete):</strong> Nhân sự cấp Trưởng phòng và Master Educator cam kết không được mở doanh nghiệp phân phối hoặc làm việc cho đối thủ trong ngành mỹ phẩm tóc trong vòng <strong>24 tháng</strong> kể từ ngày thôi việc. Vi phạm sẽ bị thu hồi 100% cổ phần ESOP và bồi hoàn chi phí đào tạo.\n                        </div>\n                    </div>\n                    "}, {"tab": "quiz", "name": "4. Trắc Nghiệm Cơ Cấu VACP", "content": "\n                    <div class=\"p-4 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700\">\n                        <div class=\"font-bold text-sm text-slate-900 dark:text-white mb-2\">Câu hỏi: Yêu cầu kỹ thuật bắt buộc đối với kho bảo quản thuốc uốn nhuộm cao cấp của VACP Group tại 2 đầu cầu Hà Nội và TP.HCM là gì?</div>\n                        <div class=\"space-y-2 mt-3 text-xs text-slate-700 dark:text-slate-300\">\n                            <label class=\"block p-2.5 rounded border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 cursor-pointer\">\n                                <input type=\"radio\" name=\"vacp_q2\" value=\"a\" class=\"mr-2\"> A. Để ngoài trời dưới mái tôn cho thông thoáng.\n                            </label>\n                            <label class=\"block p-2.5 rounded border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 cursor-pointer\">\n                                <input type=\"radio\" name=\"vacp_q2\" value=\"b\" class=\"mr-2\"> B. Kho mát duy trì nhiệt độ liên tục dưới 28°C có máy hút ẩm và điều hòa trung tâm 24/7 để chống biến tính hoạt chất Cysteamine và oxy hóa kem nhuộm.\n                            </label>\n                            <label class=\"block p-2.5 rounded border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 cursor-pointer\">\n                                <input type=\"radio\" name=\"vacp_q2\" value=\"c\" class=\"mr-2\"> C. Chỉ cần bật quạt máy vào ban ngày.\n                            </label>\n                        </div>\n                        <div class=\"mt-3 p-3 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 rounded text-xs text-emerald-800 dark:text-emerald-300 hidden\" id=\"vacp_q2_ans\">\n                            <strong>Đáp án đúng: B!</strong> Hoạt chất Cysteamine trong thuốc uốn PLEXIS cực kỳ nhạy cảm với nhiệt độ. Nếu để nhiệt độ &gt; 32°C trong kho tôn kín, thuốc sẽ bị biến tính ngả vàng và mất khả năng định hình sóng uốn.\n                        </div>\n                        <button onclick=\"document.getElementById('vacp_q2_ans').classList.toggle('hidden')\" class=\"mt-3 px-3 py-1 bg-blue-600 hover:bg-blue-700 text-white rounded text-xs font-semibold\">Xem Giải Thích</button>\n                    </div>\n                    "}]}, {"id": "vacp_m3", "title": "Module 3: Khoa Học Sản Phẩm Chiến Lược: PLEXIS Seoul, DEMI Japan & HAIR MATE Ba Lan", "subtitle": "Giải mã bộ tứ công nghệ uốn Cysteamine, quy trình 7 bước cứu tóc nát, phục hồi màng CMC và trị liệu da đầu", "duration": "35 phút học", "lessons": [{"tab": "theory", "name": "1. Khoa Học Sợi Tóc & Bộ Tứ Công Nghệ PLEXIS Seoul", "content": "\n                    <div class=\"space-y-4 text-xs text-slate-700 dark:text-slate-300 leading-relaxed\">\n                        <div class=\"p-4 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700\">\n                            <h5 class=\"font-bold text-sm text-blue-900 dark:text-blue-300 mb-2\">🧪 Bản Chất Hóa Học Của Sợi Tóc Khi Uốn:</h5>\n                            <p class=\"mb-2\">Sợi tóc được cấu tạo chủ yếu bởi <strong>Keratin (85-90%)</strong> liên kết với nhau bằng 3 loại cầu nối: Liên kết Hydro (dễ đứt bởi nước), Liên kết Muối (dễ đứt bởi pH) và <strong>Liên kết Lưu Huỳnh (Disulfide bond - S-S)</strong>. Uốn tóc là quá trình cắt đứt liên kết S-S bằng chất khử, uốn định hình theo trục lô, sau đó hàn gắn lại liên kết S-S bằng chất oxy hóa (dập số 2).</p>\n                            <p class=\"mb-2\">Thuốc uốn truyền thống sử dụng <em>Thioglycolic Acid</em> với độ kiềm cao (pH 9.5-10.5) làm biểu bì tóc bung toạc dữ dội, khiến chất đệm trong tủy tóc trôi ra ngoài, làm tóc bị khô xơ và gãy rụng sau vài tuần.</p>\n                        </div>\n\n                        <div class=\"p-4 bg-indigo-50/60 dark:bg-slate-800 rounded-xl border border-indigo-200 dark:border-slate-700\">\n                            <h5 class=\"font-bold text-sm text-indigo-900 dark:text-indigo-300 mb-2\">⭐ Bộ Tứ Đột Phá Của Hệ Thống PLEXIS K-Beauty:</h5>\n                            <div class=\"grid sm:grid-cols-2 gap-3\">\n                                <div class=\"p-3 bg-white dark:bg-slate-700 rounded-lg\">\n                                    <strong>1. Hoạt Chất Cắt Khử Cysteamine HCl:</strong>\n                                    <p class=\"mt-1\">Kích thước phân tử siêu nhỏ chỉ bằng 1/3 Thioglycolate, len lỏi tự nhiên vào lõi tóc cắt chọn lọc liên kết S-S mà không cần mở bung vảy biểu bì, loại bỏ hoàn toàn mùi hăng nồng nặc.</p>\n                                </div>\n                                <div class=\"p-3 bg-white dark:bg-slate-700 rounded-lg\">\n                                    <strong>2. Kiểm Soát pH Đa Tầng (Multi-pH System):</strong>\n                                    <p class=\"mt-1\">Cung cấp 3 mức pH chuyên biệt: pH 4.5 (Uốn Axit cho tóc nát tẩy nhiều lần), pH 7.0 (Uốn Trung tính cho tóc yếu), pH 9.0 (Uốn Kiềm nhẹ cho tóc khỏe nguyên bản).</p>\n                                </div>\n                                <div class=\"p-3 bg-white dark:bg-slate-700 rounded-lg\">\n                                    <strong>3. Phức Hợp Silk Protein PPT Đệm Lõi:</strong>\n                                    <p class=\"mt-1\">Bổ sung chuỗi peptide tơ tằm thủy phân hàn gắn khoảng rỗng trong tủy tóc ngay trong lúc mềm hóa, giúp sợi tóc ngậm nước và đàn hồi.</p>\n                                </div>\n                                <div class=\"p-3 bg-white dark:bg-slate-700 rounded-lg\">\n                                    <strong>4. Màng Chống Cháy Nhiệt Anti-Heat Shield:</strong>\n                                    <p class=\"mt-1\">Bảo vệ sợi tóc không bị chín protein (caramel hóa) khi chạy máy kích nhiệt ở 40 - 60 độ C.</p>\n                                </div>\n                            </div>\n                        </div>\n                    </div>\n                    "}, {"tab": "data", "name": "2. Bảng Tra Thông Số Kỹ Thuật Uốn PLEXIS 7 Bước", "content": "\n                    <div class=\"overflow-x-auto text-xs\">\n                        <table class=\"w-full text-left border-collapse\">\n                            <thead class=\"bg-slate-100 dark:bg-slate-800 uppercase font-bold\">\n                                <tr>\n                                    <th class=\"p-2.5 border\">Tình Trạng Sợi Tóc</th>\n                                    <th class=\"p-2.5 border\">Mức Độ Hư Tổn</th>\n                                    <th class=\"p-2.5 border\">Mã Thuốc Uốn & Độ pH</th>\n                                    <th class=\"p-2.5 border\">Thời Gian Mềm Hóa</th>\n                                    <th class=\"p-2.5 border\">Nhiệt Độ & Thời Gian Kích Máy</th>\n                                </tr>\n                            </thead>\n                            <tbody class=\"divide-y text-slate-600 dark:text-slate-300\">\n                                <tr>\n                                    <td class=\"p-2.5 font-bold border\">Tóc Nguyên Bản Khỏe</td>\n                                    <td class=\"p-2.5 border\">Cấp 1 - 2 (Chưa hóa chất)</td>\n                                    <td class=\"p-2.5 border font-bold text-blue-600\">Plexis Strong (pH 9.0)</td>\n                                    <td class=\"p-2.5 border\">15 - 20 phút (Kiểm tra giãn 80%)</td>\n                                    <td class=\"p-2.5 border\">55°C (10 phút) -> Nghỉ 5p -> 60°C (8 phút)</td>\n                                </tr>\n                                <tr>\n                                    <td class=\"p-2.5 font-bold border\">Tóc Đã Nhuộm / Uốn Cũ</td>\n                                    <td class=\"p-2.5 border\">Cấp 3 - 4 (Trung bình yếu)</td>\n                                    <td class=\"p-2.5 border font-bold text-amber-600\">Plexis Neutral (pH 7.0)</td>\n                                    <td class=\"p-2.5 border\">10 - 15 phút (Kiểm tra giãn 60%)</td>\n                                    <td class=\"p-2.5 border\">45°C (8 phút) -> Nghỉ 5p -> 50°C (6 phút)</td>\n                                </tr>\n                                <tr>\n                                    <td class=\"p-2.5 font-bold border text-red-600\">Tóc Đã Tẩy 2-3 Lần / Nát Nhũn</td>\n                                    <td class=\"p-2.5 border\">Cấp 5 - 6 (Hư tổn nặng)</td>\n                                    <td class=\"p-2.5 border font-bold text-red-600\">Plexis Acid Wave (pH 4.5)</td>\n                                    <td class=\"p-2.5 border\">8 - 12 phút (Khóa đệm PPT trước)</td>\n                                    <td class=\"p-2.5 border\">40°C (6 phút) -> Nghỉ 5p -> 40°C (5 phút)</td>\n                                </tr>\n                            </tbody>\n                        </table>\n                    </div>\n                    "}, {"tab": "checklist", "name": "3. 7 Bước Quy Trình Uốn Phục Hồi Chuẩn Seoul", "content": "\n                    <div class=\"space-y-2 text-xs text-slate-700 dark:text-slate-300\">\n                        <div class=\"p-2.5 bg-white dark:bg-slate-800 rounded border\">\n                            <strong>Bước 1 - Khám Tóc:</strong> Kéo dãn sợi tóc ướt chẩn đoán độ đứt gãy. Xác định phân vùng chân (khỏe), thân (trung bình), ngọn (yếu).\n                        </div>\n                        <div class=\"p-2.5 bg-white dark:bg-slate-800 rounded border\">\n                            <strong>Bước 2 - Tiền Xử Lý:</strong> Xịt đệm protein Plexis Pre-PPT lên ngọn tóc yếu để lấp đầy khoảng rỗng xốp.\n                        </div>\n                        <div class=\"p-2.5 bg-white dark:bg-slate-800 rounded border\">\n                            <strong>Bước 3 - Bôi Thuốc Đa Tầng:</strong> Bôi thuốc kiểm soát pH theo từng phân vùng (pH 9.0 chân -> pH 7.0 thân -> pH 4.5 ngọn).\n                        </div>\n                        <div class=\"p-2.5 bg-white dark:bg-slate-800 rounded border\">\n                            <strong>Bước 4 - Xả Khử Kiềm (Acid Rinse):</strong> Xả sạch thuốc 100% bằng nước ấm, cân bằng độ ẩm.\n                        </div>\n                        <div class=\"p-2.5 bg-white dark:bg-slate-800 rounded border\">\n                            <strong>Bước 5 - Lên Trục & Kích Nhiệt:</strong> Thoa kem chống nhiệt Heat Shield, chạy máy ngắt quãng theo bảng tra.\n                        </div>\n                        <div class=\"p-2.5 bg-white dark:bg-slate-800 rounded border\">\n                            <strong>Bước 6 - Định Hình Dập Số 2:</strong> Để nguội trục 10 phút, tra thuốc dập cố định liên kết S-S trong 10-12 phút.\n                        </div>\n                        <div class=\"p-2.5 bg-white dark:bg-slate-800 rounded border\">\n                            <strong>Bước 7 - Hoàn Thiện:</strong> Xả mặt nạ khóa ẩm, sấy lọn tay tự nhiên chuẩn phong cách Hàn Quốc.\n                        </div>\n                    </div>\n                    "}, {"tab": "quiz", "name": "4. Trắc Nghiệm Kỹ Thuật Uốn Hóa Học", "content": "\n                    <div class=\"p-4 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700\">\n                        <div class=\"font-bold text-sm text-slate-900 dark:text-white mb-2\">Câu hỏi: Hoạt chất Cysteamine HCl trong thuốc uốn PLEXIS có ưu điểm vượt trội gì so với hoạt chất Thioglycolate truyền thống?</div>\n                        <div class=\"space-y-2 mt-3 text-xs text-slate-700 dark:text-slate-300\">\n                            <label class=\"block p-2.5 rounded border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 cursor-pointer\">\n                                <input type=\"radio\" name=\"vacp_q3\" value=\"a\" class=\"mr-2\"> A. Có khả năng cắt đứt 100% liên kết tóc trong 2 phút làm tóc xoăn tít như sợi thép.\n                            </label>\n                            <label class=\"block p-2.5 rounded border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 cursor-pointer\">\n                                <input type=\"radio\" name=\"vacp_q3\" value=\"b\" class=\"mr-2\"> B. Kích thước phân tử siêu nhỏ len lỏi sâu cắt chọn lọc liên kết disulfide ở môi trường pH trung tính hoặc axit, không làm vỡ biểu bì, không mùi hăng nồng và bảo toàn độ bóng mềm của sợi tóc.\n                            </label>\n                            <label class=\"block p-2.5 rounded border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 cursor-pointer\">\n                                <input type=\"radio\" name=\"vacp_q3\" value=\"c\" class=\"mr-2\"> C. Có thể dùng để gội đầu hàng ngày thay dầu gội.\n                            </label>\n                        </div>\n                        <div class=\"mt-3 p-3 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 rounded text-xs text-emerald-800 dark:text-emerald-300 hidden\" id=\"vacp_q3_ans\">\n                            <strong>Đáp án đúng: B!</strong> Cysteamine chính là chìa khóa công nghệ K-Beauty giúp uốn được những mái tóc đã tẩy nhuộm sáng màu mà thuốc kiềm truyền thống hoàn toàn bất lực.\n                        </div>\n                        <button onclick=\"document.getElementById('vacp_q3_ans').classList.toggle('hidden')\" class=\"mt-3 px-3 py-1 bg-blue-600 hover:bg-blue-700 text-white rounded text-xs font-semibold\">Xem Giải Thích</button>\n                    </div>\n                    "}]}, {"id": "vacp_m4", "title": "Module 4: Kế Hoạch Dòng Tiền 53 Tháng & Mô Hình Tài Chính 3 Thương Hiệu VACP", "subtitle": "Dự phóng doanh thu từng tháng T9/2026 - T7/2027 của Plexis, Demi, Hairmate; điểm hòa vốn và cấu trúc P&L", "duration": "30 phút học", "lessons": [{"tab": "theory", "name": "1. Mô Hình Kế Hoạch Dòng Tiền Chi Tiết T9/2026 - T7/2027", "content": "\n                    <div class=\"space-y-4 text-xs text-slate-700 dark:text-slate-300 leading-relaxed\">\n                        <div class=\"p-4 bg-emerald-50/70 dark:bg-slate-800 rounded-xl border border-emerald-200 dark:border-slate-700\">\n                            <h5 class=\"font-bold text-sm text-emerald-950 dark:text-emerald-300 mb-2\">📊 Kế Hoạch Dòng Tiền & Tăng Trưởng Doanh Số 3 Nhãn Hàng</h5>\n                            <p class=\"mb-2\">Theo hồ sơ tài chính quản trị của VACP Group, lộ trình doanh thu được thiết lập theo từng tháng cho 3 thương hiệu chiến lược:</p>\n                            <ul class=\"list-disc pl-4 space-y-1\">\n                                <li><strong>Doanh thu PLEXIS (Hàn Quốc):</strong> Khởi điểm T9 đạt 1.0 tỷ -> T10 đạt 1.2 tỷ -> T11 đạt 2.0 tỷ -> T12 đạt 2.5 tỷ -> Tháng Tết (T1/2027) đạt đỉnh <strong>3.0 tỷ đồng</strong> -> Ổn định ở mức 1.5 tỷ/tháng các tháng tiếp theo.</li>\n                                <li><strong>Doanh thu DEMI (Nhật Bản):</strong> Khởi điểm T10 đạt 800 triệu -> T11 đạt 1.5 tỷ -> T12 đạt 2.0 tỷ -> T1/2027 đạt <strong>3.0 tỷ đồng</strong> -> Duy trì vững chắc 2.0 tỷ/tháng.</li>\n                                <li><strong>Doanh thu HAIR MATE (Ba Lan):</strong> Bắt đầu tung hàng T12 đạt 500 triệu -> T1/2027 đạt 500 triệu -> T2 đạt 800 triệu -> T3 đạt 1.2 tỷ -> T4 đạt 1.8 tỷ -> T5 đạt 2.5 tỷ -> T6 đạt 3.5 tỷ -> Tháng 7/2027 đạt <strong>4.5 tỷ đồng</strong>.</li>\n                                <li><strong>Tổng Doanh Thu Đỉnh Điểm Tháng Tết (T1/2027):</strong> Đạt <strong>6.5 tỷ đồng/tháng</strong>.</li>\n                            </ul>\n                        </div>\n                    </div>\n                    "}, {"tab": "data", "name": "2. Bảng Dự Phóng Dòng Tiền Chi Tiết (Triệu VNĐ)", "content": "\n                    <div class=\"overflow-x-auto text-xs\">\n                        <table class=\"w-full text-left border-collapse\">\n                            <thead class=\"bg-slate-100 dark:bg-slate-800 uppercase font-bold\">\n                                <tr>\n                                    <th class=\"p-2 border\">Chỉ Tiêu Doanh Số (Tr VNĐ)</th>\n                                    <th class=\"p-2 border\">T9/26</th>\n                                    <th class=\"p-2 border\">T10/26</th>\n                                    <th class=\"p-2 border\">T11/26</th>\n                                    <th class=\"p-2 border\">T12/26</th>\n                                    <th class=\"p-2 border text-amber-600\">T1/27 (Tết)</th>\n                                    <th class=\"p-2 border\">T3/27</th>\n                                    <th class=\"p-2 border\">T5/27</th>\n                                    <th class=\"p-2 border text-emerald-600\">T7/27</th>\n                                </tr>\n                            </thead>\n                            <tbody class=\"divide-y text-slate-600 dark:text-slate-300 font-mono\">\n                                <tr>\n                                    <td class=\"p-2 font-bold font-sans border\">1. PLEXIS Korea</td>\n                                    <td class=\"p-2 border\">1,000</td>\n                                    <td class=\"p-2 border\">1,200</td>\n                                    <td class=\"p-2 border\">2,000</td>\n                                    <td class=\"p-2 border\">2,500</td>\n                                    <td class=\"p-2 border font-bold text-amber-600\">3,000</td>\n                                    <td class=\"p-2 border\">1,500</td>\n                                    <td class=\"p-2 border\">1,500</td>\n                                    <td class=\"p-2 border\">1,500</td>\n                                </tr>\n                                <tr>\n                                    <td class=\"p-2 font-bold font-sans border\">2. DEMI Japan</td>\n                                    <td class=\"p-2 border\">0</td>\n                                    <td class=\"p-2 border\">800</td>\n                                    <td class=\"p-2 border\">1,500</td>\n                                    <td class=\"p-2 border\">2,000</td>\n                                    <td class=\"p-2 border font-bold text-amber-600\">3,000</td>\n                                    <td class=\"p-2 border\">2,000</td>\n                                    <td class=\"p-2 border\">2,000</td>\n                                    <td class=\"p-2 border\">2,000</td>\n                                </tr>\n                                <tr>\n                                    <td class=\"p-2 font-bold font-sans border\">3. HAIR MATE Poland</td>\n                                    <td class=\"p-2 border\">0</td>\n                                    <td class=\"p-2 border\">0</td>\n                                    <td class=\"p-2 border\">0</td>\n                                    <td class=\"p-2 border\">500</td>\n                                    <td class=\"p-2 border\">500</td>\n                                    <td class=\"p-2 border\">1,200</td>\n                                    <td class=\"p-2 border\">2,500</td>\n                                    <td class=\"p-2 border font-bold text-emerald-600\">4,500</td>\n                                </tr>\n                                <tr class=\"bg-slate-50 dark:bg-slate-800 font-bold\">\n                                    <td class=\"p-2 font-sans border\">TỔNG DOANH THU THỰC HIỆN</td>\n                                    <td class=\"p-2 border\">1,000</td>\n                                    <td class=\"p-2 border\">2,000</td>\n                                    <td class=\"p-2 border\">3,500</td>\n                                    <td class=\"p-2 border\">5,000</td>\n                                    <td class=\"p-2 border text-amber-600 text-sm\">6,500</td>\n                                    <td class=\"p-2 border\">4,700</td>\n                                    <td class=\"p-2 border\">6,000</td>\n                                    <td class=\"p-2 border text-emerald-600 text-sm\">8,000</td>\n                                </tr>\n                            </tbody>\n                        </table>\n                    </div>\n                    "}, {"tab": "checklist", "name": "3. Kỷ Luật Vốn Lưu Động & Nhập Hàng Ngoại", "content": "\n                    <div class=\"space-y-2 text-xs text-slate-700 dark:text-slate-300\">\n                        <div class=\"p-3 bg-white dark:bg-slate-800 rounded border\">\n                            <strong>1. Ký Hợp Đồng Mua Ngoại Tệ Kỳ Hạn (Forward Contract):</strong> Mọi đơn hàng nhập khẩu từ Hàn Quốc (USD) và Nhật Bản (JPY) phải được chốt tỷ giá kỳ hạn với ngân hàng trước 60 ngày để tránh rủi ro biến động tỷ giá hối đoái.\n                        </div>\n                        <div class=\"p-3 bg-white dark:bg-slate-800 rounded border\">\n                            <strong>2. Quỹ Dự Phòng Thanh Khoản:</strong> Luôn duy trì số dư tiền mặt tối thiểu bằng 2 tháng chi phí hoạt động cố định (khoảng 1.2 tỷ đồng) để bảo đảm trả lương và chi phí kho bãi đúng hạn trong mọi tình huống.\n                        </div>\n                    </div>\n                    "}, {"tab": "quiz", "name": "4. Trắc Nghiệm Quản Trị Dòng Tiền VACP", "content": "\n                    <div class=\"p-4 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700\">\n                        <div class=\"font-bold text-sm text-slate-900 dark:text-white mb-2\">Câu hỏi: Theo kế hoạch dòng tiền VACP Group, tổng doanh thu bán hàng của 3 thương hiệu trong tháng cao điểm nhất trước Tết (Tháng 1/2027) được dự phóng đạt bao nhiêu?</div>\n                        <div class=\"space-y-2 mt-3 text-xs text-slate-700 dark:text-slate-300\">\n                            <label class=\"block p-2.5 rounded border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 cursor-pointer\">\n                                <input type=\"radio\" name=\"vacp_q4\" value=\"a\" class=\"mr-2\"> A. 2.5 tỷ đồng\n                            </label>\n                            <label class=\"block p-2.5 rounded border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 cursor-pointer\">\n                                <input type=\"radio\" name=\"vacp_q4\" value=\"b\" class=\"mr-2\"> B. 6.5 tỷ đồng (PLEXIS 3.0 tỷ + DEMI 3.0 tỷ + HAIR MATE 500 triệu)\n                            </label>\n                            <label class=\"block p-2.5 rounded border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 cursor-pointer\">\n                                <input type=\"radio\" name=\"vacp_q4\" value=\"c\" class=\"mr-2\"> C. 20 tỷ đồng\n                            </label>\n                        </div>\n                        <div class=\"mt-3 p-3 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 rounded text-xs text-emerald-800 dark:text-emerald-300 hidden\" id=\"vacp_q4_ans\">\n                            <strong>Đáp án đúng: B!</strong> Con số 6.5 tỷ đồng được tính toán dựa trên kế hoạch dòng tiền chi tiết của từng nhãn hàng trong file tài chính gốc.\n                        </div>\n                        <button onclick=\"document.getElementById('vacp_q4_ans').classList.toggle('hidden')\" class=\"mt-3 px-3 py-1 bg-blue-600 hover:bg-blue-700 text-white rounded text-xs font-semibold\">Xem Giải Thích</button>\n                    </div>\n                    "}]}, {"id": "vacp_m5", "title": "Module 5: VACP Academy & Go-To-Market (GTM): Hair Show & Ký Kết Salon VIP", "subtitle": "Kịch bản staging Hair Show 300 salon, quy chuẩn tổ chức Masterclass và điều khoản hợp đồng độc quyền bán kính 1km", "duration": "30 phút học", "lessons": [{"tab": "theory", "name": "1. Binh Pháp Tổ Chức Hair Show & Workshop Trải Nghiệm", "content": "\n                    <div class=\"space-y-4 text-xs text-slate-700 dark:text-slate-300 leading-relaxed\">\n                        <div class=\"p-4 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700\">\n                            <h5 class=\"font-bold text-sm text-slate-900 dark:text-white mb-2\">🎭 Sân Khấu Hóa Kỹ Thuật — Kịch Bản Chiếm Trọn Trái Tim Chủ Salon:</h5>\n                            <p class=\"mb-2\">Một sự kiện Hair Show hoặc Masterclass kỹ thuật thành công của VACP Group phải tuân theo nguyên lý <strong>\"Kịch Tính Hóa - Trải Nghiệm Thật - Chốt Đơn Đỉnh Cao\"</strong>:</p>\n                            <ul class=\"list-disc pl-4 space-y-1\">\n                                <li><strong>T-30 Ngày:</strong> Lựa chọn 4 người mẫu có chất tóc đối lập: 1 mẫu tóc nát tẩy 3 lần, 1 mẫu tóc bạc kháng thuốc, 1 mẫu tóc tơ mảnh xơ xôi, 1 mẫu tóc dày sợi thô. Quay video tình trạng tóc ban đầu làm tư liệu đối chứng.</li>\n                                <li><strong>14:00 - 15:30 Ngày Sự Kiện:</strong> Master Trainer trực tiếp pha thuốc PLEXIS và bôi lên người mẫu ngay trước mắt 200-300 chủ salon. Giải thích rõ vì sao chọn pH 4.5 hay pH 7.0.</li>\n                                <li><strong>15:30 - 16:30:</strong> Xả tóc, sấy khô bằng tay không dùng lược sấy tạo kiểu để phô diễn những lọn sóng uốn bóng mượt, đàn hồi nảy sóng như tóc nguyên bản. Cả hội trường sẽ ồ lên kinh ngạc vì tóc tẩy mà vẫn uốn bóng mềm.</li>\n                                <li><strong>16:30 - 17:00 (15 Phút Vàng Chốt Đơn):</strong> Giám đốc Kinh doanh bước lên sân khấu công bố Gói Chuyển Giao Công Nghệ VIP duy nhất trong ngày.</li>\n                            </ul>\n                        </div>\n                    </div>\n                    "}, {"tab": "data", "name": "2. Cấu Trúc Gói Chuyển Giao Công Nghệ (Launch Pack VIP)", "content": "\n                    <div class=\"p-4 bg-amber-50/70 dark:bg-slate-800 rounded-xl border border-amber-200 dark:border-slate-700 text-xs\">\n                        <h5 class=\"font-bold text-sm text-amber-950 dark:text-amber-300 mb-2\">🎁 Gói Chuyển Giao Độc Quyền Salon VIP (Trị giá 35.000.000 VNĐ)</h5>\n                        <ul class=\"space-y-1.5 text-slate-700 dark:text-slate-300\">\n                            <li>• <strong>Sản phẩm:</strong> 3 thùng thuốc uốn đa tầng PLEXIS (Strong, Neutral, Acid Wave) + 1 thùng Kem phục hồi PPT + 1 thùng Dập số 2.</li>\n                            <li>• <strong>Thiết bị tặng kèm:</strong> 01 Máy kích nhiệt tạo sóng kỹ thuật số chuẩn Seoul (Trị giá 12.000.000 VNĐ).</li>\n                            <li>• <strong>Quyền lợi thương hiệu:</strong> 01 Biển đồng chứng nhận \"Seoul Certified Partner Salon\" gắn tại quầy lễ tân.</li>\n                            <li>• <strong>Quyền lợi truyền thông:</strong> Ekip Media 4K của VACP về tận tiệm quay 01 video quảng cáo chuyên nghiệp cho chủ salon đăng TikTok & Facebook kéo khách.</li>\n                        </ul>\n                    </div>\n                    "}, {"tab": "checklist", "name": "3. Điều Khoản Hợp Đồng Salon VIP Bắt Buộc", "content": "\n                    <div class=\"space-y-2 text-xs text-slate-700 dark:text-slate-300\">\n                        <div class=\"p-3 bg-white dark:bg-slate-800 rounded border\">\n                            <strong>Điều khoản 1: Bảo Hộ Độc Quyền Bán Kính 1km:</strong> Công ty cam kết không cấp gói đối tác VIP PLEXIS cho salon thứ 2 trong bán kính 1km đường chim bay.\n                        </div>\n                        <div class=\"p-3 bg-white dark:bg-slate-800 rounded border\">\n                            <strong>Điều khoản 2: Cam Kết Sản Lượng Duy Trì:</strong> Salon VIP cam kết mức tiêu thụ tối thiểu 20.000.000 VNĐ sản phẩm/tháng. Nếu 2 tháng liên tiếp không đạt sản lượng tối thiểu mà không có lý do chính đáng, quyền bảo hộ độc quyền khu vực sẽ tự động hủy bỏ.\n                        </div>\n                    </div>\n                    "}, {"tab": "quiz", "name": "4. Trắc Nghiệm Binh Pháp GTM VACP", "content": "\n                    <div class=\"p-4 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700\">\n                        <div class=\"font-bold text-sm text-slate-900 dark:text-white mb-2\">Câu hỏi: Yếu tố quan trọng nhất giúp chuyển hóa hơn 60% chủ salon tham dự Workshop VACP thành người mua gói Launch Pack là gì?</div>\n                        <div class=\"space-y-2 mt-3 text-xs text-slate-700 dark:text-slate-300\">\n                            <label class=\"block p-2.5 rounded border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 cursor-pointer\">\n                                <input type=\"radio\" name=\"vacp_q5\" value=\"a\" class=\"mr-2\"> A. Cho khách ăn tiệc buffet 5 sao miễn phí.\n                            </label>\n                            <label class=\"block p-2.5 rounded border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 cursor-pointer\">\n                                <input type=\"radio\" name=\"vacp_q5\" value=\"b\" class=\"mr-2\"> B. Trực tiếp chứng kiến kết quả uốn phục hồi thần kỳ trên mái tóc nát hư tổn nặng ngay trên sân khấu thực tế, kèm gói giải pháp hỗ trợ máy móc và kéo khách đến tiệm.\n                            </label>\n                            <label class=\"block p-2.5 rounded border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 cursor-pointer\">\n                                <input type=\"radio\" name=\"vacp_q5\" value=\"c\" class=\"mr-2\"> C. Ép buộc mọi người tham gia phải nộp tiền cọc trước khi vào cửa.\n                            </label>\n                        </div>\n                        <div class=\"mt-3 p-3 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 rounded text-xs text-emerald-800 dark:text-emerald-300 hidden\" id=\"vacp_q5_ans\">\n                            <strong>Đáp án đúng: B!</strong> \"Trăm nghe không bằng một thấy, trăm thấy không bằng tự tay sờ vào mái tóc uốn bóng mềm\". Chứng minh kỹ thuật thực tế là chìa khóa mở ví tiền của các chủ salon khó tính nhất.\n                        </div>\n                        <button onclick=\"document.getElementById('vacp_q5_ans').classList.toggle('hidden')\" class=\"mt-3 px-3 py-1 bg-blue-600 hover:bg-blue-700 text-white rounded text-xs font-semibold\">Xem Giải Thích</button>\n                    </div>\n                    "}]}, {"id": "vacp_m6", "title": "Module 6: Hệ Điều Hành Văn Hóa Culture-OS & 16 Quy Trình SOP ISO 9001:2015", "subtitle": "5 văn hóa Setup vs Growth, chi tiết 16 SOP chuẩn hóa từ R&D đến kiểm toán nội bộ và cơ chế kiểm soát chất lượng", "duration": "35 phút học", "lessons": [{"tab": "theory", "name": "1. Culture-OS: 5 Trụ Cột Văn Hóa Setup vs Growth", "content": "\n                    <div class=\"space-y-4 text-xs text-slate-700 dark:text-slate-300 leading-relaxed\">\n                        <div class=\"p-4 bg-violet-50/70 dark:bg-slate-800 rounded-xl border border-violet-200 dark:border-slate-700\">\n                            <h5 class=\"font-bold text-sm text-violet-950 dark:text-violet-300 mb-2\">💎 Hệ Điều Hành Văn Hóa (Culture-OS) Của VACP Group</h5>\n                            <p>Khi doanh nghiệp chuyển từ giai đoạn thành lập (Setup) sang tăng trưởng bùng nổ (Growth), văn hóa hành xử của đội ngũ nhân sự phải được nâng cấp tương xứng:</p>\n                        </div>\n\n                        <div class=\"space-y-2\">\n                            <div class=\"p-3 bg-white dark:bg-slate-800 rounded border-l-4 border-blue-600 border border-slate-200 dark:border-slate-700\">\n                                <strong>1. Trách Nhiệm 100% (Extreme Ownership):</strong> Xóa bỏ tư duy nạn nhân. Khi có lỗi kỹ thuật hoặc sự cố giao hàng, câu hỏi đầu tiên là: \"Tôi đã làm gì sai trong quy trình và giải pháp sửa chữa ngay bây giờ là gì?\"\n                            </div>\n                            <div class=\"p-3 bg-white dark:bg-slate-800 rounded border-l-4 border-amber-600 border border-slate-200 dark:border-slate-700\">\n                                <strong>2. Kỷ Luật Số Liệu Trung Thực (Data Honesty):</strong> Cấm báo cáo định tính cảm tính. Mọi kết luận đều phải có bằng chứng số liệu đơn hàng, phiếu xuất nhập kho và hóa đơn đối soát.\n                            </div>\n                            <div class=\"p-3 bg-white dark:bg-slate-800 rounded border-l-4 border-emerald-600 border border-slate-200 dark:border-slate-700\">\n                                <strong>3. Tốc Độ Hành Động Vượt Trội (Bias for Action):</strong> Một quyết định triển khai 80% độ chín nhưng ra đòn nhanh trong 24 giờ luôn thắng một kế hoạch hoàn hảo 100% nhưng mất 1 tháng chần chừ.\n                            </div>\n                            <div class=\"p-3 bg-white dark:bg-slate-800 rounded border-l-4 border-purple-600 border border-slate-200 dark:border-slate-700\">\n                                <strong>4. Tôn Trọng Pháp Luật Hệ Thống (System as Law):</strong> Không có ngoại lệ cá nhân. Quy trình SOP đã ban hành là luật chơi chung, mọi vi phạm đều bị xử lý bình đẳng.\n                            </div>\n                            <div class=\"p-3 bg-white dark:bg-slate-800 rounded border-l-4 border-cyan-600 border border-slate-200 dark:border-slate-700\">\n                                <strong>5. Tinh Thần Học Tập Không Ngừng (Growth Mindset):</strong> Liên tục cập nhật các trào lưu thời trang tóc quốc tế, ứng dụng công nghệ AI và tự giác đào tạo thế hệ kế cận.\n                            </div>\n                        </div>\n                    </div>\n                    "}, {"tab": "data", "name": "2. Danh Mục Toàn Diện 16 Quy Trình SOP ISO 9001:2015", "content": "\n                    <div class=\"grid sm:grid-cols-2 gap-3 text-xs\">\n                        <div class=\"p-3 bg-white dark:bg-slate-800 rounded border\">\n                            <strong class=\"text-blue-600\">Nhóm R&D & Vận Hành Academy:</strong>\n                            <ul class=\"mt-1 space-y-1 text-slate-600 dark:text-slate-300\">\n                                <li>• <strong>SOP-01:</strong> Quy trình kiểm định chất lượng hóa chất thuốc tóc mới nhập khẩu.</li>\n                                <li>• <strong>SOP-02:</strong> Quy trình xử lý khẩn cấp sự cố cháy/nhũn tóc khách hàng trong 2h.</li>\n                                <li>• <strong>SOP-03:</strong> Quy chuẩn tổ chức lớp học kỹ thuật Masterclass VACP Academy.</li>\n                                <li>• <strong>SOP-04:</strong> Quy chuẩn staging sự kiện biểu diễn thời trang Hair Show.</li>\n                            </ul>\n                        </div>\n                        <div class=\"p-3 bg-white dark:bg-slate-800 rounded border\">\n                            <strong class=\"text-amber-600\">Nhóm Chuỗi Cung Ứng & Kho Mát:</strong>\n                            <ul class=\"mt-1 space-y-1 text-slate-600 dark:text-slate-300\">\n                                <li>• <strong>SOP-05:</strong> Quy trình đặt hàng nhập khẩu nhà máy OEM Hàn Quốc & Nhật Bản.</li>\n                                <li>• <strong>SOP-06:</strong> Quy trình kiểm đếm, lưu kho và dán tem phụ hàng nhập khẩu.</li>\n                                <li>• <strong>SOP-07:</strong> Quy chuẩn vận hành kho mát &lt;28°C và quản lý chống ẩm.</li>\n                                <li>• <strong>SOP-08:</strong> Quy trình đóng gói chống sốc và điều vận hỏa tốc 24h.</li>\n                            </ul>\n                        </div>\n                        <div class=\"p-3 bg-white dark:bg-slate-800 rounded border\">\n                            <strong class=\"text-emerald-600\">Nhóm Kinh Doanh Salon VIP & Tài Chính:</strong>\n                            <ul class=\"mt-1 space-y-1 text-slate-600 dark:text-slate-300\">\n                                <li>• <strong>SOP-09:</strong> Quy trình thẩm định mặt bằng và ký hợp đồng Salon VIP độc quyền.</li>\n                                <li>• <strong>SOP-10:</strong> Quy trình chào hàng bẻ gãy lời từ chối và ký gói Launch Pack.</li>\n                                <li>• <strong>SOP-11:</strong> Quy trình thẩm định hạn mức nợ gối đầu và bảo lãnh thanh toán.</li>\n                                <li>• <strong>SOP-12:</strong> Quy trình thu hồi nợ quá hạn và bàn giao hồ sơ pháp lý.</li>\n                            </ul>\n                        </div>\n                        <div class=\"p-3 bg-white dark:bg-slate-800 rounded border\">\n                            <strong class=\"text-purple-600\">Nhóm Nhân Sự & Kiểm Toán Nội Bộ:</strong>\n                            <ul class=\"mt-1 space-y-1 text-slate-600 dark:text-slate-300\">\n                                <li>• <strong>SOP-13:</strong> Quy trình phỏng vấn tuyển dụng thực chiến theo khung ASK.</li>\n                                <li>• <strong>SOP-14:</strong> Quy trình đào tạo hội nhập văn hóa Culture-OS trong 14 ngày.</li>\n                                <li>• <strong>SOP-15:</strong> Quy trình đánh giá KPI hiệu quả công việc và tính lương 3P.</li>\n                                <li>• <strong>SOP-16:</strong> Quy trình kiểm toán nội bộ đột xuất và phòng chống gian lận.</li>\n                            </ul>\n                        </div>\n                    </div>\n                    "}, {"tab": "checklist", "name": "3. Quy Tắc Lưu Đồ 1 Trang & Audit Đột Xuất", "content": "\n                    <div class=\"space-y-2 text-xs text-slate-700 dark:text-slate-300\">\n                        <div class=\"p-3 bg-white dark:bg-slate-800 rounded border\">\n                            <strong>Nguyên Tắc Lưu Đồ 1 Trang (1-Page Flowchart):</strong> Mỗi quy trình SOP dài 10 trang phải có 1 trang tóm tắt dạng sơ đồ khối trực quan (Ai làm -> Làm gì -> Tiêu chuẩn đầu ra -> Người duyệt) in màu và dán ngay trước bàn làm việc của nhân sự phụ trách.\n                        </div>\n                        <div class=\"p-3 bg-white dark:bg-slate-800 rounded border\">\n                            <strong>Kiểm Toán Đột Xuất (Monthly Surprise Audit):</strong> Ban Kiểm Soát Nội Bộ không báo trước, kiểm tra ngẫu nhiên 3 quy trình tại kho hoặc phòng ban mỗi tháng. Phát hiện sai phạm sẽ trừ thẳng 30% điểm KPI của Trưởng phòng khối đó.\n                        </div>\n                    </div>\n                    "}, {"tab": "quiz", "name": "4. Trắc Nghiệm Văn Hóa Culture-OS", "content": "\n                    <div class=\"p-4 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700\">\n                        <div class=\"font-bold text-sm text-slate-900 dark:text-white mb-2\">Câu hỏi: Khi một Trưởng phòng báo cáo: \"Tháng này nhóm em không đạt doanh số vì kinh tế khó khăn khách hàng thắt chặt chi tiêu\", theo văn hóa Culture-OS của VACP Group, tư duy này đang vi phạm nguyên tắc nào?</div>\n                        <div class=\"space-y-2 mt-3 text-xs text-slate-700 dark:text-slate-300\">\n                            <label class=\"block p-2.5 rounded border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 cursor-pointer\">\n                                <input type=\"radio\" name=\"vacp_q6\" value=\"a\" class=\"mr-2\"> A. Vi phạm nguyên tắc bảo mật thông tin.\n                            </label>\n                            <label class=\"block p-2.5 rounded border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 cursor-pointer\">\n                                <input type=\"radio\" name=\"vacp_q6\" value=\"b\" class=\"mr-2\"> B. Vi phạm nguyên tắc \"Trách Nhiệm 100% (Extreme Ownership)\": Người quản lý đang đóng vai nạn nhân của hoàn cảnh thay vì chủ động tìm kiếm các giải pháp kích cầu, nâng cấp dịch vụ và tổ chức đào tạo kéo khách.\n                            </label>\n                            <label class=\"block p-2.5 rounded border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 cursor-pointer\">\n                                <input type=\"radio\" name=\"vacp_q6\" value=\"c\" class=\"mr-2\"> C. Không vi phạm gì cả vì kinh tế khó khăn là sự thật.\n                            </label>\n                        </div>\n                        <div class=\"mt-3 p-3 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 rounded text-xs text-emerald-800 dark:text-emerald-300 hidden\" id=\"vacp_q6_ans\">\n                            <strong>Đáp án đúng: B!</strong> Văn hóa VACP Group đòi hỏi người lãnh đạo phải làm chủ tình thế. Trong khó khăn, đối thủ lùi bước chính là cơ hội vàng để ta bứt phá chiếm lĩnh thị phần.\n                        </div>\n                        <button onclick=\"document.getElementById('vacp_q6_ans').classList.toggle('hidden')\" class=\"mt-3 px-3 py-1 bg-blue-600 hover:bg-blue-700 text-white rounded text-xs font-semibold\">Xem Giải Thích</button>\n                    </div>\n                    "}]}]};

        let currentTrack = 'dtd'; // 'dtd' or 'vacp'
        let currentModuleIndex = 0;
        let currentTab = 'theory';

        const htmlEl = document.documentElement;
        const themeBtn = document.getElementById('theme-toggle');

        // Dark/Light Theme
        function setTheme(dark) {
            if (dark) {
                htmlEl.classList.add('dark');
                localStorage.setItem('masterclass_theme', 'dark');
            } else {
                htmlEl.classList.remove('dark');
                localStorage.setItem('masterclass_theme', 'light');
            }
        }
        const savedTheme = localStorage.getItem('masterclass_theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            setTheme(true);
        } else {
            setTheme(false);
        }
        themeBtn.addEventListener('click', () => setTheme(!htmlEl.classList.contains('dark')));

        // Track Switching
        const btnDtd = document.getElementById('btn-track-dtd');
        const btnVacp = document.getElementById('btn-track-vacp');
        const companyLogo = document.getElementById('company-logo');
        const brandTitle = document.getElementById('portal-brand-title');
        const brandDesc = document.getElementById('portal-brand-desc');
        const sidebarLabel = document.getElementById('sidebar-track-label');

        function switchTrack(track) {
            currentTrack = track;
            currentModuleIndex = 0;
            currentTab = 'theory';

            if (track === 'dtd') {
                btnDtd.className = 'px-3 sm:px-4 py-1.5 rounded-lg text-xs font-bold transition-all shadow-sm flex items-center gap-1.5 bg-white dark:bg-slate-700 text-amber-700 dark:text-amber-300';
                btnVacp.className = 'px-3 sm:px-4 py-1.5 rounded-lg text-xs font-bold transition-all text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white flex items-center gap-1.5';
                companyLogo.innerText = '🏛️';
                companyLogo.className = 'w-9 h-9 rounded-xl flex items-center justify-center text-white font-black text-lg shadow-md bg-amber-600';
                brandTitle.innerHTML = 'DTD HOLDING <span class="text-[10px] px-2 py-0.5 rounded-full font-bold uppercase tracking-wider bg-amber-100 text-amber-900 dark:bg-amber-950/60 dark:text-amber-300">HỌC VIỆN B2B</span>';
                brandDesc.innerText = 'Giáo trình đào tạo độc lập dành cho nhân sự DTD Holding';
                sidebarLabel.innerText = 'CHUYÊN ĐỀ DTD HOLDING';
            } else {
                btnVacp.className = 'px-3 sm:px-4 py-1.5 rounded-lg text-xs font-bold transition-all shadow-sm flex items-center gap-1.5 bg-white dark:bg-slate-700 text-blue-700 dark:text-blue-300';
                btnDtd.className = 'px-3 sm:px-4 py-1.5 rounded-lg text-xs font-bold transition-all text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white flex items-center gap-1.5';
                companyLogo.innerText = '👑';
                companyLogo.className = 'w-9 h-9 rounded-xl flex items-center justify-center text-white font-black text-lg shadow-md bg-blue-600';
                brandTitle.innerHTML = 'VACP GROUP <span class="text-[10px] px-2 py-0.5 rounded-full font-bold uppercase tracking-wider bg-blue-100 text-blue-900 dark:bg-blue-950/60 dark:text-blue-300">HỌC VIỆN SALON VIP</span>';
                brandDesc.innerText = 'Giáo trình đào tạo độc lập dành cho nhân sự VACP Group';
                sidebarLabel.innerText = 'CHUYÊN ĐỀ VACP GROUP';
            }

            renderSidebar();
            renderModule();
        }

        btnDtd.addEventListener('click', () => switchTrack('dtd'));
        btnVacp.addEventListener('click', () => switchTrack('vacp'));

        function getCurrentData() {
            return currentTrack === 'dtd' ? dtdData : vacpData;
        }

        // Render Sidebar
        const moduleListContainer = document.getElementById('module-list');
        function renderSidebar() {
            const data = getCurrentData();
            moduleListContainer.innerHTML = '';

            data.modules.forEach((mod, idx) => {
                const isCurrent = idx === currentModuleIndex;
                const a = document.createElement('a');
                a.href = '#';
                a.className = `block p-3 rounded-xl transition-all ${
                    isCurrent 
                    ? (currentTrack === 'dtd' 
                        ? 'bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800 text-amber-900 dark:text-amber-200 shadow-sm' 
                        : 'bg-blue-50 dark:bg-blue-950/40 border border-blue-200 dark:border-blue-800 text-blue-900 dark:text-blue-200 shadow-sm')
                    : 'hover:bg-slate-100 dark:hover:bg-slate-800/60 text-slate-700 dark:text-slate-300'
                }`;

                a.innerHTML = `
                    <div class="flex items-center justify-between mb-1">
                        <span class="text-[10px] font-black ${isCurrent ? (currentTrack === 'dtd' ? 'text-amber-600' : 'text-blue-600') : 'text-slate-400'}">MÔ-ĐUN ${idx + 1}</span>
                        <span class="text-xs font-mono text-slate-400">${mod.duration}</span>
                    </div>
                    <div class="font-bold text-xs line-clamp-2 leading-snug">${mod.title}</div>
                `;

                a.addEventListener('click', (e) => {
                    e.preventDefault();
                    currentModuleIndex = idx;
                    currentTab = 'theory';
                    renderSidebar();
                    renderModule();
                    if (window.innerWidth < 1024) {
                        document.getElementById('sidebar').classList.add('-translate-x-full');
                    }
                });

                moduleListContainer.appendChild(a);
            });
        }

        // Render Module Content
        function renderModule() {
            const data = getCurrentData();
            const mod = data.modules[currentModuleIndex];
            if (!mod) return;

            const badgeColor = currentTrack === 'dtd' ? 'bg-amber-100 text-amber-900 dark:bg-amber-950/70 dark:text-amber-300' : 'bg-blue-100 text-blue-900 dark:bg-blue-950/70 dark:text-blue-300';
            const nextBtnColor = currentTrack === 'dtd' ? 'bg-amber-600 hover:bg-amber-700' : 'bg-blue-600 hover:bg-blue-700';

            const badge = document.getElementById('module-badge');
            badge.className = `px-3 py-1 text-xs font-black rounded-full uppercase tracking-wider ${badgeColor}`;
            badge.innerText = `${data.company} · MÔ-ĐUN ${currentModuleIndex + 1}`;

            document.getElementById('module-duration').innerText = '⏱️ ' + mod.duration;
            document.getElementById('module-title').innerText = mod.title;
            document.getElementById('module-subtitle').innerText = mod.subtitle;
            document.getElementById('module-counter').innerText = `Chuyên đề ${currentModuleIndex + 1} / ${data.modules.length}`;

            const nextBtn = document.getElementById('btn-next-mod');
            nextBtn.className = `px-4 py-2 rounded-xl text-white text-xs sm:text-sm font-bold transition-colors shadow-sm ${nextBtnColor}`;

            // Update Tab Headers
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if (btn.dataset.tab === currentTab) {
                    const activeBorder = currentTrack === 'dtd' ? 'border-amber-600 text-amber-600 dark:text-amber-400' : 'border-blue-600 text-blue-600 dark:text-blue-400';
                    btn.className = `tab-btn px-4 py-2.5 text-xs sm:text-sm font-bold border-b-2 -mb-[1px] ${activeBorder}`;
                } else {
                    btn.className = 'tab-btn px-4 py-2.5 text-xs sm:text-sm font-bold border-b-2 -mb-[1px] border-transparent text-slate-500 hover:text-slate-700 dark:hover:text-slate-300';
                }
            });

            // Render Tab Pane Content
            const lesson = mod.lessons.find(l => l.tab === currentTab) || mod.lessons[0];
            document.getElementById('tab-pane').innerHTML = lesson.content;

            // Update Next/Prev state
            document.getElementById('btn-prev-mod').disabled = (currentModuleIndex === 0);
            document.getElementById('btn-prev-mod').classList.toggle('opacity-40', currentModuleIndex === 0);
            document.getElementById('btn-next-mod').disabled = (currentModuleIndex === data.modules.length - 1);
            document.getElementById('btn-next-mod').classList.toggle('opacity-40', currentModuleIndex === data.modules.length - 1);
        }

        // Tab click listeners
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentTab = btn.dataset.tab;
                renderModule();
            });
        });

        // Prev / Next Listeners
        document.getElementById('btn-prev-mod').addEventListener('click', () => {
            if (currentModuleIndex > 0) {
                currentModuleIndex--;
                currentTab = 'theory';
                renderSidebar();
                renderModule();
            }
        });

        document.getElementById('btn-next-mod').addEventListener('click', () => {
            const data = getCurrentData();
            if (currentModuleIndex < data.modules.length - 1) {
                currentModuleIndex++;
                currentTab = 'theory';
                renderSidebar();
                renderModule();
            }
        });

        // Mobile sidebar
        document.getElementById('toggle-sidebar').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
        });

        // Module search
        document.getElementById('module-search').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase();
            const data = getCurrentData();
            document.querySelectorAll('#module-list > a').forEach((el, idx) => {
                const mod = data.modules[idx];
                const match = mod.title.toLowerCase().includes(q) || mod.subtitle.toLowerCase().includes(q);
                el.style.display = match ? 'block' : 'none';
            });
        });

        // Init
        switchTrack('dtd');
    </script>
</body>
</html>
