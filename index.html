   <div class=\"text-2xl font-bold text-blue-600 dark:text-blue-400 mb-1\">01</div>\n                                <div class=\"font-bold text-sm text-slate-800 dark:text-slate-200\">Chuẩn Hóa</div>\n                                <div class=\"text-xs text-slate-500 dark:text-slate-400 mt-1\">Định nghĩa tiêu chuẩn từng SKU, quy trình, mô tả công việc</div>\n                            </div>\n                            <div class=\"p-3 bg-white dark:bg-slate-700 rounded-lg shadow-sm\">\n                                <div class=\"text-2xl font-bold text-blue-600 dark:text-blue-400 mb-1\">02</div>\n                                <div class=\"font-bold text-sm text-slate-800 dark:text-slate-200\">Quy Trình Hóa</div>\n                                <div class=\"text-xs text-slate-500 dark:text-slate-400 mt-1\">16 SOP rõ ràng, ma trận RACI không dẫm chân</div>\n                            </div>\n                            <div class=\"p-3 bg-white dark:bg-slate-700 rounded-lg shadow-sm\">\n                                <div class=\"text-2xl font-bold text-blue-600 dark:text-blue-400 mb-1\">03</div>\n                                <div class=\"font-bold text-sm text-slate-800 dark:text-slate-200\">Số Hóa</div>\n                                <div class=\"text-xs text-slate-500 dark:text-slate-400 mt-1\">Dữ liệu tài chính MISA, CRM khách hàng, báo cáo realtime</div>\n                            </div>\n                            <div class=\"p-3 bg-white dark:bg-slate-700 rounded-lg shadow-sm\">\n                                <div class=\"text-2xl font-bold text-blue-600 dark:text-blue-400 mb-1\">04</div>\n                                <div class=\"font-bold text-sm text-slate-800 dark:text-slate-200\">Tự Động Hóa</div>\n                                <div class=\"text-xs text-slate-500 dark:text-slate-400 mt-1\">Zalo bot AI, script xuất báo cáo, đồng bộ đơn hàng</div>\n                            </div>\n                            <div class=\"p-3 bg-white dark:bg-slate-700 rounded-lg shadow-sm\">\n                                <div class=\"text-2xl font-bold text-blue-600 dark:text-blue-400 mb-1\">05</div>\n                                <div class=\"font-bold text-sm text-slate-800 dark:text-slate-200\">Tối Ưu Hóa</div>\n                                <div class=\"text-xs text-slate-500 dark:text-slate-400 mt-1\">Hệ số mùa vụ, bù hàng thiếu, kiểm soát vòng quay vốn</div>\n                            </div>\n                        </div>\n                    </div>\n                </div>\n                "}, {"tab": "data", "name": "Bảng So Sánh & Dữ Liệu Thực Chiến", "content": "\n                <div class=\"overflow-x-auto\">\n                    <table class=\"w-full text-sm text-left border-collapse\">\n                        <thead class=\"bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 uppercase text-xs\">\n                            <tr>\n                                <th class=\"p-3 border border-slate-200 dark:border-slate-700\">Tiêu Chí So Sánh</th>\n                                <th class=\"p-3 border border-slate-200 dark:border-slate-700 bg-amber-50/50 dark:bg-amber-950/20 text-amber-900 dark:text-amber-300 font-bold\">DTD HOLDING (B2B Nền Tảng)</th>\n                                <th class=\"p-3 border border-slate-200 dark:border-slate-700 bg-blue-50/50 dark:bg-blue-950/20 text-blue-900 dark:text-blue-300 font-bold\">VACP GROUP (B2B Tinh Hoa & VIP)</th>\n                            </tr>\n                        </thead>\n                        <tbody class=\"divide-y divide-slate-200 dark:divide-slate-700 text-slate-600 dark:text-slate-300\">\n                            <tr>\n                                <td class=\"p-3 font-semibold border border-slate-200 dark:border-slate-700\">Đối Tượng Phục Vụ</td>\n                                <td class=\"p-3 border border-slate-200 dark:border-slate-700\">65 NPP toàn quốc, Salon bình dân đến trung cấp tại các tỉnh thành</td>\n                                <td class=\"p-3 border border-slate-200 dark:border-slate-700\">Top 500 Salon VIP hạng A/A+, Hair Stylist danh tiếng, chuỗi Salon cao cấp</td>\n                            </tr>\n                            <tr>\n                                <td class=\"p-3 font-semibold border border-slate-200 dark:border-slate-700\">Dải Phân Khúc Giá</td>\n                                <td class=\"p-3 border border-slate-200 dark:border-slate-700\">Mass to Mid-range (Giá hợp lý, tối ưu chi phí cho chủ salon tỉnh)</td>\n                                <td class=\"p-3 border border-slate-200 dark:border-slate-700\">High-end & Luxury (Sản phẩm nhập khẩu chính ngạch Hàn Quốc, Nhật Bản, Ba Lan)</td>\n                            </tr>\n                            <tr>\n                                <td class=\"p-3 font-semibold border border-slate-200 dark:border-slate-700\">Chiến Lược Bán Hàng</td>\n                                <td class=\"p-3 border border-slate-200 dark:border-slate-700\">Đẩy hàng qua NPP, chính sách gối đầu, chiết khấu số lượng, tặng hàng dùng thử</td>\n                                <td class=\"p-3 border border-slate-200 dark:border-slate-700\">Pull Marketing qua VACP Academy, tài trợ hair show, chứng nhận Salon đối tác độc quyền</td>\n                            </tr>\n                            <tr>\n                                <td class=\"p-3 font-semibold border border-slate-200 dark:border-slate-700\">Biên Lợi Nhuận Gộp</td>\n                                <td class=\"p-3 border border-slate-200 dark:border-slate-700\">45% - 60.8% (GLEM đạt kỷ lục 60.8% T6/2026)</td>\n                                <td class=\"p-3 border border-slate-200 dark:border-slate-700\">65% - 75% (Giá trị gia tăng từ thương hiệu và công nghệ độc quyền)</td>\n                            </tr>\n                            <tr>\n                                <td class=\"p-3 font-semibold border border-slate-200 dark:border-slate-700\">Hạ Tầng Vận Hành</td>\n                                <td class=\"p-3 border border-slate-200 dark:border-slate-700\">MISA AMIS, Quản lý kho tổng & điều phối 21 trạm phân phối</td>\n                                <td class=\"p-3 border border-slate-200 dark:border-slate-700\">Bộ máy 73 nhân sự, Trung tâm Đào tạo Kỹ thuật Academy, Hệ thống SOP ISO</td>\n                            </tr>\n                        </tbody>\n                    </table>\n                </div>\n                "}, {"tab": "checklist", "name": "Checklist Lãnh Đạo & Ứng Dụng", "content": "\n                <div class=\"space-y-4\">\n                    <h4 class=\"font-bold text-slate-900 dark:text-white\">📋 5 Câu Hỏi Kiểm Tra Chiến Lược Dành Cho C-Level:</h4>\n                    <div class=\"space-y-3\">\n                        <label class=\"flex items-start gap-3 p-3 bg-slate-50 dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700 cursor-pointer\">\n                            <input type=\"checkbox\" class=\"mt-1 rounded text-blue-600 focus:ring-blue-500\">\n                            <span class=\"text-sm text-slate-700 dark:text-slate-300\"><strong>1. Phân định ranh giới thương hiệu:</strong> Doanh nghiệp đã tách biệt rõ ràng thông điệp truyền thông của GLEM (kinh tế, bền màu, salon tỉnh) với PLEXIS (công nghệ K-Beauty, uốn đa tầng phục hồi) chưa?</span>\n                        </label>\n                        <label class=\"flex items-start gap-3 p-3 bg-slate-50 dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700 cursor-pointer\">\n                            <input type=\"checkbox\" class=\"mt-1 rounded text-blue-600 focus:ring-blue-500\">\n                            <span class=\"text-sm text-slate-700 dark:text-slate-300\"><strong>2. Kiểm soát dòng tiền hai cực:</strong> Dòng tiền thu về từ 21 NPP của DTD có được tái đầu tư đúng mức để nuôi các chiến dịch tạo tiếng vang của VACP Academy không?</span>\n                        </label>\n                        <label class=\"flex items-start gap-3 p-3 bg-slate-50 dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700 cursor-pointer\">\n                            <input type=\"checkbox\" class=\"mt-1 rounded text-blue-600 focus:ring-blue-500\">\n                            <span class=\"text-sm text-slate-700 dark:text-slate-300\"><strong>3. Tỷ lệ chuyển đổi từ Tặng sang Bán:</strong> Giám đốc kinh doanh đã theo dõi chỉ số chuyển đổi từ mẫu thử (sampling/tặng) sang đơn hàng thanh toán thực tế của từng NPP hay chưa? (Bài học thành công của GLEM tháng 4-6/2026).</span>\n                        </label>\n                        <label class=\"flex items-start gap-3 p-3 bg-slate-50 dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700 cursor-pointer\">\n                            <input type=\"checkbox\" class=\"mt-1 rounded text-blue-600 focus:ring-blue-500\">\n                            <span class=\"text-sm text-slate-700 dark:text-slate-300\"><strong>4. Mức độ chuẩn hóa 5 Hóa:</strong> Các phòng ban hiện tại đang ở cấp độ nào trong 5 Hóa? Có hiện tượng quy trình viết ra trên giấy nhưng không số hóa trên phần mềm hay không?</span>\n                        </label>\n                    </div>\n                </div>\n                "}, {"tab": "quiz", "name": "Trắc Nghiệm Tư Duy Tình Huống", "content": "\n                <div class=\"space-y-6\">\n                    <div class=\"p-5 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700\">\n                        <div class=\"font-bold text-slate-900 dark:text-white mb-2\">Câu hỏi 1: Tại sao DTD Holding lại cần thành lập VACP Group thay vì trực tiếp phân phối nhãn hàng cao cấp PLEXIS dưới danh nghĩa DTD?</div>\n                        <div class=\"space-y-2 mt-3 text-sm text-slate-700 dark:text-slate-300\">\n                            <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/50 cursor-pointer\">\n                                <input type=\"radio\" name=\"q1\" value=\"a\" class=\"mr-2\"> A. Để giảm bớt thuế thu nhập doanh nghiệp giữa các công ty con.\n                            </label>\n                            <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/50 cursor-pointer\">\n                                <input type=\"radio\" name=\"q1\" value=\"b\" class=\"mr-2\"> B. Tránh xung đột định vị thương hiệu (Brand Dilution): Thương hiệu DTD đã gắn liền với phân khúc salon bình dân/tỉnh, nếu bán PLEXIS cao cấp dưới tên DTD sẽ khó thuyết phục Salon VIP hạng A và KOLs.\n                            </label>\n                            <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/50 cursor-pointer\">\n                                <input type=\"radio\" name=\"q1\" value=\"c\" class=\"mr-2\"> C. Vì đối tác Hàn Quốc yêu cầu công ty phân phối phải có chữ Group trong tên đăng ký kinh doanh.\n                            </label>\n                        </div>\n                        <div class=\"mt-4 p-3 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 rounded-lg text-xs text-emerald-800 dark:text-emerald-300 hidden\" id=\"q1-ans\">\n                            <strong>Đáp án chính xác: B!</strong> Trong quản trị chiến lược đa thương hiệu (House of Brands), việc tách bạch pháp nhân và kênh phân phối giúp bảo vệ sự cao cấp của thương hiệu mới, không bị ảnh hưởng bởi hình ảnh giá rẻ của thương hiệu đại chúng trước đó.\n                        </div>\n                        <button onclick=\"document.getElementById('q1-ans').classList.toggle('hidden')\" class=\"mt-3 px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded text-xs font-semibold\">Xem Giải Thích Học Thuật</button>\n                    </div>\n                </div>\n                "}]}, {"id": 2, "title": "Kiến Trúc Bộ Máy, RACI, Định Biên 73 Nhân Sự, Lương 3P & ESOP", "subtitle": "Cơ cấu tổ chức hợp nhất 6 khối nghiệp vụ, ma trận RACI chống đùn đẩy, cơ chế đãi ngộ 3P và chiến lược ESOP", "badge": "Quản Trị Tổ Chức & Nhân Tài", "duration": "30 phút học", "lessons": [{"tab": "core", "name": "Kiến Trúc Bộ Máy 73 Nhân Sự & Lương 3P", "content": "\n                <div class=\"space-y-6\">\n                    <div class=\"bg-indigo-50 dark:bg-slate-800/60 p-5 rounded-xl border border-indigo-200 dark:border-slate-700\">\n                        <h4 class=\"text-lg font-bold text-indigo-900 dark:text-indigo-300 mb-2\">👥 Thách Thức Quản Trị Khi Doanh Nghiệp Tăng Trưởng (Scale-up)</h4>\n                        <p class=\"text-slate-700 dark:text-slate-300 leading-relaxed\">\n                            Khi doanh số vượt mốc hàng chục tỷ đồng và mạng lưới mở rộng, các công ty phân phối B2B thường rơi vào <strong>\"bẫy vận hành gia đình\"</strong>: không có mô tả công việc (JD) rõ ràng, sales tranh chấp khách hàng với đại lý, phòng kỹ thuật đổ lỗi cho kho vận làm thuốc hư hỏng, lương trả theo cảm tính gây mất đoàn kết nội bộ.\n                        </p>\n                    </div>\n\n                    <h4 class=\"text-xl font-bold text-slate-900 dark:text-white mt-4\">🏛️ Sơ Đồ Tổ Chức 6 Khối Nghiệp Vụ VACP Group (Định Biên 73 Nhân Sự)</h4>\n                    \n                    <div class=\"grid sm:grid-cols-3 gap-4 text-sm\">\n                        <div class=\"bg-white dark:bg-slate-800 p-4 rounded-lg border border-slate-200 dark:border-slate-700\">\n                            <div class=\"font-bold text-blue-600 dark:text-blue-400 mb-1\">1. Khối Kinh Doanh (Sales B2B)</div>\n                            <div class=\"text-slate-500 dark:text-slate-400 text-xs\">Định biên: <strong>26 nhân sự</strong></div>\n                            <div class=\"text-slate-600 dark:text-slate-300 text-xs mt-2\">Giám đốc KD, Trưởng phòng B2B Salon VIP, Trưởng phòng NPP tỉnh, 20 Quản lý vùng / Trình dược viên salon.</div>\n                        </div>\n                        <div class=\"bg-white dark:bg-slate-800 p-4 rounded-lg border border-slate-200 dark:border-slate-700\">\n                            <div class=\"font-bold text-amber-600 dark:text-amber-400 mb-1\">2. Khối Academy & Marketing</div>\n                            <div class=\"text-slate-500 dark:text-slate-400 text-xs\">Định biên: <strong>16 nhân sự</strong></div>\n                            <div class=\"text-slate-600 dark:text-slate-300 text-xs mt-2\">Giám đốc Kỹ thuật (Master Educator), 8 Chuyên viên kỹ thuật uốn nhuộm, Trưởng phòng MKT, Content, Media Event.</div>\n                        </div>\n                        <div class=\"bg-white dark:bg-slate-800 p-4 rounded-lg border border-slate-200 dark:border-slate-700\">\n                            <div class=\"font-bold text-emerald-600 dark:text-emerald-400 mb-1\">3. Khối SCM, Mua Hàng & R&D</div>\n                            <div class=\"text-slate-500 dark:text-slate-400 text-xs\">Định biên: <strong>11 nhân sự</strong></div>\n                            <div class=\"text-slate-600 dark:text-slate-300 text-xs mt-2\">Trưởng phòng Mua hàng quốc tế, Chuyên viên kiểm định hóa chất thuốc tóc, Quản lý kho tổng, Điều vận logistics.</div>\n                        </div>\n                        <div class=\"bg-white dark:bg-slate-800 p-4 rounded-lg border border-slate-200 dark:border-slate-700\">\n                            <div class=\"font-bold text-purple-600 dark:text-purple-400 mb-1\">4. Khối Tài Chính Kế Toán</div>\n                            <div class=\"text-slate-500 dark:text-slate-400 text-xs\">Định biên: <strong>8 nhân sự</strong></div>\n                            <div class=\"text-slate-600 dark:text-slate-300 text-xs mt-2\">Kế toán trưởng, Kế toán công nợ NPP, Kế toán kho & giá thành, Thủ quỹ, Chuyên viên phân tích dữ liệu MISA.</div>\n                        </div>\n                        <div class=\"bg-white dark:bg-slate-800 p-4 rounded-lg border border-slate-200 dark:border-slate-700\">\n                            <div class=\"font-bold text-rose-600 dark:text-rose-400 mb-1\">5. Khối Nhân Sự & Hành Chính</div>\n                            <div class=\"text-slate-500 dark:text-slate-400 text-xs\">Định biên: <strong>6 nhân sự</strong></div>\n                            <div class=\"text-slate-600 dark:text-slate-300 text-xs mt-2\">Trưởng phòng HR, Chuyên viên C&B (lương thưởng 3P/KPI), Chuyên viên tuyển dụng & đào tạo hội nhập, Pháp chế.</div>\n                        </div>\n                        <div class=\"bg-white dark:bg-slate-800 p-4 rounded-lg border border-slate-200 dark:border-slate-700\">\n                            <div class=\"font-bold text-cyan-600 dark:text-cyan-400 mb-1\">6. Ban Tổng Giám Đốc (BOD/CEO)</div>\n                            <div class=\"text-slate-500 dark:text-slate-400 text-xs\">Định biên: <strong>6 nhân sự</strong></div>\n                            <div class=\"text-slate-600 dark:text-slate-300 text-xs mt-2\">Chủ tịch HĐQT, Tổng Giám Đốc (CEO), Phó Tổng Vận hành (COO), Trợ lý chiến lược, Ban Kiểm soát nội bộ.</div>\n                        </div>\n                    </div>\n\n                    <div class=\"bg-slate-50 dark:bg-slate-800/40 p-5 rounded-xl border border-slate-200 dark:border-slate-700 mt-6\">\n                        <h4 class=\"text-lg font-bold text-slate-900 dark:text-white mb-3\">💰 Hệ Thống Lương 3P & Đãi Ngộ Cốt Cán</h4>\n                        <div class=\"grid md:grid-cols-3 gap-4\">\n                            <div class=\"p-4 bg-white dark:bg-slate-700 rounded-lg\">\n                                <div class=\"font-bold text-blue-600 dark:text-blue-400 text-base mb-1\">P1 - Position (Vị trí)</div>\n                                <p class=\"text-xs text-slate-600 dark:text-slate-300\">Trả lương dựa trên giá trị công việc và mức độ phức tạp của vị trí (Market Rate benchmark theo ngành mỹ phẩm).</p>\n                            </div>\n                            <div class=\"p-4 bg-white dark:bg-slate-700 rounded-lg\">\n                                <div class=\"font-bold text-amber-600 dark:text-amber-400 text-base mb-1\">P2 - Person (Năng lực)</div>\n                                <p class=\"text-xs text-slate-600 dark:text-slate-300\">Đánh giá theo khung năng lực: trình độ tay nghề kỹ thuật tóc, kỹ năng thuyết phục chủ salon VIP, khả năng xử lý sự cố uốn nhuộm.</p>\n                            </div>\n                            <div class=\"p-4 bg-white dark:bg-slate-700 rounded-lg\">\n                                <div class=\"font-bold text-emerald-600 dark:text-emerald-400 text-base mb-1\">P3 - Performance (Hiệu quả)</div>\n                                <p class=\"text-xs text-slate-600 dark:text-slate-300\">Thưởng KPI tháng/quý gắn liền với Doanh số thu tiền thực tế (Cash Collection), tỷ lệ thu hồi nợ đúng hạn và độ mở rộng salon mới.</p>\n                            </div>\n                        </div>\n                    </div>\n                </div>\n                "}, {"tab": "data", "name": "Ma Trận RACI Chống Đùn Đẩy Trách Nhiệm", "content": "\n                <div class=\"overflow-x-auto\">\n                    <p class=\"text-xs text-slate-500 mb-2 italic\">Chú thích: R = Responsible (Người trực tiếp làm) | A = Accountable (Người chịu trách nhiệm duyệt/chịu tội) | C = Consulted (Người được tham vấn) | I = Informed (Người được thông báo kết quả)</p>\n                    <table class=\"w-full text-sm text-left border-collapse\">\n                        <thead class=\"bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 uppercase text-xs\">\n                            <tr>\n                                <th class=\"p-3 border border-slate-200 dark:border-slate-700\">Quy Trình Trọng Yếu</th>\n                                <th class=\"p-2 border border-slate-200 dark:border-slate-700 text-center\">BOD / CEO</th>\n                                <th class=\"p-2 border border-slate-200 dark:border-slate-700 text-center\">Kinh Doanh (Sales)</th>\n                                <th class=\"p-2 border border-slate-200 dark:border-slate-700 text-center\">Academy (Kỹ thuật)</th>\n                                <th class=\"p-2 border border-slate-200 dark:border-slate-700 text-center\">Mua Hàng / R&D</th>\n                                <th class=\"p-2 border border-slate-200 dark:border-slate-700 text-center\">Kế Toán / Tài Chính</th>\n                            </tr>\n                        </thead>\n                        <tbody class=\"divide-y divide-slate-200 dark:divide-slate-700 text-slate-600 dark:text-slate-300 text-xs\">\n                            <tr>\n                                <td class=\"p-3 font-semibold border border-slate-200 dark:border-slate-700\">Tung Sản Phẩm Mới (Launch GTM)</td>\n                                <td class=\"p-2 border border-slate-200 dark:border-slate-700 text-center font-bold text-red-500\">A</td>\n                                <td class=\"p-2 border border-slate-200 dark:border-slate-700 text-center font-bold text-blue-600\">R</td>\n                                <td class=\"p-2 border border-slate-200 dark:border-slate-700 text-center font-bold text-blue-600\">R</td>\n                                <td class=\"p-2 border border-slate-200 dark:border-slate-700 text-center text-slate-400\">C</td>\n                                <td class=\"p-2 border border-slate-200 dark:border-slate-700 text-center text-slate-400\">I</td>\n                            </tr>\n                            <tr>\n                                <td class=\"p-3 font-semibold border border-slate-200 dark:border-slate-700\">Thẩm Định & Test Hóa Chất Uốn Nhuộm</td>\n                                <td class=\"p-2 border border-slate-200 dark:border-slate-700 text-center text-slate-400\">I</td>\n                                <td class=\"p-2 border border-slate-200 dark:border-slate-700 text-center text-slate-400\">C</td>\n                                <td class=\"p-2 border border-slate-200 dark:border-slate-700 text-center font-bold text-red-500\">A</td>\n                                <td class=\"p-2 border border-slate-200 dark:border-slate-700 text-center font-bold text-blue-600\">R</td>\n                                <td class=\"p-2 border border-slate-200 dark:border-slate-700 text-center text-slate-400\">I</td>\n                            </tr>\n                            <tr>\n                                <td class=\"p-3 font-semibold border border-slate-200 dark:border-slate-700\">Duyệt Hạn Mức Công Nợ Cho NPP Mới</td>\n                                <td class=\"p-2 border border-slate-200 dark:border-slate-700 text-center font-bold text-red-500\">A</td>\n                                <td class=\"p-2 border border-slate-200 dark:border-slate-700 text-center font-bold text-blue-600\">R</td>\n                                <td class=\"p-2 border border-slate-200 dark:border-slate-700 text-center text-slate-400\">I</td>\n                                <td class=\"p-2 border border-slate-200 dark:border-slate-700 text-center text-slate-400\">I</td>\n                                <td class=\"p-2 border border-slate-200 dark:border-slate-700 text-center font-bold text-blue-600\">R (Thẩm tra)</td>\n                            </tr>\n                            <tr>\n                                <td class=\"p-3 font-semibold border border-slate-200 dark:border-slate-700\">Xử Lý Sự Cố Tóc Khách Hàng Bị Cháy/Hư</td>\n                                <td class=\"p-2 border border-slate-200 dark:border-slate-700 text-center text-slate-400\">I</td>\n                                <td class=\"p-2 border border-slate-200 dark:border-slate-700 text-center text-slate-400\">C (Tiếp nhận)</td>\n                                <td class=\"p-2 border border-slate-200 dark:border-slate-700 text-center font-bold text-red-500\">A / R (Cứu tóc)</td>\n                                <td class=\"p-2 border border-slate-200 dark:border-slate-700 text-center text-slate-400\">C (Test lô)</td>\n                                <td class=\"p-2 border border-slate-200 dark:border-slate-700 text-center text-slate-400\">I (Đổi trả)</td>\n                            </tr>\n                        </tbody>\n                    </table>\n                </div>\n                "}, {"tab": "checklist", "name": "Chính Sách Cổ Phần Thưởng (ESOP)", "content": "\n                <div class=\"space-y-4\">\n                    <h4 class=\"font-bold text-slate-900 dark:text-white\">🌟 Chiến Lược Giữ Chân Nhân Sự Cốt Cán Qua ESOP (2026–2030)</h4>\n                    <p class=\"text-sm text-slate-600 dark:text-slate-300\">\n                        Đối với doanh nghiệp phân phối B2B và giáo dục tóc, <strong>chuyên gia kỹ thuật hàng đầu (Master Trainer)</strong> và <strong>Giám đốc kinh doanh vùng</strong> là tài sản lớn nhất. Nếu không có cơ chế giữ chân bằng quyền lợi sở hữu, họ sẽ mang theo khách hàng và công thức ra mở công ty riêng.\n                    </p>\n                    <div class=\"p-4 bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800 rounded-lg text-sm text-slate-700 dark:text-slate-300 space-y-2\">\n                        <div><strong>1. Quỹ ESOP:</strong> Trích lập 5% - 8% tổng vốn điều lệ cho Ban Giám Đốc và các nhân sự đạt thành tích xuất sắc.</div>\n                        <div><strong>2. Điều kiện Vesting (Mở khóa cổ phần):</strong> Áp dụng lịch trình 4 năm (Vesting Schedule): Năm 1: 25%, Năm 2: 25%, Năm 3: 25%, Năm 4: 25%. Kèm điều khoản cam kết không mở công ty cạnh tranh trực tiếp trong 2 năm sau khi rời doanh nghiệp (Non-compete agreement).</div>\n                        <div><strong>3. Tiêu chí đánh giá:</strong> Đạt tối thiểu 90% KPI liên tục trong 8 quý và trực tiếp đào tạo được ít nhất 2 nhân sự kế cận (Succession planning).</div>\n                    </div>\n                </div>\n                "}, {"tab": "quiz", "name": "Trắc Nghiệm Tình Huống RACI", "content": "\n                <div class=\"p-5 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700\">\n                    <div class=\"font-bold text-slate-900 dark:text-white mb-2\">Tình huống: Một Salon VIP phản ánh rằng lô thuốc uốn Plexis vừa nhập về làm tóc khách hàng bị khô xơ và mềm nhũn, đe dọa bóc phốt trên hội nhóm Salon. Ai là người giữ vai trò Accountable (A) trong việc xử lý sự cố này theo RACI?</div>\n                    <div class=\"space-y-2 mt-3 text-sm text-slate-700 dark:text-slate-300\">\n                        <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/50 cursor-pointer\">\n                            <input type=\"radio\" name=\"q2\" value=\"a\" class=\"mr-2\"> A. Trình dược viên bán đơn hàng đó (Sales) vì họ trực tiếp cầm tiền của salon.\n                        </label>\n                        <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/50 cursor-pointer\">\n                            <input type=\"radio\" name=\"q2\" value=\"b\" class=\"mr-2\"> B. Giám đốc Kỹ thuật / Trưởng Bộ phận Academy vì đây là sự cố về kỹ thuật hóa chất uốn và quy trình phục hồi tóc, cần chuyên gia thẩm định và trực tiếp giải cứu sợi tóc.\n                        </label>\n                        <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/50 cursor-pointer\">\n                            <input type=\"radio\" name=\"q2\" value=\"c\" class=\"mr-2\"> C. Thủ kho vì có thể do kho bảo quản ở nhiệt độ quá cao làm biến tính thuốc.\n                        </label>\n                    </div>\n                    <div class=\"mt-4 p-3 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 rounded-lg text-xs text-emerald-800 dark:text-emerald-300 hidden\" id=\"q2-ans\">\n                        <strong>Đáp án chính xác: B!</strong> Trong ngành mỹ phẩm tóc chuyên nghiệp, 90% các sự cố \"cháy tóc/nhũn tóc\" xuất phát từ việc thợ salon canh sai thời gian mềm hóa (over-processing) hoặc chọn sai nồng độ pH của thuốc uốn chứ không phải do lỗi thuốc. Chuyên gia kỹ thuật Academy phải là người Accountable đứng ra test lại chất tóc, phục hồi và hướng dẫn lại salon, bảo vệ uy tín thương hiệu.\n                    </div>\n                    <button onclick=\"document.getElementById('q2-ans').classList.toggle('hidden')\" class=\"mt-3 px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded text-xs font-semibold\">Xem Giải Thích Học Thuật</button>\n                </div>\n                "}]}, {"id": 3, "title": "Danh Mục Thương Hiệu & Ma Trận Sản Phẩm Đa Tầng", "subtitle": "Giải mã công nghệ PLEXIS Seoul, DEMI Nhật Bản, GLEM, MINATO và AINEOR Clinical Haircare", "badge": "Sản Phẩm & Công Nghệ", "duration": "35 phút học", "lessons": [{"tab": "core", "name": "Ma Trận Sản Phẩm Đa Tầng Portfolio", "content": "\n                <div class=\"space-y-6\">\n                    <h4 class=\"text-xl font-bold text-slate-900 dark:text-white\">🧴 Chiến Lược Danh Mục Đa Tầng (Brand Portfolio Strategy)</h4>\n                    <p class=\"text-slate-600 dark:text-slate-300\">\n                        Một doanh nghiệp mỹ phẩm tóc bền vững không bao giờ phụ thuộc vào một sản phẩm duy nhất. Hệ sinh thái DTD & VACP xây dựng cấu trúc <strong>4 tầng sản phẩm</strong>:\n                    </p>\n\n                    <div class=\"space-y-4\">\n                        <div class=\"p-5 bg-white dark:bg-slate-800 rounded-xl border-l-4 border-indigo-600 border border-slate-200 dark:border-slate-700 shadow-sm\">\n                            <div class=\"flex justify-between items-center mb-1\">\n                                <h5 class=\"text-lg font-bold text-indigo-900 dark:text-indigo-300\">1. PLEXIS — Hệ Thống Uốn Phục Hồi Đa Tầng Chuẩn Seoul (Korea)</h5>\n                                <span class=\"px-2.5 py-0.5 bg-indigo-100 dark:bg-indigo-950 text-indigo-800 dark:text-indigo-300 rounded text-xs font-semibold\">VACP Chiến Lược</span>\n                            </div>\n                            <p class=\"text-sm text-slate-600 dark:text-slate-300 mt-2\">\n                                <strong>Vũ khí cạnh tranh:</strong> Hệ thống uốn kiểm soát pH (Multi-pH Perming System) từ pH 4.5 (tóc nát hư tổn nặng), pH 7.0 (tóc trung bình yếu) đến pH 9.0 (tóc khỏe nguyên bản). Sử dụng hoạt chất khử <strong>Cysteamine</strong> hạt siêu nhỏ giảm thiểu mùi hăng nồng, bổ sung phức hợp Protein tơ tằm và Lipid hàn gắn liên kết lưu huỳnh (Disulfide bonds).\n                            </p>\n                            <div class=\"mt-3 flex flex-wrap gap-2 text-xs\">\n                                <span class=\"bg-slate-100 dark:bg-slate-700 px-2 py-1 rounded\">Quy trình 7 bước</span>\n                                <span class=\"bg-slate-100 dark:bg-slate-700 px-2 py-1 rounded\">Bảo vệ nhiệt Anti-Heat</span>\n                                <span class=\"bg-slate-100 dark:bg-slate-700 px-2 py-1 rounded\">Hợp đồng KOL Salon VIP</span>\n                            </div>\n                        </div>\n\n                        <div class=\"p-5 bg-white dark:bg-slate-800 rounded-xl border-l-4 border-red-600 border border-slate-200 dark:border-slate-700 shadow-sm\">\n                            <div class=\"flex justify-between items-center mb-1\">\n                                <h5 class=\"text-lg font-bold text-red-900 dark:text-red-300\">2. DEMI — Mỹ Phẩm Tóc Hàng Đầu Nhật Bản (Japan)</h5>\n                                <span class=\"px-2.5 py-0.5 bg-red-100 dark:bg-red-950 text-red-800 dark:text-red-300 rounded text-xs font-semibold\">VACP Tinh Hoa</span>\n                            </div>\n                            <p class=\"text-sm text-slate-600 dark:text-slate-300 mt-2\">\n                                <strong>Vũ khí cạnh tranh:</strong> Triết lý chăm sóc tóc y khoa Nhật Bản (Scalp & Hair Wellness). Cạnh tranh trực tiếp với Milbon (Nhật) và L'Oréal Professionnel (Pháp). Sản phẩm nổi bật: Dòng phục hồi màng tế bào CMC, uốn lạnh vi sinh, dầu gội cân bằng hệ vi sinh da đầu.\n                            </p>\n                        </div>\n\n                        <div class=\"p-5 bg-white dark:bg-slate-800 rounded-xl border-l-4 border-amber-600 border border-slate-200 dark:border-slate-700 shadow-sm\">\n                            <div class=\"flex justify-between items-center mb-1\">\n                                <h5 class=\"text-lg font-bold text-amber-900 dark:text-amber-300\">3. GLEM / LUMINOUS / AMINO CARE — Cỗ Máy Doanh Số Salon Tỉnh</h5>\n                                <span class=\"px-2.5 py-0.5 bg-amber-100 dark:bg-amber-950 text-amber-800 dark:text-amber-300 rounded text-xs font-semibold\">DTD Cột Trụ</span>\n                            </div>\n                            <p class=\"text-sm text-slate-600 dark:text-slate-300 mt-2\">\n                                <strong>Vũ khí cạnh tranh:</strong> Màu nhuộm hạt màu nano hạt mịn, độ bám cao, phủ bạc 100% không trôi đỏ. Doanh số T6/2026 đạt <strong>2.12 tỷ VND (+294.6% MoM)</strong>, biên lợi nhuận đạt <strong>60.8%</strong>. Đây là dòng sản phẩm tạo dòng tiền nuôi sống toàn bộ hệ thống đại lý.\n                            </p>\n                        </div>\n\n                        <div class=\"p-5 bg-white dark:bg-slate-800 rounded-xl border-l-4 border-emerald-600 border border-slate-200 dark:border-slate-700 shadow-sm\">\n                            <div class=\"flex justify-between items-center mb-1\">\n                                <h5 class=\"text-lg font-bold text-emerald-900 dark:text-emerald-300\">4. AINEOR — Dòng Chăm Sóc Tóc Lâm Sàng D2C (Clinical Haircare)</h5>\n                                <span class=\"px-2.5 py-0.5 bg-emerald-100 dark:bg-emerald-950 text-emerald-800 dark:text-emerald-300 rounded text-xs font-semibold\">Startup Ecom D2C</span>\n                            </div>\n                            <p class=\"text-sm text-slate-600 dark:text-slate-300 mt-2\">\n                                <strong>Vũ khí cạnh tranh:</strong> Thương hiệu đón đầu làn sóng người tiêu dùng tự chăm sóc tóc chuẩn Salon tại nhà. Bao bì thiết kế chuẩn Luxury tối giản (Glass/Amber bottle, pump cao cấp), hoạt chất nồng độ cao (Peptides, Niacinamide, Keratin thủy phân), tối ưu bán lẻ trên TikTok Shop và Shopee Mall.\n                            </p>\n                        </div>\n                    </div>\n                </div>\n                "}, {"tab": "data", "name": "Bảng Thông Số Kỹ Thuật PLEXIS vs Thị Trường", "content": "\n                <div class=\"overflow-x-auto\">\n                    <table class=\"w-full text-sm text-left border-collapse\">\n                        <thead class=\"bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 uppercase text-xs\">\n                            <tr>\n                                <th class=\"p-3 border border-slate-200 dark:border-slate-700\">Thông Số Kỹ Thuật</th>\n                                <th class=\"p-3 border border-slate-200 dark:border-slate-700 text-blue-600 dark:text-blue-400 font-bold\">Hệ Thống PLEXIS Korea</th>\n                                <th class=\"p-3 border border-slate-200 dark:border-slate-700\">Thuốc Uốn Truyền Thống (Thioglycolate)</th>\n                                <th class=\"p-3 border border-slate-200 dark:border-slate-700\">Thuốc Uốn Kiềm Cao (Ammonia)</th>\n                            </tr>\n                        </thead>\n                        <tbody class=\"divide-y divide-slate-200 dark:divide-slate-700 text-slate-600 dark:text-slate-300 text-xs\">\n                            <tr>\n                                <td class=\"p-3 font-semibold border border-slate-200 dark:border-slate-700\">Hoạt Chất Cắt Khử Liên Kết</td>\n                                <td class=\"p-3 border border-slate-200 dark:border-slate-700 font-bold text-slate-900 dark:text-white\">Cysteamine HCl phân tử nhỏ</td>\n                                <td class=\"p-3 border border-slate-200 dark:border-slate-700\">Ammonium Thioglycolate (TG)</td>\n                                <td class=\"p-3 border border-slate-200 dark:border-slate-700\">Ethanolamine / Ammonia đậm đặc</td>\n                            </tr>\n                            <tr>\n                                <td class=\"p-3 font-semibold border border-slate-200 dark:border-slate-700\">Dải pH Hoạt Động</td>\n                                <td class=\"p-3 border border-slate-200 dark:border-slate-700 font-bold text-blue-600\">4.5 - 7.0 - 9.0 (Kiểm soát đa tầng)</td>\n                                <td class=\"p-3 border border-slate-200 dark:border-slate-700\">8.5 - 9.5 (Cố định kiềm cao)</td>\n                                <td class=\"p-3 border border-slate-200 dark:border-slate-700\">9.5 - 10.5 (Dễ gây cháy tóc)</td>\n                            </tr>\n                            <tr>\n                                <td class=\"p-3 font-semibold border border-slate-200 dark:border-slate-700\">Mùi Hóa Chất Khi Vận Hành</td>\n                                <td class=\"p-3 border border-slate-200 dark:border-slate-700\">Mùi nhẹ dịu, xử lý hương thơm tự nhiên</td>\n                                <td class=\"p-3 border border-slate-200 dark:border-slate-700\">Mùi lưu huỳnh hăng nồng nặc</td>\n                                <td class=\"p-3 border border-slate-200 dark:border-slate-700\">Cay mắt, nồng gắt phòng kín</td>\n                            </tr>\n                            <tr>\n                                <td class=\"p-3 font-semibold border border-slate-200 dark:border-slate-700\">Độ Mềm Mại Của Sóng Tóc</td>\n                                <td class=\"p-3 border border-slate-200 dark:border-slate-700\">Sóng lơi Hàn Quốc, đàn hồi, bóng mượt tự nhiên</td>\n                                <td class=\"p-3 border border-slate-200 dark:border-slate-700\">Sóng xoăn tít nhưng khô cứng</td>\n                                <td class=\"p-3 border border-slate-200 dark:border-slate-700\">Dễ bị xơ giòn gãy rụng sau 1 tháng</td>\n                            </tr>\n                        </tbody>\n                    </table>\n                </div>\n                "}, {"tab": "checklist", "name": "Quy Trình 7 Bước Uốn Phục Hồi Chuẩn PLEXIS", "content": "\n                <div class=\"space-y-3 text-sm text-slate-700 dark:text-slate-300\">\n                    <div class=\"flex items-start gap-3 p-3 bg-white dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700\">\n                        <span class=\"w-6 h-6 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-xs shrink-0\">1</span>\n                        <div><strong>Bước 1 - Chẩn đoán & Test đàn hồi sợi tóc:</strong> Kiểm tra độ giãn nở của tóc khi ướt. Xác định tóc cấp độ 1-2 (khỏe), 3-4 (trung bình), 5-6 (hư tổn nặng do tẩy nhiều lần).</div>\n                    </div>\n                    <div class=\"flex items-start gap-3 p-3 bg-white dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700\">\n                        <span class=\"w-6 h-6 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-xs shrink-0\">2</span>\n                        <div><strong>Bước 2 - Tiền xử lý phục hồi đa tầng (Pre-Treatment):</strong> Thoa tinh chất Plexis PPT xịt đệm khóa ngọn tóc yếu, cân bằng độ xốp trước khi vào hóa chất.</div>\n                    </div>\n                    <div class=\"flex items-start gap-3 p-3 bg-white dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700\">\n                        <span class=\"w-6 h-6 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-xs shrink-0\">3</span>\n                        <div><strong>Bước 3 - Bôi thuốc mềm hóa kiểm soát pH:</strong> Chọn chính xác số thuốc uốn (pH 4.5 cho đoạn ngọn tẩy, pH 7.0 cho đoạn thân, pH 9.0 cho đoạn chân tóc khỏe).</div>\n                    </div>\n                    <div class=\"flex items-start gap-3 p-3 bg-white dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700\">\n                        <span class=\"w-6 h-6 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-xs shrink-0\">4</span>\n                        <div><strong>Bước 4 - Xả sạch & Khử kiềm (Acid Rinse):</strong> Xả sạch thuốc mềm hóa 100% bằng nước ấm, khử tồn dư kiềm giúp tóc ngậm nước.</div>\n                    </div>\n                    <div class=\"flex items-start gap-3 p-3 bg-white dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700\">\n                        <span class=\"w-6 h-6 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-xs shrink-0\">5</span>\n                        <div><strong>Bước 5 - Lên trục uốn & Kích nhiệt bảo vệ:</strong> Bôi kem chống cháy nhiệt Plexis Heat-Protector, chạy máy kích nhiệt ngắt quãng (40-60 độ C tùy chất tóc).</div>\n                    </div>\n                    <div class=\"flex items-start gap-3 p-3 bg-white dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700\">\n                        <span class=\"w-6 h-6 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-xs shrink-0\">6</span>\n                        <div><strong>Bước 6 - Định hình dập số 2 (Neutralizer):</strong> Tra thuốc dập khóa nếp, cố định liên kết lưu huỳnh trong 10-15 phút.</div>\n                    </div>\n                    <div class=\"flex items-start gap-3 p-3 bg-white dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700\">\n                        <span class=\"w-6 h-6 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-xs shrink-0\">7</span>\n                        <div><strong>Bước 7 - Xả dưỡng hoàn thiện & Hướng dẫn sấy:</strong> Khóa dưỡng chất bằng mặt nạ phục hồi, hướng dẫn khách sấy lọn tay tạo kiểu tại nhà.</div>\n                    </div>\n                </div>\n                "}, {"tab": "quiz", "name": "Trắc Nghiệm Kiến Thức Hóa Tóc", "content": "\n                <div class=\"p-5 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700\">\n                    <div class=\"font-bold text-slate-900 dark:text-white mb-2\">Câu hỏi: Khi xử lý một mái tóc đã từng tẩy 2 lần để nhuộm màu khói, nếu chủ salon dùng thuốc uốn có nồng độ pH 9.5 truyền thống thì hiện tượng gì chắc chắn sẽ xảy ra?</div>\n                    <div class=\"space-y-2 mt-3 text-sm text-slate-700 dark:text-slate-300\">\n                        <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/50 cursor-pointer\">\n                            <input type=\"radio\" name=\"q3\" value=\"a\" class=\"mr-2\"> A. Sóng tóc sẽ xoăn tít và giữ nếp rất lâu vì độ kiềm cao mở biểu bì sâu.\n                        </label>\n                        <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/50 cursor-pointer\">\n                            <input type=\"radio\" name=\"q3\" value=\"b\" class=\"mr-2\"> B. Tóc bị nhũn, đứt gãy và cháy sun (over-processed) do liên kết disunphua đã bị phá hủy hoàn toàn ở môi trường kiềm mạnh.\n                        </label>\n                        <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/50 cursor-pointer\">\n                            <input type=\"radio\" name=\"q3\" value=\"c\" class=\"mr-2\"> C. Tóc không hề ăn thuốc và giữ nguyên trạng thái cũ.\n                        </label>\n                    </div>\n                    <div class=\"mt-4 p-3 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 rounded-lg text-xs text-emerald-800 dark:text-emerald-300 hidden\" id=\"q3-ans\">\n                        <strong>Đáp án chính xác: B!</strong> Tóc tẩy là tóc đã mất đi lớp màng lipid bảo vệ và cấu trúc tủy tóc rỗng. Chỉ có hệ thống uốn axit hoặc trung tính (pH 4.5 - 5.5 như Plexis Acid Wave) sử dụng Cysteamine mới có thể uốn được tóc tẩy mà không làm nát tóc.\n                    </div>\n                    <button onclick=\"document.getElementById('q3-ans').classList.toggle('hidden')\" class=\"mt-3 px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded text-xs font-semibold\">Xem Giải Thích Học Thuật</button>\n                </div>\n                "}]}, {"id": 4, "title": "Đề Án Chiến Lược 2026–2030 & Head-to-Head Battlecard", "subtitle": "So găng trực diện Milbon, L'Oréal, Cẩm Tú; chiến lược chiếm lĩnh thị phần ngách và phòng thủ đại lý", "badge": "Chiến Lược Cạnh Tranh & Thị Trường", "duration": "30 phút học", "lessons": [{"tab": "core", "name": "Bản Đồ Cạnh Tranh & Head-to-Head Battlecard", "content": "\n                <div class=\"space-y-6\">\n                    <h4 class=\"text-xl font-bold text-slate-900 dark:text-white\">⚔️ Phân Tích Cục Diện Đối Thủ Trên Thị Trường Salon Việt Nam</h4>\n                    <p class=\"text-slate-600 dark:text-slate-300\">\n                        Thị trường phân phối salon chia làm 3 nhóm đối thủ chính:\n                    </p>\n                    <div class=\"grid md:grid-cols-3 gap-4 text-sm\">\n                        <div class=\"p-4 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm\">\n                            <div class=\"font-bold text-red-600 mb-1\">1. Nhóm Đa Quốc Gia Cao Cấp</div>\n                            <div class=\"text-xs text-slate-500 mb-2\">L'Oréal Professionnel, Milbon, Wella, Goldwell</div>\n                            <p class=\"text-xs text-slate-600 dark:text-slate-300\"><strong>Thế mạnh:</strong> Thương hiệu toàn cầu, ngân sách marketing khổng lồ, salon VIP tự hào khi trưng bày.</p>\n                            <p class=\"text-xs text-red-600 mt-2\"><strong>Điểm yếu tử huyệt:</strong> Giá quá cao, chính sách chiết khấu cứng nhắc, ít hỗ trợ đào tạo cầm tay chỉ việc cho thợ salon tỉnh.</p>\n                        </div>\n                        <div class=\"p-4 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm\">\n                            <div class=\"font-bold text-amber-600 mb-1\">2. Nhóm Nhà Nhập Khẩu B2B Truyền Thống</div>\n                            <div class=\"text-xs text-slate-500 mb-2\">Cẩm Tú, Obsidian, Nouvelle, Alonzo, Tricol</div>\n                            <p class=\"text-xs text-slate-600 dark:text-slate-300\"><strong>Thế mạnh:</strong> Thâm niên 15-20 năm, hệ thống đại lý chân rết sâu tại các tỉnh thành, quan hệ cá nhân tốt.</p>\n                            <p class=\"text-xs text-amber-600 mt-2\"><strong>Điểm yếu tử huyệt:</strong> Hình ảnh già cỗi, thiếu đào tạo xu hướng hot trend Gen Z, truyền thông mạng xã hội yếu kém.</p>\n                        </div>\n                        <div class=\"p-4 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm\">\n                            <div class=\"font-bold text-blue-600 mb-1\">3. Vị Thế Của DTD & VACP Group</div>\n                            <div class=\"text-xs text-slate-500 mb-2\">Sự kết hợp giữa Giá Thành Tối Ưu & Giáo Dục Đột Phá</div>\n                            <p class=\"text-xs text-slate-600 dark:text-slate-300\"><strong>Chiến lược đòn bẩy:</strong> Lấy chất lượng và giá của GLEM bao vây salon tỉnh, đồng thời dùng VACP Academy và PLEXIS đánh chiếm các salon VIP khát khao kỹ thuật mới.</p>\n                        </div>\n                    </div>\n                </div>\n                "}, {"tab": "data", "name": "Bảng Head-to-Head So Sánh 7S McKinsey (VACP vs Milbon)", "content": "\n                <div class=\"overflow-x-auto\">\n                    <table class=\"w-full text-sm text-left border-collapse\">\n                        <thead class=\"bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 uppercase text-xs\">\n                            <tr>\n                                <th class=\"p-3 border border-slate-200 dark:border-slate-700\">Yếu Tố 7S McKinsey</th>\n                                <th class=\"p-3 border border-slate-200 dark:border-slate-700 text-blue-600 font-bold\">VACP GROUP (Plexis & Demi)</th>\n                                <th class=\"p-3 border border-slate-200 dark:border-slate-700 text-slate-600 font-bold\">MILBON VIỆT NAM</th>\n                            </tr>\n                        </thead>\n                        <tbody class=\"divide-y divide-slate-200 dark:divide-slate-700 text-slate-600 dark:text-slate-300 text-xs\">\n                            <tr>\n                                <td class=\"p-3 font-semibold border border-slate-200 dark:border-slate-700\">Strategy (Chiến Lược)</td>\n                                <td class=\"p-3 border border-slate-200 dark:border-slate-700\">Linh hoạt, đào tạo thực chiến tại salon, đóng gói combo hỗ trợ thiết bị</td>\n                                <td class=\"p-3 border border-slate-200 dark:border-slate-700\">Định vị siêu cao cấp, chọn lọc khắt khe số lượng salon được bán</td>\n                            </tr>\n                            <tr>\n                                <td class=\"p-3 font-semibold border border-slate-200 dark:border-slate-700\">Structure (Cơ Cấu)</td>\n                                <td class=\"p-3 border border-slate-200 dark:border-slate-700\">Phẳng, ra quyết định tài trợ salon trong 24h, hỗ trợ trực tiếp chủ salon</td>\n                                <td class=\"p-3 border border-slate-200 dark:border-slate-700\">Phân cấp nhiều tầng, duyệt chính sách mất nhiều tuần qua công ty mẹ tại Nhật</td>\n                            </tr>\n                            <tr>\n                                <td class=\"p-3 font-semibold border border-slate-200 dark:border-slate-700\">Systems (Hệ Thống)</td>\n                                <td class=\"p-3 border border-slate-200 dark:border-slate-700\">Tự động hóa ERP MISA, Zalo bot chăm sóc salon, CRM kết nối trực tiếp</td>\n                                <td class=\"p-3 border border-slate-200 dark:border-slate-700\">Hệ thống báo cáo toàn cầu, bảo thủ trong tương tác mạng xã hội địa phương</td>\n                            </tr>\n                            <tr>\n                                <td class=\"p-3 font-semibold border border-slate-200 dark:border-slate-700\">Shared Values (Giá Trị Chung)</td>\n                                <td class=\"p-3 border border-slate-200 dark:border-slate-700\">Đồng hành cùng sự giàu có của chủ Salon (\"Giúp salon đông khách và tăng giá dịch vụ\")</td>\n                                <td class=\"p-3 border border-slate-200 dark:border-slate-700\">Tôn vinh nghệ thuật truyền thống của nhà tạo mẫu tóc Nhật Bản</td>\n                            </tr>\n                            <tr>\n                                <td class=\"p-3 font-semibold border border-slate-200 dark:border-slate-700\">Style (Phong Cách Lãnh Đạo)</td>\n                                <td class=\"p-3 border border-slate-200 dark:border-slate-700\">Máu lửa, tốc chiến, thực chiến lăn xả tại hiện trường</td>\n                                <td class=\"p-3 border border-slate-200 dark:border-slate-700\">Chuẩn mực, lịch thiệp, giữ khoảng cách thương hiệu</td>\n                            </tr>\n                        </tbody>\n                    </table>\n                </div>\n                "}, {"tab": "checklist", "name": "Kịch Bản Battlecard Khi Chào Hàng Salon VIP", "content": "\n                <div class=\"space-y-4\">\n                    <h4 class=\"font-bold text-slate-900 dark:text-white\">🎯 Xử Lý Lời Từ Chối Của Chủ Salon VIP:</h4>\n                    <div class=\"p-4 bg-slate-50 dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700 space-y-3 text-sm text-slate-700 dark:text-slate-300\">\n                        <div>\n                            <div class=\"font-bold text-red-600\">Khách nói: \"Salon anh quen dùng L'Oréal / Milbon rồi, khách hàng chỉ biết thương hiệu đó thôi.\"</div>\n                            <div class=\"mt-1 text-slate-600 dark:text-slate-300\"><strong>Sales phản hồi theo Battlecard:</strong> <em>\"Dạ em rất hiểu, L'Oréal là thương hiệu quốc tế rất tốt để kéo uy tín ban đầu. Nhưng anh có nhận thấy hiện nay khách làm dịch vụ uốn phục hồi cao cấp họ quan tâm nhất là: <strong>Tóc sau uốn có mềm mượt như chưa uốn không và có bị hôi mùi thuốc không?</strong> PLEXIS sở hữu công nghệ Cysteamine chuẩn Seoul giúp anh nâng giá dịch vụ uốn từ 800k lên 1tr8 mà khách hoàn toàn hài lòng. Em xin phép gửi chuyên gia Academy qua làm thử 1 mẫu tóc nát nhất tại salon anh ngay chiều nay để anh trực tiếp kiểm chứng.\"</em></div>\n                        </div>\n                    </div>\n                </div>\n                "}, {"tab": "quiz", "name": "Trắc Nghiệm Chiến Lược Cạnh Tranh", "content": "\n                <div class=\"p-5 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700\">\n                    <div class=\"font-bold text-slate-900 dark:text-white mb-2\">Câu hỏi: Chiến lược \"Bao vây nông thôn, đánh chiếm thành thị\" của DTD Holding & VACP Group được thể hiện qua hành động nào dưới đây?</div>\n                    <div class=\"space-y-2 mt-3 text-sm text-slate-700 dark:text-slate-300\">\n                        <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/50 cursor-pointer\">\n                            <input type=\"radio\" name=\"q4\" value=\"a\" class=\"mr-2\"> A. Hạ giá tất cả các sản phẩm xuống mức rẻ nhất thị trường để đánh bật đối thủ.\n                        </label>\n                        <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/50 cursor-pointer\">\n                            <input type=\"radio\" name=\"q4\" value=\"b\" class=\"mr-2\"> B. Dùng GLEM phủ sóng toàn bộ 21 NPP và salon các tỉnh thành để tạo dòng tiền vững chắc và thị phần số đông, sau đó đưa PLEXIS và VACP Academy thâm nhập các salon VIP trung tâm để chiếm đỉnh cao thương hiệu.\n                        </label>\n                        <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/50 cursor-pointer\">\n                            <input type=\"radio\" name=\"q4\" value=\"c\" class=\"mr-2\"> C. Ngừng hoàn toàn bán hàng cho salon tỉnh để tập trung mở chuỗi salon tự doanh tại Hà Nội và TP.HCM.\n                        </label>\n                    </div>\n                    <div class=\"mt-4 p-3 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 rounded-lg text-xs text-emerald-800 dark:text-emerald-300 hidden\" id=\"q4-ans\">\n                        <strong>Đáp án chính xác: B!</strong> Đây là chiến lược kinh điển: Lấy dòng tiền ổn định từ thị trường đại chúng (GLEM) nuôi dưỡng đầu tư cho phân khúc cao cấp (VACP/Plexis), tạo ra thế trận kiềng 3 chân không thể bị đánh bại.\n                    </div>\n                    <button onclick=\"document.getElementById('q4-ans').classList.toggle('hidden')\" class=\"mt-3 px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded text-xs font-semibold\">Xem Giải Thích Học Thuật</button>\n                </div>\n                "}]}, {"id": 5, "title": "Mô Hình Tài Chính, Dòng Tiền 53 Tháng & Quản Trị P&L B2B Thực Chiến", "subtitle": "Kỹ trị tài chính MISA, quản trị công nợ 21 NPP, thuật toán Đặt hàng v4 và hệ số mùa vụ Tết", "badge": "Tài Chính & Chuỗi Cung Ứng", "duration": "35 phút học", "lessons": [{"tab": "core", "name": "Bản Đồ Tài Chính & Dòng Tiền 53 Tháng", "content": "\n                <div class=\"space-y-6\">\n                    <div class=\"bg-emerald-50 dark:bg-slate-800/60 p-5 rounded-xl border border-emerald-200 dark:border-slate-700\">\n                        <h4 class=\"text-lg font-bold text-emerald-900 dark:text-emerald-300 mb-2\">💵 Nghệ Thuật Quản Trị Dòng Tiền Phân Phối B2B</h4>\n                        <p class=\"text-slate-700 dark:text-slate-300 leading-relaxed\">\n                            Trong kinh doanh phân phối mỹ phẩm tóc, <em>\"Doanh số là hư danh, Lợi nhuận là thực tế, nhưng Dòng tiền mới là sinh mạng\"</em>. Nhiều doanh nghiệp phân phối đạt doanh số trăm tỷ nhưng vẫn phá sản vì <strong>bị chôn vốn trong hàng tồn kho và công nợ đại lý quá hạn</strong>.\n                        </p>\n                    </div>\n\n                    <h4 class=\"text-xl font-bold text-slate-900 dark:text-white mt-4\">📊 Cấu Trúc P&L Chuẩn Mực Ngành Mỹ Phẩm Tóc B2B</h4>\n                    <div class=\"space-y-2 text-sm text-slate-600 dark:text-slate-300\">\n                        <div class=\"flex justify-between items-center p-3 bg-white dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700\">\n                            <span class=\"font-bold text-slate-800 dark:text-slate-200\">1. Doanh Thu Thuần (Net Revenue)</span>\n                            <span class=\"font-mono font-bold text-blue-600\">100%</span>\n                        </div>\n                        <div class=\"flex justify-between items-center p-3 bg-white dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700\">\n                            <span class=\"text-slate-600 dark:text-slate-300\">2. Giá Vốn Hàng Bán (COGS - Nhập khẩu & Đóng gói)</span>\n                            <span class=\"font-mono font-bold text-red-500\">35% - 42%</span>\n                        </div>\n                        <div class=\"flex justify-between items-center p-3 bg-white dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700\">\n                            <span class=\"font-bold text-emerald-600\">3. Lợi Nhuận Gộp (Gross Margin)</span>\n                            <span class=\"font-mono font-bold text-emerald-600\">58% - 65%</span>\n                        </div>\n                        <div class=\"flex justify-between items-center p-3 bg-white dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700\">\n                            <span class=\"text-slate-600 dark:text-slate-300\">4. Chi Phí Bán Hàng (Sales, Chiết khấu NPP, Vận chuyển)</span>\n                            <span class=\"font-mono font-bold text-amber-500\">18% - 22%</span>\n                        </div>\n                        <div class=\"flex justify-between items-center p-3 bg-white dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700\">\n                            <span class=\"text-slate-600 dark:text-slate-300\">5. Chi Phí Marketing, Academy & Tài Trợ Hair Show</span>\n                            <span class=\"font-mono font-bold text-purple-500\">10% - 12%</span>\n                        </div>\n                        <div class=\"flex justify-between items-center p-3 bg-white dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700\">\n                            <span class=\"text-slate-600 dark:text-slate-300\">6. Chi Phí Quản Lý Doanh Nghiệp (G&A, Văn phòng, Lương cứng)</span>\n                            <span class=\"font-mono font-bold text-slate-500\">8% - 10%</span>\n                        </div>\n                        <div class=\"flex justify-between items-center p-3 bg-emerald-50 dark:bg-emerald-950/40 rounded-lg border border-emerald-300 dark:border-emerald-800\">\n                            <span class=\"font-bold text-emerald-900 dark:text-emerald-300\">7. Lợi Nhuận Thuần Trước Thuế (EBITDA Margin)</span>\n                            <span class=\"font-mono font-bold text-emerald-600\">18% - 25%</span>\n                        </div>\n                    </div>\n                </div>\n                "}, {"tab": "data", "name": "Bảng Phân Tích Công Nợ 21 NPP & Bẫy Mùa Vụ", "content": "\n                <div class=\"space-y-4\">\n                    <h5 class=\"font-bold text-slate-900 dark:text-white\">🎯 3 Vùng Kiểm Soát Công Nợ Đại Lý NPP:</h5>\n                    <div class=\"grid md:grid-cols-3 gap-4 text-xs\">\n                        <div class=\"p-4 bg-emerald-50 dark:bg-slate-800 border-l-4 border-emerald-500 rounded-lg border border-slate-200 dark:border-slate-700\">\n                            <div class=\"font-bold text-emerald-800 dark:text-emerald-300 mb-1\">VÙNG XANH (An Toàn: 0 - 30 ngày)</div>\n                            <p class=\"text-slate-600 dark:text-slate-300\">Công nợ trong hạn định mức hợp đồng. Cho phép xuất đơn hàng tiếp theo bình thường. Hưởng chiết khấu thanh toán nhanh 2%.</p>\n                        </div>\n                        <div class=\"p-4 bg-amber-50 dark:bg-slate-800 border-l-4 border-amber-500 rounded-lg border border-slate-200 dark:border-slate-700\">\n                            <div class=\"font-bold text-amber-800 dark:text-amber-300 mb-1\">VÙNG VÀNG (Cảnh Báo: 31 - 45 ngày)</div>\n                            <p class=\"text-slate-600 dark:text-slate-300\">Quá hạn mức từ 1 - 15 ngày. Khóa đơn hàng mới trên MISA. Yêu cầu thanh toán tối thiểu 50% số nợ cũ mới được xuất hàng bù.</p>\n                        </div>\n                        <div class=\"p-4 bg-red-50 dark:bg-slate-800 border-l-4 border-red-500 rounded-lg border border-slate-200 dark:border-slate-700\">\n                            <div class=\"font-bold text-red-800 dark:text-red-300 mb-1\">VÙNG ĐỎ (Báo Động: > 45 ngày)</div>\n                            <p class=\"text-slate-600 dark:text-slate-300\">Dừng toàn bộ quan hệ thương mại. Giám đốc kinh doanh vùng trực tiếp xuống đối soát kho NPP, thu hồi hàng tồn hoặc chuyển sang thu hồi pháp lý.</p>\n                        </div>\n                    </div>\n\n                    <div class=\"p-4 bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 mt-4\">\n                        <h5 class=\"font-bold text-slate-900 dark:text-white mb-2\">📈 Thuật Toán Đặt Hàng v4 & Hệ Số Mùa Vụ Tết:</h5>\n                        <p class=\"text-xs text-slate-600 dark:text-slate-300 leading-relaxed\">\n                            Doanh số ngành tóc biến động cực mạnh vào dịp Tết Nguyên Đán: Doanh số tháng 11 - 12 âm lịch có thể <strong>tăng gấp 3.5 - 4.5 lần</strong> so với các tháng bình thường trong năm. Nếu không dùng thuật toán Đặt hàng v4 với hệ số mùa vụ (Seasonal Factor), doanh nghiệp sẽ:\n                        </p>\n                        <ul class=\"text-xs text-slate-600 dark:text-slate-300 mt-2 space-y-1 list-disc pl-4\">\n                            <li><strong>Cháy hàng tháng Chạp:</strong> Mất hàng chục tỷ doanh thu vì nhà máy nước ngoài không kịp sản xuất và vận chuyển đường biển mất 45 ngày.</li>\n                            <li><strong>Chết vốn tồn kho tháng Giêng:</strong> Nhập ồ ạt nhưng sau Tết nhu cầu làm tóc rơi tự do, hàng ôm cả năm hết hạn sử dụng.</li>\n                        </ul>\n                    </div>\n                </div>\n                "}, {"tab": "checklist", "name": "Checklist Kiểm Soát Dòng Tiền & Đặt Hàng", "content": "\n                <div class=\"space-y-3\">\n                    <label class=\"flex items-start gap-3 p-3 bg-white dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700 cursor-pointer\">\n                        <input type=\"checkbox\" class=\"mt-1 rounded text-blue-600\">\n                        <span class=\"text-sm text-slate-700 dark:text-slate-300\"><strong>Nguyên tắc \"Tách Mã Yếu Khỏi Thiếu Hàng\":</strong> Không đánh đồng việc NPP không bán được một mã hàng là do thiếu hàng. Phải kiểm tra tồn kho tại đại lý trước khi duyệt kế hoạch nhập thêm.</span>\n                    </label>\n                    <label class=\"flex items-start gap-3 p-3 bg-white dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700 cursor-pointer\">\n                        <input type=\"checkbox\" class=\"mt-1 rounded text-blue-600\">\n                        <span class=\"text-sm text-slate-700 dark:text-slate-300\"><strong>Khóa đơn tự động trên MISA:</strong> Kế toán không được phép bấm xuất kho nếu hệ thống báo NPP đã vượt quá hạn mức nợ (Credit Limit), trừ khi có phê duyệt đặc cách bằng văn bản từ CEO.</span>\n                    </label>\n                    <label class=\"flex items-start gap-3 p-3 bg-white dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700 cursor-pointer\">\n                        <input type=\"checkbox\" class=\"mt-1 rounded text-blue-600\">\n                        <span class=\"text-sm text-slate-700 dark:text-slate-300\"><strong>Dự báo đặt hàng trước 60 ngày:</strong> Đơn hàng phục vụ cao điểm Tết (tháng 11-12) bắt buộc phải chốt số lượng với nhà máy Hàn Quốc/Nhật Bản chậm nhất vào ngày 15 tháng 9.</span>\n                    </label>\n                </div>\n                "}, {"tab": "quiz", "name": "Trắc Nghiệm Tài Chính Thực Chiến", "content": "\n                <div class=\"p-5 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700\">\n                    <div class=\"font-bold text-slate-900 dark:text-white mb-2\">Câu hỏi: Một NPP tỉnh muốn đặt thêm 500 triệu tiền hàng trước thềm vụ Tết, nhưng hiện tại họ vẫn còn 300 triệu nợ quá hạn 40 ngày (vùng vàng). Là Giám đốc Tài chính (CFO), bạn sẽ xử lý như thế nào?</div>\n                    <div class=\"space-y-2 mt-3 text-sm text-slate-700 dark:text-slate-300\">\n                        <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/50 cursor-pointer\">\n                            <input type=\"radio\" name=\"q5\" value=\"a\" class=\"mr-2\"> A. Cho xuất tiếp 500 triệu hàng vì Tết là cơ hội lớn nhất trong năm, không bán sẽ mất thị phần vào tay đối thủ.\n                        </label>\n                        <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/50 cursor-pointer\">\n                            <input type=\"radio\" name=\"q5\" value=\"b\" class=\"mr-2\"> B. Yêu cầu NPP chuyển khoản thanh toán dứt điểm 300 triệu nợ cũ, và đơn hàng mới 500 triệu phải thanh toán tiền mặt 100% trước khi xe xuất kho (hoặc tối thiểu thanh toán 70% và cam kết trả trước 28 Tết).\n                        </label>\n                        <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/50 cursor-pointer\">\n                            <input type=\"radio\" name=\"q5\" value=\"c\" class=\"mr-2\"> C. Cắt hợp đồng và từ chối vĩnh viễn không bao giờ bán hàng cho đại lý này nữa.\n                        </label>\n                    </div>\n                    <div class=\"mt-4 p-3 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 rounded-lg text-xs text-emerald-800 dark:text-emerald-300 hidden\" id=\"q5-ans\">\n                        <strong>Đáp án chính xác: B!</strong> Trong ngành phân phối B2B, trước Tết các đại lý thu tiền mặt từ salon rất nhiều. Đây là thời điểm vàng để thu hồi nợ cũ. Nếu thả lỏng cho nợ thêm 500 triệu, sau Tết salon đóng cửa nghỉ xả hơi, NPP sẽ chây ì và số tiền 800 triệu đó nguy cơ cao biến thành nợ xấu khó đòi.\n                    </div>\n                    <button onclick=\"document.getElementById('q5-ans').classList.toggle('hidden')\" class=\"mt-3 px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded text-xs font-semibold\">Xem Giải Thích Học Thuật</button>\n                </div>\n                "}]}, {"id": 6, "title": "Go-To-Market (GTM), VACP Academy & Binh Pháp Chiếm Lĩnh Salon Tỉnh", "subtitle": "Học viện đào tạo như động cơ bán hàng, tổ chức Hair Show 300 salon, kịch bản chốt đơn combo tại chỗ", "badge": "Marketing & Bán Hàng B2B", "duration": "30 phút học", "lessons": [{"tab": "core", "name": "Binh Pháp GTM: Bán Hàng Bằng Giáo Dục (Education-led Selling)", "content": "\n                <div class=\"space-y-6\">\n                    <div class=\"bg-amber-50 dark:bg-slate-800/60 p-5 rounded-xl border border-amber-200 dark:border-slate-700\">\n                        <h4 class=\"text-lg font-bold text-amber-900 dark:text-amber-300 mb-2\">🎓 Tại Sao Quảng Cáo Truyền Thống Thất Bại Tại Kênh Salon?</h4>\n                        <p class=\"text-slate-700 dark:text-slate-300 leading-relaxed\">\n                            Chủ salon tóc là những người có <strong>tôi nghề nghiệp (craftsman ego)</strong> rất cao. Họ không bao giờ mua thuốc uốn nhuộm chỉ vì xem một bài quảng cáo Facebook hay một tờ rơi giới thiệu chiết khấu cao. Họ chỉ tin khi <strong>chính tay họ cầm bát thuốc, bôi lên tóc khách hàng và thấy tóc xoăn bóng đàn hồi</strong>.\n                        </p>\n                    </div>\n\n                    <h4 class=\"text-xl font-bold text-slate-900 dark:text-white mt-4\">🚀 Cỗ Máy VACP Academy: Chuyển Hóa Kỹ Thuật Thành Doanh Số</h4>\n                    <div class=\"grid md:grid-cols-2 gap-4 text-sm\">\n                        <div class=\"p-4 bg-white dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700\">\n                            <div class=\"font-bold text-blue-600 mb-2\">1. Khóa Học \"Bí Mật Uốn Sóng Chuẩn Seoul\"</div>\n                            <p class=\"text-xs text-slate-600 dark:text-slate-300\">Đào tạo miễn phí hoặc thu phí tượng trưng cho 30 - 50 chủ salon tại trung tâm tỉnh. Giảng viên trực tiếp biểu diễn kỹ thuật uốn trên các mái tóc nát, tóc tẩy hư tổn.</p>\n                        </div>\n                        <div class=\"p-4 bg-white dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700\">\n                            <div class=\"font-bold text-amber-600 mb-2\">2. Gói Chuyển Giao Công Nghệ (Launch Pack)</div>\n                            <p class=\"text-xs text-slate-600 dark:text-slate-300\">Ngay sau buổi đào tạo khi salon chứng kiến sự kỳ diệu của sản phẩm, tung gói combo: <em>\"Mua 1 thùng thuốc uốn Plexis tặng máy kích nhiệt + Biển chứng nhận Salon Đối Tác Độc Quyền Seoul\"</em>. Tỷ lệ chốt đơn đạt trên <strong>65% tại lớp</strong>.</p>\n                        </div>\n                    </div>\n                </div>\n                "}, {"tab": "data", "name": "Kịch Bản Tổ Chức Hair Show & Workshop Tỉnh (100 - 300 Khách)", "content": "\n                <div class=\"space-y-4 text-xs text-slate-600 dark:text-slate-300\">\n                    <div class=\"p-3 bg-white dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700\">\n                        <strong>T-30 ngày (Chuẩn bị):</strong> Phối hợp NPP tỉnh lên danh sách 300 chủ salon có doanh thu > 50tr/tháng. Gửi thiệp mời VIP sang trọng mạ vàng tận tay.\n                    </div>\n                    <div class=\"p-3 bg-white dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700\">\n                        <strong>T-7 ngày (Hâm nóng):</strong> Master Educator livestream chia sẻ 1 mẹo xử lý tóc tẩy không sun, thông báo sẽ thực hiện trên sân khấu trực tiếp tại sự kiện.\n                    </div>\n                    <div class=\"p-3 bg-white dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700\">\n                        <strong>Ngày D (Sự kiện):</strong>\n                        <ul class=\"list-disc pl-4 mt-1 space-y-1\">\n                            <li>13h30 - 14h00: Check-in, chụp hình backdrop sang trọng phong cách K-Beauty.</li>\n                            <li>14h00 - 16h00: Trình diễn kỹ thuật uốn đa tầng Plexis trên 4 người mẫu thật.</li>\n                            <li>16h00 - 17h00: Công bố chính sách ưu đãi bùng nổ duy nhất trong ngày + Bốc thăm trúng thưởng xe máy / chuyến du lịch Hàn Quốc.</li>\n                        </ul>\n                    </div>\n                </div>\n                "}, {"tab": "checklist", "name": "Checklist Ký Hợp Đồng KOL & Salon VIP", "content": "\n                <div class=\"space-y-2 text-sm text-slate-700 dark:text-slate-300\">\n                    <label class=\"flex items-start gap-2 p-2.5 bg-white dark:bg-slate-800 rounded border border-slate-200 dark:border-slate-700\">\n                        <input type=\"checkbox\" class=\"mt-1\">\n                        <span><strong>Cam kết độc quyền vùng:</strong> Không cấp hàng cho salon thứ 2 trong bán kính 1km đối với dòng cao cấp.</span>\n                    </label>\n                    <label class=\"flex items-start gap-2 p-2.5 bg-white dark:bg-slate-800 rounded border border-slate-200 dark:border-slate-700\">\n                        <input type=\"checkbox\" class=\"mt-1\">\n                        <span><strong>Tài trợ hình ảnh POSM:</strong> Thiết kế bảng hiệu, standee, tạp chí mẫu tóc đặt tại bàn chờ của salon.</span>\n                    </label>\n                    <label class=\"flex items-start gap-2 p-2.5 bg-white dark:bg-slate-800 rounded border border-slate-200 dark:border-slate-700\">\n                        <input type=\"checkbox\" class=\"mt-1\">\n                        <span><strong>Sản xuất video TikTok cho chủ salon:</strong> Ekip media của VACP quay video biến hình cho khách tại salon, kéo khách tới cho chủ salon.</span>\n                    </label>\n                </div>\n                "}, {"tab": "quiz", "name": "Trắc Nghiệm Binh Pháp GTM", "content": "\n                <div class=\"p-5 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700\">\n                    <div class=\"font-bold text-slate-900 dark:text-white mb-2\">Câu hỏi: Đâu là sai lầm phổ biến nhất của các thương hiệu mỹ phẩm tóc mới khi tiếp cận các Salon VIP?</div>\n                    <div class=\"space-y-2 mt-3 text-sm text-slate-700 dark:text-slate-300\">\n                        <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/50 cursor-pointer\">\n                            <input type=\"radio\" name=\"q6\" value=\"a\" class=\"mr-2\"> A. Cố gắng bán đứt sản phẩm ngay lần đầu gặp mặt bằng cách mời chào chiết khấu cao mà không chứng minh được đẳng cấp kỹ thuật.\n                        </label>\n                        <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/50 cursor-pointer\">\n                            <input type=\"radio\" name=\"q6\" value=\"b\" class=\"mr-2\"> B. Mời chủ salon đi ăn tối giao lưu.\n                        </label>\n                        <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/50 cursor-pointer\">\n                            <input type=\"radio\" name=\"q6\" value=\"c\" class=\"mr-2\"> C. Mời chủ salon tham gia khóa học nâng cao tay nghề.\n                        </label>\n                    </div>\n                    <div class=\"mt-4 p-3 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 rounded-lg text-xs text-emerald-800 dark:text-emerald-300 hidden\" id=\"q6-ans\">\n                        <strong>Đáp án chính xác: A!</strong> Salon VIP định vị thương hiệu rất cao, nếu tiếp cận bằng bài ca \"chiết khấu rẻ\" họ sẽ xếp ngay sản phẩm vào hàng bình dân kém chất lượng. Phải tiếp cận bằng giá trị kỹ thuật và sự tôn vinh tay nghề của họ.\n                    </div>\n                    <button onclick=\"document.getElementById('q6-ans').classList.toggle('hidden')\" class=\"mt-3 px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded text-xs font-semibold\">Xem Giải Thích Học Thuật</button>\n                </div>\n                "}]}, {"id": 7, "title": "E-Commerce D2C & Chiến Lược Phễu Traffic Đại Dương Xanh (Case Top Gia 725 Tỷ)", "subtitle": "Giải mã case study Top Gia 725 tỷ, setup cỗ máy khởi nghiệp D2C 5 người, ma trận SKU và tối ưu TikTok Shop", "badge": "E-Commerce & Startup D2C", "duration": "35 phút học", "lessons": [{"tab": "core", "name": "Bóc Tách Case Study TOP GIA 725 Tỷ & Phễu Đại Dương Xanh", "content": "\n                <div class=\"space-y-6\">\n                    <div class=\"bg-cyan-50 dark:bg-slate-800/60 p-5 rounded-xl border border-cyan-200 dark:border-slate-700\">\n                        <h4 class=\"text-lg font-bold text-cyan-900 dark:text-cyan-300 mb-2\">🔥 Hiện Tượng TOP GIA: 725 Tỷ GMV Từ Ngành Giấy Khăn Lau</h4>\n                        <p class=\"text-slate-700 dark:text-slate-300 leading-relaxed\">\n                            Top Gia đã tạo nên một cơn địa chấn trong ngành TMĐT Việt Nam khi đạt mức doanh thu hơn <strong>725 tỷ VND</strong> nhờ chiến lược: <strong>Sản phẩm mồi siêu rẻ (Tripwire) -> Thao túng thuật toán Livestream TikTok -> Upsell combo gia đình -> Lãi lớn từ tái mua hàng (Retention)</strong>.\n                        </p>\n                    </div>\n\n                    <h4 class=\"text-xl font-bold text-slate-900 dark:text-white mt-4\">🌊 Ứng Dụng Sang Ngành Mỹ Phẩm Tóc (Dự Án AINEOR D2C)</h4>\n                    <div class=\"grid md:grid-cols-4 gap-3 text-center text-sm\">\n                        <div class=\"p-4 bg-white dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700\">\n                            <div class=\"text-xs font-bold text-blue-600 mb-1\">TẦNG 1: SẢN PHẨM MỒI</div>\n                            <div class=\"font-bold text-sm\">Mini-Size / Lược gội</div>\n                            <div class=\"text-xs text-slate-500 mt-1\">Giá: 29k - 49k. Mục đích: Phá vỡ rào cản mua hàng lần đầu.</div>\n                        </div>\n                        <div class=\"p-4 bg-white dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700\">\n                            <div class=\"text-xs font-bold text-amber-600 mb-1\">TẦNG 2: CHỦ LỰC (HERO)</div>\n                            <div class=\"font-bold text-sm\">Dầu Gội Trị Liệu</div>\n                            <div class=\"text-xs text-slate-500 mt-1\">Giá: 189k - 249k. Tỷ trọng 60% doanh số, giải quyết rụng tóc.</div>\n                        </div>\n                        <div class=\"p-4 bg-white dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700\">\n                            <div class=\"text-xs font-bold text-emerald-600 mb-1\">TẦNG 3: BÁN KÈM (CROSS-SELL)</div>\n                            <div class=\"font-bold text-sm\">Xịt Dưỡng Peptide</div>\n                            <div class=\"text-xs text-slate-500 mt-1\">Giá: 149k - 199k. Tăng giá trị đơn hàng (AOV > 350k).</div>\n                        </div>\n                        <div class=\"p-4 bg-white dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700\">\n                            <div class=\"text-xs font-bold text-purple-600 mb-1\">TẦNG 4: THÀNH VIÊN VIP</div>\n                            <div class=\"font-bold text-sm\">Combo Chăm Sóc Năm</div>\n                            <div class=\"text-xs text-slate-500 mt-1\">Giá: 699k - 999k. Dòng tiền tái sinh (LTV cao).</div>\n                        </div>\n                    </div>\n                </div>\n                "}, {"tab": "data", "name": "Mô Hình Nhân Bản Đội Ngũ Ecom Tinh Gọn 5 Người", "content": "\n                <div
