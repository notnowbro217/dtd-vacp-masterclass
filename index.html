    <script>
        const dtdData = {"company": "DTD HOLDING", "track_title": "Học Viện Quản Trị B2B & Phân Phối Mỹ Phẩm Tóc Toàn Quốc", "tagline": "Cẩm nang học thuật & vận hành thực chiến dành riêng cho Ban Lãnh đạo, Khối Bán hàng B2B, Kế toán MISA và Chuỗi cung ứng SCM DTD Holding", "icon": "🏛️", "modules": [{"id": "dtd_m1", "title": "Module 1: Tầm Nhìn Chiến Lược 2026–2030, 5 Tư Duy Lãnh Đạo & Triết Lý Vận Hành 5 Hóa DTD Holding", "subtitle": "Hành trình phát triển, sứ mệnh phụng sự Salon đại chúng, mục tiêu phủ sóng 65 NPP và kỷ luật văn hóa 5 Hóa", "duration": "35 phút học", "lessons": [{"tab": "theory", "name": "1. Lịch Sử, Sứ Mệnh & Tầm Nhìn Chiến Lược 2026–2030", "content": "\n                    <div class=\"space-y-6 text-slate-700 dark:text-slate-300 text-sm leading-relaxed\">\n                        <div class=\"p-6 bg-gradient-to-r from-amber-50 to-orange-50 dark:from-slate-800 dark:to-slate-850 rounded-2xl border border-amber-200 dark:border-slate-700 shadow-sm\">\n                            <h4 class=\"text-xl font-black text-amber-950 dark:text-amber-300 mb-3 flex items-center gap-2\">\n                                <span>📜</span> Hành Trình Khởi Nghiệp & Nỗi Đau Ngành Tóc Việt Nam\n                            </h4>\n                            <p class=\"mb-3\">\n                                Được sáng lập bởi <strong>Founder Định HongKong</strong>, DTD Holding khởi nguồn từ sự thấu cảm sâu sắc nỗi đau của hàng chục nghìn chủ tiệm và thợ làm tóc tại các tỉnh thành Việt Nam: <em>Họ là những người lao động nghệ thuật chân chính nhưng luôn chịu thế yếu trong chuỗi cung ứng mỹ phẩm tóc.</em>\n                            </p>\n                            <p class=\"mb-3\">\n                                <strong>3 Nỗi Đau Cốt Lõi Của Salon Tỉnh:</strong>\n                            </p>\n                            <ul class=\"list-disc pl-5 space-y-1 mb-4 text-xs\">\n                                <li><strong>Bị ép giá và khan hiếm nguồn hàng:</strong> Các thương hiệu ngoại nhập áp đặt chính sách giá quá cao và điều kiện nhập hàng khắt khe, bào mòn gần như toàn bộ lợi nhuận làm dịch vụ của salon tầm trung.</li>\n                                <li><strong>Hàng trôi nổi, hóa chất độc hại:</strong> Nạn hàng giả, hàng nhái, hóa chất không rõ nguồn gốc chứa nồng độ kiềm và amoniac vượt ngưỡng cho phép gây hư nát tóc khách hàng và ảnh hưởng nghiêm trọng đến sức khỏe người thợ.</li>\n                                <li><strong>Thiếu thốn đào tạo kỹ thuật thực chiến:</strong> Thợ làm tóc tại các huyện thị xa xôi không có điều kiện tiếp cận các kỹ thuật nhuộm màu hiện đại, công thức khử ánh sắc cam đỏ hay kỹ thuật pha màu chuẩn quốc tế.</li>\n                            </ul>\n                            <div class=\"p-4 bg-white/80 dark:bg-slate-900/80 rounded-xl border border-amber-300 dark:border-slate-600\">\n                                <span class=\"font-bold text-amber-900 dark:text-amber-200\">💎 SỨ MỆNH BẤT BIẾN CỦA DTD HOLDING:</span>\n                                <p class=\"text-xs mt-1 text-slate-600 dark:text-slate-300\">\n                                    \"Trở thành bệ phóng kinh doanh vững chắc, cung cấp hệ sinh thái sản phẩm chất lượng ổn định, giá thành tối ưu nhất và đào tạo kỹ thuật tận tâm, đồng hành cùng sự thịnh vượng và bền vững của hàng chục nghìn Salon tóc trên toàn quốc.\"\n                                </p>\n                            </div>\n                        </div>\n\n                        <div class=\"p-5 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800\">\n                            <h4 class=\"text-base font-black text-slate-900 dark:text-white mb-3\">🎯 Mục Tiêu Tăng Trưởng Chiến Lược 2026–2030</h4>\n                            <div class=\"grid sm:grid-cols-3 gap-4 text-xs\">\n                                <div class=\"p-4 bg-amber-50/50 dark:bg-slate-800 rounded-xl border border-amber-100 dark:border-slate-700\">\n                                    <div class=\"text-amber-600 dark:text-amber-400 font-bold uppercase tracking-wider text-[11px] mb-1\">Mạng Lưới Phân Phối</div>\n                                    <div class=\"text-2xl font-black text-slate-900 dark:text-white mb-1\">65 NPP Tỉnh</div>\n                                    <p class=\"text-slate-500 dark:text-slate-400\">Nâng cấp từ 21 NPP hiện hữu lên 65 Tổng kho NPP độc quyền cấp tỉnh, bảo đảm phủ kín 100% các tỉnh thành từ Bắc vào Nam.</p>\n                                </div>\n                                <div class=\"p-4 bg-blue-50/50 dark:bg-slate-800 rounded-xl border border-blue-100 dark:border-slate-700\">\n                                    <div class=\"text-blue-600 dark:text-blue-400 font-bold uppercase tracking-wider text-[11px] mb-1\">Độ Phủ Điểm Bán</div>\n                                    <div class=\"text-2xl font-black text-slate-900 dark:text-white mb-1\">10,000+ Salon</div>\n                                    <p class=\"text-slate-500 dark:text-slate-400\">Trực tiếp cung ứng nguyên phụ liệu uốn, nhuộm, gội xả định kỳ hàng tuần cho hơn 10.000 salon tóc đại chúng và tầm trung.</p>\n                                </div>\n                                <div class=\"p-4 bg-emerald-50/50 dark:bg-slate-800 rounded-xl border border-emerald-100 dark:border-slate-700\">\n                                    <div class=\"text-emerald-600 dark:text-emerald-400 font-bold uppercase tracking-wider text-[11px] mb-1\">Chuỗi Cung Ứng & AI</div>\n                                    <div class=\"text-2xl font-black text-slate-900 dark:text-white mb-1\">Tự Động Hóa 100%</div>\n                                    <p class=\"text-slate-500 dark:text-slate-400\">Kết nối dữ liệu MISA AMIS với hệ thống Đặt hàng v4, vận hành bot AI kiểm soát công nợ và cảnh báo hàng tồn kho an toàn.</p>\n                                </div>\n                            </div>\n                        </div>\n\n                        <div class=\"p-5 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800\">\n                            <h4 class=\"text-base font-black text-slate-900 dark:text-white mb-3\">⚙️ Triết Lý Vận Hành \"5 HÓA\" Cốt Tử</h4>\n                            <p class=\"text-xs text-slate-500 dark:text-slate-400 mb-3\">5 Hóa không phải là khẩu hiệu treo tường, mà là tiêu chuẩn đánh giá từng hành động của mọi cán bộ nhân viên DTD Holding:</p>\n                            <div class=\"space-y-2.5 text-xs\">\n                                <div class=\"p-3 bg-slate-50 dark:bg-slate-800 rounded-lg flex items-start gap-3\">\n                                    <span class=\"px-2 py-0.5 bg-amber-500 text-white font-bold rounded text-[10px]\">1</span>\n                                    <div><strong>CHUẨN HÓA (Standardization):</strong> Chuẩn hóa quy cách đóng gói (thùng 24 tuýp/chai), tem nhãn phụ tiếng Việt đạt chuẩn y tế, quy trình test màu và mẫu biểu hợp đồng phân phối.</div>\n                                </div>\n                                <div class=\"p-3 bg-slate-50 dark:bg-slate-800 rounded-lg flex items-start gap-3\">\n                                    <span class=\"px-2 py-0.5 bg-blue-500 text-white font-bold rounded text-[10px]\">2</span>\n                                    <div><strong>QUY TRÌNH HÓA (Proceduralization):</strong> Mọi công việc từ xuất kho, vận chuyển xe tải, đối soát số liệu đến thu hồi công nợ đều phải lập thành văn bản quy trình rõ ràng, xóa bỏ làm việc theo cảm tính.</div>\n                                </div>\n                                <div class=\"p-3 bg-slate-50 dark:bg-slate-800 rounded-lg flex items-start gap-3\">\n                                    <span class=\"px-2 py-0.5 bg-emerald-500 text-white font-bold rounded text-[10px]\">3</span>\n                                    <div><strong>SỐ HÓA (Digitization):</strong> 100% dữ liệu kế toán, chứng từ thu chi, hóa đơn giá trị gia tăng và sổ chi tiết bán hàng phải nằm trên phần mềm MISA AMIS và hệ thống cơ sở dữ liệu số.</div>\n                                </div>\n                                <div class=\"p-3 bg-slate-50 dark:bg-slate-800 rounded-lg flex items-start gap-3\">\n                                    <span class=\"px-2 py-0.5 bg-purple-500 text-white font-bold rounded text-[10px]\">4</span>\n                                    <div><strong>TỰ ĐỘNG HÓA (Automation):</strong> Giảm thiểu tối đa thao tác thủ công. Báo cáo bán hàng, nạp số liệu vào Đặt hàng v4 và cảnh báo nợ quá hạn được điều phối bằng script tự động và AI Agent.</div>\n                                </div>\n                                <div class=\"p-3 bg-slate-50 dark:bg-slate-800 rounded-lg flex items-start gap-3\">\n                                    <span class=\"px-2 py-0.5 bg-rose-500 text-white font-bold rounded text-[10px]\">5</span>\n                                    <div><strong>TỐI ƯU HÓA (Optimization):</strong> Định kỳ hàng tháng rà soát chi phí logistics, loại bỏ các mã hàng tồn kho chết (Dead Stock) và cải tiến tốc độ giao hàng cho các NPP tỉnh.</div>\n                                </div>\n                            </div>\n                        </div>\n                    </div>\n                    "}, {"tab": "data", "name": "2. 5 Tư Duy Lãnh Đạo & Kỷ Luật Văn Hóa Doanh Nghiệp DTD", "content": "\n                    <div class=\"space-y-4 text-xs text-slate-700 dark:text-slate-300\">\n                        <div class=\"p-4 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800\">\n                            <h5 class=\"text-sm font-bold text-slate-900 dark:text-white mb-2\">🧠 5 Tư Duy Lãnh Đạo Đột Phá Tại DTD Holding</h5>\n                            <p class=\"leading-relaxed mb-3\">Mọi cán bộ từ cấp Giám đốc, Trưởng phòng, Quản trị viên đến Chuyên viên đều phải rèn luyện 5 tư duy nền tảng sau:</p>\n                            <div class=\"grid sm:grid-cols-2 gap-3\">\n                                <div class=\"p-3 bg-slate-50 dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700\">\n                                    <div class=\"font-bold text-blue-600 dark:text-blue-400\">1. TƯ DUY SỞ HỮU (OWNERSHIP MINDSET)</div>\n                                    <p class=\"mt-1 text-slate-500 dark:text-slate-400\">Coi công việc của công ty như việc của chính mình. Khi gặp lỗi kho hàng hay nợ chậm trả, không đùn đẩy trách nhiệm mà chủ động tìm giải pháp đến cùng.</p>\n                                </div>\n                                <div class=\"p-3 bg-slate-50 dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700\">\n                                    <div class=\"font-bold text-emerald-600 dark:text-emerald-400\">2. TƯ DUY DỮ LIỆU (DATA-DRIVEN MINDSET)</div>\n                                    <p class=\"mt-1 text-slate-500 dark:text-slate-400\">Nói chuyện bằng con số, không nói bằng cảm giác. Quyết định tăng/giảm nhập hàng phải căn cứ trên báo cáo MISA và hệ số dự báo tiêu thụ thực tế.</p>\n                                </div>\n                                <div class=\"p-3 bg-slate-50 dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700\">\n                                    <div class=\"font-bold text-amber-600 dark:text-amber-400\">3. TƯ DUY HỆ THỐNG (SYSTEMIC THINKING)</div>\n                                    <p class=\"mt-1 text-slate-500 dark:text-slate-400\">Xây dựng giải pháp mang tính quy trình có thể nhân bản và chuyển giao cho cấp dưới, không để công việc phụ thuộc vào sự có mặt của một cá nhân duy nhất.</p>\n                                </div>\n                                <div class=\"p-3 bg-slate-50 dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700\">\n                                    <div class=\"font-bold text-purple-600 dark:text-purple-400\">4. TƯ DUY PHỤNG SỰ (SERVANT LEADERSHIP)</div>\n                                    <p class=\"mt-1 text-slate-500 dark:text-slate-400\">Cấp trên là người hỗ trợ, tháo gỡ rào cản tài nguyên cho nhân viên cấp dưới; toàn bộ công ty là hậu phương phục vụ đại lý NPP và Salon khách hàng.</p>\n                                </div>\n                                <div class=\"p-3 bg-slate-50 dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700 sm:col-span-2\">\n                                    <div class=\"font-bold text-rose-600 dark:text-rose-400\">5. TƯ DUY TỐC ĐỘ & THỰC THI (BIAS FOR ACTION)</div>\n                                    <p class=\"mt-1 text-slate-500 dark:text-slate-400\">Ý tưởng hoàn hảo mà chậm trễ là vô giá trị. Kế hoạch hoàn thiện 80% nhưng đưa vào thử nghiệm và điều chỉnh ngay lập tức sẽ chiến thắng sự do dự trì trệ.</p>\n                                </div>\n                            </div>\n                        </div>\n\n                        <div class=\"overflow-x-auto\">\n                            <table class=\"w-full text-left border-collapse border border-slate-200 dark:border-slate-700\">\n                                <thead class=\"bg-slate-100 dark:bg-slate-800 font-bold text-slate-700 dark:text-slate-300\">\n                                    <tr>\n                                        <th class=\"p-3 border\">Kỷ Luật Văn Hóa DTD</th>\n                                        <th class=\"p-3 border text-emerald-700 dark:text-emerald-400\">Chuẩn Mực Được Khuyến Khích</th>\n                                        <th class=\"p-3 border text-rose-700 dark:text-rose-400\">Hành Vi Bị Cấm Tuyệt Đối</th>\n                                    </tr>\n                                </thead>\n                                <tbody class=\"divide-y divide-slate-200 dark:divide-slate-700 text-slate-600 dark:text-slate-300\">\n                                    <tr>\n                                        <td class=\"p-3 font-bold border\">Đối Thoại Khách Hàng</td>\n                                        <td class=\"p-3 border\">Lắng nghe khiêm nhường, nhiệt tình hỗ trợ salon khi gặp lỗi màu, hướng dẫn pha công thức tận tình.</td>\n                                        <td class=\"p-3 border text-rose-500\">Trịch thượng, coi thường thợ salon huyện thị, đổ lỗi cho salon khi hóa chất xảy ra sự cố.</td>\n                                    </tr>\n                                    <tr>\n                                        <td class=\"p-3 font-bold border\">Kỷ Luật Dữ Liệu Kho & MISA</td>\n                                        <td class=\"p-3 border\">Hạch toán phiếu xuất nhập kho ngay trong ngày, đối chiếu công nợ khớp từng đồng trên phần mềm.</td>\n                                        <td class=\"p-3 border text-rose-500\">Xuất hàng chui không có lệnh duyệt, lập đơn ảo chạy KPI, ghi nợ trên sổ tay cá nhân.</td>\n                                    </tr>\n                                    <tr>\n                                        <td class=\"p-3 font-bold border\">Bảo Vệ Thị Trường B2B</td>\n                                        <td class=\"p-3 border\">Chăm sóc đúng địa bàn phân công, hỗ trợ NPP tỉnh phát triển thêm salon trực thuộc.</td>\n                                        <td class=\"p-3 border text-rose-500\">Bán lấn tuyến, tuồn hàng giá rẻ sang vùng quản lý của NPP khác phá hoại giá thị trường.</td>\n                                    </tr>\n                                </tbody>\n                            </table>\n                        </div>\n                    </div>\n                    "}, {"tab": "checklist", "name": "3. Quy Chuẩn Đặt Tên & Quản Trị Tri Thức Số DTD", "content": "\n                    <div class=\"space-y-3 text-xs text-slate-700 dark:text-slate-300 leading-relaxed\">\n                        <div class=\"p-4 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800\">\n                            <h5 class=\"font-bold text-sm text-slate-900 dark:text-white mb-2\">📁 Quy Định Đặt Tên File & Thư Mục Thống Nhất Của DTD Holding</h5>\n                            <p class=\"mb-3\">Để loại bỏ hoàn toàn tình trạng thất lạc file, trùng lặp tài liệu hoặc ghi đè dữ liệu sai lệch, toàn bộ nhân sự DTD Holding bắt buộc phải tuân theo cấu trúc đặt tên sau:</p>\n                            <div class=\"p-3 bg-slate-50 dark:bg-slate-800 rounded-lg font-mono text-[11px] text-amber-700 dark:text-amber-300 border border-amber-200 dark:border-slate-700 mb-3\">\n                                [YYYYMMDD]_[MaPhongBan]_[TenNoiDungRutGon]_[PhienBan].[ext]\n                            </div>\n                            <ul class=\"list-disc pl-5 space-y-1.5 text-slate-600 dark:text-slate-300\">\n                                <li><strong>Ví dụ chuẩn:</strong> <code>20260908_KT_Bao_Cao_Cong_No_21_NPP_v1.2.xlsx</code></li>\n                                <li><strong>Ví dụ cấm:</strong> <code>baocao.xlsx</code>, <code>báo cáo mới nhất (1).xlsx</code>, <code>sổ nợ final ok.docx</code></li>\n                                <li><strong>Mã phòng ban quy ước:</strong> <code>BOD</code> (Ban Giám Đốc), <code>KD</code> (Kinh Doanh B2B), <code>KT</code> (Kế Toán), <code>SCM</code> (Chuỗi Cung Ứng & Kho), <code>MKT</code> (Marketing), <code>RND</code> (Nghiên Cứu Kỹ Thuật).</li>\n                            </ul>\n                        </div>\n                    </div>\n                    "}, {"tab": "quiz", "name": "4. Bài Kiểm Tra Năng Lực & Tình Huống Quản Trị M1", "content": "\n                    <div class=\"p-5 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 space-y-4\">\n                        <div class=\"font-bold text-sm text-slate-900 dark:text-white\">\n                            ❓ Tình Huống Thực Tế: Một Giám đốc Kinh doanh phát hiện một NPP ở tỉnh lân cận đang bán phá giá thấp hơn 10% sang địa bàn tỉnh bạn để gom tiền mặt trả nợ. Theo triết lý 5 Hóa và kỷ luật văn hóa DTD Holding, hướng xử lý nào sau đây là chuẩn mực nhất?\n                        </div>\n                        <div class=\"space-y-2 text-xs text-slate-700 dark:text-slate-300\">\n                            <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer\">\n                                <input type=\"radio\" name=\"dtd_q1\" value=\"a\" class=\"mr-2\"> A. Cho phép NPP tỉnh bị xâm lấn giảm giá thấp hơn nữa để cạnh tranh trực tiếp giành lại khách.\n                            </label>\n                            <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer\">\n                                <input type=\"radio\" name=\"dtd_q1\" value=\"b\" class=\"mr-2\"> B. Lập tức lập biên bản kiểm tra bằng chứng số serial lô hàng, kích hoạt quy chế bảo vệ vùng: Phạt thu hồi 100% chiết khấu đơn hàng vi phạm của NPP bán lấn tuyến, đồng thời hỗ trợ tài chính và truyền thông cho NPP bị xâm phạm.\n                            </label>\n                            <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer\">\n                                <input type=\"radio\" name=\"dtd_q1\" value=\"c\" class=\"mr-2\"> C. Bỏ qua vì miễn là công ty DTD Holding vẫn thu được tiền bán hàng từ đại lý lấn tuyến.\n                            </label>\n                        </div>\n                        <div class=\"p-3 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 rounded-lg text-xs text-emerald-800 dark:text-emerald-300 hidden\" id=\"dtd_q1_ans\">\n                            <strong>Đáp án chuẩn xác: B!</strong> Kỷ luật bảo hộ địa bàn là \"tính mạng\" của hệ thống phân phối B2B. Nếu công ty dung túng cho hành vi lấn tuyến, mạng lưới 65 NPP sẽ sụp đổ dây chuyền vì mất niềm tin vào thương hiệu.\n                        </div>\n                        <button onclick=\"document.getElementById('dtd_q1_ans').classList.toggle('hidden')\" class=\"px-4 py-1.5 bg-amber-600 hover:bg-amber-700 text-white rounded text-xs font-semibold\">Xem Phân Tích Lãnh Đạo</button>\n                    </div>\n                    "}]}, {"id": "dtd_m2", "title": "Module 2: Mạng Lưới Phân Phối B2B 21–65 NPP & Cơ Cấu Bộ Máy, KPI, Thưởng 4 Trưởng Phòng", "subtitle": "Quy chế phân quyền DOA, cơ chế hoa hồng TPKD, chính sách chiết khấu bậc thang và chế tài xử lý lấn tuyến", "duration": "35 phút học", "lessons": [{"tab": "theory", "name": "1. Mô Hình Phân Phối B2B Đa Cấp & Cơ Chế Hợp Tác NPP", "content": "\n                    <div class=\"space-y-5 text-slate-700 dark:text-slate-300 text-sm leading-relaxed\">\n                        <div class=\"p-5 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800\">\n                            <h4 class=\"text-base font-black text-slate-900 dark:text-white mb-2\">🌐 Cấu Trúc Kênh Phân Phối B2B DTD Holding</h4>\n                            <p class=\"text-xs text-slate-600 dark:text-slate-400 mb-4\">Mô hình phân phối của DTD Holding vận hành theo trục 3 mắt xích gắn kết mật thiết:</p>\n                            \n                            <div class=\"grid sm:grid-cols-3 gap-3 text-xs\">\n                                <div class=\"p-3 bg-amber-50 dark:bg-slate-800 rounded-lg border border-amber-200 dark:border-slate-700\">\n                                    <div class=\"font-bold text-amber-900 dark:text-amber-200 text-sm mb-1\">MẮT XÍCH 1: DTD HOLDING</div>\n                                    <p class=\"text-slate-600 dark:text-slate-300\">Đóng vai trò Tổng công ty chỉ huy: Đảm nhiệm R&D sản phẩm, đặt hàng nhà máy OEM quốc tế, lưu trữ tổng kho, hỗ trợ đào tạo kỹ thuật toàn quốc và xây dựng chính sách thương mại.</p>\n                                </div>\n                                <div class=\"p-3 bg-blue-50 dark:bg-slate-800 rounded-lg border border-blue-200 dark:border-slate-700\">\n                                    <div class=\"font-bold text-blue-900 dark:text-blue-200 text-sm mb-1\">MẮT XÍCH 2: 21 - 65 NPP CẤP TỈNH</div>\n                                    <p class=\"text-slate-600 dark:text-slate-300\">Đóng vai trò Tổng kho vệ tinh độc quyền theo từng tỉnh/khu vực. Chịu trách nhiệm vốn lưu động, lưu trữ hàng tại địa phương, giao hàng trong ngày và thu tiền từ salon cấp dưới.</p>\n                                </div>\n                                <div class=\"p-3 bg-emerald-50 dark:bg-slate-800 rounded-lg border border-emerald-200 dark:border-slate-700\">\n                                    <div class=\"font-bold text-emerald-900 dark:text-emerald-200 text-sm mb-1\">MẮT XÍCH 3: SALON TÓC KHU VỰC</div>\n                                    <p class=\"text-slate-600 dark:text-slate-300\">Người tiêu thụ đầu cuối của chuỗi B2B. Sử dụng hóa chất uốn nhuộm để phục vụ khách hàng trực tiếp, nhận hỗ trợ kỹ thuật và tích điểm đổi quà từ NPP.</p>\n                                </div>\n                            </div>\n                        </div>\n\n                        <div class=\"p-5 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800\">\n                            <h4 class=\"text-base font-black text-slate-900 dark:text-white mb-3\">📋 Tiêu Chuẩn Gia Nhập & Quyền Lợi Của Nhà Phân Phối Độc Quyền</h4>\n                            <div class=\"space-y-2 text-xs\">\n                                <div class=\"p-3 bg-slate-50 dark:bg-slate-800 rounded-lg\">\n                                    <strong>Hạn Mức Vốn & Cam Kết Doanh Số:</strong> Mỗi NPP tỉnh phải có năng lực vốn lưu động tối thiểu từ 200 – 500 triệu VNĐ, cam kết doanh số tối thiểu từ 80 – 150 triệu VNĐ/tháng tùy theo quy mô dân số tỉnh.\n                                </div>\n                                <div class=\"p-3 bg-slate-50 dark:bg-slate-800 rounded-lg\">\n                                    <strong>Chính Sách Chiết Khấu Bậc Thang Tích Lũy:</strong>\n                                    <ul class=\"list-disc pl-5 mt-1 space-y-0.5 text-slate-500 dark:text-slate-400\">\n                                        <li>Mức 1 (Doanh số 50 - 100 tr/tháng): Chiết khấu 30% trên giá niêm yết.</li>\n                                        <li>Mức 2 (Doanh số 101 - 200 tr/tháng): Chiết khấu 38% + Thưởng 2% cuối quý nếu không có nợ quá hạn.</li>\n                                        <li>Mức 3 (Doanh số > 200 tr/tháng): Chiết khấu 43% + Hỗ trợ 50% chi phí tổ chức Hội thảo kỹ thuật chuyển giao tại tỉnh.</li>\n                                    </ul>\n                                </div>\n                                <div class=\"p-3 bg-slate-50 dark:bg-slate-800 rounded-lg\">\n                                    <strong>Chính Sách Gối Đầu & Tín Dụng:</strong> Áp dụng hạn mức công nợ tối đa bằng 30% giá trị đơn hàng trước đó, thời hạn thanh toán không quá 30 ngày. Đơn mới chỉ được xuất khi số dư nợ cũ nằm trong hạn mức an toàn.\n                                </div>\n                            </div>\n                        </div>\n                    </div>\n                    "}, {"tab": "data", "name": "2. Cơ Cấu Tổ Chức, KPI & Thưởng 4 Trưởng Phòng", "content": "\n                    <div class=\"space-y-4 text-xs text-slate-700 dark:text-slate-300\">\n                        <div class=\"p-4 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800\">\n                            <h5 class=\"text-sm font-bold text-slate-900 dark:text-white mb-2\">⚖️ Ma Trận Phân Quyền DOA (Delegation of Authority) Của DTD Holding</h5>\n                            <table class=\"w-full text-left border-collapse border border-slate-200 dark:border-slate-700 mt-2\">\n                                <thead class=\"bg-slate-100 dark:bg-slate-800 font-bold text-slate-700 dark:text-slate-300\">\n                                    <tr>\n                                        <th class=\"p-2.5 border\">Nội Dung Thẩm Quyền Phê Duyệt</th>\n                                        <th class=\"p-2.5 border text-center\">Trưởng Phòng (TP)</th>\n                                        <th class=\"p-2.5 border text-center\">Giám Đốc Khối (CCO/CFO)</th>\n                                        <th class=\"p-2.5 border text-center\">Tổng Giám Đốc (CEO)</th>\n                                    </tr>\n                                </thead>\n                                <tbody class=\"divide-y divide-slate-200 dark:divide-slate-700\">\n                                    <tr>\n                                        <td class=\"p-2.5 border font-semibold\">Ký duyệt đơn hàng xuất kho thông thường</td>\n                                        <td class=\"p-2.5 border text-center text-emerald-600 font-bold\">&le; 50 Triệu</td>\n                                        <td class=\"p-2.5 border text-center text-blue-600 font-bold\">&le; 200 Triệu</td>\n                                        <td class=\"p-2.5 border text-center text-purple-600 font-bold\">> 200 Triệu</td>\n                                    </tr>\n                                    <tr>\n                                        <td class=\"p-2.5 border font-semibold\">Gia hạn công nợ cho NPP (Thêm 7-15 ngày)</td>\n                                        <td class=\"p-2.5 border text-center text-rose-500\">Không có quyền</td>\n                                        <td class=\"p-2.5 border text-center text-blue-600 font-bold\">&le; 100 Triệu</td>\n                                        <td class=\"p-2.5 border text-center text-purple-600 font-bold\">Mọi hạn mức</td>\n                                    </tr>\n                                    <tr>\n                                        <td class=\"p-2.5 border font-semibold\">Chấp thuận chiết khấu thương mại đặc biệt</td>\n                                        <td class=\"p-2.5 border text-center text-rose-500\">Không có quyền</td>\n                                        <td class=\"p-2.5 border text-center text-blue-600 font-bold\">&le; 2%</td>\n                                        <td class=\"p-2.5 border text-center text-purple-600 font-bold\">> 2%</td>\n                                    </tr>\n                                    <tr>\n                                        <td class=\"p-2.5 border font-semibold\">Ký hợp đồng bổ nhiệm Nhà Phân Phối mới</td>\n                                        <td class=\"p-2.5 border text-center\">Khảo sát & Thẩm định</td>\n                                        <td class=\"p-2.5 border text-center\">Trình đề xuất</td>\n                                        <td class=\"p-2.5 border text-center text-purple-600 font-bold\">Phê duyệt tối cao</td>\n                                    </tr>\n                                </tbody>\n                            </table>\n                        </div>\n\n                        <div class=\"p-4 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800\">\n                            <h5 class=\"text-sm font-bold text-slate-900 dark:text-white mb-2\">💰 Cơ Chế Thưởng Dự Án 4 Trưởng Phòng Cốt Lõi</h5>\n                            <p class=\"text-slate-500 dark:text-slate-400 mb-2\">Áp dụng theo Nghị quyết Quản trị dự án phân phối mới của DTD Holding:</p>\n                            <div class=\"grid sm:grid-cols-2 gap-3\">\n                                <div class=\"p-3 bg-slate-50 dark:bg-slate-800 rounded-lg border\">\n                                    <div class=\"font-bold text-blue-600 dark:text-blue-400\">1. Trưởng Phòng Kinh Doanh (TPKD)</div>\n                                    <p class=\"mt-1\">Lương cứng: 18 - 25 tr + Thưởng 0.8% - 1.2% trên tổng doanh số thu tiền mặt về từ 21 NPP. Thưởng quý 20 - 40 tr nếu không phát sinh nợ nhóm 3.</p>\n                                </div>\n                                <div class=\"p-3 bg-slate-50 dark:bg-slate-800 rounded-lg border\">\n                                    <div class=\"font-bold text-emerald-600 dark:text-emerald-400\">2. Kế Toán Trưởng (KTT)</div>\n                                    <p class=\"mt-1\">Lương cứng: 20 - 28 tr + Thưởng quản trị dòng tiền 0.2% trên tổng công nợ thu hồi đúng hạn. Phạt trừ điểm KPI nếu báo cáo đối soát MISA chậm sau ngày mùng 5 hàng tháng.</p>\n                                </div>\n                                <div class=\"p-3 bg-slate-50 dark:bg-slate-800 rounded-lg border\">\n                                    <div class=\"font-bold text-amber-600 dark:text-amber-400\">3. Trưởng Phòng Mua Hàng & SCM</div>\n                                    <p class=\"mt-1\">Lương cứng: 18 - 22 tr + Thưởng tối ưu chi phí giá vốn (COGS) 3% trên số tiền đàm phán tiết kiệm được từ nhà máy. Thưởng KPI giao hàng đúng hẹn 98%.</p>\n                                </div>\n                                <div class=\"p-3 bg-slate-50 dark:bg-slate-800 rounded-lg border\">\n                                    <div class=\"font-bold text-purple-600 dark:text-purple-400\">4. Trưởng Phòng Kỹ Thuật & Đào Tạo</div>\n                                    <p class=\"mt-1\">Lương cứng: 16 - 22 tr + Thưởng đứng lớp Hội thảo tỉnh 3 - 5 tr/sự kiện nếu tỷ lệ chốt đơn của salon tại hội trường đạt trên 40%.</p>\n                                </div>\n                            </div>\n                        </div>\n                    </div>\n                    "}, {"tab": "checklist", "name": "3. Quy Chuẩn Xử Lý Tranh Chấp Địa Bàn & Chống Bán Phá Giá", "content": "\n                    <div class=\"space-y-3 text-xs text-slate-700 dark:text-slate-300 leading-relaxed\">\n                        <div class=\"p-4 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800\">\n                            <h5 class=\"font-bold text-sm text-slate-900 dark:text-white mb-2\">🚫 Chế Tài 3 Bước Xử Lý Lấn Tuyến & Phá Giá Cực Nghiêm</h5>\n                            <div class=\"space-y-2\">\n                                <div class=\"p-3 bg-slate-50 dark:bg-slate-800 rounded-lg border-l-4 border-amber-500\">\n                                    <strong>Bước 1 - Lập Biên Bản Vi Phạm (Trong 24h):</strong> Khi nhận phản ánh có hàng bán phá giá, Sales khu vực mua lại sản phẩm có dán tem mã vạch/số lô, chụp hình chứng cứ và lập biên bản hiện trường gửi về Khối Pháp chế DTD.\n                                </div>\n                                <div class=\"p-3 bg-slate-50 dark:bg-slate-800 rounded-lg border-l-4 border-orange-500\">\n                                    <strong>Bước 2 - Phạt Hành Chính & Thu Hồi Chiết Khấu (Lần 1):</strong> Thu hồi 100% tiền thưởng doanh số quý của NPP vi phạm, đồng thời yêu cầu NPP thu hồi toàn bộ lô hàng lấn tuyến về trong vòng 7 ngày.\n                                </div>\n                                <div class=\"p-3 bg-slate-50 dark:bg-slate-800 rounded-lg border-l-4 border-rose-600\">\n                                    <strong>Bước 3 - Cắt Hợp Đồng Độc Quyền & Khóa Mã NPP (Lần 2):</strong> Tước bỏ quyền phân phối độc quyền cấp tỉnh, chuyển giao quyền đại lý cho đơn vị khác và thu hồi toàn bộ biển bảng tài trợ.\n                                </div>\n                            </div>\n                        </div>\n                    </div>\n                    "}, {"tab": "quiz", "name": "4. Bài Kiểm Tra Tình Huống Phân Quyền M2", "content": "\n                    <div class=\"p-5 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 space-y-4\">\n                        <div class=\"font-bold text-sm text-slate-900 dark:text-white\">\n                            ❓ Tình Huống Thực Tế: Một Nhà Phân Phối lớn tại Hải Dương có đơn hàng mới trị giá 180 triệu VNĐ nhưng đang có khoản nợ cũ 60 triệu quá hạn thanh toán 10 ngày. Trưởng phòng Kinh Doanh có quyền tự ý phê duyệt xuất kho đơn hàng này không?\n                        </div>\n                        <div class=\"space-y-2 text-xs text-slate-700 dark:text-slate-300\">\n                            <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer\">\n                                <input type=\"radio\" name=\"dtd_q2\" value=\"a\" class=\"mr-2\"> A. Có quyền, vì giá trị đơn hàng 180 triệu vẫn dưới 200 triệu thuộc thẩm quyền của CCO/TPKD.\n                            </label>\n                            <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer\">\n                                <input type=\"radio\" name=\"dtd_q2\" value=\"b\" class=\"mr-2\"> B. Tuyệt đối không có quyền! Theo ma trận phân quyền DOA và quy chế công nợ, khi NPP đã có nợ quá hạn, lệnh xuất kho bị khóa tự động trên MISA. Việc xuất hàng ngoại lệ bắt buộc phải có văn bản bảo lãnh của CCO và phê duyệt từ Tổng Giám đốc (CEO).\n                            </label>\n                            <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer\">\n                                <input type=\"radio\" name=\"dtd_q2\" value=\"c\" class=\"mr-2\"> C. TPKD có thể chia nhỏ đơn thành 4 đơn dưới 50 triệu để tự duyệt.\n                            </label>\n                        </div>\n                        <div class=\"p-3 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 rounded-lg text-xs text-emerald-800 dark:text-emerald-300 hidden\" id=\"dtd_q2_ans\">\n                            <strong>Đáp án chuẩn xác: B!</strong> Hành vi chia nhỏ đơn hàng để lách hạn mức phê duyệt là vi phạm nghiêm trọng quy chế DOA. Kỷ luật công nợ là hàng rào bảo vệ an toàn tài chính cho doanh nghiệp.\n                        </div>\n                        <button onclick=\"document.getElementById('dtd_q2_ans').classList.toggle('hidden')\" class=\"px-4 py-1.5 bg-amber-600 hover:bg-amber-700 text-white rounded text-xs font-semibold\">Xem Phân Tích Lãnh Đạo</button>\n                    </div>\n                    "}]}, {"id": "dtd_m3", "title": "Module 3: Năng Lực Hóa Sinh Sản Phẩm GLEM Nano Amino, Dòng Gội Xả MINATO & Dữ Liệu Bán Hàng", "subtitle": "Giải mã cấu trúc hạt màu Micro Nano Pigment, tỷ lệ pha Oxy, dữ liệu doanh số 2.12 tỷ VNĐ (+294.6% MoM) và kiểm định R&D", "duration": "35 phút học", "lessons": [{"tab": "theory", "name": "1. Hóa Sinh Hạt Màu Nano Amino & Công Nghệ GLEM Luminous", "content": "\n                    <div class=\"space-y-5 text-slate-700 dark:text-slate-300 text-sm leading-relaxed\">\n                        <div class=\"p-5 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800\">\n                            <h4 class=\"text-base font-black text-slate-900 dark:text-white mb-2\">🔬 Cơ Chế Thẩm Thấu Hạt Màu Micro Nano Pigment Của Thuốc Nhuộm GLEM</h4>\n                            <p class=\"text-xs text-slate-600 dark:text-slate-400 mb-3\">Sự khác biệt mang tính cách mạng giữa thuốc nhuộm thông thường và dòng sản phẩm GLEM Luminous Amino:</p>\n                            <div class=\"grid sm:grid-cols-2 gap-3 text-xs\">\n                                <div class=\"p-3 bg-rose-50 dark:bg-slate-800 rounded-lg border border-rose-200 dark:border-slate-700\">\n                                    <div class=\"font-bold text-rose-700 dark:text-rose-400 mb-1\">❌ Thuốc Nhuộm Kiềm Cao Thông Thường:</div>\n                                    <p class=\"text-slate-600 dark:text-slate-300\">Sử dụng nồng độ Ammonia lớn để cưỡng bức mở toang lớp biểu bì tóc (Cuticle). Hạt màu thô to chen vào làm đứt gãy cầu nối Disulfide, khiến tóc sau khi nhuộm bị xơ rối, khô giòn và bay màu nhanh chỉ sau 2-3 tuần gội.</p>\n                                </div>\n                                <div class=\"p-3 bg-emerald-50 dark:bg-slate-800 rounded-lg border border-emerald-200 dark:border-slate-700\">\n                                    <div class=\"font-bold text-emerald-700 dark:text-emerald-400 mb-1\">✅ Công Nghệ GLEM Micro Nano Amino:</div>\n                                    <p class=\"text-slate-600 dark:text-slate-300\">Hạt màu được nghiền siêu mịn ở kích thước phân tử Nanometer kết hợp 17 loại Axit Amin tự nhiên. Thuốc chỉ mở nhẹ lớp vảy tóc, đưa hạt màu chui sâu vào lõi tủy tóc (Cortex) và tự khóa lại bên trong, giúp màu nhuộm bóng mượt, giữ hạt màu bền bỉ trên 8 - 12 tuần.</p>\n                                </div>\n                            </div>\n                        </div>\n\n                        <div class=\"p-5 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800\">\n                            <h4 class=\"text-base font-black text-slate-900 dark:text-white mb-3\">🎨 Bảng Tỷ Lệ Pha Oxy & Ứng Dụng Kỹ Thuật Nhuộm Chuẩn Salon</h4>\n                            <div class=\"overflow-x-auto text-xs\">\n                                <table class=\"w-full text-left border-collapse border border-slate-200 dark:border-slate-700\">\n                                    <thead class=\"bg-slate-100 dark:bg-slate-800 font-bold text-slate-700 dark:text-slate-300\">\n                                        <tr>\n                                            <th class=\"p-2.5 border\">Nồng Độ Oxy GLEM</th>\n                                            <th class=\"p-2.5 border\">Tỷ Lệ Pha (Kem màu : Oxy)</th>\n                                            <th class=\"p-2.5 border\">Mục Đích Dịch Vụ Salon</th>\n                                            <th class=\"p-2.5 border\">Thời Gian Lưu Thuốc</th>\n                                        </tr>\n                                    </thead>\n                                    <tbody class=\"divide-y divide-slate-200 dark:divide-slate-700\">\n                                        <tr>\n                                            <td class=\"p-2.5 font-bold border text-blue-600\">Oxy 3% (Vol 10)</td>\n                                            <td class=\"p-2.5 border\">1 : 1</td>\n                                            <td class=\"p-2.5 border\">Nhuộm hạ tông, nhuộm pastel trên nền tóc tẩy cấp độ 9-10, phủ bóng tóc hư tổn.</td>\n                                            <td class=\"p-2.5 border\">20 - 25 phút</td>\n                                        </tr>\n                                        <tr>\n                                            <td class=\"p-2.5 font-bold border text-emerald-600\">Oxy 6% (Vol 20)</td>\n                                            <td class=\"p-2.5 border\">1 : 1 (hoặc 1 : 1.2)</td>\n                                            <td class=\"p-2.5 border\">Nhuộm cùng tông, nâng 1-2 tông, phủ bạc 100% cho tóc hoa râm người trung niên.</td>\n                                            <td class=\"p-2.5 border\">35 - 45 phút</td>\n                                        </tr>\n                                        <tr>\n                                            <td class=\"p-2.5 font-bold border text-amber-600\">Oxy 9% (Vol 30)</td>\n                                            <td class=\"p-2.5 border\">1 : 1.5</td>\n                                            <td class=\"p-2.5 border\">Nâng 2-3 tông màu thời trang (Nâu tây, Nâu lạnh, Rêu khói) từ nền tóc đen tự nhiên.</td>\n                                            <td class=\"p-2.5 border\">40 - 50 phút</td>\n                                        </tr>\n                                        <tr>\n                                            <td class=\"p-2.5 font-bold border text-rose-600\">Oxy 12% (Vol 40)</td>\n                                            <td class=\"p-2.5 border\">1 : 2</td>\n                                            <td class=\"p-2.5 border\">Nâng 3-4 tông sáng, sử dụng kèm các mã màu nâng tông 0.00 hoặc bột tẩy.</td>\n                                            <td class=\"p-2.5 border\">45 - 55 phút</td>\n                                        </tr>\n                                    </tbody>\n                                </table>\n                            </div>\n                        </div>\n                    </div>\n                    "}, {"tab": "data", "name": "2. Dữ Liệu Bán Hàng Thực Tế GLEM & MINATO", "content": "\n                    <div class=\"space-y-4 text-xs text-slate-700 dark:text-slate-300\">\n                        <div class=\"p-4 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800\">\n                            <h5 class=\"text-sm font-bold text-slate-900 dark:text-white mb-2\">📊 Báo Cáo Doanh Số Thực Tế Đạt Mốc 2,12 Tỷ VNĐ (+294,6% MoM)</h5>\n                            <p class=\"text-slate-500 dark:text-slate-400 mb-3\">Số liệu trích xuất trực tiếp từ nhật ký bán hàng MISA AMIS của DTD Holding:</p>\n                            \n                            <table class=\"w-full text-left border-collapse border border-slate-200 dark:border-slate-700\">\n                                <thead class=\"bg-slate-100 dark:bg-slate-800 font-bold text-slate-700 dark:text-slate-300\">\n                                    <tr>\n                                        <th class=\"p-2.5 border\">Mã SKU Sản Phẩm Cốt Lõi</th>\n                                        <th class=\"p-2.5 border\">Quy Cách Đóng Gói</th>\n                                        <th class=\"p-2.5 border text-right\">Doanh Số (VNĐ)</th>\n                                        <th class=\"p-2.5 border text-right\">Tỷ Trọng (%)</th>\n                                        <th class=\"p-2.5 border text-center\">Tốc Độ Tăng Trưởng</th>\n                                    </tr>\n                                </thead>\n                                <tbody class=\"divide-y divide-slate-200 dark:divide-slate-700\">\n                                    <tr>\n                                        <td class=\"p-2.5 font-bold border\">Oxy Trợ Nhuộm GLEM Luminous</td>\n                                        <td class=\"p-2.5 border\">Chai 1000ml (Thùng 24 chai)</td>\n                                        <td class=\"p-2.5 border text-right font-semibold text-slate-900 dark:text-white\">586.820.000</td>\n                                        <td class=\"p-2.5 border text-right font-bold text-blue-600\">27.6%</td>\n                                        <td class=\"p-2.5 border text-center text-emerald-600 font-bold\">+312%</td>\n                                    </tr>\n                                    <tr>\n                                        <td class=\"p-2.5 font-bold border\">Tuýp Nhuộm Màu GLEM Nano Amino</td>\n                                        <td class=\"p-2.5 border\">Tuýp 100ml (Hộp 72 tuýp)</td>\n                                        <td class=\"p-2.5 border text-right font-semibold text-slate-900 dark:text-white\">546.400.000</td>\n                                        <td class=\"p-2.5 border text-right font-bold text-blue-600\">25.7%</td>\n                                        <td class=\"p-2.5 border text-center text-emerald-600 font-bold\">+285%</td>\n                                    </tr>\n                                    <tr>\n                                        <td class=\"p-2.5 font-bold border\">Bộ Gội Xả Phục Hồi MINATO Nhật Bản</td>\n                                        <td class=\"p-2.5 border\">Cặp 780ml x 2 (Thùng 12 cặp)</td>\n                                        <td class=\"p-2.5 border text-right font-semibold text-slate-900 dark:text-white\">412.350.000</td>\n                                        <td class=\"p-2.5 border text-right font-bold text-blue-600\">19.4%</td>\n                                        <td class=\"p-2.5 border text-center text-emerald-600 font-bold\">+210%</td>\n                                    </tr>\n                                    <tr>\n                                        <td class=\"p-2.5 font-bold border\">Bột Tẩy Tím Khử Ánh Vàng GLEM</td>\n                                        <td class=\"p-2.5 border\">Hũ 500g (Thùng 24 hũ)</td>\n                                        <td class=\"p-2.5 border text-right font-semibold text-slate-900 dark:text-white\">328.600.000</td>\n                                        <td class=\"p-2.5 border text-right font-bold text-blue-600\">15.5%</td>\n                                        <td class=\"p-2.5 border text-center text-emerald-600 font-bold\">+340%</td>\n                                    </tr>\n                                    <tr>\n                                        <td class=\"p-2.5 font-bold border\">Hấp Dầu Collagen & Tinh Dầu Argan</td>\n                                        <td class=\"p-2.5 border\">Hũ 1000ml / Chai 100ml</td>\n                                        <td class=\"p-2.5 border text-right font-semibold text-slate-900 dark:text-white\">251.230.000</td>\n                                        <td class=\"p-2.5 border text-right font-bold text-blue-600\">11.8%</td>\n                                        <td class=\"p-2.5 border text-center text-emerald-600 font-bold\">+180%</td>\n                                    </tr>\n                                    <tr class=\"bg-amber-50/60 dark:bg-slate-800/80 font-bold\">\n                                        <td class=\"p-2.5 border\">TỔNG DOANH SỐ THÁNG ĐẠT MỐC</td>\n                                        <td class=\"p-2.5 border\">Đầy đủ hệ sinh thái</td>\n                                        <td class=\"p-2.5 border text-right text-amber-700 dark:text-amber-300 text-sm\">2.125.400.000</td>\n                                        <td class=\"p-2.5 border text-right\">100.0%</td>\n                                        <td class=\"p-2.5 border text-center text-emerald-600 font-black\">+294.6%</td>\n                                    </tr>\n                                </tbody>\n                            </table>\n                        </div>\n                    </div>\n                    "}, {"tab": "checklist", "name": "3. Quy Trình R&D Kiểm Định Chất Lượng Mẫu Tóc Trước Khi Nhập Lô Hàng", "content": "\n                    <div class=\"space-y-3 text-xs text-slate-700 dark:text-slate-300 leading-relaxed\">\n                        <div class=\"p-4 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800\">\n                            <h5 class=\"font-bold text-sm text-slate-900 dark:text-white mb-2\">🧪 4 Bước Kiểm Thử R&D Nghiêm Ngặt Tại Phòng Lab DTD:</h5>\n                            <div class=\"space-y-2\">\n                                <div class=\"p-2.5 bg-slate-50 dark:bg-slate-800 rounded-lg\">\n                                    <strong>1. Test Trên Tóc Tẩy Level 10:</strong> Thử nghiệm độ lên màu chuẩn xác của các mã màu thời trang khói, tro (.1), tím (.7), đỏ (.6) để đảm bảo không bị sai lệch ánh sắc.\n                                </div>\n                                <div class=\"p-2.5 bg-slate-50 dark:bg-slate-800 rounded-lg\">\n                                    <strong>2. Test Phủ Bạc Trên Tóc Thật:</strong> Pha thuốc với Oxy 6% trên mẫu tóc bạc trên 80% trong 40 phút. Yêu cầu bắt buộc: Phải ăn màu sâu 100% sợi tóc, không bị trượt màu hay ánh đỏ chân tóc.\n                                </div>\n                                <div class=\"p-2.5 bg-slate-50 dark:bg-slate-800 rounded-lg\">\n                                    <strong>3. Kiểm Tra Độ Bền Cơ Học & Đứt Gãy:</strong> Dùng máy kéo lực kiểm tra độ đàn hồi sợi tóc trước và sau khi nhuộm. Tỷ lệ suy giảm cấu trúc tóc không được vượt quá 7%.\n                                </div>\n                                <div class=\"p-2.5 bg-slate-50 dark:bg-slate-800 rounded-lg\">\n                                    <strong>4. Test Độ Nhũ Tương & Ổn Định Nhiệt:</strong> Đặt mẫu thuốc nhuộm ở nhiệt độ 45°C trong 72 giờ để bảo đảm kem nhuộm không bị tách lớp dầu-nước khi vận chuyển trong mùa hè Việt Nam.\n                                </div>\n                            </div>\n                        </div>\n                    </div>\n                    "}, {"tab": "quiz", "name": "4. Bài Kiểm Tra Kỹ Thuật & Kiến Thức Hóa Sinh M3", "content": "\n                    <div class=\"p-5 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 space-y-4\">\n                        <div class=\"font-bold text-sm text-slate-900 dark:text-white\">\n                            ❓ Câu Hỏi Kỹ Thuật: Khi một salon tỉnh phản ánh thuốc nhuộm GLEM mã 6.1 (Nâu khói) nhuộm lên tóc khách hàng bị trồi ánh đồng đỏ (Warm Red/Orange), nguyên nhân chính và công thức khắc phục là gì?\n                        </div>\n                        <div class=\"space-y-2 text-xs text-slate-700 dark:text-slate-300\">\n                            <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer\">\n                                <input type=\"radio\" name=\"dtd_q3\" value=\"a\" class=\"mr-2\"> A. Do salon dùng Oxy quá yếu (Oxy 3%), cần đổi sang Oxy 12%.\n                            </label>\n                            <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer\">\n                                <input type=\"radio\" name=\"dtd_q3\" value=\"b\" class=\"mr-2\"> B. Do nền tóc khách hàng còn ẩn nhiều sắc tố đỏ cam tự nhiên (Undertone level 4-5) chưa được nâng tông hoặc khử sạch. Khắc phục: Phải cộng thêm 5 - 10% Mix Xanh Dương (Blue/Ash Corrector) hoặc 0.11 để trung hòa triệt để ánh cam đỏ.\n                            </label>\n                            <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer\">\n                                <input type=\"radio\" name=\"dtd_q3\" value=\"c\" class=\"mr-2\"> C. Đổ thêm nước lọc vào bát thuốc nhuộm để làm nhạt bớt màu đỏ.\n                            </label>\n                        </div>\n                        <div class=\"p-3 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 rounded-lg text-xs text-emerald-800 dark:text-emerald-300 hidden\" id=\"dtd_q3_ans\">\n                            <strong>Đáp án chuẩn xác: B!</strong> Quy luật bánh xe màu sắc (Color Wheel) là nguyên lý hóa sinh căn bản của thợ tóc. Trợ giảng kỹ thuật DTD phải thuộc lòng các nguyên lý này để hỗ trợ đại lý tức thì qua điện thoại.\n                        </div>\n                        <button onclick=\"document.getElementById('dtd_q3_ans').classList.toggle('hidden')\" class=\"px-4 py-1.5 bg-amber-600 hover:bg-amber-700 text-white rounded text-xs font-semibold\">Xem Phân Tích Kỹ Thuật</button>\n                    </div>\n                    "}]}, {"id": "dtd_m4", "title": "Module 4: Quản Trị Tài Chính Doanh Nghiệp MISA & Kiểm Soát Công Nợ 21 NPP", "subtitle": "Quy trình đối soát 3 báo cáo, phân tầng tuổi nợ Xanh-Vàng-Đỏ và bẫy số thập phân Google Sheets (vi_VN vs en_US)", "duration": "35 phút học", "lessons": [{"tab": "theory", "name": "1. Hệ Thống Tài Khoản MISA & Nguyên Tắc Hạch Toán B2B", "content": "\n                    <div class=\"space-y-5 text-slate-700 dark:text-slate-300 text-sm leading-relaxed\">\n                        <div class=\"p-5 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800\">\n                            <h4 class=\"text-base font-black text-slate-900 dark:text-white mb-2\">📊 Cấu Trúc Hệ Thống Kế Toán MISA AMIS Của DTD Holding</h4>\n                            <p class=\"text-xs text-slate-600 dark:text-slate-400 mb-3\">Toàn bộ dòng tiền và giá trị hàng hóa của DTD Holding được quản trị tập trung qua 6 nhóm tài khoản chuẩn mực:</p>\n                            <div class=\"grid sm:grid-cols-3 gap-3 text-xs\">\n                                <div class=\"p-3 bg-slate-50 dark:bg-slate-800 rounded-lg border\">\n                                    <div class=\"font-bold text-blue-600 dark:text-blue-400\">TK 131 - Phải Thu Khách Hàng</div>\n                                    <p class=\"mt-1 text-slate-500 dark:text-slate-400\">Chi tiết theo từng mã NPP cấp tỉnh. Phản ánh số nợ gối đầu và hạn mức tín dụng còn lại của từng đại lý.</p>\n                                </div>\n                                <div class=\"p-3 bg-slate-50 dark:bg-slate-800 rounded-lg border\">\n                                    <div class=\"font-bold text-amber-600 dark:text-amber-400\">TK 156 - Hàng Hóa Kho Tổng</div>\n                                    <p class=\"mt-1 text-slate-500 dark:text-slate-400\">Theo dõi giá trị tồn kho theo từng mã SKU, kiểm soát giá vốn bình quân gia quyền tại thời điểm xuất kho.</p>\n                                </div>\n                                <div class=\"p-3 bg-slate-50 dark:bg-slate-800 rounded-lg border\">\n                                    <div class=\"font-bold text-emerald-600 dark:text-emerald-400\">TK 511 - Doanh Thu Bán Hàng</div>\n                                    <p class=\"mt-1 text-slate-500 dark:text-slate-400\">Ghi nhận doanh thu thuần sau khi trừ đi chiết khấu thương mại và giảm giá bán hàng cho các NPP tỉnh.</p>\n                                </div>\n                                <div class=\"p-3 bg-slate-50 dark:bg-slate-800 rounded-lg border\">\n                                    <div class=\"font-bold text-rose-600 dark:text-rose-400\">TK 632 - Giá Vốn Hàng Bán</div>\n                                    <p class=\"mt-1 text-slate-500 dark:text-slate-400\">Chi phí nhập khẩu OEM từ nhà máy bao gồm cước tàu biển quốc tế, thuế nhập khẩu và phí ủy thác hải quan.</p>\n                                </div>\n                                <div class=\"p-3 bg-slate-50 dark:bg-slate-800 rounded-lg border\">\n                                    <div class=\"font-bold text-purple-600 dark:text-purple-400\">TK 641 - Chi Phí Bán Hàng</div>\n                                    <p class=\"mt-1 text-slate-500 dark:text-slate-400\">Chi phí cước xe tải giao hàng về tỉnh, chi phí hoa hồng cho đội ngũ Sales B2B và ngân sách hội thảo salon.</p>\n                                </div>\n                                <div class=\"p-3 bg-slate-50 dark:bg-slate-800 rounded-lg border\">\n                                    <div class=\"font-bold text-indigo-600 dark:text-indigo-400\">TK 642 - Chi Phí Quản Lý</div>\n                                    <p class=\"mt-1 text-slate-500 dark:text-slate-400\">Lương khối văn phòng điều hành, khấu hao tài sản cố định, phần mềm MISA, server đám mây và chi phí pháp lý.</p>\n                                </div>\n                            </div>\n                        </div>\n\n                        <div class=\"p-5 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800\">\n                            <h4 class=\"text-base font-black text-slate-900 dark:text-white mb-2\">🔄 Quy Trình Đối Soát Tam Giác Vàng (3 Báo Cáo MISA)</h4>\n                            <p class=\"text-xs text-slate-500 dark:text-slate-400 mb-2\">Để bảo đảm không có hóa đơn nào bị sót hoặc trùng lặp, Kế toán trưởng bắt buộc phải chạy quy trình khớp số liệu tam giác:</p>\n                            <div class=\"p-3 bg-slate-50 dark:bg-slate-800 rounded-lg font-mono text-xs text-slate-700 dark:text-slate-300\">\n                                <strong>[Sổ Chi Tiết Bán Hàng]</strong> (Sản phẩm xuất ra) <br>\n                                &nbsp;&nbsp;&nbsp;&nbsp;&harr; Khớp 100% với <strong>[Sổ Chi Tiết Công Nợ 131]</strong> (Tiền đại lý phải trả)<br>\n                                &nbsp;&nbsp;&nbsp;&nbsp;&harr; Khớp 100% với <strong>[Sổ Cái Doanh Thu 511 & Kho 156]</strong>\n                            </div>\n                        </div>\n                    </div>\n                    "}, {"tab": "data", "name": "2. Khung Quản Trị Tuổi Nợ 21 NPP (Aging Analysis)", "content": "\n                    <div class=\"space-y-4 text-xs text-slate-700 dark:text-slate-300\">\n                        <div class=\"p-4 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800\">\n                            <h5 class=\"text-sm font-bold text-slate-900 dark:text-white mb-2\">🚦 Phân Loại 3 Vùng Tuổi Nợ Của 21 Nhà Phân Phối Tỉnh</h5>\n                            <table class=\"w-full text-left border-collapse border border-slate-200 dark:border-slate-700\">\n                                <thead class=\"bg-slate-100 dark:bg-slate-800 font-bold text-slate-700 dark:text-slate-300\">\n                                    <tr>\n                                        <th class=\"p-2.5 border\">Phân Hạng Tuổi Nợ</th>\n                                        <th class=\"p-2.5 border\">Số Ngày Nợ Lũy Kế</th>\n                                        <th class=\"p-2.5 border\">Trạng Thái Rủi Ro</th>\n                                        <th class=\"p-2.5 border\">Hành Động Bắt Buộc Của Kế Toán & Sales</th>\n                                    </tr>\n                                </thead>\n                                <tbody class=\"divide-y divide-slate-200 dark:divide-slate-700\">\n                                    <tr class=\"bg-emerald-50/40 dark:bg-emerald-950/20\">\n                                        <td class=\"p-2.5 font-bold border text-emerald-700 dark:text-emerald-400\">VÙNG XANH (Nợ Trong Hạn)</td>\n                                        <td class=\"p-2.5 border\">&le; 30 Ngày</td>\n                                        <td class=\"p-2.5 border font-semibold text-emerald-600\">An toàn tuyệt đối</td>\n                                        <td class=\"p-2.5 border\">Cho phép NPP tiếp tục đặt hàng gối đầu theo hạn mức bình thường. Kế toán gửi đối soát công nợ cuối tháng.</td>\n                                    </tr>\n                                    <tr class=\"bg-amber-50/40 dark:bg-amber-950/20\">\n                                        <td class=\"p-2.5 font-bold border text-amber-700 dark:text-amber-400\">VÙNG VÀNG (Cảnh Báo Sớm)</td>\n                                        <td class=\"p-2.5 border\">31 – 45 Ngày</td>\n                                        <td class=\"p-2.5 border font-semibold text-amber-600\">Rủi ro trung bình</td>\n                                        <td class=\"p-2.5 border\">Tạm dừng duyệt nợ mới. Đơn hàng phát sinh mới bắt buộc phải thu tiền mặt 100%. TPKD trực tiếp gọi điện làm việc với chủ NPP.</td>\n                                    </tr>\n                                    <tr class=\"bg-rose-50/40 dark:bg-rose-950/20\">\n                                        <td class=\"p-2.5 font-bold border text-rose-700 dark:text-rose-400\">VÙNG ĐỎ (Báo Động Đỏ)</td>\n                                        <td class=\"p-2.5 border\">> 45 Ngày</td>\n                                        <td class=\"p-2.5 border font-semibold text-rose-600\">Nguy cơ nợ xấu cao</td>\n                                        <td class=\"p-2.5 border\">Khóa mã đặt hàng toàn hệ thống. Gửi công văn nhắc nợ lần 1, tính lãi suất chậm trả 1.5%/tháng. Khối Pháp chế chuẩn bị hồ sơ thu hồi hàng tồn kho.</td>\n                                    </tr>\n                                </tbody>\n                            </table>\n                        </div>\n                    </div>\n                    "}, {"tab": "checklist", "name": "3. 6 Bẫy Dấu Thập Phân Locale vi_VN vs en_US Trên Google Sheets", "content": "\n                    <div class=\"space-y-3 text-xs text-slate-700 dark:text-slate-300 leading-relaxed\">\n                        <div class=\"p-4 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800\">\n                            <h5 class=\"font-bold text-sm text-slate-900 dark:text-white mb-2\">⚠️ Bài Học Xương Máu: Bẫy Định Dạng Số Locale Kế Toán</h5>\n                            <div class=\"p-3 bg-rose-50 dark:bg-slate-800 rounded-lg border border-rose-200 dark:border-slate-700 mb-3\">\n                                <strong>Vấn đề phát sinh:</strong> Khi kế toán xuất khẩu file Excel từ MISA (chuẩn Việt Nam: dấu phẩy <code>,</code> là phân cách thập phân, dấu chấm <code>.</code> là phân cách hàng nghìn) rồi dán trực tiếp lên Google Sheets cài đặt chuẩn Mỹ (en_US), toàn bộ số tiền hàng tỷ đồng bị hiểu nhầm thành chuỗi văn bản (String), dẫn đến công thức <code>SUM</code> trả về kết quả bằng 0 hoặc sai lệch nghiêm trọng!\n                            </div>\n                            <div class=\"space-y-2\">\n                                <div class=\"p-2.5 bg-slate-50 dark:bg-slate-800 rounded\">\n                                    <strong>Quy Tắc 1:</strong> Cài đặt thống nhất Locale của Google Sheets sang <code>Vietnam (vi_VN)</code> trong phần File &rarr; Settings &rarr; Locale.\n                                </div>\n                                <div class=\"p-2.5 bg-slate-50 dark:bg-slate-800 rounded\">\n                                    <strong>Quy Tắc 2:</strong> Không hardcode công thức. Sử dụng hàm <code>VALUE(SUBSTITUTE(...))</code> nếu bắt buộc phải xử lý dữ liệu hỗn hợp.\n                                </div>\n                                <div class=\"p-2.5 bg-slate-50 dark:bg-slate-800 rounded\">\n                                    <strong>Quy Tắc 3:</strong> Luôn có cột đối soát chéo (Reconciliation Column): <code>=Total_MISA - Total_Sheet</code>. Nếu kết quả khác 0, cảnh báo đỏ lập tức xuất hiện.\n                                </div>\n                            </div>\n                        </div>\n                    </div>\n                    "}, {"tab": "quiz", "name": "4. Bài Kiểm Tra Nghiệp Vụ Công Nợ M4", "content": "\n                    <div class=\"p-5 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 space-y-4\">\n                        <div class=\"font-bold text-sm text-slate-900 dark:text-white\">\n                            ❓ Tình Huống Kế Toán: NPP Thanh Hóa gửi khoản chuyển khoản 50 triệu VNĐ nhưng không ghi chú rõ thanh toán cho đơn hàng nào trong 3 đơn hàng đang nợ (Đơn 1: 30tr nợ 42 ngày; Đơn 2: 40tr nợ 20 ngày; Đơn 3: 50tr nợ 5 ngày). Kế toán DTD Holding bắt buộc phải cấn trừ công nợ theo nguyên tắc nào?\n                        </div>\n                        <div class=\"space-y-2 text-xs text-slate-700 dark:text-slate-300\">\n                            <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer\">\n                                <input type=\"radio\" name=\"dtd_q4\" value=\"a\" class=\"mr-2\"> A. Cấn trừ đúng cho Đơn 3 (50 triệu) vì số tiền khớp hoàn toàn.\n                            </label>\n                            <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer\">\n                                <input type=\"radio\" name=\"dtd_q4\" value=\"b\" class=\"mr-2\"> B. Cấn trừ theo nguyên tắc FIFO (First In - First Out / Khoản nợ cũ nhất cấn trừ trước): Trừ dứt điểm 30 triệu của Đơn 1 (42 ngày tuổi nợ), 20 triệu còn lại trừ vào Đơn 2, giúp xóa sổ ngay khoản nợ đang nằm trong Vùng Vàng.\n                            </label>\n                            <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer\">\n                                <input type=\"radio\" name=\"dtd_q4\" value=\"c\" class=\"mr-2\"> C. Giữ nguyên tiền trong tài khoản tạm treo, không cấn trừ gì cả.\n                            </label>\n                        </div>\n                        <div class=\"p-3 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 rounded-lg text-xs text-emerald-800 dark:text-emerald-300 hidden\" id=\"dtd_q4_ans\">\n                            <strong>Đáp án chuẩn xác: B!</strong> Nguyên tắc FIFO trong quản trị công nợ là luật thép. Luôn ưu tiên xóa các khoản nợ già ngày nhất để kéo giảm tỷ lệ trích lập dự phòng rủi ro nợ khó đòi của doanh nghiệp.\n                        </div>\n                        <button onclick=\"document.getElementById('dtd_q4_ans').classList.toggle('hidden')\" class=\"px-4 py-1.5 bg-amber-600 hover:bg-amber-700 text-white rounded text-xs font-semibold\">Xem Phân Tích Kế Toán</button>\n                    </div>\n                    "}]}, {"id": "dtd_m5", "title": "Module 5: Chuỗi Cung Ứng Thực Chiến (SCM) — Đặt Hàng v4, Tồn Kho An Toàn & Hệ Số Mùa Vụ Tết", "subtitle": "Kiến trúc Ledger Append-only, công thức ROP, Lead time quốc tế 60–75 ngày và bài toán đỉnh vụ Tết 3.8x", "duration": "35 phút học", "lessons": [{"tab": "theory", "name": "1. Kiến Trúc Sổ Ghi Chỉ Thêm (Append-Only Ledger) Đặt Hàng v4", "content": "\n                    <div class=\"space-y-5 text-slate-700 dark:text-slate-300 text-sm leading-relaxed\">\n                        <div class=\"p-5 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800\">\n                            <h4 class=\"text-base font-black text-slate-900 dark:text-white mb-2\">📦 Đặt Hàng v4: Trái Tim Vận Hành Chuỗi Cung Ứng DTD</h4>\n                            <p class=\"text-xs text-slate-600 dark:text-slate-400 mb-3\">\n                                File Google Sheet <code>ĐẶT HÀNG v4</code> (ID: <code>1iAjw4Xddmcj8sUnVrg6qMgJ7rEfJZQDMlAo7cvtBZdM</code>) là công cụ trung tâm điều phối toàn bộ chuỗi cung ứng sản phẩm cho 21–65 Nhà Phân Phối tỉnh.\n                            </p>\n                            <div class=\"p-4 bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700\">\n                                <strong class=\"text-blue-600 dark:text-blue-400 text-xs uppercase tracking-wider block mb-1\">Kiến Trúc Kỹ Thuật: Sổ Ghi Chỉ Thêm (Append-Only Ledger)</strong>\n                                <p class=\"text-xs text-slate-600 dark:text-slate-300 leading-relaxed\">\n                                    Hệ thống cấm tuyệt đối việc sửa đè số liệu cũ. Mỗi khi phát sinh giao dịch nhập hàng mới, xuất kho cho đại lý hay điều chỉnh hàng lỗi, nhân sự chỉ được thêm một dòng mới (append row) có gắn kèm dấu thời gian (Timestamp) và mã nhân sự thực hiện. Cách làm này giúp kiểm toán dễ dàng truy vết lại lịch sử kho bãi suốt 365 ngày mà không sợ bị sai số.\n                                </p>\n                            </div>\n                        </div>\n\n                        <div class=\"p-5 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800\">\n                            <h4 class=\"text-base font-black text-slate-900 dark:text-white mb-3\">📐 Công Thức Tính Điểm Đặt Hàng Lại Tối Ưu (ROP & Safety Stock)</h4>\n                            <div class=\"p-4 bg-amber-50/70 dark:bg-slate-800 rounded-xl border border-amber-200 dark:border-slate-700 font-mono text-xs text-amber-950 dark:text-amber-200 space-y-2\">\n                                <div class=\"font-bold text-sm\">ROP = (Nhu Cầu Tiêu Thụ Trong Lead Time) + Tồn Kho An Toàn</div>\n                                <div>ROP = (D &times; L) + Z &times; &sigma;L</div>\n                                <div class=\"text-[11px] text-slate-600 dark:text-slate-300\">\n                                    &bull; <strong>D (Daily Demand):</strong> Lượng tiêu thụ bình quân ngày của 21 NPP (chai/ngày).<br>\n                                    &bull; <strong>L (Lead Time):</strong> Thời gian từ lúc chốt đơn đặt hàng đến khi hàng về kho tổng (thông thường từ 60 - 75 ngày).<br>\n                                    &bull; <strong>Z:</strong> Hệ số tin cậy dịch vụ (Z = 1.65 tương ứng mức phục vụ 95% không bị đứt hàng).<br>\n                                    &bull; <strong>&sigma;L:</strong> Độ lệch chuẩn của nhu cầu trong thời gian lead time.\n                                </div>\n                            </div>\n                        </div>\n                    </div>\n                    "}, {"tab": "data", "name": "2. Kịch Bản Đặt Hàng Phục Vụ Mùa Vụ Tết (Hệ Số 3.8x)", "content": "\n                    <div class=\"space-y-4 text-xs text-slate-700 dark:text-slate-300\">\n                        <div class=\"p-4 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800\">\n                            <h5 class=\"text-sm font-bold text-slate-900 dark:text-white mb-2\">📅 Kế Hoạch 5 Tháng Chuẩn Bị Hàng Tết Của DTD Holding</h5>\n                            <p class=\"text-slate-500 dark:text-slate-400 mb-3\">Vào 2 tháng giáp Tết (Tháng 11 và 12 Âm lịch), nhu cầu uốn nhuộm của phụ nữ tăng vọt gấp <strong>3,8 lần</strong> so với ngày thường. Bất kỳ sự chậm trễ nào về chuỗi cung ứng cũng sẽ dẫn đến việc mất sạch thị trường:</p>\n                            \n                            <table class=\"w-full text-left border-collapse border border-slate-200 dark:border-slate-700\">\n                                <thead class=\"bg-slate-100 dark:bg-slate-800 font-bold text-slate-700 dark:text-slate-300\">\n                                    <tr>\n                                        <th class=\"p-2.5 border\">Mốc Thời Gian (Âm Lịch)</th>\n                                        <th class=\"p-2.5 border\">Nhiệm Vụ Của Khối SCM & Mua Hàng</th>\n                                        <th class=\"p-2.5 border\">Tình Trạng Hàng Hóa Thực Tế</th>\n                                    </tr>\n                                </thead>\n                                <tbody class=\"divide-y divide-slate-200 dark:divide-slate-700\">\n                                    <tr>\n                                        <td class=\"p-2.5 font-bold border text-amber-600\">Tháng 8 Âm Lịch</td>\n                                        <td class=\"p-2.5 border\">Tổng hợp dự báo nhu cầu từ 21 NPP, nhân hệ số 3.8x, chốt hợp đồng sản xuất và thanh toán tạm ứng 30% cho nhà máy OEM.</td>\n                                        <td class=\"p-2.5 border text-slate-500\">Nhà máy lên kế hoạch thu mua nguyên liệu, chuẩn bị vỏ tuýp, nắp chai.</td>\n                                    </tr>\n                                    <tr>\n                                        <td class=\"p-2.5 font-bold border text-amber-600\">Tháng 9 Âm Lịch</td>\n                                        <td class=\"p-2.5 border\">Giám sát sản xuất, lấy mẫu kiểm định chất lượng xuất xưởng, booking cont tàu biển.</td>\n                                        <td class=\"p-2.5 border text-slate-500\">Hàng rời cảng xuất khẩu, vận chuyển đường biển về cảng Hải Phòng / Cát Lái (18 - 25 ngày trên biển).</td>\n                                    </tr>\n                                    <tr>\n                                        <td class=\"p-2.5 font-bold border text-amber-600\">Tháng 10 Âm Lịch</td>\n                                        <td class=\"p-2.5 border\">Thông quan hải quan, nộp thuế nhập khẩu, vận chuyển cont về tổng kho, dán tem phụ tiếng Việt và kiểm đếm 100%.</td>\n                                        <td class=\"p-2.5 border text-emerald-600 font-bold\">Kho tổng đạt cơ số tồn an toàn 100% (Sẵn sàng phục vụ chiến dịch Tết).</td>\n                                    </tr>\n                                    <tr>\n                                        <td class=\"p-2.5 font-bold border text-amber-600\">Tháng 11 - 12 Âm Lịch</td>\n                                        <td class=\"p-2.5 border\">Điều phối xe tải giao hàng hằng ngày về kho 21 NPP tỉnh. NPP lập tức phân phối về các salon làm tóc.</td>\n                                        <td class=\"p-2.5 border text-amber-600 font-bold\">Đáp ứng trọn vẹn 10,000+ salon, thu tiền mặt về tài khoản công ty.</td>\n                                    </tr>\n                                </tbody>\n                            </table>\n                        </div>\n                    </div>\n                    "}, {"tab": "checklist", "name": "3. Quy Trình Bù Hàng Thiếu, Tách Mã SKU & Kiểm Kê Định Kỳ", "content": "\n                    <div class=\"space-y-3 text-xs text-slate-700 dark:text-slate-300 leading-relaxed\">\n                        <div class=\"p-4 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800\">\n                            <h5 class=\"font-bold text-sm text-slate-900 dark:text-white mb-2\">📋 Quy Chuẩn Vận Hành Kho Bãi & Xử Lý Sự Cố Giao Hàng</h5>\n                            <div class=\"space-y-2\">\n                                <div class=\"p-2.5 bg-slate-50 dark:bg-slate-800 rounded\">\n                                    <strong>1. Xử Lý Bù Hàng Thiếu Trong 24h:</strong> Khi NPP phát hiện hàng vỡ hoặc thiếu số lượng khi mở thùng xe tải, thủ kho lập biên bản đồng kiểm với lái xe, chụp hình và hệ thống tự động lập đơn bù hàng xuất kho ngay ngày hôm sau.\n                                </div>\n                                <div class=\"p-2.5 bg-slate-50 dark:bg-slate-800 rounded\">\n                                    <strong>2. Tách Mã Combo Để Quản Trị Tồn Kho:</strong> Các combo khuyến mãi (ví dụ: Mua 10 tặng 2) phải được tách thành từng mã SKU đơn lẻ trên hệ thống để theo dõi chính xác số lượng thực tế trong kho.\n                                </div>\n                                <div class=\"p-2.5 bg-slate-50 dark:bg-slate-800 rounded\">\n                                    <strong>3. Kiểm Kê Luân Phiên (Cycle Counting):</strong> Thay vì chờ đến cuối năm mới kiểm kho, thủ kho DTD thực hiện kiểm kê luân phiên 5 mã hàng mỗi ngày, bảo đảm độ chính xác tồn kho luôn trên 99.8%.\n                                </div>\n                            </div>\n                        </div>\n                    </div>\n                    "}, {"tab": "quiz", "name": "4. Bài Kiểm Tra Tính Toán Chuỗi Cung Ứng M5", "content": "\n                    <div class=\"p-5 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 space-y-4\">\n                        <div class=\"font-bold text-sm text-slate-900 dark:text-white\">\n                            ❓ Bài Toán Tính Toán: Một mã thuốc nhuộm GLEM Luminous có mức tiêu thụ bình quân ngày thường là 500 tuýp/ngày. Trong dịp cao điểm Tết (hệ số mùa vụ 3.8x), Lead time đặt hàng từ nhà máy về kho là 60 ngày. Mức tồn kho an toàn quy định là 10.000 tuýp. Điểm đặt hàng lại (ROP) để phục vụ vụ Tết là bao nhiêu?\n                        </div>\n                        <div class=\"space-y-2 text-xs text-slate-700 dark:text-slate-300\">\n                            <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer\">\n                                <input type=\"radio\" name=\"dtd_q5\" value=\"a\" class=\"mr-2\"> A. 40.000 tuýp.\n                            </label>\n                            <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer\">\n                                <input type=\"radio\" name=\"dtd_q5\" value=\"b\" class=\"mr-2\"> B. 124.000 tuýp (Tính toán: Nhu cầu ngày Tết = 500 &times; 3.8 = 1.900 tuýp/ngày; Nhu cầu trong 60 ngày Lead time = 1.900 &times; 60 = 114.000 tuýp; ROP = 114.000 + 10.000 tồn an toàn = 124.000 tuýp).\n                            </label>\n                            <label class=\"block p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer\">\n                                <input type=\"radio\" name=\"dtd_q5\" value
